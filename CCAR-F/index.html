<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CCAR-F 問題集</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap">
<style>
/* Layout: 一枚の答案用紙。中央1カラムの問題冊子、選択肢はマークシートの楕円、採点は赤ペンの丸付け */
:root {
  --bg: #eef1f4;
  --sheet: #ffffff;
  --ink: #18202b;
  --muted: #586473;
  --line: #d5dbe3;
  --print: #1b6b83;        /* マークシートの印刷インク */
  --print-soft: #e2eff3;
  --graphite: #262b33;     /* 鉛筆で塗った楕円 */
  --graphite-ink: #ffffff;
  --pen: #d03a3a;          /* 採点用の赤ペン */
  --pen-soft: #fbeaea;
  --ok: #1d7650;
  --ok-soft: #e5f2ea;
  --code-bg: #f2f4f7;
  --font-display: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  --font-body: "IBM Plex Sans JP", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", "Meiryo", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1318; --sheet: #171c23; --ink: #e6e9ee; --muted: #9aa4b2; --line: #2a323d;
    --print: #6bbfd5; --print-soft: #15303a; --graphite: #e6e9ee; --graphite-ink: #0f1318;
    --pen: #ff716b; --pen-soft: #3a1e21; --ok: #5cc898; --ok-soft: #13302a; --code-bg: #11161c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1318; --sheet: #171c23; --ink: #e6e9ee; --muted: #9aa4b2; --line: #2a323d;
  --print: #6bbfd5; --print-soft: #15303a; --graphite: #e6e9ee; --graphite-ink: #0f1318;
  --pen: #ff716b; --pen-soft: #3a1e21; --ok: #5cc898; --ok-soft: #13302a; --code-bg: #11161c;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.75;
  font-feature-settings: "palt" 0;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
p { margin: 0; }
code {
  font-family: var(--font-mono); font-size: .88em;
  background: var(--code-bg); border: 1px solid var(--line); border-radius: 4px;
  padding: .05em .35em; overflow-wrap: anywhere;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--print); outline-offset: 2px; }

.wrap {
  max-width: 760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 72px;
  display: flex; flex-direction: column; gap: 28px;
}
.wrap-wide { max-width: 920px; }

/* ---------- 共通部品 ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 8px 18px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--sheet); color: var(--ink);
  font-weight: 700; font-size: 15px; cursor: pointer; white-space: nowrap;
}
.btn:hover:not(:disabled) { border-color: var(--ink); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn-primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn-primary:hover:not(:disabled) { background: var(--print); border-color: var(--print); color: var(--sheet); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn-ghost:hover:not(:disabled) { border-color: transparent; color: var(--ink); }
.btn-small { min-height: 36px; padding: 4px 12px; font-size: 14px; }
.btn-danger { background: var(--pen); border-color: var(--pen); color: var(--sheet); }
.eyebrow {
  font-family: var(--font-mono); font-size: 12px; font-weight: 500;
  letter-spacing: .12em; text-transform: uppercase; color: var(--print);
}
.muted { color: var(--muted); }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* ---------- ホーム ---------- */
.banner {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px;
  padding: 12px 16px; border-radius: var(--radius);
  background: var(--print-soft); border: 1px solid var(--print);
}
.banner > span { min-width: 0; }
.banner-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }

.hero { display: flex; flex-direction: column; gap: 12px; padding-top: 8px; }
.hero h1 { font-weight: 900; font-size: clamp(36px, 8vw, 56px); line-height: 1.1; letter-spacing: .01em; }
.hero .lead { max-width: 40em; color: var(--muted); }

.spec {
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
  margin: 0; border: 1.5px solid var(--print); border-radius: 8px; overflow: hidden;
  background: var(--sheet);
}
.spec > div { padding: 12px 16px; border-left: 1px solid var(--print); min-width: 0; }
.spec > div:first-child { border-left: none; }
.spec dt { font-size: 12px; letter-spacing: .08em; color: var(--print); font-weight: 700; }
.spec dd { margin: 2px 0 0; font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.3; }
.spec dd small { font-family: var(--font-body); font-size: 13px; font-weight: 500; color: var(--muted); }

.modes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.panel {
  background: var(--sheet); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 20px; display: flex; flex-direction: column; gap: 16px; min-width: 0;
}
.panel h2 { font-size: 22px; font-weight: 900; }
.panel-head { display: flex; flex-direction: column; gap: 4px; }
.panel-head p { color: var(--muted); font-size: 14px; }
.panel-foot { margin-top: auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.panel-foot .count { font-size: 14px; color: var(--muted); }
.panel-foot .count b { color: var(--ink); font-family: var(--font-mono); }

.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field-label { font-size: 12px; font-weight: 700; letter-spacing: .06em; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.field-label button { border: none; background: none; padding: 0; color: var(--print); font-size: 12px; font-weight: 700; cursor: pointer; }
.field-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 10px; }
select {
  font: inherit; font-size: 14px; width: 100%; min-height: 40px;
  padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--sheet); color: var(--ink);
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-btn {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px; padding: 4px 10px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: transparent; color: var(--muted);
}
.chip-btn b { font-family: var(--font-mono); font-weight: 500; font-size: 12px; }
.chip-btn[aria-pressed="true"] { background: var(--print-soft); border-color: var(--print); color: var(--ink); }
.ticks { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
.ticks li { display: flex; gap: 10px; }
.ticks li::before {
  content: ""; flex: none; width: 12px; height: 16px; margin-top: 5px;
  border: 1.5px solid var(--print); border-radius: 50%;
}

.section-head { display: flex; flex-direction: column; gap: 4px; margin-bottom: 4px; }
.section-head h2 { font-size: 22px; font-weight: 900; }
.section-head p { color: var(--muted); font-size: 14px; }
.bp { display: flex; flex-direction: column; }
.bp-row {
  display: grid; grid-template-columns: 40px minmax(0, 1fr) 150px 110px auto;
  align-items: center; gap: 8px 14px; padding: 12px 0; border-top: 1px solid var(--line);
}
.bp-row:last-child { border-bottom: 1px solid var(--line); }
.bp-code { font-family: var(--font-mono); font-weight: 500; color: var(--print); }
.bp-name { min-width: 0; line-height: 1.45; }
.bp-name b { display: block; font-weight: 700; }
.bp-name small { color: var(--muted); font-size: 12px; }
.meter { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
.meter-track { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.meter-track span { display: block; height: 100%; background: var(--print); }
.meter-track.acc span { background: var(--ink); }
.meter .num { color: var(--ink); }

.foot { display: flex; flex-direction: column; gap: 14px; font-size: 14px; color: var(--muted); }
.foot-stats { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; }
.foot-stats b { color: var(--ink); font-family: var(--font-mono); font-weight: 500; }
.foot-stats .spacer { flex: 1; }
.confirm { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--ink); }

/* ---------- 上部バー ---------- */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
.bar-inner {
  max-width: 760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px;
  display: flex; align-items: center; gap: 8px 12px;
}
.bar-mid { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 10px; }
.bar-mode { font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--print); }
.bar-count { font-family: var(--font-mono); font-size: 14px; color: var(--muted); white-space: nowrap; }
.bar-count b { color: var(--ink); font-size: 16px; }
.bar-right { display: flex; align-items: center; gap: 6px; }
.timer {
  font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 14px;
  padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap;
}
.timer.is-low { color: var(--pen); border-color: var(--pen); }
.icon-btn {
  width: 40px; height: 40px; border-radius: 8px; border: 1px solid transparent;
  background: transparent; cursor: pointer; font-size: 20px; line-height: 1; color: var(--muted);
}
.icon-btn:hover { border-color: var(--line); }
.icon-btn[aria-pressed="true"] { color: var(--pen); }
.bar-progress { height: 3px; background: var(--line); }
.bar-progress span { display: block; height: 100%; background: var(--print); transition: width .25s; }

/* ---------- 問題 ---------- */
.sheet {
  background: var(--sheet); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 24px clamp(16px, 4vw, 32px) 28px;
  display: flex; flex-direction: column; gap: 18px; min-width: 0;
}
.q-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font-size: 13px; color: var(--muted); }
.q-num { font-family: var(--font-display); font-weight: 900; font-size: 24px; color: var(--ink); line-height: 1; }
.q-num small { font-size: 14px; margin-right: 2px; }
.q-dom { border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px; }
.q-dom b { font-family: var(--font-mono); font-weight: 500; color: var(--print); margin-right: 4px; }
.q-id { font-family: var(--font-mono); font-size: 12px; margin-left: auto; }
.q-text { font-size: 17px; line-height: 1.9; }
.code {
  margin: 0; padding: 14px 16px; border-radius: 8px; background: var(--code-bg); border: 1px solid var(--line);
  font-family: var(--font-mono); font-size: 13.5px; line-height: 1.65; overflow-x: auto; white-space: pre; tab-size: 2;
}
.code code { background: none; border: none; padding: 0; font-size: inherit; overflow-wrap: normal; }
.q-instr { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; font-size: 14px; font-weight: 700; }
.q-instr .num { font-weight: 500; color: var(--muted); }
.hint { font-size: 14px; color: var(--pen); }
.scn {
  border-left: 3px solid var(--print); background: var(--print-soft); border-radius: 0 8px 8px 0;
  padding: 10px 14px; font-size: 14px; line-height: 1.75;
}
.scn b { display: block; font-size: 12px; font-weight: 700; letter-spacing: .06em; color: var(--print); }

.opts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: flex; align-items: flex-start; gap: 16px; width: 100%; text-align: left;
  padding: 12px 16px 12px 14px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--line); background: transparent; line-height: 1.7;
}
.opt:hover { border-color: var(--print); }
.opt.is-chosen { border-color: var(--graphite); }
.opt[aria-disabled="true"] { cursor: default; }
.opt[aria-disabled="true"]:hover { border-color: var(--line); }
.opt.is-right, .opt.is-right:hover { background: var(--ok-soft); border-color: var(--ok); }
.opt.is-wrong, .opt.is-wrong:hover { background: var(--pen-soft); border-color: var(--pen); }
.bubble {
  position: relative; flex: none; width: 24px; height: 34px; margin-top: -3px;
  display: grid; place-items: center; border-radius: 50%;
  border: 1.5px solid var(--print); color: var(--print);
  font-family: var(--font-mono); font-size: 13px; font-weight: 500;
}
.opt.is-chosen .bubble { background: var(--graphite); border-color: var(--graphite); color: var(--graphite-ink); }
.opt-body { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.opt-note { font-size: 14px; color: var(--muted); line-height: 1.7; }
.tag {
  display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .04em;
  padding: 0 8px; border-radius: 999px; margin-right: 6px; line-height: 1.8; vertical-align: 1px;
}
.tag-right { background: var(--ok); color: var(--sheet); }
.tag-wrong { background: var(--pen); color: var(--sheet); }

.pen {
  position: absolute; left: 50%; top: 50%; width: 46px; height: 56px;
  transform: translate(-50%, -50%) rotate(-10deg); overflow: visible; pointer-events: none;
}
.pen path, .vmark path {
  fill: none; stroke: var(--pen); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;
  stroke-dasharray: 260; stroke-dashoffset: 0; animation: draw .6s ease-out both;
}
.pen-check { width: 40px; height: 44px; transform: translate(-30%, -60%) rotate(-4deg); }
@keyframes draw { from { stroke-dashoffset: 260; } }

.verdict { display: flex; align-items: center; gap: 16px; padding: 14px 18px; border-radius: 8px; }
.verdict.ok { background: var(--ok-soft); }
.verdict.ng { background: var(--pen-soft); }
.vmark { width: 48px; height: 48px; flex: none; overflow: visible; }
.verdict-title { font-family: var(--font-display); font-weight: 900; font-size: 24px; line-height: 1.2; }
.verdict-sub { font-size: 14px; color: var(--muted); }
.explain { display: flex; flex-direction: column; gap: 8px; padding-top: 18px; border-top: 1px dashed var(--line); }
.explain h3 { font-size: 15px; font-weight: 900; color: var(--print); letter-spacing: .06em; }
.explain p { line-height: 1.9; }
.ref { font-size: 13px; color: var(--muted); }

.actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.actions .grow { flex: 1; }
.keys { font-size: 12px; color: var(--muted); text-align: center; }
.keys kbd {
  font-family: var(--font-mono); font-size: 11px; padding: 0 5px; border-radius: 4px;
  border: 1px solid var(--line); background: var(--sheet);
}

.navbox { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.navbox summary { cursor: pointer; font-weight: 700; font-size: 14px; display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; }
.navbox summary span { font-weight: 400; color: var(--muted); font-size: 13px; }
.nav { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 6px; margin-top: 12px; }
.nav button {
  position: relative; height: 36px; border-radius: 6px; border: 1px solid var(--line);
  background: transparent; cursor: pointer; font-family: var(--font-mono); font-size: 13px;
}
.nav button.answered { background: var(--graphite); border-color: var(--graphite); color: var(--graphite-ink); }
.nav button.current { outline: 2px solid var(--print); outline-offset: 1px; }
.nav button.flagged::after {
  content: ""; position: absolute; top: 3px; right: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--pen);
}
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 10px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; border: 1px solid var(--line); }
.legend .l-ans { background: var(--graphite); border-color: var(--graphite); }
.legend .l-flag { background: var(--pen); border-color: var(--pen); border-radius: 50%; }
.finish-box {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
  padding: 14px 16px; border-radius: var(--radius); border: 1px solid var(--pen); background: var(--pen-soft);
}

/* ---------- 結果 ---------- */
.score-head { display: flex; flex-direction: column; gap: 14px; }
.score-row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 24px; }
.score { font-family: var(--font-display); font-weight: 900; font-size: clamp(56px, 14vw, 88px); line-height: .95; }
.score small { font-size: .4em; margin-left: 4px; }
.score-sub { display: flex; flex-direction: column; gap: 2px; padding-bottom: 6px; font-size: 14px; color: var(--muted); }
.score-sub b { color: var(--ink); font-family: var(--font-mono); font-weight: 500; }
.gauge { position: relative; height: 10px; border-radius: 5px; background: var(--line); margin-top: 18px; }
.gauge > span { display: block; height: 100%; border-radius: 5px; background: var(--ink); }
.gauge .mark { position: absolute; top: -7px; bottom: -7px; width: 2px; background: var(--pen); }
.gauge .mark::before {
  content: attr(data-label); position: absolute; bottom: calc(100% + 2px); left: 50%; transform: translateX(-50%);
  font-size: 11px; color: var(--pen); white-space: nowrap; font-weight: 700;
}
.score-msg { font-weight: 700; }
.score-note { font-size: 13px; color: var(--muted); }

.dom-list { display: flex; flex-direction: column; gap: 10px; }
.dom-row { display: grid; grid-template-columns: 40px minmax(0, 1fr) 72px; gap: 4px 14px; align-items: center; font-size: 14px; }
.dom-row .meter-track { grid-column: 2 / 3; }
.dom-row .num { text-align: right; }
.res-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.res-list button {
  width: 100%; display: grid; grid-template-columns: 28px 52px 40px minmax(0, 1fr) auto;
  align-items: center; gap: 10px; padding: 10px 4px; border: none; border-bottom: 1px solid var(--line);
  background: transparent; text-align: left; cursor: pointer; font-size: 14px;
}
.res-list button:hover { background: var(--sheet); }
.res-mark { font-size: 20px; line-height: 1; font-weight: 700; text-align: center; }
.res-mark.ok { color: var(--pen); }
.res-mark.ng { color: var(--muted); }
.res-topic { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res-go { color: var(--print); font-size: 13px; font-weight: 700; }

@media (max-width: 680px) {
  .spec { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .spec > div:nth-child(3) { border-left: none; }
  .spec > div:nth-child(n+3) { border-top: 1px solid var(--print); }
  .modes { grid-template-columns: minmax(0, 1fr); }
  .bp-row { grid-template-columns: 36px minmax(0, 1fr) auto; }
  .bp-row .meter { grid-column: 2 / 3; }
  .bp-row .bp-go { grid-column: 3; grid-row: 1; }
  .res-list button { grid-template-columns: 24px 44px 34px minmax(0, 1fr); }
  .res-go { display: none; }
  .q-id { margin-left: 0; }
  .keys { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .pen path, .vmark path { animation: none; }
  .bar-progress span { transition: none; }
}
</style>

<script>
(() => {
'use strict';

const QUESTIONS = [{"id":"D1-01","domain":"D1","scenario":"S1","topic":"ループの制御","type":"multi","question":"サポートエージェントのループを自前で実装しました。回答を書き終えたあとも会話が終わらず、同じ説明を何度も繰り返してタイムアウトする会話が約15%あります。また、ツールを実行した直後のリクエストで、Claude が同じ `lookup_order` を何度も呼び直します。ループの中心部分は次のとおりです。この2つの不具合を直すために行うべき変更はどれですか。（2つ選択）","code":"while True:\n    resp = client.messages.create(model=MODEL, system=SYSTEM,\n                                  tools=TOOLS, messages=messages)\n    text = \"\".join(b.text for b in resp.content if b.type == \"text\")\n    if \"完了\" in text:\n        break                      # 「完了」と書けば終わりとみなす\n    run_tools(resp.content)        # 結果はログに書くだけ\n    messages.append({\"role\": \"user\", \"content\": \"続けてください。\"})","options":["応答を履歴に足し、各結果を `tool_use_id` 付きの `tool_result` にして次のリクエストで返す","`stop_reason` が `\"tool_use\"` の間はツールを実行して続け、`\"end_turn\"` で終える","反復回数の上限を3回に固定し、上限に達したら会話の状態にかかわらず必ずループを終えるようにする","システムプロンプトに「回答の最後には必ず『完了』と書くこと」と加え、いまの語による判定を続ける","応答にテキストのブロックが1つでも含まれていれば、その時点で完了とみなしてループを終える"],"answer":[0,1],"notes":["正解。モデルが次の行動を推論できるのは、ツールの結果が会話履歴に入っているときだけです。いまは結果がログにしか残らないので、Claude は同じツールを呼び直しています。","正解。ループを続けるか終えるかは `stop_reason` で決めます。言い回しは毎回変わるので、「完了」のような語の有無では、終わったかどうかを判定できません。","根拠のない反復回数の上限を主な停止手段にするのもアンチパターンです。繰り返しは止まっても、必要な調査が終わる前に打ち切られ、結果が履歴に戻らない問題も残ります。","自然言語の合図で終了を決めるという誤りそのものが残ります。指示に従うかどうかは確率的で、ツールの結果が履歴に戻らない問題にも効きません。","テキストの有無で完了を判定するのも、試験ガイドが挙げるアンチパターンです。Claude はツールを呼ぶ前に説明の文を書くことがあるので、調査の途中でループが終わってしまいます。"],"explanation":"エージェントループは、リクエストを送り、`stop_reason` を確かめ、要求されたツールを実行し、結果を履歴に戻す、の繰り返しです。`stop_reason` が `\"tool_use\"` の間は続け、`\"end_turn\"` で終えます。応答の文章の言い回しは毎回変わるので、特定の語やテキストの有無を終了の合図にはしません。結果は、アシスタントの応答のあとのユーザーメッセージに、`tool_use_id` で対応づけた `tool_result` として入れます。2026年11月時点のドキュメントでは、`tool_use` 以外の停止理由（`max_tokens` など）ではループを抜け、理由ごとに扱うよう説明されています。","ref":"試験ガイド タスク 1.1 ／ Claude Docs: How tool use works、Handle tool calls、Define tools"},{"id":"D1-02","domain":"D1","scenario":"S1","topic":"反復回数の上限","type":"single","question":"エージェントループは、`stop_reason` に関係なく、5回の反復で必ず打ち切る作りになっています。請求に関する異議のケースでは、複数の注文を順に調べるうちに反復が5回を超えることがあり、そのケースの9%が途中で打ち切られて、根拠のない回答のまま会話が終わっています。最も適切な対応はどれですか。","options":["上限を8回に引き上げ、いまの請求に関する異議のケースがすべて上限の中に収まるように設定し直す","終了は `stop_reason` で判定し、回数の上限は大きな安全網にして、達したら人に引き継ぐ","応答に「解決しました」という文言が出たら終えるように変え、回数による打ち切りはやめる","システムプロンプトで、ツールの呼び出しを5回以内に収めてから回答をまとめるよう、明確に指示する"],"answer":[1],"notes":["数字を変えただけで、根拠のない上限が主な停止手段であることは変わりません。もっと調査が要るケースが来れば、また打ち切られます。","正解。完了の判定は `stop_reason` に任せ、上限は暴走を防ぐための安全網として使います。上限に達したときの扱い（人への引き継ぎ）も決めておきます。","自然言語の文言で終了を決めるのはアンチパターンです。言い回しのぶれで、終わっていないのに終えたり、終わったのに続けたりします。","必要な調査を削らせるだけで、根拠のない回答が増えます。打ち切りという症状を、別の形で抑えているにすぎません。"],"explanation":"試験ガイドは、根拠のない（恣意的な）反復回数の上限を主な停止手段にすることを、避けるべきアンチパターンとして挙げています。ループの終了は `stop_reason` で決め、回数の上限は想定外の暴走を止める安全網に位置づけます。Agent SDK の `max_turns` も既定では上限がなく、上限に達すると結果が `error_max_turns` になる、安全のための仕組みとして説明されています。上限に達したら、黙って終えず、引き継ぎなどの扱いを決めておくのが実務的です。","ref":"試験ガイド タスク 1.1 ／ Agent SDK Docs: How the agent loop works"},{"id":"D1-03","domain":"D1","scenario":"S1","topic":"モデル主導の判断","type":"single","question":"開発者の1人が、メッセージに「返品」が含まれたら `lookup_order` から `process_refund` へ、「請求」が含まれたら `get_customer` から `escalate_to_human` へ、と決まった順にツールを呼ぶ分岐をコードに組み込みました。その結果、「返品したのに二重に請求された」のような依頼で、どの注文が対象かを確かめないまま返金の手続きが進む例が増えています。最も適切な対応はどれですか。","options":["分岐をやめ、次に呼ぶツールは結果をふまえて Claude に判断させ、必須の規則だけをコードで強制する","キーワードの分岐をさらに増やし、「返品」と「請求」が両方含まれる場合の手順もコードで決めておく","最初の応答でこのケースに必要なツールの順番を Claude にすべて出させ、その順にまとめて実行する","依頼の種類を判定する専用のモデルを学習させ、判定した種類ごとに決まったツールの順番を割り当てる"],"answer":[0],"notes":["正解。曖昧さの大きい依頼では、ツールの結果を見て次の一手を決めるモデル主導の判断が向きます。本人確認のような必須の順序だけは、コードで強制します。","決定木を細かくしても、組み合わせの数だけ分岐が要ります。想定していない言い回しの依頼で、また誤った順序の手続きが走ります。","最初に計画を固定すると、途中のツールの結果（対象の注文、請求の状態）を次の判断に生かせません。決まった順序で呼ぶのと同じ弱点が残ります。","分類の精度を上げても、種類ごとに固定の順序で呼ぶという設計は変わりません。ラベル付きのデータと学習の基盤も要り、最初の手としては重すぎます。"],"explanation":"試験ガイドは、Claude が文脈から次に呼ぶツールを推論するモデル主導の意思決定と、事前に決めた決定木やツールの順序を区別しています。返品、請求、アカウントが入り混じる依頼は、調べた結果によって次の手が変わるので、結果を履歴に戻しながらモデルに判断させるのが基本です。そのうえで、金銭に関わる操作の前の本人確認のように例外なく守らせたい順序だけを、プログラムで強制します。","ref":"試験ガイド タスク 1.1 ／ Anthropic Engineering: Building effective agents"},{"id":"D1-04","domain":"D1","scenario":"S1","topic":"前提条件ゲート","type":"single","question":"本人確認のため、「`get_customer` が呼ばれるまで `process_refund` を止める」というゲートをコードに実装しました。ところが監査で、`get_customer` が「該当なし」を返したあとに、顧客が名乗った顧客IDのまま返金が実行された例が見つかりました。ゲートをどう直すのが最も適切ですか。","options":["システムプロンプトに「`get_customer` で確認できなかった顧客には返金しない」と明記する","顧客が名乗った顧客IDの形式（桁数や接頭辞）が正しいことをゲートの条件に加え、形式の誤りを止める","`get_customer` が確認済みの顧客IDを返したことを条件にし、返金先がそのIDでなければ止める","返金を実行したあとに、顧客IDと本人確認の結果を照らし合わせる日次のバッチ処理を追加する"],"answer":[2],"notes":["ゲートの穴をプロンプトで埋めても、守るかどうかは確率的です。金銭に関わる操作の前の本人確認には、決定論的な保証が要ります。","形式が正しくても、そのIDが本人のものかは分かりません。`get_customer` が「該当なし」を返した顧客でも、形式の合うIDを名乗れば返金が通ってしまいます。","正解。前提条件は「呼ばれたか」ではなく「検証済みの顧客IDが返ったか」で判定します。返金の対象をそのIDに結び付ければ、名乗っただけのIDでは通りません。","実行後に見つけても、誤った返金はすでに起きています。事後の監査は、実行前に止める仕組みの代わりになりません。"],"explanation":"前提条件ゲートは、前のステップが完了するまで下流のツール呼び出しを止める、プログラムによる強制です。試験ガイドの例は「`get_customer` が検証済みの顧客IDを返すまで `process_refund` を止める」で、条件は呼び出しの有無ではなく、確認の結果です。ゲートを作るときは、何をもって前提が満たされたとみなすかを、ツールの結果の中身で定めます。","ref":"試験ガイド タスク 1.4"},{"id":"D1-05","domain":"D1","scenario":"S1","topic":"ハンドオフサマリー","type":"single","question":"ポリシーの例外が必要な請求の異議を、エージェントが `escalate_to_human` で人間の担当者に引き継いでいます。担当者は会話の記録を見られず、受け取るのは「返金のご相談です。対応をお願いします」程度の一文だけです。そのため顧客に最初から説明し直してもらうことになり、平均処理時間が伸びています。最も適切な対応はどれですか。","options":["引き継ぎの一文に、顧客が最後に送ったメッセージをそのまま添えて、担当者が用件をつかめるようにする","担当者が会話の記録を検索して読めるように、専用の閲覧システムを新しく構築する","エージェントが自己申告した確信度を引き継ぎに添え、担当者が優先順位を決められるようにする","顧客ID、根本原因の分析、返金額、推奨する対応をまとめた構造化ハンドオフサマリーを渡す"],"answer":[3],"notes":["最後のメッセージだけでは、それまでに調べた注文や金額、原因の見立てが伝わりません。担当者は結局、顧客に経緯を聞き直すことになります。","効く可能性はありますが、担当者は長い記録を読み解く必要があり、処理時間は大きく縮みません。最初の手としては作り込みすぎです。","自己申告の確信度はキャリブレーションが不十分で、当てになりません。担当者が判断に使う事実（金額や原因）も伝わりません。","正解。会話の記録にアクセスできない担当者には、すぐ動けるだけの事実と見立てを構造化して渡します。担当者は説明を聞き直さずに対応を始められます。"],"explanation":"プロセスの途中でエスカレーションするときは、受け手が会話の記録を見られない前提で、顧客の詳細、根本原因の分析、推奨する対応を含む構造化されたハンドオフを作ります。試験ガイドは、項目として顧客ID、根本原因、返金額、推奨アクションを挙げています。`escalate_to_human` の入力にこれらの項目を定義しておくと、引き継ぎの品質がそろいます。","ref":"試験ガイド タスク 1.4"},{"id":"D1-06","domain":"D1","scenario":"S1","topic":"複数の用件の分解","type":"single","question":"顧客から1通で「注文Aが破損して届いた。注文Bの請求が二重になっている。今後の配送先も変えたい」というメッセージが届きました。いまのエージェントは最初の用件だけを処理して返信を終え、残りの2つは顧客が送り直すまで手付かずです。最も適切な対応はどれですか。","options":["用件ごとに別のチケットを起票し、それぞれを新しいセッションで最初から処理させる","依頼を3つの項目に分け、共有の顧客情報を使って並行して調べ、1つの回答にまとめる","最初の用件を解決したあとに「ほかにご用件はありますか」と尋ね、1往復に1件ずつ処理する","`max_tokens` を引き上げて長い返信を書けるようにし、3件分をまとめて答えさせる"],"answer":[1],"notes":["共有の文脈が失われ、本人確認や顧客情報の取得を3回やり直すことになります。顧客にも3つの回答が別々に届きます。","正解。複数の懸案は個別の項目に分け、共有のコンテキストを使って並行して調べ、統一された解決策にまとめます。1回の対応で3件とも片付きます。","顧客が尋ね返されるまで残りの用件が進まず、往復が増えます。初回対応での解決率を下げる作りです。","返信が途中で切れる問題ではありません。用件を分解して調べる手順がないままでは、長く書けても2件目以降の調査は行われません。"],"explanation":"試験ガイドは、複数の懸案を含むリクエストを個別の項目に分解し、共有コンテキストを使って並列に調べ、1つの解決策にまとめるスキルを挙げています。確認済みの顧客IDのような共通の事実は一度だけ取得して全項目で使い、注文ごとの調査は1つの応答の中で複数のツール呼び出しとして並べられます。最後に、用件ごとの結論を1通の回答に統合します。","ref":"試験ガイド タスク 1.4 ／ Claude Docs: Parallel tool use"},{"id":"D1-07","domain":"D1","scenario":"S1","topic":"強制と誘導の使い分け","type":"single","question":"サポート部門から2つの要件が届きました。1つめは法務からの要請で、本人確認が済む前に返金を実行してはならない。2つめは、在庫がある商品なら返金より先に交換を提案するのが望ましい、というもので、顧客が断れば返金に進んでかまいません。この2つの実装として最も適切なものはどれですか。","options":["2つともシステムプロンプトに書き、重要度が伝わるよう1つめの要件を太字で強調しておく","2つともコードで強制し、交換を提案した記録が残るまで `process_refund` を止める","1つめは前提条件ゲートでコードから強制し、2つめはシステムプロンプトの指針として書く","1つめはシステムプロンプトに書き、2つめは前提条件ゲートで提案の有無をコードで確かめる"],"answer":[2],"notes":["強調しても、プロンプトの指示だけでは失敗率はゼロになりません。法務の要件には決定論的な保証が要ります。","交換の提案は状況しだいの望ましい振る舞いで、例外なく守らせる規則ではありません。コードで縛ると、交換が合わない場面でも手続きが止まります。","正解。例外を許さない順序はプログラムで強制し、状況に応じた判断の余地がある方針はプロンプトで誘導します。要件の性質で置き場所を分けます。","強制と誘導の割り当てが逆です。法務の要件が確率的な遵守に任され、柔軟でよい方針のほうが硬く縛られます。"],"explanation":"ワークフローの順序付けには、フックや前提条件ゲートによるプログラムの強制と、プロンプトによるガイダンスがあります。金銭に関わる操作の前の本人確認のように決定論的な遵守が要る規則は、プロンプトだけでは失敗率がゼロにならないので、コードで強制します。一方、顧客の反応しだいで変わる望ましい振る舞いは、プロンプトで伝えてモデルの判断に任せます。何でもコードで縛るのではなく、守らせ方の強さを要件に合わせることが判断の軸です。","ref":"試験ガイド タスク 1.4"},{"id":"D1-08","domain":"D1","scenario":"S1","topic":"PostToolUse で正規化","type":"single","question":"`lookup_order` は配送日を Unix タイムスタンプで返し、`get_customer` は請求日を ISO 8601 の文字列で返します。注文の状態も `3` や `4` のような数値のコードです。エージェントが返品期限（配送から30日）を計算し誤ったり、「返送済み」を「配送済み」と読み違えたりしています。MCP サーバーは別のチームの管理で、すぐには変えられません。最も適切な対応はどれですか。","options":["`PostToolUse` フックで、モデルが処理する前に結果の日付の形式をそろえ、状態コードを意味の分かる値に変える","システムプロンプトに状態コードの対応表と日付の換算方法を書き、ツールの結果を毎回それに従って読むよう指示する","`PreToolUse` フックで、ツールを呼ぶ前に入力の形式をそろえ、返ってくる値の形式もあわせて統一させるようにする","日付の計算を誤りにくくするため、より大きなモデルに切り替え、あわせてコンテキストウィンドウも広げておく"],"answer":[0],"notes":["正解。`PostToolUse` は、ツールの結果をエージェントが処理する前に横取りして変換できます。サーバーに手を入れずに、不均一な形式を1か所で正規化できます。","換算をモデルに任せる限り、読み違いは確率的に残ります。対応表のぶんだけ、毎回のコンテキストも消費します。","`PreToolUse` はツールを実行する前に呼ばれるフックで、まだ存在しない結果は変換できません。タイミングを取り違えています。","原因は、形式がばらばらな入力を毎回モデルに解釈させていることです。規模を上げても、この原因は残ります。"],"explanation":"試験ガイドは、異なる MCP ツールから返る Unix タイムスタンプ、ISO 8601、数値のステータスコードを、エージェントが処理する前に正規化する `PostToolUse` フックを挙げています。正規化をコードで行えば、モデルが形式を解釈する余地がなくなり、結果が決定論的に安定します。2026年11月時点の Agent SDK のドキュメントでは、`PostToolUse` の `hookSpecificOutput` に `updatedToolOutput` を返すと、組み込みツールと MCP ツールのどちらでも、Claude が見る前に出力を差し替えられます。","ref":"試験ガイド タスク 1.5 ／ Agent SDK Docs: Hooks"},{"id":"D1-09","domain":"D1","scenario":"S1","topic":"ブロックと代替の流れ","type":"single","question":"500ドルを超える返金には人の承認が要る、というポリシーを守るため、`process_refund` の呼び出しを横取りするフックを入れました。いまのフックは、金額が500ドルを超えると例外を投げてセッションごと終わらせます。そのため顧客には「エラーが発生しました」と表示され、会話がそこで切れてしまいます。最も適切な改善はどれですか。","options":["フックで返金額を500ドルに書き換えて実行を許可し、残りの差額は後日あらためて別に手続きする","実行前の判定をやめ、`PostToolUse` で500ドルを超えた返金を記録して監査に回す","例外を投げる代わりに、システムプロンプトで500ドルを超える返金を控えるよう強く指示する","呼び出しを拒否し、理由と「`escalate_to_human` で人の承認に回す」ことをモデルに返す"],"answer":[3],"notes":["入力の書き換え自体はフックでできますが、顧客の依頼と違う金額を黙って返金することになります。ポリシーが求める人の承認も行われません。","ツールが実行されたあとに記録しても、承認なしの返金はすでに行われています。事前に止めるという要件を満たしません。","確率的な遵守に戻ってしまいます。金額のしきい値のように確実な遵守が要る規則は、フックで強制します。","正解。ポリシー違反の呼び出しを止めたうえで、代替のワークフロー（人へのエスカレーション）に向かわせます。会話は切れず、顧客は次の手続きに進めます。"],"explanation":"ツール呼び出しを横取りするフックは、ポリシーに違反するアクションを止めるだけでなく、代替のワークフローへ導くことまで設計します。Agent SDK では、`PreToolUse` フックが `permissionDecision` に `\"deny\"` を返すと呼び出しが止まり、`permissionDecisionReason` に書いた理由が Claude に伝わります。理由に次の手（`escalate_to_human`）を書けば、エージェントは会話を続けたまま人の承認に回せます。","ref":"試験ガイド タスク 1.5 ／ Agent SDK Docs: Hooks"},{"id":"D1-10","domain":"D1","scenario":"S1","topic":"フックで確実に守る","type":"single","question":"長い会話で顧客が同じ要望を繰り返すと、エージェントが同じ注文に2回返金してしまうことがあり、返金全体の0.3%で起きています。「1つの注文への返金は1回まで」は例外のない規則です。チームで出ている次の案のうち、最も適切なものはどれですか。","options":["システムプロンプトに「同じ注文へ二重に返金しない」と書き、二重返金を断る対応の例を添える","返金済みの注文番号を「ケースの事実情報」ブロックに残し、毎回のプロンプトに入れて確かめさせる","`process_refund` を横取りするフックで注文の返金履歴を確かめ、返金済みなら拒否する","会話が長いほど起きやすいので、エージェントループの反復回数の上限を下げて会話を短く保つ"],"answer":[2],"notes":["指示と例で発生率は下がるかもしれませんが、守るかどうかは確率的です。例外のない規則には、決定論的な保証が要ります。","長い会話で事実を保つには有効な手ですが、返金済みかどうかの判断は依然としてモデルに任されています。二重返金をゼロにする保証にはなりません。","正解。フックはモデルの判断と関係なく毎回動き、返金履歴という事実で判定します。規則の遵守を、確率ではなく仕組みで保証できます。","根拠のない反復回数の上限で会話を切ると、必要な調査まで打ち切られます。二重返金という原因にも直接効きません。"],"explanation":"試験ガイドは、決定論的な保証のためにフックを使うことと、確率的な遵守のためにプロンプトの指示に頼ることを区別し、ビジネスルールで確実な遵守が求められる場合はフックを選ぶよう求めています。プロンプトの改善や文脈の整理は、エージェントの振る舞いを良くする手としては有効ですが、例外のない規則の保証にはなりません。金銭に関わる規則は、ツールの呼び出しの手前で、事実に基づいてコードで判定します。","ref":"試験ガイド タスク 1.5 ／ Agent SDK Docs: Hooks"},{"id":"D1-11","domain":"D1","scenario":"S2","topic":"要約で新しく始める","type":"single","question":"あなたは昨日、`claude -n pay-audit` で名前を付けたセッションで、決済モジュールの30ファイルを読み、処理の流れと問題点の一覧をまとめました。今朝、モジュールを作り直す大きなプルリクエストがマージされ、30ファイルのうち24ファイルが分割・改名・書き換えられました。昨日の結論のうち、どこに問題がありそうかという見立ては今も参考になりますが、ファイルを読んだ結果の大半は今のコードと合いません。調査を続けるうえで最も適切な進め方はどれですか。","options":["`claude --resume pay-audit` で再開し、変わった24ファイルの名前を伝えて、それらを読み直させる","`claude --resume pay-audit` で再開し、変更には触れずに、昨日の問題点の一覧の続きから作業させる","昨日の見立てと未解決の点を構造化した要約にまとめ、それを渡して新しいセッションで調べ直させる","新しいセッションを始め、昨日の結論は使わずに、モジュール全体を何も前提にせず最初から調べさせる"],"answer":[2],"notes":["再開したセッションには、24ファイルの古い読み取り結果がそのまま残ります。新旧の内容が混ざった文脈で考えることになり、古い結果に引きずられるおそれがあります。","大半が古くなったツール結果をもとに作業を続けることになります。今のコードと合わない結論を出すおそれが大きくなります。","正解。以前のツール結果の多くが古くなったときは、まだ役に立つ結論を構造化した要約にして、新しいセッションに渡します。古い読み取り結果を持ち込まずに、見立てだけを引き継げます。","昨日の見立てという、まだ役に立つ情報まで捨てています。要約にして渡せば、調べ直しの出発点にできます。"],"explanation":"再開するか、要約を持って新しく始めるかは、以前の文脈がどれだけ有効かで決めます。以前のツール結果の大半が古くなったなら、古い結果を抱えたまま再開するより、構造化した要約を渡して新しいセッションを始めるほうが確実です。逆に、変わったのが一部のファイルだけで大半が有効なら、`--resume <セッション名>` で再開し、変わったファイルを具体的に伝えて、そこだけ読み直させます。どちらの場合も、まだ役に立つ結論は捨てずに引き継ぎます。","ref":"試験ガイド タスク 1.7 ／ Agent SDK Docs: Sessions ／ Claude Code Docs: CLI reference（--resume、--name）"},{"id":"D1-12","domain":"D1","scenario":"S2","topic":"名前付きで再開","type":"single","question":"あなたは同じリポジトリで、2つの調査を並行して進めています。1つは注文 API のメモリリーク、もう1つは在庫の集計が遅い原因で、どちらもあと数日かかる見込みです。今朝 `claude --continue` で再開すると、昨日最後に触っていた在庫の調査の会話が開きました。どちらの調査も、これまでの分析はそのまま使えます。調査ごとに会話を続けるための方法として、最も適切なものはどれですか。","options":["調査ごとのセッションに名前を付けておき、`claude --resume <名前>` で目的の会話を再開する","毎朝 `claude --continue` で再開し、最初のメッセージで、今日はどちらの調査を続けるのかを伝える","2つの調査を1つのセッションにまとめ、調査ごとに見出しを付けて、同じ会話の中で切り替えて進める","毎朝新しいセッションを始め、前日の調査のメモを貼り付けてから、その日の調査を続けさせる"],"answer":[0],"notes":["正解。名前を付けたセッションは、`--resume` に名前を渡して、その会話を指定して再開できます。調査ごとの文脈を混ぜずに、作業日をまたいで続けられます。","`--continue` は、そのディレクトリでいちばん最近の会話を開くだけです。別の調査の会話の中で話題を切り替えることになり、2つの調査の文脈が混ざります。","1つの会話に2つの調査の検索結果や仮説が混ざり、互いの結論に引きずられます。コンテキストも2つ分を使います。","メモや要約を渡して新しく始めるのは、以前のツール結果が古くなった場合の手です。分析がそのまま使えるなら、再開したほうが情報を失いません。"],"explanation":"作業日をまたいで特定の調査を続けるなら、セッションに名前を付けておき、`--resume <セッション名>` で再開します。`--continue` は直近の会話を開くだけなので、並行する調査が複数あると、目的の会話を確実には選べません。再開した会話には、それまでの分析がそのまま残るので、文脈が有効なうちは、新しく始めるより多くの情報を引き継げます。Claude Code では、起動時に `-n`（`--name`）で名前を付けるか、作業中に `/rename` で名前を付け直せます。","ref":"試験ガイド タスク 1.7 ／ Claude Code Docs: CLI reference（--resume、--name、--continue）／ Claude Code Docs: Commands（/rename）"},{"id":"D1-13","domain":"D1","scenario":"S3","topic":"結果を履歴に足す","type":"single","question":"コーディネーターのエージェントループを、Messages API を直接呼んで次のように実装しています。前の段の結果を使う3段階の調査を順に委任した依頼で、コーディネーターが済んだ段をもう一度依頼したり、最終レポートに最後の段の内容しか載らなかったりする例がありました。最も適切な修正はどれですか。","code":"messages = [{\"role\": \"user\", \"content\": request}]\nlatest = \"\"\nwhile True:\n    resp = client.messages.create(\n        model=MODEL, tools=tools, messages=messages,\n        system=BASE_PROMPT + \"\\n最新の結果:\\n\" + latest,\n    )\n    if resp.stop_reason != \"tool_use\":\n        break\n    latest = run_subagents(resp)  # 結果は最新の1回分だけを保持","options":["システムプロンプトに、一度依頼した段の調査は二度と依頼しないよう明記し、重複の依頼を防ぐ","サブエージェントの結果をファイルに追記して保存し、最終レポートを作るときにまとめて読み込ませる","応答と各結果の `tool_result` を `messages` に足し、次のリクエストで返す","コンテキストウィンドウの大きいモデルに切り替え、長い調査の途中でも結果を見落とさないようにする"],"answer":[2],"notes":["確率的な手で、原因が残ります。自分がどの調査を依頼し、何が返ってきたかが履歴にないので、モデルには何が済んだかを判断する材料がありません。","最終レポートの抜けは減るかもしれませんが、途中の判断（どの段が済んだか、次に何を調べるか）に結果を使えないので、同じ依頼の繰り返しは直りません。","正解。アシスタントの応答と、`tool_use_id` で呼び出しに対応づけた `tool_result` を履歴に足して返せば、モデルはそれまでの結果をふまえて次の行動を推論できます。","規模で解決しようとする手です。結果が履歴に入っていないことが原因なので、コンテキストが大きくても、上書きで消えた結果は見えません。"],"explanation":"エージェントループでは、`stop_reason` が `\"tool_use\"` のとき、要求されたツールを実行し、アシスタントの応答と、各結果を `tool_use_id` で呼び出しに対応づけた `tool_result` を会話履歴に足して、次のリクエストを送ります。モデルは積み上がった履歴を見て、何が済み、次に何をするかを推論します。結果を毎回上書きする欄に入れると、前の結果も、自分がどの呼び出しをしたかも消えるので、同じ依頼の繰り返しや抜けが起きます。トークンを減らしたいなら、履歴から結果を外すのではなく、サブエージェントに要点と出典だけを返させるなど、結果そのものを絞ります。","ref":"試験ガイド タスク 1.1 ／ Claude API Docs: How tool use works、Handle tool calls"},{"id":"D1-14","domain":"D1","scenario":"S3","topic":"呼ぶエージェントの選択","type":"single","question":"利用ログを分析すると、依頼の約6割は「ある業界団体の設立年」のような単純な事実確認でした。しかし今のコーディネーターは、どの依頼でもウェブ検索、文書分析、統合、レポート生成の全サブエージェントを順に呼んでおり、単純な依頼でも回答まで平均4分かかり、コストもかさんでいます。複雑な調査の品質は保ちたいと考えています。最も適切な対応はどれですか。","options":["コーディネーターに依頼の要件を分析させ、単純な事実確認では検索だけを呼ぶなど、呼ぶ相手を動的に選ばせる","全サブエージェントを並列に起動し、パイプライン全体を通したときの待ち時間を短くして応答を早める","すべてのサブエージェントをより小さく応答の速いモデルに切り替え、1回あたりの処理時間を短くして返す","過去の依頼で学習させた分類モデルを前段に置き、依頼ごとに処理の経路を予測して自動的に振り分ける"],"answer":[0],"notes":["正解。クエリの複雑さに応じて呼ぶサブエージェントを決めるのはコーディネーターの役割です。単純な依頼で不要な処理を省けば、複雑な調査の流れはそのまま残せます。","統合やレポート生成は前段の結果を使うので、単純に並列化はできません。単純な依頼で不要なサブエージェントを呼ぶこと自体も変わりません。","規模で解決しようとする手です。複雑な調査の品質を下げるおそれがあり、不要なサブエージェントを毎回呼ぶという原因は残ります。","効くかもしれませんが、ラベル付きのデータと別の基盤が必要で、最初の一手には重すぎます。コーディネーター自身に判断させる方法をまだ試していません。"],"explanation":"コーディネーターは、毎回パイプライン全体を通すのではなく、クエリの要件を分析して呼ぶサブエージェントを動的に選びます。Anthropic のマルチエージェントのリサーチシステムでも、エージェントは作業量の見積もりが苦手なため、単純な事実確認は1つのエージェントで足りる、複雑な調査は役割を分けた多数のサブエージェントを使う、といった目安をプロンプトに入れています。モデルを小さくする、分類モデルを足すといった手より、原因である「一律にパイプラインを通す設計」を直すほうが、品質を保ったまま効きます。","ref":"試験ガイド タスク 1.2 ／ Anthropic Engineering: How we built our multi-agent research system"},{"id":"D1-15","domain":"D1","scenario":"S3","topic":"調査範囲の分割","type":"single","question":"「電気自動車の普及を妨げる要因」という依頼に対し、コーディネーターは3つのウェブ検索サブエージェントを並列に起動し、それぞれに同じ依頼文をそのまま渡しています。結果を調べると、3つが集めた情報源の約7割が重複しており、消費したトークンの割に得られる情報が増えていません。最も適切な対応はどれですか。","options":["各サブエージェントのプロンプトに「ほかのサブエージェントと重ならない情報源を選ぶこと」と書き加える","統合サブエージェントに重複した情報源を取り除く手順を加え、レポートに重複が出ないようにする","検索サブエージェントを1つに減らし、その1つのエージェントにすべての検索をまとめて任せる","充電インフラ、価格と補助金、消費者の意識のように、サブトピックや情報源の種類を分けて割り当てる"],"answer":[3],"notes":["サブエージェントは分離されたコンテキストで動き、ほかのサブエージェントが何を集めているかを知りません。重ならないよう指示されても、避ける手がかりがありません。","下流で症状を消すだけです。重複した検索に使ったトークンと時間は戻らず、集まる情報の幅も広がりません。","両極端の手です。重複はなくなりますが、並列に広く調べるという利点まで捨ててしまいます。","正解。コーディネーターがサブトピックや情報源の種類で範囲を分け、境界をはっきり伝えれば、重複が減り、全体のカバー範囲も広がります。"],"explanation":"重複を減らすには、コーディネーターが調査範囲をサブエージェント間で分割し、各エージェントに異なるサブトピックや情報源の種類を割り当てます。サブエージェントはコーディネーターや互いの会話履歴を引き継がないので、何をどこまで調べるかはプロンプトで明示するしかありません。Anthropic のリサーチシステムの記事も、詳しい担当範囲を示さないとエージェントが作業を重複させたり抜けを作ったりすると述べています。","ref":"試験ガイド タスク 1.2 ／ Anthropic Engineering: How we built our multi-agent research system"},{"id":"D1-16","domain":"D1","scenario":"S3","topic":"反復的な改善ループ","type":"single","question":"「国内の再生可能エネルギー政策の変遷」のレポートを確かめたところ、2023年以降の制度改正がほとんど扱われていませんでした。追加で調べると、該当する公的資料はウェブで公開されています。今のシステムは、検索、分析、統合を1回ずつ実行して終わる構成です。最も適切な対応はどれですか。","options":["統合サブエージェントに、資料が足りない期間はモデル自身の知識で補ってレポートを書くよう指示する","コーディネーターが統合の出力の不足を評価し、的を絞って検索と分析に再委任してから統合し直す","最初の検索で取得する結果の件数を大幅に増やし、1回の実行ですべての期間を網羅できるようにする","レポートに「2023年以降の制度改正は対象外」と注記を加え、カバー範囲の限界を読者に示す"],"answer":[1],"notes":["出典のない記述が増え、出典を明記したレポートという目的に反します。モデルの知識は古い可能性もあります。","正解。統合の結果に抜けがないかをコーディネーターが評価し、足りない部分だけを狙って再委任し、カバー範囲が十分になるまで統合を繰り返します。","規模で解決しようとする手です。何が抜けるかは結果を見るまで分からず、件数を増やしても関係の薄い結果が増えて統合の負担が重くなります。","カバレッジの注記は、情報源が得られない欠落を正直に伝えるための手です。今回は資料が公開されていて調べられるので、抜けを埋めないまま残すことになります。"],"explanation":"1回で終わる構成では、最初の分解や検索で落ちた部分を取り戻せません。コーディネーターが統合の出力を評価し、不足している範囲に絞ったクエリで検索と分析のサブエージェントに再委任し、十分になるまで統合を呼び直す反復的な改善ループを組みます。Anthropic のリサーチシステムでも、リードエージェントが結果をまとめたうえで、さらに調査が必要かを判断し、サブエージェントを追加したり方針を変えたりしています。資料が手に入るのに注記だけで済ませるのは、調べられない欠落を伝える手との取り違えです。","ref":"試験ガイド タスク 1.2 ／ Anthropic Engineering: How we built our multi-agent research system"},{"id":"D1-17","domain":"D1","scenario":"S3","topic":"通信の経路","type":"single","question":"開発者の一人が、待ち時間を減らすために「文書分析サブエージェントが分析を終えたら、統合サブエージェントを直接呼び出して結果を渡す」構成を提案しました。チームは、どのサブエージェントで何が失敗したかを一か所で把握できることと、エラーの扱いがどの経路でもそろっていることを重視しています。最も適切な判断はどれですか。","options":["採用する。直接渡せば往復が1回減り、エラーの扱いはそれぞれのサブエージェントの判断に任せられる","採用する。そのうえで各サブエージェントが自分のログを別々のファイルに書き出し、あとでまとめて突き合わせる","採用しない。サブエージェント間の通信はすべてコーディネーター経由にし、可観測性とエラー処理をそろえる","採用しない。代わりに文書分析と統合を1つのサブエージェントにまとめ、受け渡しの経路そのものをなくす"],"answer":[2],"notes":["エラーの扱いが経路ごとにばらばらになり、失敗を一か所で把握するという要件に反します。","ログが分散し、失敗が起きてから突き合わせる運用になります。エラーの扱いをそろえるという要件も満たせません。","正解。ハブアンドスポーク型では、コーディネーターがすべての通信、エラー処理、情報のルーティングを管理するので、何がどこで起きたかを一か所で追えます。","論点がずれています。役割を合わせると専門化の利点を失い、ほかのサブエージェントとの通信をどう管理するかという問題は残ります。"],"explanation":"コーディネーターとサブエージェントのパターンでは、サブエージェント間の通信をすべてコーディネーター経由にします。そうすると、可観測性、一貫したエラー処理、制御された情報フローが得られます。サブエージェント同士を直接つなぐと往復は減るかもしれませんが、失敗の把握とエラーの扱いが経路ごとに分かれてしまいます。要件に「一か所で把握」「扱いをそろえる」とあるときは、ハブアンドスポーク型を守るのが答えです。","ref":"試験ガイド タスク 1.2"},{"id":"D1-18","domain":"D1","scenario":"S3","topic":"委任ツールの許可","type":"single","question":"Agent SDK でコーディネーターを次のように設定しました。サブエージェントの定義は読み込まれていますが、実行ログを見ると、サブエージェントは一度も起動されず、コーディネーター自身が `WebSearch` で検索してレポートを書いています。最も可能性の高い原因と対処はどれですか。","code":"options = ClaudeAgentOptions(\n    allowed_tools=[\"WebSearch\", \"Read\"],\n    agents={\n        \"web-searcher\": AgentDefinition(...),\n        \"doc-analyzer\": AgentDefinition(...),\n        \"synthesizer\": AgentDefinition(...),\n    },\n)","options":["コーディネーターの `allowed_tools` に `\"Task\"` がないため委任できない。`\"Task\"` を加える","システムプロンプトの委任の指示が弱い。「調査は必ずサブエージェントに委任すること」と明記する","各サブエージェントの `tools` に `\"Task\"` がない。サブエージェント側の各定義に `\"Task\"` を加える","`AgentDefinition` の `description` が短い。いつ使うかを詳しく書き、選ばれやすくする"],"answer":[0],"notes":["正解。サブエージェントは `Task` ツールで起動します。コーディネーターがサブエージェントを呼ぶには、その `allowed_tools`（試験ガイドの表記では `allowedTools`）に `\"Task\"` を含める必要があります。","起動の手段がない状態でプロンプトを強めても、委任はできません。確率的な手で、仕組みの欠けを補おうとしています。","置き場所の取り違えです。サブエージェントを起動するのはコーディネーターなので、`\"Task\"` が要るのはコーディネーターの側です。","`description` はどのサブエージェントを選ぶかの手がかりですが、`Task` ツールが使えなければどれも起動できません。"],"explanation":"Agent SDK では、コーディネーターは `Task` ツールでサブエージェントを生成するので、`allowedTools`（Python の SDK では `allowed_tools`）に `\"Task\"` が必要です。`AgentDefinition` で種類ごとの説明、システムプロンプト、ツールの制限を定めても、起動の手段がなければ使われず、この例のように手元のツールで自分で作業してしまいます。なお2026年11月時点のドキュメントでは、このツールは Claude Code v2.1.63 で `Agent` という名前に変わっており、例では `allowed_tools` に `\"Agent\"` を書いています（設定の `Task` は別名として使えます）。","ref":"試験ガイド タスク 1.3 ／ Agent SDK Docs: Subagents in the SDK"},{"id":"D1-19","domain":"D1","scenario":"S3","topic":"文脈の明示的な受け渡し","type":"single","question":"コーディネーターはユーザーとのやり取りで「対象は2020年以降の国内市場に限る」という条件を確かめ、検索と文書分析も終えました。ところが統合サブエージェントを起動する `Task` のプロンプトは「これまでの調査結果を統合してレポートの素案を作って」の1文だけで、統合サブエージェントは海外の事例まで含めた一般論を返してきました。最も適切な対応はどれですか。","options":["統合サブエージェントのシステムプロンプトに、コーディネーターの会話履歴を確かめてから作業するよう書く","検索と文書分析の結果全体と、期間と地域の条件を、統合を依頼する `Task` のプロンプトに直接含める","統合サブエージェントの出力を受け取ったあと、条件に合わない部分をコーディネーターが削ってから使う","統合サブエージェントのモデルを、コンテキストウィンドウのより大きいモデルに切り替えて余裕を持たせる"],"answer":[1],"notes":["サブエージェントはコーディネーターの会話履歴を自動的には引き継ぎません。見られない履歴を確かめるよう指示しても効きません。","正解。サブエージェントに必要な文脈は、プロンプトで明示的に渡します。先行するエージェントの調査結果全体と、ユーザーが決めた条件をそのまま含めます。","下流で症状を抑えるだけです。統合サブエージェントは調査結果も受け取っていないので、削っても正しい素案にはなりません。","規模で解決しようとする手です。コンテキストが大きくても、渡されていない情報は使えません。"],"explanation":"サブエージェントは分離されたコンテキストで動き、親の会話履歴を自動的には継承せず、呼び出しをまたいでメモリも共有しません。そのため、統合サブエージェントには、ウェブ検索と文書分析の結果全体と、範囲の条件を、`Task` のプロンプトに直接含めて渡します。「これまでの」のような言い方は、受け取る側には何も指していません。2026年11月時点の Claude Code と Agent SDK には会話を丸ごと引き継ぐフォークという種類のサブエージェントもありますが、通常のサブエージェントは今も引き継ぎません。","ref":"試験ガイド タスク 1.3 ／ Agent SDK Docs: Subagents in the SDK（What subagents inherit）"},{"id":"D1-20","domain":"D1","scenario":"S3","topic":"並列の起動","type":"single","question":"コーディネーターは独立した4つのサブトピックを調べるため、1つの応答で `Task` を1回呼び、結果が返ってから次のターンで次の `Task` を呼ぶ、という形で4回に分けて起動しています。各サブエージェントの所要時間はほぼ同じで、全体の調査時間は1つ分の約4倍です。調査の品質を変えずに時間を短くしたいと考えています。最も適切な対応はどれですか。","options":["4つのサブトピックを1つのサブエージェントにまとめて渡し、起動の回数そのものを1回だけに減らしておく","各サブエージェントの最大ターン数を減らし、1つあたりの調査を早めに切り上げさせて時間を縮める","すべてのサブエージェントを、より小さく応答の速いモデルに切り替えて1回あたりの時間を縮める","コーディネーターの1つの応答で4つの `Task` 呼び出しを出させ、サブエージェントを並列に起動する"],"answer":[3],"notes":["1つのコンテキストに4つのテーマを詰め込むと注意が分散し、順に調べるので時間もほとんど縮みません。","調査を途中で切り上げるので、品質を変えないという条件に反します。","規模で解決しようとする手です。品質が変わるおそれがあり、1つずつ順に起動するという原因も残ります。","正解。独立したサブタスクは、1つの応答で複数の `Task` 呼び出しを出して並列に起動します。全体の時間は、合計ではなくいちばん遅い1つの時間に近づきます。"],"explanation":"サブエージェントを並列に生成するには、ターンを分けるのではなく、コーディネーターの単一の応答で複数の `Task` ツール呼び出しを出力します。Agent SDK のドキュメントも、並列に動かせば独立したサブタスクは合計の時間ではなく最も遅いものの時間で終わると説明しています。Anthropic のリサーチシステムでは、サブエージェントの並列起動などで複雑な調査の時間を大きく縮めました。2026年11月時点の Agent SDK では、サブエージェントは既定でバックグラウンドで動き、ツールの名前は `Agent` に変わっています。","ref":"試験ガイド タスク 1.3 ／ Agent SDK Docs: Subagents in the SDK ／ Anthropic Engineering: How we built our multi-agent research system"},{"id":"D1-21","domain":"D1","scenario":"S3","topic":"目標と品質基準を渡す","type":"single","question":"コーディネーターは検索サブエージェントに「1. 『〇〇 市場規模』で検索する 2. 上位3件を読む 3. 要約を返す」という手順をそのまま指示しています。新しい分野のトピックでは、最初のクエリで役に立たない結果しか出なくても手順どおりに進み、根拠の薄い要約が返ってきます。最も適切な改善はどれですか。","options":["分野ごとに検索語と読む件数を細かく決めた手順書を用意し、トピックに合わせて使い分けさせる","上位3件ではなく上位10件を読むよう手順を変え、1回の検索で集めて読む情報の量を大きく増やす","調査の目標、独立した情報源の数や一次資料の優先などの品質基準、返す形式を示し、進め方は任せる","結果が3件未満なら同じクエリで検索をやり直す、という分岐を手順の2番目の前に加える"],"answer":[2],"notes":["手順を細かくするほど、想定外の結果への適応の余地がなくなります。分野が増えるたびに手順書を作る負担も残ります。","規模で解決しようとする手です。クエリそのものが合っていなければ、読む件数を増やしても役に立つ情報は増えません。","正解。目標と品質基準を示せば、サブエージェントは結果を見てクエリを変えるなど、状況に合わせて進め方を変えられます。","同じクエリをやり直しても、同じような結果が返るだけです。決まった分岐を足しても手順の硬さは変わりません。"],"explanation":"コーディネーターのプロンプトでは、段階的な手順ではなく、調査の目標と品質基準を指定し、サブエージェントが適応できるようにします。Anthropic のリサーチシステムの記事も、各サブエージェントには目的、出力の形式、使うツールと情報源の指針、明確な担当範囲が必要だと述べ、短く広いクエリから始めて徐々に絞る進め方を勧めています。固定の手順は、結果が想定どおりのときにしかうまく働きません。","ref":"試験ガイド タスク 1.3 ／ Anthropic Engineering: How we built our multi-agent research system"},{"id":"D1-22","domain":"D1","scenario":"S3","topic":"分解パターンの選択","type":"single","question":"このシステムでは、すべての依頼を「検索→分析→統合→レポート」の固定のプロンプトチェーンで処理しています。毎週の競合動向レポート（財務、製品、提携、ニュースの4項目が毎回同じ）は安定しています。一方、「新素材Xの商用化の見通し」のような依頼では、途中で規制が大きな論点だと分かっても進め方を変えられず、レポートに反映されませんでした。最も適切な対応はどれですか。","options":["定型の週次レポートはチェーンのまま、先の見えない調査は途中の発見からサブタスクを作る動的な分解にする","固定のチェーンに「規制の調査」のステップを足し、どの依頼でも必ず規制の動向を調べるようにする","週次レポートも含めたすべての依頼を、コーディネーターが毎回その場で分解を決める動的な方式に切り替える","チェーンの各ステップのプロンプトに「重要な論点を見落とさないこと」という注意書きをはっきり加える"],"answer":[0],"notes":["正解。手順が予測できる多面的な処理にはプロンプトチェーン、オープンエンドな調査には中間的な発見に基づく動的な分解、と使い分けます。","今回の論点だけに対応する手です。次の依頼で別の論点が出れば同じことが起き、規制が関係ない依頼にも不要な処理が増えます。","安定している定型の処理まで動的にすると、毎回の出力の一貫性が下がり、手間とコストも増えます。","チェーンの構造は固定のままなので、途中で分かった論点に合わせてサブタスクを足すことはできません。"],"explanation":"固定の逐次パイプライン（プロンプトチェーン）は、毎回同じ項目を調べる予測可能な処理に向きます。何を調べるべきかが途中の発見で変わるオープンエンドな調査には、各ステップで見つかった内容からサブタスクを作る動的で適応的な分解が向きます。1つの方式をすべてに当てはめるのではなく、ワークフローの性質で選ぶのが判断の軸です。","ref":"試験ガイド タスク 1.6 ／ Anthropic Engineering: Building effective agents"},{"id":"D1-23","domain":"D1","scenario":"S3","topic":"文書ごとのパス","type":"single","question":"文書分析サブエージェントに、ある技術分野の論文25本をまとめて渡し、各論文の手法、結果、限界を分析させています。出力を見ると、最初の数本は詳しいのに後半の論文は1〜2行しかなく、同じ評価手法を、ある論文では妥当、別の論文では問題ありと矛盾して評価していました。最も適切な分析の構成はどれですか。","options":["論文を発表年の新しい順に並べ替えて渡し、重要度の高い新しい論文から先に分析されるようにする","各論文の要旨だけを渡して入力を短くし、25本を1回のパスでも無理なく扱えるようにしておく","分析の観点を細かく並べたチェックリストをプロンプトに加え、どの論文にも同じ観点を漏れなく当てさせる","論文ごとに個別の分析パスを実行し、そのあとで論文を横断して比較と整合を取る統合パスを別に実行する"],"answer":[3],"notes":["順番を変えても、後ろに置かれた論文が薄くなる問題は残ります。新しい論文ほど重要とも限りません。","手法や限界の詳細は本文にあることが多く、分析に要る情報を捨ててしまいます。","観点をそろえても、25本を1度に扱うことによる注意の分散は解消しません。論文の間の矛盾を整理する段階もありません。","正解。1本ずつのパスで分析の深さをそろえ、別の統合パスで論文をまたぐ比較と矛盾の整理を行います。"],"explanation":"多くの入力を1回で扱うと注意が分散し、深さがばらつき、同じものへの評価が食い違います。大きな分析は、1件ずつの局所的な分析パスと、横断の統合パスに分けるプロンプトチェーンにします。試験ガイドはコードレビューを例に挙げていますが、リサーチの文書分析でも同じ考え方が当てはまります。","ref":"試験ガイド タスク 1.6"},{"id":"D1-24","domain":"D1","scenario":"S3","topic":"先の見えない調査の分解","type":"multi","question":"社内に蓄積された過去10年分の調査資料（約3,000件）から、今後取り組むべき研究テーマの候補を洗い出す依頼を受けました。資料がどう分類できるかも、どの資料が重要かも、まだ分かっていません。この依頼の分解の進め方として、取るべき対応はどれですか。（2つ選択）","options":["3,000件を30のサブエージェントに100件ずつ均等に割り振り、全件を同じ深さで分析させる","まず資料の分類、年次、テーマの分布を把握し、影響の大きい領域を特定して優先順位を付けた計画を作る","最初に依頼者と調べる観点を10項目に確定させ、途中で計画を変えずにすべて実行する","「今後の課題」などの語を含む資料だけを検索で抜き出し、その資料から候補をまとめる","調べる中で見つかった資料どうしの関連や新しい論点に応じて、サブタスクを足したり組み替えたりする"],"answer":[1,4],"notes":["重要度を見ずに機械的に割ると、価値の低い資料にも同じ手間をかけます。資料をまたぐ関連も各エージェントの担当の境目で切れます。","正解。オープンエンドなタスクは、まず全体の構造を把握し、影響の大きい領域を特定して優先順位付きの計画を作ることから始めます。","資料の中身を見る前に観点を固定すると、調べる中で見つかる重要な論点や資料どうしのつながりを計画に取り込めません。","語の一致だけで対象を絞ると、別の言い方で書かれた重要な資料を落とします。全体の構造を把握しないまま範囲を狭めることにもなります。","正解。適応的な調査計画では、各ステップで分かったことに応じてサブタスクを作り直します。"],"explanation":"終わりの見えない調査は、最初にすべてのサブタスクを決めることができません。まず構造を把握し、影響の大きい領域を特定して優先順位付きの計画を作り、見つかった依存関係や論点に合わせて計画を更新します。試験ガイドは「レガシーなコードベースに包括的なテストを追加する」を例にしていますが、大量の資料の調査でも同じ進め方をします。機械的な均等割りや語の一致による絞り込みは全体の構造を見ないまま進め、観点の固定は途中の発見を取り込めないので劣ります。","ref":"試験ガイド タスク 1.6 ／ Anthropic Engineering: Building effective agents"},{"id":"D1-25","domain":"D1","scenario":"S4","topic":"完了の判定","type":"single","question":"Agent SDK に移る前の試作として、Messages API を直接呼ぶエージェントループを次のように自作しました。ツールの結果は履歴に足していますが、調査の途中で「まず呼び出し元を Grep で探します。」のような一言だけが回答として返り、ループが終わってしまう例が約3割あります。ログを見ると、そうした応答には、テキストと一緒に `tool_use` のブロックが含まれていました。最も適切な修正はどれですか。","code":"while True:\n    resp = client.messages.create(model=MODEL, system=SYSTEM,\n                                  tools=TOOLS, messages=messages)\n    messages.append({\"role\": \"assistant\", \"content\": resp.content})\n    if any(b.type == \"text\" for b in resp.content):\n        break                      # テキストがあれば回答とみなす\n    messages.append({\"role\": \"user\", \"content\": run_tools(resp.content)})","options":["`stop_reason` が `\"tool_use\"` の間はツールを実行して続け、`\"end_turn\"` で終える","システムプロンプトに「ツールを呼ぶ応答には説明の文章を書かないこと」と加え、今のテキストによる判定を続ける","テキストが200字を超えたときだけ回答が出たとみなすように、ループを終える条件を書き換えておく","反復回数の上限を5回に固定し、上限に達したときの最後の応答を、そのまま回答として返すようにする"],"answer":[0],"notes":["正解。続けるか終えるかは `stop_reason` で判断します。`\"tool_use\"` なら、テキストが含まれていてもツールを実行して結果を返し、`\"end_turn\"` で終えます。","書き方をプロンプトで縛っても、テキストの有無で完了を判定するアンチパターンは残ります。指示が守られない応答があれば、同じように途中で終わります。","目安を文字数に変えても、テキストの中身から完了を推測していることは同じです。長い説明と一緒にツールを呼ぶ応答では、やはり途中で終わります。","根拠のない反復回数の上限を主な停止の仕組みにするアンチパターンです。調査の進み具合と関係なく打ち切られ、終わっていない調査が回答になります。"],"explanation":"Claude は、ツールを呼ぶ応答でも、「〜を調べます」のようなテキストのブロックを `tool_use` の前に含めることがあります。そのため、テキストの有無や、テキストに含まれる言葉で完了を判断すると、調査の途中でループが終わります。エージェントループは `stop_reason` で制御し、`\"tool_use\"` の間はツールを実行して `tool_result` を返し、`\"end_turn\"` で終えます。`\"max_tokens\"` のようなほかの停止理由は、正常な完了とは分けて扱います。","ref":"試験ガイド タスク 1.1 ／ Claude API Docs: How tool use works（The agentic loop）、Handle tool calls"},{"id":"D1-26","domain":"D1","scenario":"S4","topic":"根拠を分けて渡す","type":"single","question":"コーディネーターは、依存関係を調べるサブエージェントの報告を、レガシーシステムの解説文書を書くサブエージェントに渡しています。調査役の報告には根拠のファイルと行番号が書かれていますが、コーディネーターはそれを短い文章に要約してから解説役に渡しています。その結果、できた文書では、どの説明がどのコードに基づくのかが分からず、レビュー担当が根拠を確かめられません。最も適切な対応はどれですか。","options":["調査の結果を、発見の内容と根拠のファイルパス・行番号を分けた構造化データにして渡す","解説役のシステムプロンプトに、説明ごとに根拠のファイル名と行番号を必ず書くよう指示を加える","解説役にも Read と Grep を与え、文書を書く前に根拠の場所をコード全体から探し直させる","要約の文章をもっと長くし、調査役の報告の言い回しをできるだけ残したまま解説役に渡す"],"answer":[0],"notes":["正解。発見の本文とメタデータ（ファイルパス、行番号など）を分けた構造化データで渡すと、どの記述がどこに基づくかが最後まで保たれます。","解説役は渡されたものしか知りません。根拠の場所が要約で落ちている以上、指示を足しても正しい場所は書けず、推測が混ざります。","調査役がすでに突き止めたことを、もう一度探させる二重の作業です。探し直した結果が、調査役の根拠と食い違うおそれもあります。","文章のまま渡す限り、根拠の場所は本文に埋もれるか抜け落ちます。長くしても、記述と根拠の対応は確実には保てません。"],"explanation":"サブエージェントは親の会話履歴を引き継がず、起動のときにプロンプトで渡されたものだけをもとに作業します。そのため、前のエージェントの結果を渡すときは、内容とメタデータ（ウェブの調査なら出典の URL や文書名、ページ番号、コードの調査ならファイルパスや行番号）を分けた構造化データにして、情報源の帰属を保ちます。自然な文章に要約すると、内容は伝わっても「どこから来た情報か」が落ちやすくなります。受け取る側に指示を足すより、渡す情報の形を直すほうが原因に直接効きます。","ref":"試験ガイド タスク 1.3 ／ Agent SDK Docs: Subagents in the SDK"},{"id":"D1-27","domain":"D1","scenario":"S4","topic":"実行前に止めるフック","type":"single","question":"反復作業を自動化するエージェントに、Bash、Write、Edit を許可しています。チームの決まりでは、本番に適用済みの `db/migrations/` 配下の既存ファイルは書き換えてはいけません。システムプロンプトに書くだけでは500回の実行のうち2回破られたため、チームはフックで強制することに決めました。決まりを確実に守らせるフックの使い方として、最も適切なものはどれですか。","options":["`PostToolUse` フックで書き込み後の差分を調べ、違反が見つかったら元に戻すようエージェントに指示する","`Stop` フックで実行の終わりに `db/migrations/` の変更を調べ、違反があればその実行を失敗として扱う","`UserPromptSubmit` フックで毎回の依頼に決まりの文言を足し、作業の前にエージェントに思い出させる","`PreToolUse` フックで書き込みの対象を調べ、既存のマイグレーションなら拒否して理由を返す"],"answer":[3],"notes":["`PostToolUse` はツールの実行後に呼ばれるので、ファイルはすでに書き換わっています。元に戻すかどうかもエージェントの判断に任され、書き換えそのものは防げません。","`Stop` はエージェントの実行が終わるときに呼ばれます。違反には気付けても、その時点で書き換えは終わっており、止める仕組みになっていません。","依頼に文言を足すのは、プロンプトで決まりを伝えることと変わりません。確率的な手で、違反をゼロにする保証にはなりません。","正解。`PreToolUse` は、ツールが実行される前の呼び出しを横取りできます。`permissionDecision: \"deny\"` と理由を返せば、書き換えを決定論的に止めたうえで、新しいマイグレーションを作る流れに導けます。"],"explanation":"フックには、送られるツール呼び出しを横取りするもの（`PreToolUse`）と、ツールの結果を横取りするもの（`PostToolUse`）があります。操作そのものを止めたいなら、実行の前に呼ばれる `PreToolUse` で方針に反する呼び出しを拒否し、理由を返します。理由はモデルに伝わるので、エージェントは代わりのやり方に進めます。`PostToolUse` や `Stop` は事後に気付く仕組みで、結果の変換や記録に向きます。なお、フックの照合はツールの名前に対して行われるので、Write と Edit だけでなく、Bash のコマンドでファイルを書き換える経路も対象に含めます。","ref":"試験ガイド タスク 1.5 ／ Agent SDK Docs: Intercept and control agent behavior with hooks"},{"id":"D1-28","domain":"D1","scenario":"S4","topic":"再開と変更の伝達","type":"single","question":"エンジニアが `claude --resume billing-analysis` で、前日に名前を付けた調査セッションを再開しようとしています。前日のセッションでは40ファイルを分析しました。その後に変わったのは、チームメイトがマージした3ファイル（`invoice.py`、`tax.py`、`rounding.py`）だけで、前日の分析の大部分はまだ有効です。最も適切な進め方はどれですか。","options":["前日の分析は使わず、新しいセッションで40ファイルすべてを最初から読み直させる","セッションを再開し、変わった3ファイルと変更の要旨を伝えて、そこだけを再分析させる","セッションを再開し、ファイルの変更には触れずに前日の分析の続きから作業させる","セッションを再開し、「最新の状態を確認して」とだけ伝えて、変更の調査も任せる"],"answer":[1],"notes":["以前の文脈の大部分が有効なのに捨てるのは無駄です。新しく始めるのは、以前のツール結果が古くなっている場合の手です。","正解。以前の文脈がおおむね有効なら再開を選び、変わったファイルを具体的に伝えて、的を絞った再分析をさせます。","3ファイルについては古い分析が残ったままになり、変更前の内容を前提にした誤った結論が出るおそれがあります。","どこが変わったかをエージェントに探させると、全体の再探索に近くなります。分かっている変更は伝えるべきです。"],"explanation":"名前を付けたセッションは `--resume <セッション名>` で再開でき、複数の作業日にまたがる調査を続けられます。コードが変わった後に再開するときは、以前に分析したファイルのどれが変わったかをエージェントに伝えることが大切です。以前の文脈がおおむね有効なら再開して変更だけを伝え、以前のツール結果の多くが古くなっているなら、構造化したサマリーを渡して新しいセッションで始めます。この問題では変更が40ファイル中3ファイルなので、前者を選びます。","ref":"試験ガイド タスク 1.7 ／ Claude Code Docs: CLI reference"},{"id":"D1-29","domain":"D1","scenario":"S4","topic":"分岐して比較する","type":"single","question":"Agent SDK で作った支援ツールで、エージェントがレガシーの注文モジュールを1時間かけて分析し、依存関係の全体像がセッションにたまりました。チームは、この共通の分析を土台に、「少しずつ置き換える案」と「一度に書き直す案」の2つを、互いの検討に影響させずに比べたいと考えています。最も適切な方法はどれですか。","options":["同じセッションの中で1つ目の案を検討させ、続けて同じ流れで2つ目の案を検討させる","新しいセッションを2つ始め、それぞれで注文モジュールの分析を最初からやり直させる","分析済みのセッションを `fork_session` で分岐させ、枝ごとに別の案を検討させる","1つ目の案を検討した後に `/compact` で要約し、その要約を土台に2つ目の案を検討させる"],"answer":[2],"notes":["1つ目の案の検討が履歴に残るので、2つ目の案がその影響を受けます。独立した比較になりません。","1時間かけた共通の分析を捨てて、同じ作業を2回繰り返すことになります。分析の結果が2つでずれるおそれもあります。","正解。`fork_session` は、元の履歴を写した独立したセッションを作ります。共通の分析を土台に、2つの方向を別々に探れます。","要約には1つ目の案の検討も含まれるので、2つ目の案が独立しません。分析の細部も要約で落ちます。"],"explanation":"`fork_session` は、共通の分析を土台にして独立した枝を作り、別々のやり方を探るための仕組みです。元のセッションは変わらず、それぞれの枝は別のセッション ID を持つので、あとで個別に再開できます。同じセッションで続けて検討すると前の検討が後の検討に混ざり、やり直すと共通の土台を捨てることになります。ただし分岐するのは会話の履歴だけで、ファイルの変更は分かれないので、各枝でファイルを書き換える場合は別の作業ツリーなどで分けます。","ref":"試験ガイド タスク 1.7 ／ Agent SDK Docs: Work with sessions"},{"id":"D1-30","domain":"D1","scenario":"S5","topic":"定型レビューの分解","type":"single","question":"すべての PR に対し、同じ4つの観点（正確性、セキュリティ、テストの有無、API 規約）でレビューするジョブを作っています。現在は1つのエージェントに「必要と思う調査を自由に進めて」と任せており、PR によって観点の抜けや実行時間のばらつきが大きく、どの段階で問題が起きたのかも追えません。観点は今後も変わる予定がありません。最も適切なタスク分解はどれですか。","options":["エージェントの自律性はそのままにし、システムプロンプトに「4つの観点を必ず網羅すること」と強い表現で追記する","中間の発見に応じてサブタスクを生成する動的な分解に切り替え、PR ごとにエージェントが調査計画を立て直せるようにする","観点ごとに決まったステップを順に実行するプロンプトチェーンにし、各ステップの出力を記録してから最後に結果をまとめる","差分の大きさを判定する分類器を前段に置き、大きい PR だけをエージェントに渡して、小さい PR はレビューを省く"],"answer":[2],"notes":["プロンプトを強めても、観点を網羅するかどうかはモデルの確率的な判断に残ります。段階ごとの記録が取れない問題も解決しません。","動的な分解は、何が必要か事前に分からないオープンエンドな調査に向く方法です。観点が決まっている定型のレビューには、ばらつきを増やすだけです。","正解。観点が予測可能で変わらない多面的なレビューには、固定の逐次パイプライン（プロンプトチェーン）が合います。各段の出力を記録でき、どこで失敗したかも追えます。","どの PR をレビューするかという別の問題を解いています。小さい PR の観点の抜けはそのまま残り、実行ごとのばらつきも解消しません。"],"explanation":"タスク分解は、ワークフローの性質で選びます。観点や手順が事前に決まっている予測可能な多面的レビューにはプロンプトチェーン、何が見つかるか分からないオープンエンドな調査には動的な分解が合います。この場面は観点が固定で、網羅性・実行時間の安定・段階ごとの追跡が求められているので、固定の逐次ステップに分けるのが最もつり合った手です。自律的なエージェントの柔軟さは、手順を前もって決められない仕事のために取っておきます。","ref":"試験ガイド タスク 1.6 ／ Anthropic Engineering: Building effective agents"},{"id":"D1-31","domain":"D1","scenario":"S5","topic":"未知の領域の分解","type":"single","question":"夜間のジョブで、テストがほとんどない決済モジュール（約120ファイル）に「包括的なテストを追加する」作業を Claude Code に任せようとしています。モジュールの内部構造や依存関係は、担当者にもまだよく分かっていません。最初の実行では、アルファベット順にファイルを1つずつ処理する固定の手順を与えたところ、重要度の低いユーティリティに時間を使い果たし、決済の中核部分にはほとんど手が付きませんでした。最も適切な分解の方法はどれですか。","options":["ファイルの処理順を、アルファベット順から更新日時の新しい順に変え、同じ固定の手順で全ファイルを処理させる","まず構造を把握して影響の大きい領域を特定し、優先順位付きの計画を立て、依存関係が見つかるたびに計画を更新させる","120ファイルを均等に6つに分けてサブエージェントに並列で渡し、それぞれに担当範囲のテストを書かせる","1回の実行で処理する量の上限をなくし、全ファイルが終わるまで同じ固定の手順を最後まで繰り返し続けさせる"],"answer":[1],"notes":["並べ方を変えても、どこが重要かを調べずに順番を決めている点は同じです。中核部分に手が届く保証はありません。","正解。オープンエンドなタスクは、まず構造を把握し、影響の大きい領域を特定してから優先順位付きの計画を作り、見つかった依存関係に応じて計画を変える形で分解します。","機械的に均等に分けると、依存関係のあるファイルが別々の担当に割れ、重要度の見極めもされません。並列にしても優先順位の問題は残ります。","量を増やすだけで、重要な部分から手を付けるという問題を解いていません。時間とコストが増えるうえ、中核部分への到達はやはり後回しになります。"],"explanation":"「レガシーコードに包括的なテストを追加する」のような、範囲や中身が事前に分からないタスクには、固定の手順ではなく、中間の発見に応じてサブタスクを作る動的な分解が合います。最初に構造を把握し、影響の大きい領域を特定し、優先順位付きの計画を立て、依存関係が見つかるたびに計画を直します。定型のレビューのように手順が決まっている仕事はプロンプトチェーン、何が出てくるか分からない仕事は適応的な計画、と使い分けるのが判断の軸です。","ref":"試験ガイド タスク 1.6"},{"id":"D1-32","domain":"D1","scenario":"S6","topic":"前提条件ゲート","type":"single","question":"抽出エージェントは、`extract_invoice` で請求書を抽出し、`validate_extraction` で合計や必須項目を検証してから、`post_to_ledger` で会計システムに登録します。システムプロンプトには「検証が合格するまで登録しない」と書いてありますが、本番のログでは約2%の請求書が検証の前に登録され、合計の合わないデータが会計に入りました。経理部門は、検証を通っていない登録を1件も認めません。最も適切な対応はどれですか。","options":["システムプロンプトの該当の指示を冒頭に移して強い言葉にし、検証してから登録する手順の few-shot の例も加える","文書ごとに検証の合格をコードで記録し、合格していない文書への `post_to_ledger` の呼び出しをフックで止める","毎晩、会計システムに登録されたデータを再検証し、合計の合わない登録を担当者が見つけて取り消す","`post_to_ledger` をエージェントのツールから外し、すべての請求書の登録を経理の担当者が手作業で行う"],"answer":[1],"notes":["プロンプトや例を強めても、確率的な誘導のままです。失敗率はゼロにならず、「1件も認めない」という要件を満たせません。","正解。前提のステップ（検証の合格）が済むまで下流のツールをプログラムで止める、前提条件ゲートです。順序を確実に守らせられます。","誤った登録が会計に入った後で見つけて直す、症状への対処です。登録の時点で止めていないので、要件に反します。","人がすべて登録すれば誤登録は防げますが、自動化の価値を捨てる両極端な手です。止めるべきなのは、検証の前の登録だけです。"],"explanation":"業務上必ず守らせたい順序は、プロンプトではなくプログラムで強制します。試験ガイドは、決定論的な遵守が求められる場面ではプロンプトの指示だけでは失敗率がゼロにならないとし、前提となるステップが完了するまで下流のツール呼び出しをブロックする前提条件ゲートを挙げています。Agent SDK では、`PreToolUse` フックでツールの呼び出しを止め、その理由をモデルに返せます。「まれに破られる」ことが許されるかどうかが、プロンプトでの誘導と仕組みでの強制を分ける軸です。","ref":"試験ガイド タスク 1.4 ／ Agent SDK Docs: Hooks"},{"id":"D2-01","domain":"D2","scenario":"S1","topic":"システムプロンプトの語","type":"single","question":"システムプロンプトに「顧客が『返金』と書いたら、まず `process_refund` で手続きを始めること」という一文があります。`lookup_order` の説明には返金の進み具合も返すことが詳しく書いてあるのに、「先週の返金はいつ口座に入りますか」という問い合わせで `process_refund` が呼ばれ、新しい返金の手続きが始まりかけています。最も適切な対応はどれですか。","options":["`process_refund` の説明に「返金の状況確認には使わない」と追記し、システムプロンプトはそのまま残す","語句で特定のツールに結び付けている一文を見直し、どのツールを使うかの判断はツールの説明に任せる","「返金はいつ」という語句が含まれたら `lookup_order` を使う、という一文をシステムプロンプトに足す","返金の前に確認の質問を必ず挟む様子を示す few-shot の例を、システムプロンプトに10件ほど加える"],"answer":[1],"notes":["説明の改善は悪くありませんが、説明を上書きしているキーワードの指示が残ります。同じ語を含む別の問い合わせで、また誤ったツールが選ばれます。","正解。キーワードに敏感な指示は、よく書かれたツールの説明を上書きして、意図しないツールとの結び付きを生みます。原因になっている指示そのものを直します。","キーワードに敏感な指示をもう1つ増やすだけです。語の組み合わせが増えるほど、指示どうしがぶつかります。","原因の指示を残したまま、例で打ち消そうとしています。トークンが増えるうえ、確率的な手当てにとどまります。"],"explanation":"ツールの選択には、ツールの説明だけでなく、システムプロンプトの文言も影響します。「この語が出たらこのツール」のような指示は、文脈を無視した結び付きを生み、適切に書かれた説明を上書きしてしまいます。ツール選択がおかしいときは、説明を足す前に、システムプロンプトにキーワードに敏感な指示がないかを見直します。","ref":"試験ガイド タスク 2.1"},{"id":"D2-02","domain":"D2","scenario":"S1","topic":"重複するツール","type":"single","question":"配送業者の追跡 API を呼ぶ MCP サーバーを自社で追加し、`track_order` というツールが使えるようになりました。説明は「注文の状況を返す」で、既存の `lookup_order` の説明とほぼ同じです。「荷物はいつ届きますか」という問い合わせに、エージェントが `lookup_order` を呼んで倉庫の状態だけを見て「出荷準備中です」と答え、配送業者の持つ到着予定を見落とす例が出ています。最も適切な対応はどれですか。","options":["機能が重なって見える `track_order` を外し、配送の状況は `lookup_order` の結果だけで答えさせる","「届く」「いつ」という語が含まれる問い合わせでは `track_order` を使うよう、システムプロンプトに書く","配送の問い合わせでは2つのツールを毎回両方呼ばせ、返ってきた結果をつなぎ合わせて答えさせる","`track_order` を配送の追跡と分かる名前に変え、両方の説明に返す内容と使い分けの境界を書く"],"answer":[3],"notes":["到着予定を知る手段がなくなり、「いつ届くか」に答えられなくなります。問題を解くのではなく、業務の一部をやめています。","キーワードに敏感な指示で、意図しないツールの結び付きを生みます。言い回しが違う問い合わせには効きません。","不要な呼び出しが毎回増え、2つの結果が食い違ったときの扱いも決まっていません。重複という原因はそのまま残ります。","正解。機能の重複は、名前の変更と説明の更新で解消します。それぞれが何を返し、どの問いにはどちらを使うのかが分かれば、選択が安定します。"],"explanation":"ツールの説明は、LLM がツールを選ぶ主要な仕組みです。説明が曖昧だったり重複していたりすると、誤ったルーティングが起きます。試験ガイドは、機能の重複をなくすためにツールの名前を変え、説明を更新するスキルを挙げています。2026年11月時点の Define tools のページも、複数のサービスにまたがるときはサービス名を接頭辞にした名前で区別するよう勧めています。","ref":"試験ガイド タスク 2.1 ／ Claude Docs: Define tools"},{"id":"D2-03","domain":"D2","scenario":"S1","topic":"入力形式と境界","type":"single","question":"`lookup_order` は、`ORD-` に8桁の数字が続く注文番号だけを受け付けます。ところが顧客は、請求メールに載っている `INV-` で始まる請求書番号を伝えてくることが多く、エージェントはそれをそのまま `lookup_order` に渡して「ご注文が見つかりません」と答えています。ツールの説明は「注文の詳細を取得する」の1文だけです。最も適切な対応はどれですか。","options":["説明に受け付ける番号の形式と例、請求書番号は注文番号ではないこと、そのときの調べ方を書く","「見つかりません」が返ったら、番号の書き方を変えて最大3回まで `lookup_order` を呼び直させる","`lookup_order` がどんな文字列も受け付け、いちばん近い番号の注文を返すように作り替える","「見つかりません」と返したときは、注文番号をもう一度確かめてもらうよう顧客に案内させる"],"answer":[0],"notes":["正解。ツールの説明には、入力の形式、例、エッジケース、境界を書きます。請求書番号を受け取ったときの扱いが分かれば、モデルは正しい手順で注文を特定できます。","形式の取り違えは、呼び直しでは直りません。無駄なツール呼び出しが増えるだけです。","あいまいな照合は、別の顧客の注文を返す危険を生みます。返金を扱うシステムで取るべき手ではありません。","エージェントは請求書番号が注文番号ではないことを知らないままなので、顧客は同じ番号を送り直しがちです。手間を顧客に回すだけで、原因は残ります。"],"explanation":"試験ガイドは、ツールの説明に入力形式、クエリの例、エッジケース、境界の説明を含めることの重要性を挙げています。説明が最小限だと、モデルは何を渡せばよいか、渡せないものが来たらどうするかを判断できません。2026年11月時点の Define tools のページも、ツールが何をするか、いつ使うか（使わないか）、各パラメータの意味、注意点まで詳しく書くことを、ツールの性能に最も効く要素としています。","ref":"試験ガイド タスク 2.1 ／ Claude Docs: Define tools"},{"id":"D2-04","domain":"D2","scenario":"S1","topic":"構造化されたエラー","type":"multi","question":"`process_refund` は、決済サービスのタイムアウトでも、返品期限切れのようなポリシー違反でも、金額の形式の誤りでも、同じ「Operation failed」という汎用のメッセージを返します。エージェントはポリシー違反の返金を何度もやり直したうえ、顧客には「システムの不具合です」と説明しています。行うべき変更はどれですか。（2つ選択）","options":["`isError` を立てた結果に、エラーの種類、リトライできるかの真偽値、人が読める説明を入れて返す","どのエラーでも、エージェント側で指数バックオフを使って最大5回まで自動でリトライさせる","ポリシー違反は、リトライできないことを示すフラグと、顧客に伝えられる分かりやすい理由を添えて返す","失敗したときは空の成功結果を返し、エージェントが顧客を混乱させる説明をしないようにする","エラーが返ったら例外でセッションを終わらせ、すべてのケースを人間の担当者に引き継ぐ"],"answer":[0,2],"notes":["正解。一時的なエラー、検証エラー、ビジネスエラー、権限エラーを区別できれば、エージェントは待ってリトライするか、入力を直すか、顧客に説明するかを選べます。","ポリシー違反は、何度リトライしても結果が変わりません。リトライできるかどうかの情報がないまま繰り返すのは、無駄なリトライそのものです。","正解。ビジネスルールの違反には、リトライ不可のフラグと顧客向けの説明を付けます。エージェントは繰り返しをやめ、断る理由を正しく伝えられます。","失敗を成功に見せかけて握りつぶすと、エージェントは何が起きたかを知る手段を失います。顧客には誤った案内が届きます。","1回の失敗で会話全体を止める、もう一方の極端です。一時的なエラーや入力の誤りのように、その場で立て直せるケースまで人に回ります。"],"explanation":"一律のエラーレスポンスでは、エージェントは適切な復旧の判断を下せません。MCP では、ツールの失敗を `isError: true` の結果で伝えます。そのうえで、エラーの種類（試験ガイドの例では `errorCategory`）、リトライの可否（`isRetryable`）、人が読める説明といった構造化されたメタデータを結果に含めます。これらのフィールド名は MCP の仕様が定めるものではなく、ツールの作り手が結果の中身として設計する項目です。","ref":"試験ガイド タスク 2.2 ／ MCP Specification: Tools（Error Handling）"},{"id":"D2-05","domain":"D2","scenario":"S1","topic":"空の結果と失敗","type":"single","question":"`get_customer` を提供する MCP サーバーは、顧客管理システムへの問い合わせがタイムアウトしたときも例外を握りつぶし、該当なしのときと同じ空の配列を返しています。障害が起きた時間帯に、エージェントが既存の顧客へ「アカウントが見つかりません。新規登録をお勧めします」と案内する例が相次ぎました。最も適切な対応はどれですか。","options":["空の配列が返ったら、どの場合でも `get_customer` を3回まで呼び直すようエージェントに指示する","空の配列が返ったケースは、該当なしの可能性も含めて、すべて人間の担当者にエスカレーションする","タイムアウトは一時的なエラーとして `isError` 付きで返し、空の配列は該当なしのときだけに使う","顧客管理システムへの問い合わせのタイムアウトを長くし、タイムアウトそのものを起きにくくする"],"answer":[2],"notes":["本当に該当がない検索まで無駄に繰り返します。原因は、失敗と空の結果の見分けがつかないことにあります。","通常の該当なしまで人に回り、初回対応での解決率が下がります。区別できないことを、量で吸収しようとしています。","正解。アクセスの失敗と、有効な空の結果を区別して返します。エージェントは、前者ならリトライや別の対応を選び、後者なら該当なしとして案内できます。","タイムアウトの回数は減っても、起きたときにはまた空の結果として伝わります。誤った案内という根本の問題は残ります。"],"explanation":"試験ガイドは、リトライの判断が必要なアクセスの失敗と、一致するものがなかった成功したクエリを表す有効な空の結果を区別するよう求めています。両者を同じ空の結果にすると、エージェントは障害を「顧客がいない」と解釈し、誤った案内をしてしまいます。失敗は `isError` とエラーの種類、リトライの可否を付けて返し、空の結果は本当に該当がなかったときだけに使います。","ref":"試験ガイド タスク 2.2 ／ MCP Specification: Tools（Error Handling）"},{"id":"D2-06","domain":"D2","scenario":"S2","topic":"MCP サーバーの置き場所","type":"multi","question":"チームで、Jira の課題を Claude Code から参照できるようにしたいと考えています。テックリードは、チームの使い方に合わせた Jira 用の MCP サーバーを社内で作ろうと提案していますが、広く使われているコミュニティ製のサーバーがあり、チームの用途（課題の検索と参照）はそれで足ります。また、メンバーの1人は、自分だけで試したい実験的な MCP サーバーを追加したがっています。取るべき対応はどれですか。（2つ選択）","options":["Jira 用の MCP サーバーを社内で新たに作り、チームの使い方に合わせてから `.mcp.json` で共有する","コミュニティ製の Jira サーバーを使い、プロジェクトの `.mcp.json` に書いてチームで共有する","Jira のサーバーは、各メンバーが自分の `~/.claude.json` にそれぞれ追加し、リポジトリには入れない","実験的なサーバーは、そのメンバーのユーザーレベルの設定（`~/.claude.json`）に追加し、リポジトリには入れない","実験的なサーバーもプロジェクトの `.mcp.json` に加え、ほかのメンバーには承認を求められたら断るよう伝える"],"answer":[1,3],"notes":["標準的な連携には、既存のコミュニティ製サーバーを選びます。用途が既存のサーバーで足りるのに自作すると、作る手間と保守の負担が増えます。自作はチーム固有のワークフローのために取っておきます。","正解。標準的な連携には、既存のコミュニティ製サーバーを選びます。チームで共有するサーバーは、プロジェクトの `.mcp.json` に書いてコミットします。","各自の設定に書くと、チームで同じ設定を共有できず、人ごとの食い違いや設定の手間が生まれます。チームで使うサーバーは、プロジェクトレベルで共有します。","正解。個人用や実験的なサーバーは、ユーザーレベルの `~/.claude.json` に置きます。チームの設定を汚さず、共有のサーバーと同時に使えます。","個人の実験をチームの共有設定に入れると、全員に承認の確認が出て、使わないサーバーの設定まで配られます。個人用のサーバーは個人のスコープに置きます。"],"explanation":"MCP サーバーの置き場所は、誰と共有するかで決めます。チームで共有するツールはプロジェクトの `.mcp.json` に書いてコミットします。個人用や実験的なサーバーはユーザーレベルの `~/.claude.json` に置きます。また、Jira のような標準的な連携には既存のコミュニティ製サーバーを使い、自作はチーム固有のワークフローに限ります。なお、2026年11月時点の Claude Code には、そのプロジェクトで自分だけが使う local スコープ（これも `~/.claude.json` に保存され、既定のスコープ）もあります。","ref":"試験ガイド タスク 2.4 ／ Claude Code Docs: MCP（スコープ）"},{"id":"D2-07","domain":"D2","scenario":"S3","topic":"isError フラグ","type":"single","question":"文書分析サブエージェントが使う MCP ツール `fetch_document` は、取得元のサーバーがエラーを返したときも、そのエラーページの文字列を通常の結果として返します。ログでは、取得元が一時的な過負荷で返した「503 Service Unavailable」のページを、エージェントが文書の本文として分析し、「この資料はサービスの停止について述べている」という要約を統合に渡していました。最も適切な改善はどれですか。","options":["文書分析サブエージェントのプロンプトに、エラーのように見える本文は分析せずに飛ばすよう書き加える","取得の失敗は `isError` を立てた結果で返し、エラーの種類とリトライの可否、人が読める説明を添える","結果の本文に「Error」「Unavailable」などの語があれば、その文書を飛ばす処理をエージェント側に加える","取得に失敗したときは空の本文を通常の結果として返し、その文書が分析の対象から外れるようにする"],"answer":[1],"notes":["確率的な手です。失敗かどうかが結果の形で示されていないので、モデルは本文の見た目から推測するしかなく、取りこぼしが残ります。","正解。失敗を `isError` で示せば、エージェントはそれを文書ではなくエラーとして扱えます。一時的なエラーでリトライできることも分かるので、あとで取り直す判断もできます。","文章の中の語で判定する、当てにならない方法です。エラーを扱った正当な資料まで飛ばし、別の言い方のエラーページは見逃します。","エラーを握りつぶす手です。取得の失敗が有効な空の結果に見えてしまい、リトライの判断もレポートの注記もできなくなります。"],"explanation":"MCP では、ツールの実行の失敗を、結果の `isError` フラグで伝えます。エラーの内容を通常の結果として返すと、エージェントはそれを正常なデータとして扱い、エラーページの文字列まで分析してしまいます。失敗を `isError` で示したうえで、一時的なエラー、検証エラー、権限エラーなどの種類とリトライの可否を構造化して返せば、エージェントはリトライするか、飛ばして注記するかを選べます。なお `errorCategory` や `isRetryable` のような項目は MCP の仕様が定めるものではなく、ツールの作り手が結果の中身として設計します。","ref":"試験ガイド タスク 2.2 ／ MCP Specification: Tools（Error Handling）"},{"id":"D2-08","domain":"D2","scenario":"S3","topic":"役割に合うツール","type":"multi","question":"設定を簡単にするため、すべてのサブエージェントに同じ18個のツールを渡しています。統合サブエージェントは、調査結果に抜けがあると気づくと自分でウェブ検索を何度も実行するようになりました。その結果、検索サブエージェントの作業と重複し、コーディネーターはどの情報がどこから来たかを追えなくなっています。取るべき対応はどれですか。（2つ選択）","options":["統合サブエージェントの `AgentDefinition` の `tools` を、統合に必要なツールだけに絞る","統合サブエージェントのシステムプロンプトに「ウェブ検索は使わないこと」と強い表現で明記しておく","18個すべてのツールの説明を詳しく書き直し、どのツールを使うべきかを判断しやすくする","新しい調査が要る抜けは、統合サブエージェントからコーディネーターに返し、検索に再委任させる","検索と統合を1つのサブエージェントにまとめ、抜けに気づいたらその場で検索して補えるようにする"],"answer":[0,3],"notes":["正解。各サブエージェントには役割に必要なツールだけを渡します。渡していないツールは使われないので、専門外のツールの誤用を確実に防げます。","確率的な手です。ツールが手元にある限り使われる可能性は残り、18個から選ぶ判断の複雑さも変わりません。","説明はツールの選び方を改善しますが、統合の役割に検索ツールがあること自体が問題です。18個という数の多さも残ります。","正解。複雑なケースはコーディネーター経由でルーティングすれば、検索の重複を避け、情報の流れをコーディネーターが追跡できます。","役割の分離をやめる手で、コーディネーターから情報の流れが見えなくなる問題はかえって悪化します。"],"explanation":"エージェントに多すぎるツールを与えると判断が複雑になり、ツール選択の信頼性が下がります。専門外のツールを持ったエージェントは、それを誤用しがちです（統合エージェントがウェブ検索を試みる、など）。各サブエージェントのツールを役割に関係するものに絞り、新しい調査が要るような複雑なケースはコーディネーター経由で再委任します。単純な事実確認が頻繁に必要なら、範囲を絞った役割横断のツールを限定的に足す、という手もあります。","ref":"試験ガイド タスク 2.3 ／ Agent SDK Docs: Subagents in the SDK（Tool restrictions）"},{"id":"D2-09","domain":"D2","scenario":"S3","topic":"制約付きのツール","type":"single","question":"文書分析サブエージェントには、任意の URL を取得できる汎用の `fetch_url` ツールを渡しています。本来の役割は、コーディネーターが URL で指定した文書を読み込んで分析することですが、ログでは、文書の中のリンクをたどって無関係なウェブページを読み込み、分析に混ぜている例が見つかりました。最も適切な対応はどれですか。","options":["システムプロンプトに「渡された文書以外の URL は開かないこと」と書き、守るべき具体例を添える","取得したページを後から監査するログを追加し、役割外の取得が見つかったらアラートを出す","`fetch_url` を、文書の URL かを検証して読み込む `load_document` に置き換える","`fetch_url` を取り上げ、文書分析サブエージェントには文書を取得するためのツールを何も渡さない"],"answer":[2],"notes":["確率的な手です。何でも取得できるツールが手元にある限り、役割外の取得は起こりえます。","起きたあとに気づくだけで、分析に無関係な情報が混ざること自体は防げません。","正解。汎用的なツールを、役割に合う制約付きのツールに置き換えれば、許された文書だけを確実に読み込めます。","両極端の手です。役割外の取得は止まりますが、URL で指定された文書を読み込むという、役割に必要な操作までできなくなります。"],"explanation":"汎用的なツールは便利ですが、役割の外の使い方もできてしまいます。試験ガイドは、`fetch_url` を、文書の URL を検証する `load_document` に置き換える例を挙げています。ツールの側で許す範囲を制約すれば、プロンプトでの指示や事後の監視に頼らず、役割に必要な操作だけを確実に許せます。","ref":"試験ガイド タスク 2.3"},{"id":"D2-10","domain":"D2","scenario":"S3","topic":"ツール選択の強制","type":"single","question":"文書分析サブエージェントは、Messages API を直接呼ぶ自前のループで動いています。各文書についてまず `extract_citation_metadata`（題名、著者、公開日）を呼び、そのあとで `summarize_findings` などのツールを使う決まりです。ところが約15%の文書で最初のツールが飛ばされ、レポートの出典に公開日が欠けていました。最も適切な対応はどれですか。","options":["`tool_choice` を `\"any\"` にして、最初の応答で必ず何らかのツールを呼ばせるようにする","すべてのターンで `tool_choice` を `{\"type\": \"tool\", \"name\": \"extract_citation_metadata\"}` に固定する","`tool_choice` は `\"auto\"` のまま、システムプロンプトでメタデータの抽出が最初だと強調する","最初の要求だけ `{\"type\": \"tool\", \"name\": \"extract_citation_metadata\"}` で強制し、続きは次のターンで扱う"],"answer":[3],"notes":["`\"any\"` はどれかのツールを必ず呼ばせますが、どのツールかはモデルが選びます。`summarize_findings` が先に呼ばれる可能性は残ります。","毎回同じツールが強制されるので、`summarize_findings` などの後続のステップに進めなくなります。","確率的な手です。今も15%で飛ばされているように、強調するだけでは毎回の実行は保証できません。","正解。特定のツールを最初に必ず呼ばせたいときは、最初の要求で強制的なツール選択を使い、後続のステップは次のターンで通常どおり扱います。"],"explanation":"`tool_choice` には、モデルに任せる `\"auto\"`、必ずどれかのツールを呼ばせる `\"any\"`、特定のツールを呼ばせる `{\"type\": \"tool\", \"name\": ...}` があります。順序を守らせたいのは最初の1回なので、最初の要求だけを強制し、残りはフォローアップのターンで処理します。なお2026年11月時点のドキュメントでは、一部の新しいモデルと手動の extended thinking では `\"any\"` と特定ツールの強制がエラーになり、代わりに `\"auto\"`（スキーマに合う入力を保証したいなら strict tool use と組み合わせる）を使い、どのツールを選ぶかはプロンプトで誘導するよう案内されています。","ref":"試験ガイド タスク 2.3 ／ Claude API Docs: Define tools（Forcing tool use）"},{"id":"D2-11","domain":"D2","scenario":"S4","topic":"返す内容を説明に書く","type":"single","question":"支援エージェントには、サービスの登録情報を返す MCP ツール `get_service` と、社内 Wiki を検索する `search_wiki` があります。`get_service` は、担当チーム、呼び出しの管理システムから取った現在のオンコール担当者、運用手順書の URL を返しますが、説明は「サービスの情報を取得する」の1文だけです。「決済サービスの今のオンコールは誰？」という質問に、エージェントは `search_wiki` だけで答えようとし、更新されていない Wiki のページにある前任者の名前を返すことがあります。最も適切な対応はどれですか。","options":["`get_service` の説明に、返す項目と情報の出どころ、Wiki の検索ではなくこのツールを使う場面を書く","`search_wiki` を外し、サービスについての質問には `get_service` しか使えないようにしておく","システムプロンプトに「『オンコール』という語があれば `get_service` を使うこと」と書き加える","Wiki のオンコールのページを毎日自動で更新する仕組みを作り、どちらでも同じ答えになるようにする"],"answer":[0],"notes":["正解。モデルはツールの説明をもとに使うツールを選びます。現在のオンコール担当者を返すこと、その値が呼び出しの管理システムから来ること、担当者の確認には Wiki よりこのツールが向くことを書けば、正しく選べるようになります。","Wiki は設計資料の検索など、ほかの質問には欠かせません。ツールを取り上げるのは極端で、説明が足りないという原因も残ります。","語に反応する指示は、「今の当番は？」のような別の言い方では効かず、意図しない結び付きも生みます。よく書いた説明による選択を上書きするおそれもあります。","Wiki の内容を新しく保つ別の仕組みを作っても、ツールの選び方は変わりません。作り込みが重く、原因であるツールの説明には手が届いていません。"],"explanation":"LLM がツールを選ぶ主な手がかりは、ツールの説明です。「情報を取得する」のような最小限の説明では、そのツールが何を返すのかが分からず、似た用途の別のツールが選ばれます。説明には、目的、想定する入力、返す内容（項目と出どころ）、似たツールではなくそれを使うべき場面を書きます。語に反応する振り分けや、ツールの取り上げは、その代わりになりません。","ref":"試験ガイド タスク 2.1 ／ Claude API Docs: Define tools（Best practices for tool definitions）"},{"id":"D2-12","domain":"D2","scenario":"S4","topic":"検証エラーの返し方","type":"single","question":"MCP ツール `query_metrics` は、期間を `2026-11-01` のような ISO 8601 の日付で受け取ります。ツールの説明には形式を書いてありますが、エージェントがユーザーの言い方のまま `先月` や `11/1` を渡す呼び出しが、全体の数%残っています。そのときツールは `isError: true` と `\"Internal error\"` だけを返し、エージェントは同じ引数でリトライを繰り返したあと「メトリクスのサービスが不調です」と報告しています。最も適切な改善はどれですか。","options":["クライアントの側で、失敗した呼び出しを指数バックオフ付きで最大5回まで自動的にリトライさせる","ツールの説明の冒頭に、日付の形式を守るよう強い言葉で書き足し、誤った形式の呼び出しを減らす","日付を解釈できないときはエラーにせず、空の結果を通常の結果として返して処理を先に進めさせる","検証エラーであることと、どの引数をどの形式で渡すべきかを、リトライの可否とあわせて返す"],"answer":[3],"notes":["同じ引数のままリトライしても、形式の誤りは直りません。無駄な呼び出しが増え、障害だという誤った報告も変わりません。","説明にはすでに形式が書かれており、残りの数%を言葉で無くせる保証はありません。誤った呼び出しが起きたときに立て直せない問題も残ります。","失敗を握りつぶす手です。エージェントは「該当するデータがない」と誤って報告することになり、今より悪くなります。","正解。入力の検証エラーだと分かり、正しい形式が示されれば、エージェントは引数を直して呼び直せます。同じ入力でのリトライが無駄だということも伝わります。"],"explanation":"ツールが失敗したときは、`isError` を立てるだけでなく、エラーの種類（一時的、検証、権限など）、リトライできるか、人が読める説明を構造化して返します。種類の分からない一律のエラーでは、エージェントは同じ入力でのリトライや、障害という誤った報告しかできません。入力の検証エラーなら、どの引数がどう違うかを返すことで、エージェントは自分で引数を直して呼び直せます。MCP の仕様も、日付の形式違いのような入力の検証エラーを `isError: true` のツール実行エラーとして返し、モデルが自分で直してリトライできる情報を含めるよう示しています。","ref":"試験ガイド タスク 2.2 ／ MCP Specification: Tools（Error Handling）"},{"id":"D2-13","domain":"D2","scenario":"S4","topic":"共有の MCP 設定","type":"multi","question":"チームは、社内のデプロイ状況を調べる MCP サーバーを、支援エージェントと Claude Code で使いたいと考えています。リポジトリをクローンしたメンバー全員が同じ設定で使えるようにしたい一方で、各自の API トークンはリポジトリに含めてはいけません。取るべき対応はどれですか。（2つ選択）","options":["各メンバーのユーザーレベルの設定（`~/.claude.json`）に、サーバーの定義を各自で追加してもらう","サーバーの定義をプロジェクトのルートにある `.mcp.json` に書き、バージョン管理に含める","トークンを `.mcp.json` に直接書いたうえで、`.mcp.json` を `.gitignore` に加えておく","サーバーへの接続方法とトークンの値を CLAUDE.md に書き、エージェントに読ませて接続させる","認証のヘッダーに `${DEPLOY_API_TOKEN}` のような環境変数の展開を使い、値は各自の環境で設定する"],"answer":[1,4],"notes":["ユーザーレベルの設定は個人用や実験用のサーバー向けで、チームに共有されません。メンバーごとに設定がずれる原因になります。","正解。チームで共有するサーバーは、プロジェクトレベルの `.mcp.json` に定義してコミットします。クローンしたメンバー全員に同じ設定が届きます。","`.mcp.json` をコミットしないと、共有というもう一つの要件を満たせません。秘密を守るために共有をあきらめる両極端の手です。","CLAUDE.md は指示と文脈を書く場所で、MCP サーバーの設定の仕組みではありません。トークンの値をリポジトリに入れることにもなります。","正解。`.mcp.json` では `${VAR}` 形式の環境変数の展開が使えます。設定は共有しながら、トークンの値は各自の環境に置けます。"],"explanation":"MCP サーバーの置き場所は、誰と共有するかで決めます。チームで使うサーバーはプロジェクトレベルの `.mcp.json`、個人用や実験用のサーバーはユーザーレベルの `~/.claude.json` です。共有する `.mcp.json` に秘密を書かないために、認証情報は `${GITHUB_TOKEN}` のような環境変数の展開で参照します。2026年11月時点のドキュメントでは、`~/.claude.json` に置くサーバーに、そのプロジェクトだけで使うローカルスコープ（既定）と、全プロジェクトで使うユーザースコープの2種類があります。どちらも共有されない点は同じです。","ref":"試験ガイド タスク 2.4 ／ Claude Code Docs: Connect Claude Code to tools via MCP"},{"id":"D2-14","domain":"D2","scenario":"S4","topic":"MCP ツールの説明","type":"single","question":"チームは、コードの依存関係を解析した索引を持つ MCP ツール `find_callers` を用意しました。このツールは、依存性注入の登録まで解決し、インターフェース経由の呼び出し元も含めて返します。しかし説明は「呼び出し元を探す」の1行だけで、エージェントはほとんどの場面で組み込みの Grep を使い、インターフェース経由の呼び出しを見落としています。最も適切な最初の対応はどれですか。","options":["エージェントから Grep を外し、呼び出し元の調査には `find_callers` しか使えないようにする","`find_callers` の説明に、追える呼び出しの種類、返す内容、Grep より向く場面を書き足す","システムプロンプトに「どんな検索でも必ず `find_callers` を使うこと」と書き加えておく","Grep と `find_callers` の両方を毎回呼ばせ、見つかった件数が多いほうの結果を採用させる"],"answer":[1],"notes":["Grep はエラーメッセージや文字列の検索に欠かせません。外すと、テキストで探すべき場面まで困ります。","正解。説明が最小限だと、モデルはより高機能な MCP ツールを選ぶ理由を持てません。機能と出力を詳しく書くのが、原因に直接効く軽い手です。","文字列の検索まで `find_callers` に回すことになり、別の誤りを生みます。説明が不十分という原因も残ります。","毎回2つ呼ぶのは無駄が多く、件数の多さは正しさの目安になりません。どちらを使うべきかを判断させる手になっていません。"],"explanation":"エージェントは、ツールの説明を手がかりに、どのツールを使うかを決めます。MCP ツールの説明が短いと、なじみのある組み込みツール（Grep など）が選ばれがちで、MCP ツールの強み（ここでは依存性注入を解決した呼び出し元の追跡）が生かされません。対策は、MCP ツールの説明に、できること、返す内容、組み込みツールではなくこのツールを使うべき場面を書くことです。ツールを取り上げたり、一律に使わせたりする手は、別の場面で誤りを生みます。","ref":"試験ガイド タスク 2.4 ／ Anthropic Engineering: Writing effective tools for agents"},{"id":"D2-15","domain":"D2","scenario":"S4","topic":"MCP リソース","type":"single","question":"社内のドキュメントポータルを、MCP サーバーで支援エージェントにつないでいます。ログを見ると、エージェントは1つの質問に答える前に `list_spaces`、`list_pages`、`get_page` を合わせて平均20回ほど呼び、どんな資料があるかを手探りで確かめています。資料の構成（スペースとページの階層、各ページの要約）は1日に数回しか変わりません。最も適切な対応はどれですか。","options":["`list_pages` が各ページの本文まで返すようにして、`get_page` を呼ぶ回数を減らす","システムプロンプトに、ポータルにある全ページの一覧と要約を書き込んで、毎回渡しておく","エージェントの反復回数の上限を下げ、手探りの呼び出しが続いたら途中で打ち切らせる","ページの階層と要約をコンテンツカタログとして MCP リソースで公開し、最初に参照させる"],"answer":[3],"notes":["関係のないページの本文まで毎回コンテキストに入り、トークンを大きく使います。どこに何があるかを知らないまま `list_spaces` から探す手探りも残ります。","構成が変わるたびにプロンプトを直す必要があり、古い一覧が残りやすくなります。全ページの要約を毎回渡すのはトークンの負担も大きいです。","手探りを打ち切っても、必要な資料にたどり着けなくなるだけです。何があるかが分からないという原因に効きません。","正解。MCP リソースでコンテンツカタログを公開すると、エージェントは探索的なツール呼び出しをせずに、使えるデータの全体を把握できます。"],"explanation":"MCP では、操作はツール、読ませたい内容はリソースとして公開します。課題のサマリー、ドキュメントの階層、データベースのスキーマのような「何があるか」の目録は、リソースとして公開するのに向いています。目録があれば、エージェントは手探りの呼び出しを重ねずに、目的の資料へ直接向かえます。Claude Code では、接続した MCP サーバーのリソースを `@` で参照でき、リソースを一覧して読むためのツールも自動で用意されます。","ref":"試験ガイド タスク 2.4 ／ Claude Code Docs: Connect Claude Code to tools via MCP（Use MCP resources）"},{"id":"D2-16","domain":"D2","scenario":"S4","topic":"Grep で内容を探す","type":"single","question":"エンジニアが、本番のログに出た「Invoice total mismatch」というエラーメッセージについて、コードのどこで出しているかを尋ねました。エージェントは Glob で `**/*invoice*` に一致するファイルを探し、見つかった30ファイルを順に Read しています。しかし、このメッセージを出しているのは、ファイル名に invoice を含まない `ledger/checks.py` でした。最初に取るべきツールの使い方として最も適切なものはどれですか。","options":["Grep でメッセージの文字列をコードベース全体から探し、一致したファイルだけを Read する","Glob のパターンを `**/*.py` に広げ、すべての Python ファイルを順に Read して確かめる","Bash で `ls -R` を実行してディレクトリの構成を出し、それらしいファイルを推測する","Glob で `**/*ledger*` や `**/*check*` も探し、見つかったファイルを追加で Read する"],"answer":[0],"notes":["正解。エラーメッセージや関数名のように、ファイルの中身にある文字列を探すときは Grep を使います。一致した場所だけを読めば済みます。","Glob はファイル名のパターンで探す道具です。範囲を広げても、全ファイルを読むことになり、時間とコンテキストを使い果たします。","ファイル名から推測する点で、今の失敗と同じです。メッセージがどのファイルにあるかは、名前からは分かりません。","答えを知った後でしか選べないパターンで、ファイル名で探すという誤りを繰り返しています。"],"explanation":"組み込みツールは、何で探すかで選びます。ファイルの中身（関数名、エラーメッセージ、import 文など）は Grep、ファイルの名前や拡張子のパターン（`**/*.test.tsx` など）は Glob です。今回は名前ではなく中身を探す場面なので、Grep で場所を絞り込んでから Read します。なお、2026年11月時点の Claude Code は、macOS・Linux では既定で Glob と Grep を外して Bash の `find`・`grep` で検索しますが、Agent SDK の許可ツールに Glob や Grep を名指しすれば使えます。","ref":"試験ガイド タスク 2.5 ／ Claude Code Docs: Tools reference"},{"id":"D2-17","domain":"D2","scenario":"S4","topic":"Edit の失敗の代替","type":"single","question":"エージェントが、自動生成された設定ファイル `workers.yaml` の3番目のワーカーだけ、タイムアウトの値を変えようとしています。このファイルはテンプレートから作られたため、5つのワーカーのブロックは中身がまったく同じで、並び順でしか区別できません。Edit は、一致するテキストが一意でないために失敗しました。最も確実な対応はどれですか。","options":["`old_string` に3番目のワーカーのブロック全体を含めて長くし、もう一度 Edit を実行する","`replace_all` を有効にして Edit を実行し、5つのブロックのタイムアウトをまとめて書き換える","Read でファイル全体を読み込み、3番目のブロックだけを変えた内容を Write で書き戻す","変更後の3番目のワーカーのブロックだけを内容にして、Write で `workers.yaml` に書き込む"],"answer":[2],"notes":["5つのブロックは中身がまったく同じなので、ブロック全体まで広げても一致は5か所のままです。目印を長くする手は、前後に違いがあるときにしか効きません。","求められているのは3番目だけの変更です。5つすべてを書き換えると、ほかのワーカーの設定を壊します。","正解。Edit が一意のアンカーを見つけられないときは、Read でファイル全体を読み、意図した変更を加えた全体を Write で書くのが確実な代替です。","Write はファイル全体を、渡した内容で置き換えます。3番目のブロックだけを書くと、ほかの4つのワーカーの設定が消えます。"],"explanation":"Edit は、ファイルの中で一度だけ現れるテキストを目印にして、的を絞った変更をする道具です。目印が一意でないと失敗するので、そのときは Read でファイル全体を読み込み、変更を加えた内容を Write で書き戻します。Write はファイル全体を置き換えるため、読み込んだ内容をもとに書くことが前提です。2026年11月時点のドキュメントでは、前後の文脈を足して目印を一意にする方法も示されていますが、今回のように前後まで同じで区別できないときは Read と Write が確実です。","ref":"試験ガイド タスク 2.5 ／ Claude Code Docs: Tools reference（Edit tool behavior）"},{"id":"D2-18","domain":"D2","scenario":"S4","topic":"入口から段階的に","type":"single","question":"エンジニアが、約3,000ファイルあるレガシーな Web アプリについて、「注文のキャンセル要求がどう処理されるか」を説明してほしいと頼みました。エージェントは Read、Grep、Glob、Bash を使えます。このアプリには設計資料がなく、エンジニアはどのファイルが関係するかを知りません。最初の調査の進め方として最も適切なものはどれですか。","options":["`src/` 配下のすべてのファイルを Read で読み込み、全体を把握してから処理の流れを説明する","Grep でキャンセルのルート定義やハンドラーを探して入口を特定し、Read で import をたどる","Glob で全ファイルの一覧を取り、ファイル名に cancel を含むものだけを読んで流れを説明する","Bash でコミット履歴を読み、キャンセルに関係するコミットの内容から処理の流れを推測する"],"answer":[1],"notes":["3,000ファイルを先に全部読むと、コンテキストが無関係な内容で埋まります。必要な部分を探してから読むのが基本です。","正解。Grep で入口を見つけ、Read で import をたどって流れを追うと、必要なファイルだけで理解を段階的に組み立てられます。","処理の流れは、名前に cancel を含まないファイル（共通の検証や状態遷移など）も通ります。名前だけで選ぶと抜けが出ます。","履歴は変更の経緯を示すもので、今のコードの流れを確かめる手段ではありません。推測が混ざります。"],"explanation":"不慣れなコードベースは、最初にすべてを読むのではなく、Grep で入口（ルート定義、ハンドラー、関数名）を見つけ、Read で import や呼び出しをたどって理解を広げます。この進め方なら、読むファイルが流れに関係するものに絞られ、コンテキストを無駄にしません。Glob はファイル名のパターンで探す道具なので、流れを追う出発点には向きません。","ref":"試験ガイド タスク 2.5 ／ Claude Code Docs: Tools reference"},{"id":"D2-19","domain":"D2","scenario":"S4","topic":"ラッパー越しの使用箇所","type":"single","question":"エージェントに「`parseLegacyDate` を使っている箇所をすべて洗い出して」と頼んだところ、Grep で見つかったのは4か所でした。実際には、`utils/dates/index.ts` がこの関数を `toDate` や `parseDate` という別の名前で再エクスポートしており、多くのコードはその名前で呼んでいます。漏れなく洗い出すための進め方として最も適切なものはどれですか。","options":["Grep の検索で大文字と小文字を区別しない設定にし、`parselegacydate` でもう一度探す","Glob で `**/*date*` に一致するファイルを探し、それらを Read して呼び出しを確かめる","見つかった4か所の周りのコードから、ほかにありそうな呼び出しをエージェントに推測させる","ラッパーモジュールが公開する名前をすべて特定し、それぞれの名前でコードベース全体を Grep する"],"answer":[3],"notes":["大文字と小文字の違いを許しても、`toDate` や `parseDate` という別の名前には一致しません。","呼び出し側のファイル名に date が入るとは限りません。ファイル名で探す点で、使用箇所の調査には向きません。","推測では漏れがないことを確かめられません。検索で確かめられることを、推測に任せる手です。","正解。まずラッパーモジュールがエクスポートする名前を洗い出し、次にその一つずつでコードベース全体を検索すると、別名での呼び出しも拾えます。
