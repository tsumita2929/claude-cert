"],"explanation":"関数がラッパーモジュールを通して別の名前で公開されていると、元の名前だけを Grep しても使用箇所の一部しか見つかりません。そこで、ラッパーが公開する名前を先にすべて特定し、それぞれの名前でコードベース全体を検索します。このように、検索を2段に分けて、見つかった事実をもとに次の検索を組み立てるのが、組み込みツールで依存関係を追うときの基本です。","ref":"試験ガイド タスク 2.5 ／ Claude Code Docs: Tools reference（Grep tool behavior）"},{"id":"D2-20","domain":"D2","scenario":"S5","topic":"ツールの数を絞る","type":"single","question":"CI のレビュー担当のサブエージェントには、設定を簡単にするため、GitHub、課題管理、CI の3つの MCP サーバーのツールをすべて渡しています。その数は22個ですが、レビューで実際に使うのは、差分の取得、ファイルの読み取り、カバレッジの参照、インラインコメントの投稿の4つです。ログでは、インラインコメントのつもりで PR 全体へのコメントを投稿したり、似た名前のファイル取得のツールを取り違えたりする誤りが、PR の約1割で起きています。最も適切な対応はどれですか。","options":["22個すべてのツールの説明を詳しく書き直し、似た名前のツールどうしの違いが分かるようにする","システムプロンプトに使うべき4つのツールの名前を挙げ、ほかのツールは使わないよう強く指示する","レビュー担当に渡すツールを、レビューに必要な4つに絞り、ほかのツールは渡さないようにする","より性能の高いモデルに切り替え、多くのツールの中からでも正しいツールを選べるようにする"],"answer":[2],"notes":["説明を整えるのは役に立ちますが、使わない18個が候補に残り、判断の複雑さは変わりません。役割に要らないツールを渡していることが原因です。","ツールが渡されたままなので、使うかどうかはモデルの判断に残ります。確率的な手で、取り違えをなくす保証になりません。","正解。役割に必要なツールだけを渡せば、選ぶ候補が減ってツール選択の信頼性が上がり、専門外のツールを誤って使うこともなくなります。","規模で解決しようとする手です。多すぎるツールが選択を難しくしているという原因はそのまま残り、コストも上がります。"],"explanation":"エージェントに多すぎるツール（たとえば4〜5個ではなく18個）を渡すと、判断が複雑になり、ツール選択の信頼性が下がります。サブエージェントのツールは、その役割に必要なものに絞ります。Agent SDK では、サブエージェントの定義（`AgentDefinition`）の `tools` で使えるツールを指定できます。説明の改善やプロンプトでの指示は、ツールを絞ったうえで行う補助の手です。","ref":"試験ガイド タスク 2.3 ／ Agent SDK Docs: Subagents in the SDK ／ Anthropic Engineering: Writing effective tools for agents"},{"id":"D2-21","domain":"D2","scenario":"S6","topic":"汎用ツールの分割","type":"single","question":"抽出システムでは、汎用の `process_document` ツール1つに、項目の抽出、文書の要約、台帳の記録との照合をすべて任せています。入力は文書と自由記述の指示、出力は自由形式の文章で、説明には3つの使い方がすでに詳しく書いてあります。それでも、抽出を求めた場面で要約が返ったり、照合の結果が文章で返って下流のシステムが一致か不一致かを判定できなかったりしています。最も適切な対応はどれですか。","options":["システムプロンプトに、抽出・要約・照合のそれぞれで返すべき内容と書き方を、詳しい指示として書き足す","`process_document` が返す文章を下流で解析し、一致か不一致かを正規表現で取り出す処理を加える","`process_document` を抽出・要約・照合の目的別の3つのツールに分け、それぞれの入力と出力の形を定める","依頼が抽出・要約・照合のどれにあたるかを判定する分類モデルを別に作り、ツールの前段に置く"],"answer":[2],"notes":["指示で書き方を求めても、出力が自由形式の文章であることは変わらず、確率的な誘導にとどまります。下流が頼れる入出力の決まりができません。","文章を下流で解析するのは壊れやすい後処理で、症状への対処です。抽出を求めたのに要約が返るという取り違えも直りません。","正解。目的ごとにツールを分けて入力と出力の形を決めれば、モデルは目的に合うツールを選びやすくなり、下流も決まった形で結果を受け取れます。","作り込みすぎです。前段で依頼を振り分けても、出力が自由形式の文章のままなので、下流が結果を判定できない問題は残ります。"],"explanation":"1つの汎用ツールに複数の目的を持たせ、入出力の形を決めずにおくと、モデルはどの使い方を求められているかを取り違えやすく、下流も結果を機械的に扱えません。試験ガイドは、汎用的なツールを、入出力の契約が定義された目的別のツールに分割すること（例：汎用的な `analyze_document` を `extract_data_points`、`summarize_content`、`verify_claim_against_source` に分ける）を挙げています。なお、2026年11月時点の Define tools のページは、関連する操作を `action` パラメータで1つのツールにまとめる設計も勧めていますが、目的と入出力をはっきりさせて選択のあいまいさを減らす点は同じです。選び間違いが説明の不足ではなく、ツールの境界そのもののあいまいさから来ているときは、ツールの切り分けを見直します。","ref":"試験ガイド タスク 2.1 ／ Claude Docs: Define tools（Best practices for tool definitions）"},{"id":"D2-22","domain":"D2","scenario":"S6","topic":"横断ツールを絞る","type":"single","question":"抽出サブエージェントは、請求書ごとに発行元の取引先コードを調べます。照会のたびにコーディネーターを経由する往復を減らすため、取引先担当のサブエージェントが使う取引先データベースのツール一式（検索、新規登録、更新）を、抽出サブエージェントにも渡しました。処理は速くなりましたが、表記が少し違うだけの発行元に出会うと、抽出サブエージェントが自分で取引先を新規登録してしまい、重複した取引先が月に数十件できています。照会の大半は登録番号の完全一致で済み、判断が要るのは、新しい取引先や候補が複数ある場合だけです。最も適切な対応はどれですか。","options":["抽出役のツールを、登録番号から取引先コードを引く読み取り専用の1つに絞り、判断が要る照会はコーディネーター経由に戻す","ツール一式は渡したまま、抽出役のシステムプロンプトに「取引先の新規登録と更新は行わない」と例を添えて明記する","取引先データベースのツールを抽出役からすべて外し、単純な照会も含めて、毎回コーディネーター経由の照会に戻す","ツール一式は渡したまま、抽出役が登録した取引先を毎晩洗い出し、重複を取引先担当に統合させる処理を追加する"],"answer":[0],"notes":["正解。よくある単純な照会だけを、範囲を限定した読み取り専用のツールとして渡せば、往復を減らす効果を保ったまま、役割外の登録や更新はそもそも行えなくなります。判断が要るケースは、専門の取引先担当に任せます。","役割外のツールを持たせたままでは、指示があっても誤用は確率的に残ります。使わせたくない操作は、指示で禁じるより、ツールを渡さないほうが確実です。","誤った登録は止まりますが、大半を占める単純な照会まで往復に戻り、速くした効果を捨ててしまいます。すべて渡すか、何も渡さないかの二択にする必要はありません。","重複ができたあとに片づける対処で、誤った登録そのものは続きます。原因は、抽出役が役割外の書き込みのツールを持っていることです。"],"explanation":"試験ガイドは、エージェントにはその役割に必要なツールだけを与え、頻度の高い特定のニーズにだけ、範囲を限定した役割横断のツールを与えるとしています（ガイドの例は、統合エージェントに渡す `verify_fact`）。専門外のツールを持ったエージェントは、それを誤用しがちです。横断のツールは、よく起きる単純な用途に絞り、読み取り専用のような狭い形で渡して、複雑なケースはコーディネーター経由で専門のエージェントに回します。すべてを渡すか何も渡さないかではなく、どこまでを切り出して渡すかが判断の軸です。","ref":"試験ガイド タスク 2.3"},{"id":"D3-01","domain":"D3","scenario":"S2","topic":"話題別のルール","type":"single","question":"プロジェクトの CLAUDE.md が700行になり、テスト、API の設計、ログ出力の規約を、それぞれ別のチームが書き足しています。どの規約も、どの作業でも守ってほしいものです。ところが、1つのファイルを3つのチームで編集するため、変更がぶつかりやすく、どの節をどのチームが管理しているのかも分かりにくくなっています。最も適切な対応はどれですか。","options":["規約を話題ごとに、`.claude/rules/` の `testing.md` などのファイルに分けて置く","規約を話題ごとにスキルにまとめ、テストや API の作業を始めるときに、開発者がそれぞれ呼び出す","CLAUDE.md を1つのまま保ち、節ごとに担当チームの名前と目次を付けて、誰が直すかを分かるようにする","規約を、関係の深いディレクトリ（`tests/`、`src/api/` など）に置いた CLAUDE.md に分けて移す"],"answer":[0],"notes":["正解。`.claude/rules/` に話題ごとのファイルを置けば、チームごとに自分のファイルを管理でき、変更もぶつかりにくくなります。`paths` を付けないルールは起動時に読み込まれるので、どの作業でも規約が効きます。","スキルの本文は、呼び出されたときにだけ読み込まれます。どの作業でも守ってほしい規約が、呼び出し忘れで外れる形になります。","見出しを整えても、1つのファイルを3つのチームで編集することは変わりません。変更のぶつかりやすさは残ります。","サブディレクトリの CLAUDE.md は、そのディレクトリのファイルを扱うときにだけ読み込まれます。ログ出力の規約のように、どこでも守ってほしい規約が、ほかの場所の作業では効かなくなります。"],"explanation":"大きくなった CLAUDE.md は、`.claude/rules/` の話題別のファイル（`testing.md`、`api-conventions.md` など）に分けると管理しやすくなります。`paths` のないルールは、起動時に `.claude/CLAUDE.md` と同じ優先度で読み込まれるので、1つの CLAUDE.md に書いたときと同じく、すべての作業に効きます。ファイルが分かれるので、担当ごとに編集でき、どこに何があるかも分かりやすくなります。特定のファイルだけに当てたい規約なら `paths` を付け、特定の作業のときだけ使う手順ならスキルにする、と使い分けます。","ref":"試験ガイド タスク 3.1 ／ Claude Code Docs: Memory（Organize rules with .claude/rules/）"},{"id":"D3-02","domain":"D3","scenario":"S2","topic":"/memory で診断","type":"single","question":"同じリポジトリで作業している2人の開発者から、「Claude Code が生成するコードのインデントやテストの書き方が、人によって違う」という報告がありました。2人は同じブランチを使っていて、プロジェクトの CLAUDE.md の内容も同じです。原因を突き止めるために、最初に行うべきことはどれですか。","options":["プロジェクトの CLAUDE.md の該当する規約を太字と大文字で強調し、必ず守るよう書き直す","それぞれの環境で `/memory` を実行し、どのメモリファイルが読み込まれているかを見比べる","2人の Claude Code を同じバージョンに入れ直し、設定をすべて初期化してから様子を見る","プロジェクトの CLAUDE.md を削除して書き直し、規約を1つずつ足しながら挙動を確かめる"],"answer":[1],"notes":["原因を確かめないまま、指示を強めているだけです。片方の環境に別のメモリファイルがあって食い違っているなら、強調しても解決しません。","正解。ユーザーレベルの `~/.claude/CLAUDE.md` や `CLAUDE.local.md` など、人によって違うファイルが読み込まれていないかを、まず確かめます。","設定の初期化は大がかりで、個人の設定も失います。どのファイルが効いているかを確かめる前に行う、最初の一手ではありません。","共通のファイルは2人とも同じなので、ここを書き直しても差の原因には届きません。手間も大きくなります。"],"explanation":"同じリポジトリで挙動が人によって違うときは、共有のファイルのほかに、ユーザーレベルの `~/.claude/CLAUDE.md` や `CLAUDE.local.md` など、人ごとに違うメモリファイルが効いていることが多いです。試験ガイドでは、`/memory` でどのメモリファイルが読み込まれているかを確かめ、こうした食い違いを診断します。指示を強めたり作り直したりするのは、原因が分かってからです。2026年11月時点のドキュメントでは、`/memory` はメモリファイルの一覧を出して開くためのコマンドで、起動時に読み込まれたファイルの確認には `/context all` も案内されています。","ref":"試験ガイド タスク 3.1 ／ Claude Code Docs: Memory（/memory、Troubleshoot memory issues）"},{"id":"D3-03","domain":"D3","scenario":"S2","topic":"@import で規約を選ぶ","type":"single","question":"モノレポに `packages/web`、`packages/api`、`packages/batch` の3つのパッケージがあります。規約は `docs/standards/` に、`security.md`、`api-design.md`、`frontend.md`、`data-jobs.md` と分けて管理しています。パッケージごとに必要な規約は違い、どれが必要かは各パッケージのメンテナーが分かっています。規約の写しを作らずに、各パッケージに関係する規約だけを Claude Code に渡す方法として、最も適切なものはどれですか。","options":["すべての規約ファイルの内容をルートの CLAUDE.md に貼り付け、パッケージごとの見出しで分けておく","各パッケージの CLAUDE.md に、必要な規約の内容をメンテナーがそれぞれ書き写しておく","各パッケージの CLAUDE.md で、メンテナーが選んだ規約ファイルだけを `@` のパス指定で取り込む","ルートの CLAUDE.md に「作業の前に `docs/standards/` の規約を読むこと」と1行だけ書いておく"],"answer":[2],"notes":["どのパッケージで作業しても、関係のない規約まで毎回読み込まれます。どの節が当てはまるかの判断も、モデルの推測に任せることになります。","同じ規約の写しが何か所にもでき、元のファイルを直したときに写しが古くなります。写しを作らないという要件に反します。","正解。`@import` 構文なら、規約の本体を1か所に保ったまま、パッケージごとに必要なものだけを取り込めます。相対パスは取り込みを書いたファイルから数えるので、`@../../docs/standards/security.md` のように書きます。","文章で読むよう頼むだけでは、Claude が実際にファイルを開くかどうかは確実ではありません。パッケージごとにどの規約が要るかという知識も反映されません。"],"explanation":"CLAUDE.md は `@path` の形で外部のファイルを取り込めます。取り込んだファイルは、取り込み元の CLAUDE.md と一緒に読み込まれます。規約の本体を1か所で管理し、各パッケージの CLAUDE.md がメンテナーの知見に基づいて必要なものだけを取り込めば、写しのずれも、関係のない規約の読み込みも避けられます。1つの大きなファイルに全部を書くことや、文章で「読んで」と頼むことは、その代わりになりません。","ref":"試験ガイド タスク 3.1 ／ Claude Code Docs: Memory（Import additional files）"},{"id":"D3-04","domain":"D3","scenario":"S2","topic":"探索をフォークで分離","type":"single","question":"チームは `.claude/skills/design-options/SKILL.md` に、新しい機能の設計案を5〜6個洗い出し、長所と短所を比べるスキルを置いています。開発者はこのスキルを手で呼び出しています。実行すると、比べただけで採らなかった案の議論がメインの会話に長く残り、その後の実装で Claude が、採らなかった案の書き方を混ぜることがあります。開発者に必要なのは、最後に勧められた案とその理由だけです。最も適切な対応はどれですか。","options":["フロントマターに `context: fork` を加え、案の洗い出しを分離したサブエージェントで行わせる","SKILL.md の本文の末尾に、「採らなかった案は、あとの実装で使わないこと」と書き足しておく","フロントマターに `disable-model-invocation: true` を加え、開発者が呼んだときだけ動くようにする","案を比べ終えるたびに `/clear` で会話を空にし、そのあとで実装の相談を始めるようにする"],"answer":[0],"notes":["正解。`context: fork` を付けると、案の洗い出しは会話から切り離されたサブエージェントで行われ、メインの会話には結果だけが戻ります。探索的な議論で会話が散らかりません。","採らなかった案の議論は、会話に残ったままです。指示を足すだけでは、文脈に残った案が実装に混ざる原因を取り除けません。","これは、Claude がスキルを自分の判断で読み込むのを止める設定です。開発者はすでに手で呼んでいるので、別の問題を解いています。","採らなかった案と一緒に、勧められた案とその理由や、それまでの相談の内容まで消えます。必要な結論まで捨てることになります。"],"explanation":"`context: fork` は、コードベースの分析のように冗長な出力を生むスキルだけでなく、別案のブレインストーミングのように探索的な文脈を生むスキルを、メインのセッションから切り離すためにも使います。フォークしたサブエージェントは会話履歴を見ずに SKILL.md の内容をタスクとして実行し、結果だけを会話に返すので、比べて捨てた案の議論が会話に残りません。会話履歴を見ないので、スキルの指示はそれだけで完結するように書きます。2026年11月時点のドキュメントでは、フォークしたスキルは既定でバックグラウンドで動き、`background: false` を付けると完了を待ちます。","ref":"試験ガイド タスク 3.2 ／ Claude Code Docs: Skills（Run skills in a subagent、Frontmatter reference）"},{"id":"D3-05","domain":"D3","scenario":"S2","topic":"個人用のスキル","type":"single","question":"チームはプロジェクトの `.claude/skills/review/` に、標準のレビュー手順をまとめた `/review` スキルを置いています。ある開発者は、自分のときだけ、パフォーマンスの観点を強めた版を使いたいと考えています。チームの `/review` も、場面に応じて引き続き使いたいとのことです。最も適切な方法はどれですか。","options":["プロジェクトの `.claude/skills/review/SKILL.md` に自分用の観点を書き足し、チームの版を拡張してコミットする","`~/.claude/skills/review/` に同じ名前で自分用の版を作り、自分の環境ではそちらが使われるようにする","自分の `~/.claude/CLAUDE.md` に「`/review` のときはパフォーマンスも厳しく見ること」と書き足しておく","`~/.claude/skills/` に `review-perf` のような別の名前で自分用の版を作り、2つを使い分ける"],"answer":[3],"notes":["チームで共有しているスキルを書き換えると、ほかのメンバーのレビューの手順まで変わってしまいます。","個人用とプロジェクトに同じ名前のスキルがあると、個人用が優先されます。自分の環境ではチームの `/review` が隠れて使えなくなります。","CLAUDE.md は常に読み込まれるので、`/review` 以外の作業にも影響しかねません。指示として頼むだけで、確実に使い分けられる手段でもありません。","正解。`~/.claude/skills/` の個人用スキルはバージョン管理に入らず、チームに影響しません。別の名前にすれば、チームの版と自分の版を両方呼べます。"],"explanation":"スキルを自分用に変えたいときは、チームの共有ファイルを書き換えず、`~/.claude/skills/` に別の名前で個人用の版を作ります。個人用の場所はバージョン管理に入らないので、チームメイトには影響しません。2026年11月時点のドキュメントでは、同じ名前のスキルが個人用とプロジェクトの両方にあると個人用が優先されるため、同じ名前にすると、チームの版が自分の環境から見えなくなります。両方を使い分けたいなら、名前を変えるのが確実です。","ref":"試験ガイド タスク 3.2 ／ Claude Code Docs: Skills（Choose where skills load、Resolve skills that share a name）"},{"id":"D3-06","domain":"D3","scenario":"S2","topic":"スキルか CLAUDE.md か","type":"single","question":"プロジェクトの CLAUDE.md は420行あり、そのうち180行は、週に1回のリリースのときだけ使う手順（タグ付け、変更履歴の生成、ステージングでの確認）です。残りは、どの作業でも守ってほしいコーディング規約とビルドのコマンドです。普段の作業でもリリースの手順が毎回読み込まれ、コンテキストを使っています。最も適切な対応はどれですか。","options":["リリースの手順を `.claude/rules/release.md` に移し、`paths` は付けずに、話題ごとのファイルとして管理する","リリースの手順をスキル（`.claude/skills/release/`）に移してリリースのときに呼び出し、規約は残す","リリースの手順を CLAUDE.md に残したまま、見出しに「リリースのときだけ参照すること」と書き添えておく","リリースの手順を、リリース担当者の `~/.claude/CLAUDE.md` に移し、担当者の環境だけで読み込まれるようにする"],"answer":[1],"notes":["`paths` のないルールファイルは、起動時に CLAUDE.md と同じように読み込まれます。整理にはなりますが、毎回読み込まれる問題は残ります。","正解。スキルの本文は、使うときにだけ読み込まれます。タスク固有の手順はスキルに、常に守る標準は CLAUDE.md に、と分けます。","書き添えても、ファイルは毎回まるごと読み込まれます。コンテキストを使う問題は変わりません。","担当者の環境では、リリース以外の作業でも毎回読み込まれます。担当者が替わったときに、手順がチームで共有されない問題も生まれます。"],"explanation":"CLAUDE.md は、毎回読み込まれる全体共通の標準を書く場所です。特定のタスクのときだけ使う手順はスキルにして、必要なときに呼び出します。既定では、スキルは説明だけが常にコンテキストにあり、本文は呼び出されたときに読み込まれるので、長い手順でも普段のコストはほとんどかかりません。「いつも必要か、そのタスクのときだけか」で置き場所を選びます。","ref":"試験ガイド タスク 3.2 ／ Claude Code Docs: Skills ／ Claude Code Docs: Memory"},{"id":"D3-07","domain":"D3","scenario":"S2","topic":"paths で条件付き読込","type":"single","question":"リポジトリの `terraform/` の下に、インフラの定義がまとまっています。CLAUDE.md には Terraform の命名やモジュール構成の規約が150行ありますが、開発者の多くはアプリのコードだけを触ります。Terraform の規約が毎回読み込まれてトークンを使い、アプリのコードに Terraform 流の命名が混ざることもあります。最も適切な対応はどれですか。","options":["規約をスキルにまとめ、インフラの作業を始めるときに開発者が呼び出すよう、チームに周知する","規約を `docs/terraform.md` に移し、ルートの CLAUDE.md から `@docs/terraform.md` で取り込む","規約を `.claude/rules/terraform.md` に移し、`paths: [\"terraform/**/*\"]` を指定する","CLAUDE.md の Terraform の節に「`.tf` ファイルを編集するときだけ適用すること」と目立つように書き添える"],"answer":[2],"notes":["開発者が呼び出し忘れると、規約が効きません。ファイルのパスに基づいて自動で当てる仕組みのほうが確実です。","取り込んだファイルは、取り込み元の CLAUDE.md と一緒に起動時に読み込まれます。ファイルは分かれても、毎回読み込まれる問題は残ります。","正解。`paths` を持つルールは、一致するファイルを扱うときにだけ読み込まれます。アプリの作業では読み込まれないので、トークンも混乱も減ります。","節は毎回読み込まれたままで、適用するかどうかの判断をモデルに任せています。トークンも減りません。"],"explanation":"`.claude/rules/` のファイルに YAML フロントマターの `paths` を書くと、glob パターンに一致するファイルを扱うときにだけ、そのルールが読み込まれます。特定の領域にしか関わらない規約を常に読み込むと、トークンを使ううえに、関係のない作業に規約が混ざる原因にもなります。`@` で取り込んだファイルや `paths` のないルールは起動時に読み込まれるので、ファイルを分けるだけでは条件付きになりません。試験ガイドは「一致するファイルを編集するときに」読み込まれるとしていますが、2026年11月時点のドキュメントでは、一致するファイルを読むときにも読み込まれます。","ref":"試験ガイド タスク 3.3 ／ Claude Code Docs: Memory（Path-specific rules、Import additional files）"},{"id":"D3-08","domain":"D3","scenario":"S2","topic":"ファイルの種類で当てる","type":"single","question":"gRPC のサービスを集めたリポジトリで、`.proto` ファイルの書き方の規約を `.claude/rules/proto.md` にまとめ、次のように書きました。共通の定義は `proto/` の下にありますが、各サービスの定義は `services/billing/api/invoice.proto` のようにサービスごとのディレクトリに置かれていて、こちらを編集するときには規約が読み込まれません。規約はすべての `.proto` ファイルに当てたく、それ以外の作業では読み込ませたくありません。サービスは今後も増えていきます。最も適切な修正はどれですか。","code":"---\npaths:\n  - \"proto/**/*\"\n---\n\n# .proto の規約\n- 一度使ったフィールド番号は、別の用途に使い回さない\n- フィールドを消すときは、番号を reserved にする","options":["`paths` を `**/*.proto` に変え、置き場所ではなくファイルの種類のパターンで対象を決める","`paths` に `services/billing/api/**/*` のように、定義のあるディレクトリを順に書き足す","フロントマターの `paths` を消し、このルールを起動時からどの作業でも読み込ませるようにする","各サービスの定義をすべて `proto/` の下に移し、いまの `paths` の指定に合う構成に組み替える"],"answer":[0],"notes":["正解。ファイルの種類のパターンで指定すれば、どのディレクトリにある `.proto` にも当たり、ほかのファイルでは読み込まれません。サービスが増えても書き換えは要りません。","ディレクトリ単位の指定では、同じ場所にあるほかのファイルを触るときにも規約が読み込まれます。サービスが増えるたびに書き足す手間も残ります。","`paths` のないルールは、起動時に必ず読み込まれます。`.proto` には当たりますが、関係のない作業でも読み込まれ、条件付きにした意味がなくなります。","設定に合わせてファイルの置き場所を変えるのは、手段と目的が逆です。変更が大きく、サービスごとに定義を持つ今の構成も崩れます。"],"explanation":"パス固有のルールは、`paths` の glob パターンに一致するファイルを Claude が読み書きするときにだけ読み込まれます。パターンは、ディレクトリでも、ファイルの種類でも書けます。当てたい対象が「ある場所の下のすべて」なら `terraform/**/*` のようにディレクトリで、「場所を問わず、ある種類のファイル」なら `**/*.proto` のように拡張子で指定します。対象の決め方とパターンの形を合わせることが、判断の軸です。","ref":"試験ガイド タスク 3.3 ／ Claude Code Docs: Memory（Path-specific rules）"},{"id":"D3-09","domain":"D3","scenario":"S2","topic":"ルールが常に効く原因","type":"single","question":"ある開発者が、ほかのツールの設定を参考にして、次のルールファイルを `.claude/rules/graphql.md` に作りました。`.graphql` ファイルを扱うときだけ読み込ませるつもりでしたが、React のコンポーネントを編集しているときにも、このルールが効いているようです。最も可能性の高い原因はどれですか。","code":"---\nglobs:\n  - \"**/*.graphql\"\n---\n\n# GraphQL スキーマの規約\n- 型の名前はパスカルケースにする\n- ミューテーションの名前は動詞で始める","options":["glob パターンの `**` は、`.claude/rules/` のファイルでは使えない書き方だから","ルールファイルは、対象の `.graphql` ファイルと同じディレクトリに置く必要があるから","パターンを引用符で囲んでいるため、glob ではなくただの文字列として扱われているから","ルールのフロントマターで読まれるのは `paths` だけで、`globs` は無視されるから"],"answer":[3],"notes":["`**/*.ts` のように `**` を使うパターンは、`paths` で使える書き方です。原因はパターンの書き方ではありません。","プロジェクトのルールは `.claude/rules/` に置きます。パターンは、その `.claude` フォルダがあるディレクトリを基準に数えます。","ドキュメントの例も、パターンを引用符で囲んで書いています。引用符は原因ではありません。","正解。`paths` 以外の項目は、エラーなしに無視されます。`paths` のないルールは起動時に毎回読み込まれるので、どの作業にも効いてしまいます。"],"explanation":"パス固有のルールは、YAML フロントマターの `paths` に glob パターンを書いて作ります。2026年11月時点のドキュメントでは、Claude Code がルールのフロントマターで読む項目は `paths` だけで、それ以外の項目はエラーを出さずに無視されます。その結果、このファイルは `paths` のないルールとして起動時に読み込まれ、すべての作業に効きます。ほかのツールの設定を写すときは、項目の名前が Claude Code の仕様に合っているかを確かめます。","ref":"試験ガイド タスク 3.3 ／ Claude Code Docs: Memory（Rule frontmatter reference）"},{"id":"D3-10","domain":"D3","scenario":"S2","topic":"方式の選択は計画から","type":"single","question":"動画の投稿機能に、最大2GBのファイルのアップロードを加えます。方法は、ブラウザからオブジェクトストレージへ直接アップロードする方式と、API サーバーを経由して受け取る方式の2つが考えられ、必要なインフラの設定（ストレージのアクセス方針か、API サーバーのタイムアウトとメモリ）がそれぞれ違います。変更は、フロントエンド、API、インフラの定義にまたがります。Claude Code で最も適切な進め方はどれですか。","options":["直接実行で、まず API サーバーを経由する方式を実装させ、問題が出たらストレージへ直接上げる方式に切り替える","直接実行で、2つの方式をそれぞれ別のブランチに最後まで実装させ、動かして比べてから一方を残す","Explore サブエージェントに関係するファイルを洗い出させ、その一覧をもとに直接実行で一方の方式を実装させる","プランモードで既存のコードとインフラの定義を調べさせ、2つの方式を比べて設計を決めてから実装に移る"],"answer":[3],"notes":["方式によってインフラの設定まで変わるので、途中で切り替えると、それまでのフロントエンドと API の変更が手戻りになります。複雑さは最初から分かっています。","2つとも最後まで作るのは、比べるための手間として大きすぎます。比べるのに必要なのは、実装ではなく調査と設計です。","長い調査の出力を切り離す手で、方式を比べて決めるという判断の問題を解いていません。どちらを選ぶかの根拠がないまま実装に入ります。","正解。必要なインフラが違う方式の選択は、アーキテクチャの判断です。プランモードで、ファイルを変えずに既存のコードと定義を調べ、方式を比べて決めてから実装すれば、高くつく手戻りを防げます。"],"explanation":"プランモードは、大規模な変更、複数の妥当な方法、アーキテクチャの判断、複数ファイルにまたがる修正のような、複雑なタスクのためのものです。必要なインフラが違う連携の方式を選ぶ場面はその典型で、変更を加える前に、コードベースを安全に調べ、方式を比べて設計できます。直接実行は、範囲が明確で、やり方が決まっている変更に使います。「まず作ってみて、だめなら切り替える」は、複雑さが最初から分かっている場面では、高くつく手戻りを招きます。","ref":"試験ガイド タスク 3.4 ／ Claude Code Docs: Permission modes（plan mode）"},{"id":"D3-11","domain":"D3","scenario":"S2","topic":"調査を切り離す","type":"multi","question":"共通の関数 `normalizePhone` に、国番号の扱いの誤りが見つかりました。直し方はチームで合意済みで、`src/utils/phone.ts` の1行を変えれば済みます。ただ、リリースノートに影響を書くため、修正の前に、この関数の呼び出し箇所とそのテストの一覧を把握しておきたいと考えています。コードベースは2,000ファイルを超え、洗い出しでは大量の検索結果やファイルの内容を読むことになります。取るべき対応はどれですか。（2つ選択）","options":["作業全体をプランモードで進め、1行の修正についても、調査と設計の計画を承認してから実装する","呼び出し箇所とテストの洗い出しは Explore サブエージェントに任せ、一覧の要約だけを受け取る","検索の結果とファイルの内容をメインの会話にすべて出させ、Claude に1件ずつ確かめさせる","修正の前に、見つけた呼び出し箇所を直接実行で1つずつ書き換え、新しい国番号の扱いにそろえる","1行の修正は範囲が明確なので直接実行で直させ、既存のテストと新しいテストで結果を確かめる"],"answer":[1,4],"notes":["直し方は決まっていて、設計を検討する余地がありません。1行の修正に計画と承認の手順を挟むのは、作業の大きさにつり合いません。","正解。Explore サブエージェントは別のコンテキストで読み取り専用の調査を行い、要約だけを返します。大量の検索結果で、メインの会話が埋まりません。","一度しか使わない検索結果とファイルの内容が、メインの会話に残り続けます。あとの作業でもコンテキストを使い、大事な情報が埋もれます。","必要なのは影響の一覧で、呼び出し側を書き換えることではありません。直す範囲を広げ、1行で済む修正を大きな変更にしてしまいます。","正解。内容がよく分かっていて範囲が明確な変更は、直接実行で進めます。テストで修正を確かめれば十分です。"],"explanation":"1つのタスクの中でも、段階ごとに手段を選びます。範囲が明確な修正は直接実行で進め、プランモードは、設計の判断が要る複雑な変更のために取っておきます。一方、修正の前の調査が大量の検索結果を生むなら、その段階を Explore サブエージェントに任せて要約だけを受け取り、メインの会話のコンテキストを保ちます。2026年11月時点のドキュメントでは、Claude は変更をせずにコードベースを調べる必要があるとき、自分から Explore に任せることもあります。","ref":"試験ガイド タスク 3.4 ／ Claude Code Docs: Subagents（Explore）／ Claude Code Docs: Permission modes"},{"id":"D3-12","domain":"D3","scenario":"S2","topic":"テスト駆動の反復","type":"single","question":"Claude Code に、送料を計算する関数を書かせています。送料は地域、重さ、送料無料になる金額、会員の割引の組み合わせで決まり、1回の計算は1ミリ秒以内に終える必要があります。不具合を文章で伝えて直させるたびに、以前に直したはずの組み合わせが別の形で壊れ、同じやり取りを繰り返しています。次に取るべき進め方として最も適切なものはどれですか。","options":["不具合の症状と期待する送料を、これまでより詳しい文章で伝え、1件ずつ直させて先に進む","代表的な入力と期待する送料の組を2〜3個示し、それに合うように計算のしかたを書き直させる","インタビューパターンで、送料の計算について考えるべき点を Claude に質問させてから作り直させる","期待する動作、境目の値、性能の要件を網羅するテストを先に作り、失敗の出力を渡しながら直させる"],"answer":[3],"notes":["1件ずつ直すだけでは、前に直した組み合わせが壊れても気づけません。同じ回帰を繰り返す原因が残ります。","例は変換の意図を伝えるのには効きますが、2〜3個では組み合わせを網羅できず、修正のたびに全体を確かめる仕組みにもなりません。","インタビューパターンは、不慣れな領域で、まだ気づいていない考慮点を実装の前に洗い出す手です。今回は要件が分かっていて、問題は修正のたびの回帰です。","正解。テストを先に作れば、修正のたびに全部の組み合わせと性能の要件を確かめられます。失敗したテストの出力を渡すと、Claude は何が壊れたかを具体的に知って直せます。"],"explanation":"テスト駆動の反復では、期待する動作、エッジケース、性能の要件を網羅するテストを実装の前に作り、テストの失敗を共有しながら改善を回します。合否がはっきり出るテストがあれば、Claude は変更のたびに自分で確かめ、壊れたところを出力から読み取って直せます。文章で症状を伝えて1件ずつ直すやり方では、前に直した部分が壊れても気づけず、同じ手戻りを繰り返します。入出力の例は変換の意図を伝えるのに効き、テストはその意図が守られ続けているかを確かめます。","ref":"試験ガイド タスク 3.5 ／ Claude Code Docs: Best practices（Give Claude a check to run）"},{"id":"D3-13","domain":"D3","scenario":"S2","topic":"問題の伝え方の順序","type":"multi","question":"Claude Code が生成した請求計算のモジュールをレビューし、4つの問題が見つかりました。(1) 金額を浮動小数点で持っている、(2) 端数の丸め方が仕様と違う、(3) ログのメッセージに誤字がある、(4) 公開関数の1つにドキュメントコメントがない、の4つです。(1) の型を変えると (2) の丸めの書き方も変わるため、この2つは互いに影響します。(3) と (4) は、ほかの問題と関係がありません。取るべき進め方はどれですか。（2つ選択）","options":["(3) と (4) は互いに独立しているので、それぞれ別のメッセージで順に直させ、そのつど確かめる","4つの問題をまとめて「レビューの指摘をすべて直して」とだけ伝え、直し方は Claude に任せる","(1) と (2) を、互いの関係と期待する結果を書いた1つの詳しいメッセージにまとめて直させる","モジュールを破棄し、4つの問題を避けるよう指示を足したうえで、最初から生成し直させる","(1) を直させて結果を確かめてから、次のメッセージで (2) を直させ、1つずつ順に進める"],"answer":[0,2],"notes":["正解。独立した問題は1つずつ順に直すと、どの修正で何が変わったかを確かめやすく、ほかの部分にも影響しません。","何をどう直すかが伝わらず、互いに影響する2つの問題の関係も伝わりません。修正の質が運任せになります。","正解。修正が互いに影響する問題は、関係と期待する結果を添えて、1つのメッセージで扱います。整合した形で一度に直せます。","大部分は正しいコードを捨てることになり、手間に見合いません。作り直しても、同じ種類の誤りが出ない保証はありません。","(1) を直すと (2) の前提が変わります。別々に直すと、一方の修正がもう一方を崩し、やり直しが増えます。"],"explanation":"複数の問題を伝えるときは、まず問題どうしが影響し合うかを見極めます。一方の修正がもう一方の前提を変えるなら、関係を説明した1つの詳しいメッセージにまとめて直させます。独立した問題は順番に1つずつ直し、そのつど結果を確かめます。この使い分けで、手戻りを防ぎながら段階的に改善できます。","ref":"試験ガイド タスク 3.5"},{"id":"D3-14","domain":"D3","scenario":"S4","topic":"個人の指示の置き場所","type":"single","question":"エンジニアの1人が、自分が関わるすべてのリポジトリで、Claude Code に「説明は日本語で書き、ファイルを変更する前に影響するファイルの一覧を見せる」というやり方をさせたいと考えています。チームのほかのメンバーは英語での説明を好んでいて、このやり方をほかの人に当てるつもりはありません。この指示の置き場所として、最も適切なものはどれですか。","options":["ホームディレクトリの `~/.claude/CLAUDE.md` に書き、自分のすべてのプロジェクトで読み込ませる","各リポジトリのルートの CLAUDE.md に、このエンジニアの作業のときだけ従うよう断り書きを添えて書く","各リポジトリに `CLAUDE.local.md` を作って書き、それぞれのリポジトリで `.gitignore` に加える","各リポジトリの `.claude/rules/` に自分用のファイルを作り、`paths` で自分が触る範囲に絞る"],"answer":[0],"notes":["正解。ユーザーレベルの `~/.claude/CLAUDE.md` は、自分のすべてのプロジェクトで読み込まれ、バージョン管理を通じてチームに共有されることもありません。","プロジェクトの CLAUDE.md はバージョン管理でチーム全員に共有され、全員のセッションで読み込まれます。断り書きで対象の人を分けられる保証もありません。","`CLAUDE.local.md` は自分だけに効きますが、そのプロジェクトの中だけです。すべてのリポジトリに作って管理し続ける必要があり、新しいリポジトリでは効きません。","`.claude/rules/` のファイルはリポジトリにコミットされ、チームに共有されます。`paths` はファイルの場所で絞る仕組みで、人で絞ることはできません。"],"explanation":"CLAUDE.md の置き場所は、誰に、どの範囲で効かせたいかで選びます。ユーザーレベルの `~/.claude/CLAUDE.md` は自分のすべてのプロジェクトに効き、チームには共有されません。プロジェクトレベル（ルートの CLAUDE.md か `.claude/CLAUDE.md`）と `.claude/rules/` は、バージョン管理を通じてチーム全員に共有されます。2026年11月時点のドキュメントには、そのプロジェクトで自分だけに効く `CLAUDE.local.md` もありますが、すべてのプロジェクトに当てたい個人の好みには、ユーザーレベルが向きます。","ref":"試験ガイド タスク 3.1 ／ Claude Code Docs: How Claude remembers your project"},{"id":"D3-15","domain":"D3","scenario":"S4","topic":"argument-hint","type":"single","question":"チームは `.claude/skills/new-endpoint/SKILL.md` に、API のエンドポイントの雛形を作るスキルを置いています。本文は `$ARGUMENTS` で資源の名前と HTTP メソッドを受け取る前提で、`/new-endpoint orders POST` のように呼び出す決まりです。ところが、入力の補完で選んだ `/new-endpoint` を引数なしで実行するメンバーが多く、そのたびに Claude が資源の名前を推測して、誰も意図していない名前のファイルを作っています。最も適切な対応はどれですか。","options":["CLAUDE.md に「`/new-endpoint` は資源の名前とメソッドを付けて呼ぶこと」と書き足しておく","フロントマターに `context: fork` を加え、推測した名前でのファイル作成をサブエージェントに任せる","フロントマターに `argument-hint: [resource] [method]` を加え、必要な引数を呼び出し時に示す","フロントマターに `required-arguments: true` を加え、引数がないときはスキルを実行させない"],"answer":[2],"notes":["CLAUDE.md は Claude への指示を置く場所で、スキルを呼び出す開発者の目には入りません。引数を付け忘れる人に、入力を促すことにはなりません。","`context: fork` は、スキルを分離したサブエージェントで実行し、出力がメインの会話を汚さないようにする設定です。推測した名前でファイルが作られる問題は変わりません。","正解。`argument-hint` は、スキルを呼び出すときに期待する引数を示すフロントマターです。`[resource] [method]` と書いておけば、引数なしで呼び出そうとした開発者に必要な入力を促せます。","`required-arguments` というフロントマターの項目はありません。もっともらしい名前の、存在しない設定です。"],"explanation":"スキルのフロントマターには、`context: fork`、`allowed-tools`、`argument-hint` などを書けます。試験ガイドでは、開発者が引数なしでスキルを呼び出したときに必須のパラメータの入力を促すために `argument-hint` を使います。CLAUDE.md への追記や、別の目的の設定では、呼び出す人に必要な引数は伝わりません。2026年11月時点のドキュメントでは、`argument-hint` は入力の補完のときに表示されるヒントで、引数を強制する仕組みではありません。確実にしたいときは、本文にも「引数がなければ、資源の名前とメソッドを尋ねる」と書き添えます。","ref":"試験ガイド タスク 3.2 ／ Claude Code Docs: Extend Claude with skills（Frontmatter reference）"},{"id":"D3-16","domain":"D3","scenario":"S4","topic":"大きな移行の進め方","type":"multi","question":"エンジニアが、非推奨になった社内の HTTP クライアントを新しいライブラリに置き換える作業を Claude Code に任せようとしています。影響は約50ファイルに及び、リトライやタイムアウトの扱いをどう移すかには複数のやり方が考えられます。前回の似た作業では、調査で読んだファイルの内容がメイン会話にたまり、実装の途中でコンテキストが足りなくなりました。取るべき対応はどれですか。（2つ選択）","options":["プランモードで影響範囲を調べて移行の方針を決め、計画を承認してから直接実行で実装する","50ファイルを10ファイルずつ5つのセッションに分け、それぞれのセッションで直接実行で書き換えさせる","Explore サブエージェントに、調査から50ファイルの書き換えまでを任せ、メイン会話には完了だけを返させる","冗長な調査は Explore サブエージェントに任せ、メイン会話には要約だけを返させる","見落としを防ぐため、50ファイルすべてを最初にメイン会話へ読み込ませてから計画させる"],"answer":[0,3],"notes":["正解。多数のファイルに及び、やり方が複数ある変更はプランモードで調べて設計します。計画が固まったら、直接実行で実装に移ります。","コンテキストは分けられますが、リトライやタイムアウトの扱いを決める共通の計画がないので、セッションごとに移し方がばらつくおそれがあります。","Explore は読み取り専用のサブエージェントで、Write と Edit は使えません。書き換えまでは任せられず、方針を決める過程もメイン会話から見えなくなります。","正解。Explore サブエージェントは冗長な調査の出力を分離し、要約だけを返します。複数フェーズの作業でもメインのコンテキストが枯渇しにくくなります。","前回の失敗（調査の内容でメイン会話が埋まる）をそのまま繰り返します。全部を読むより、必要な部分を探して読むべきです。"],"explanation":"プランモードは、大規模な変更、複数の有効なやり方、複数ファイルに及ぶ修正のように、変更を確定する前にコードベースを調べて設計したい作業のためのものです。調査と計画はプランモードで、実装は直接実行で、と組み合わせるのが基本です。調査のフェーズが冗長になる作業では Explore サブエージェントに調べさせ、メイン会話には要約だけを戻すと、実装のためのコンテキストを残せます。Explore は読み取り専用なので、任せるのは調査までで、書き換えは計画に沿ってメイン会話で進めます。","ref":"試験ガイド タスク 3.4 ／ Claude Code Docs: Permission modes（plan mode）、Create custom subagents"},{"id":"D3-17","domain":"D3","scenario":"S4","topic":"直接実行を選ぶ","type":"single","question":"エンジニアが、本番で出た `TypeError` のスタックトレースを Claude Code に渡しました。原因は `export/csv.py` の1つの関数で、値が `None` のときの分岐が抜けていることがはっきりしており、直す範囲もその関数の中だけです。最も適切な進め方はどれですか。","options":["プランモードに入り、コードベース全体の依存関係を調べたうえで修正の方針を計画させる","直接実行で、その関数に `None` のときの分岐を加え、テストを走らせて結果を確かめさせる","Explore サブエージェントに似た不具合を全体から探させ、その報告を待ってから修正する","インタビューパターンで、修正の前に考えるべき点を Claude から質問させてから実装する"],"answer":[1],"notes":["原因も範囲もはっきりした1つの関数の修正に、全体の調査と計画は要りません。手間に見合う効果がありません。","正解。スタックトレースで原因が分かり、範囲が明確な1ファイルの修正は、直接実行に向いています。テストで直ったことを確かめます。","似た不具合を探すのは別の作業です。今の不具合の修正を、関係のない調査の後回しにすることになります。","インタビューパターンは、不慣れな領域で設計上の考慮点を洗い出すための手です。直す内容が決まっている修正には重すぎます。"],"explanation":"直接実行は、内容がよく分かっていて範囲が明確な変更に向いています。スタックトレースで原因がはっきりした1ファイルのバグ修正や、条件分岐を1つ足すような変更がその例です。プランモードやサブエージェントでの調査、インタビューパターンは、どれも不確かさが大きい作業のための手で、今回のような変更では時間を使うだけです。作業の複雑さと不確かさに合わせて進め方を選ぶことが大切です。","ref":"試験ガイド タスク 3.4 ／ Claude Code Docs: Common workflows"},{"id":"D3-18","domain":"D3","scenario":"S4","topic":"実装前に質問させる","type":"single","question":"エンジニアが、不慣れなレガシーの在庫システムに、外部の価格 API の結果をキャッシュする層を Claude Code で追加しようとしています。本人はキャッシュの設計に詳しくなく、在庫が更新されたときにキャッシュをどう扱うか、価格 API が止まったときにどうふるまうべきかも、まだ考えていません。実装に入る前の進め方として最も適切なものはどれですか。","options":["「在庫システムに価格のキャッシュを追加して」とだけ依頼し、できた実装を動かしながら問題を直させる","一般的なキャッシュの設計指針を CLAUDE.md に書いておき、その指針に従って実装を進めさせる","実装の前に、決めておくべき点を Claude に質問させ、答えながら要件を固めてから実装させる","異なる方式でキャッシュの実装を3通り作らせ、既存のテストが通ったものから採用する案を選ぶ"],"answer":[2],"notes":["考えていない点（無効化の時期や障害時のふるまい）は、動かしてから見つかることになります。後で設計を変えると手戻りが大きくなります。","一般的な指針は、このシステムに固有の論点（在庫の更新とキャッシュの関係など）を洗い出してくれません。本人が考えていない点は決まらないままです。","正解。インタビューパターンです。開発者が想定していなかった考慮事項を、実装の前に Claude からの質問で洗い出せます。","既存のテストは新しいキャッシュの要件を確かめていないので、通っても正しさの目安になりません。何を満たすべきかが決まらないまま、数だけを増やしています。"],"explanation":"インタビューパターンは、実装の前に Claude に質問させ、開発者が想定していなかった考慮事項を洗い出す手法です。キャッシュの無効化の方針や障害時のふるまいのように、不慣れな領域で決めるべき設計上の論点に向いています。答えがまとまったら仕様として書き出し、それをもとに実装に移ります。反復的な改善の手は、期待する変換がぶれるなら入出力の例、振る舞いを確かめながら直すならテスト駆動、要件そのものが固まっていないならインタビューと、足りないものに合わせて選びます。","ref":"試験ガイド タスク 3.5 ／ Claude Code Docs: Best practices for Claude Code"},{"id":"D3-19","domain":"D3","scenario":"S5","topic":"CI に届かない指示","type":"single","question":"テックリードが手元で `claude -p` による PR のレビューを試し、期待どおりの指摘が出ることを確かめてから、同じコマンドを CI のジョブに組み込みました。ところが CI では、チームのレビュー基準（認可の確認漏れは必ず指摘する、自動生成のファイルは対象外にする、など）を無視した指摘が出ます。調べると、この基準はテックリードの `~/.claude/CLAUDE.md` だけに書かれていました。基準は、CI のレビューにも、各メンバーが手元で Claude Code を使うときにも当てたいと考えています。最も適切な対応はどれですか。","options":["CI のジョブの最初に、テックリードの `~/.claude/CLAUDE.md` をランナーのホームディレクトリへコピーする","レビュー基準を CI のジョブのプロンプトに直接書き込み、`claude -p` を呼ぶたびに毎回渡すようにする","プロジェクトの CLAUDE.md に `@~/.claude/CLAUDE.md` と書き、テックリードのファイルを取り込ませる","レビュー基準をプロジェクトの CLAUDE.md（または `.claude/rules/`）に移し、リポジトリにコミットする"],"answer":[3],"notes":["CI には効くようになりますが、基準はバージョン管理されない個人のファイルのままです。ほかのメンバーの手元には届かず、変更の履歴も追えません。","CI のレビューには届きますが、手元で Claude Code を使うメンバーには届きません。基準の写しが CI の設定とテックリードのファイルに分かれ、食い違いも生まれます。","`@` で取り込めるのは、その場所に実際にあるファイルです。CI のランナーやほかのメンバーのホームには、テックリードのファイルがありません。","正解。プロジェクトレベルの CLAUDE.md や `.claude/rules/` はリポジトリと一緒に共有され、CI から呼び出す Claude Code にも、各メンバーの手元のセッションにも読み込まれます。"],"explanation":"ユーザーレベルの `~/.claude/CLAUDE.md` は、そのユーザーの環境でだけ読み込まれ、バージョン管理を通じてチームには共有されません。手元では効くのに CI やほかのメンバーの環境では効かないときは、指示がユーザーレベルに置かれていないかを疑います。チームと CI に当てたいレビュー基準やテスト標準は、プロジェクトの CLAUDE.md（または `.claude/rules/`）に置いてコミットします。CLAUDE.md は、CI から呼び出す Claude Code にプロジェクトの文脈を渡す仕組みでもあります。","ref":"試験ガイド タスク 3.1 ／ Claude Code Docs: How Claude remembers your project"},{"id":"D3-20","domain":"D3","scenario":"S5","topic":"入出力の例で示す","type":"single","question":"Claude Code で、CI のテスト失敗ログを PR コメント用の Markdown に変換するスクリプトを作っています。「失敗をテストファイルごとにまとめ、スタックトレースはアプリのコードの最初の行だけを残す」と文章で3回説明しましたが、そのたびに解釈が変わります（テスト名ごとにまとめる、テストフレームワーク内部の行を残す、など）。スクリプトの構成に問題はなく、変換の規則が伝わっていないことが原因です。次に取るべき進め方として、最も効果的なものはどれですか。","options":["実際のログの断片と、それから作るべきコメントの組を2〜3個示し、その変換に合うように直させる","変換の規則を箇条書きでさらに細かく書き直し、「必ずこのとおりに」と強調してもう一度説明する","インタビューパターンで、変換について考えるべき点を Claude に質問させてから作り直させる","プランモードに切り替えてスクリプト全体の設計を計画し直させ、その計画に沿って書き直させる"],"answer":[0],"notes":["正解。文章の説明が毎回違う意味に読まれるときは、具体的な入力と期待する出力の例が、求める変換をいちばん確実に伝えます。まとめる単位や残す行が、例から一通りに読み取れます。","すでに3回、文章で説明してぶれています。言葉を足して強めても、同じ文章が別の意味に読まれる問題は残ります。","インタビューパターンは、自分が考えていなかった設計上の論点を、実装の前に洗い出すための手です。ここでは求める変換は決まっていて、伝わっていないだけです。","プランモードは、大きな変更や複数のやり方がある設計のための手です。スクリプトの構成には問題がなく、伝わっていないのは変換の規則です。"],"explanation":"期待する変換を文章で説明しても解釈がぶれるときは、2〜3個の具体的な入出力の例を示すのが最も効果的です。例は、まとめる単位や残す行といった細部を、言葉よりもあいまいさなく伝えます。考えるべき点がまだ分かっていないならインタビューパターン、直すたびに別のケースが壊れるならテスト駆動の反復、と症状に合わせて手を選びます。言葉を強めるだけの手は、読み違いの原因に届きません。","ref":"試験ガイド タスク 3.5"},{"id":"D3-21","domain":"D3","scenario":"S5","topic":"指摘を JSON で受ける","type":"single","question":"PR のレビュー結果をインラインコメントとして自動投稿するため、`claude -p` が出力したテキストから、正規表現でファイル名・行番号・指摘内容を取り出しています。出力の書き方が実行ごとに少しずつ変わり、約1割の実行で解析に失敗して、コメントが投稿されません。最も適切な対応はどれですか。","options":["プロンプトに出力形式の見本を追加し、正規表現も表記ゆれを吸収できるように書き直して、解析に失敗する割合を下げる","`--output-format json` と、指摘の項目を定義した `--json-schema` を付け、構造化出力から投稿する","`--output-format stream-json` に切り替え、ストリームで届く文字列をつなげてから、同じ正規表現で解析する","解析に失敗した実行だけ、同じプロンプトで `claude -p` を成功するまで繰り返し実行するようにする"],"answer":[1],"notes":["失敗の割合は下がるかもしれませんが、自由なテキストを解析する作りのままなので、形式のゆれはなくなりません。確率的な改善にとどまります。","正解。`--output-format json` と `--json-schema` を併用すると、スキーマに沿った指摘事項が結果の `structured_output` に入り、機械で確実に解析できます。","`stream-json` は出力を逐次受け取るための形式で、中身のテキストの書き方は変わりません。正規表現での解析が不安定な原因は残ります。","症状が出たら繰り返すだけで、原因に手を打っていません。実行時間とコストが増え、何度やっても解析できない出力もありえます。"],"explanation":"CI でレビューの結果を機械的に使うなら、テキストを解析するのではなく、構造化出力を強制します。Claude Code では `-p` に `--output-format json` と `--json-schema` を組み合わせると、スキーマに沿った値が JSON の `structured_output` フィールドに入るので、そのまま PR のインラインコメントにできます。2026年11月時点のドキュメントでは、要求を断ったときなど有効な構造化出力がないまま終わると、このフィールド自体が出ないとされています。スクリプトは、使う前にフィールドがあるかを確かめます。","ref":"試験ガイド タスク 3.6 ／ Claude Code Docs: Run Claude Code programmatically、CLI reference"},{"id":"D3-22","domain":"D3","scenario":"S5","topic":"再レビューの重複","type":"single","question":"PR に新しいコミットが積まれるたびに、Claude Code によるレビューを最初から実行し直しています。開発者からは「すでに修正した問題に、また同じコメントが付く」「同じ指摘が何件も重なり、どれが新しい指摘なのか分からない」という不満が出ています。修正済みの指摘は繰り返さず、まだ直っていない指摘は引き続き追えるようにしたいと考えています。最も適切な対応はどれですか。","options":["前回のレビュー以降に変わった差分だけを渡し、その範囲に絞ってレビューさせる","新しいコミットのたびに、前回 Claude が付けたコメントをすべて削除してから、全体を改めてレビューさせる","レビューを実行するのは PR を作成したときの1回だけにし、その後のコミットではレビューを行わない","前回のレビューの指摘事項を文脈に含め、新しい問題と未対応の問題だけを報告するよう指示する"],"answer":[3],"notes":["新しい差分の中でも、前回と同じ問題がまた指摘されえます。前回の指摘を知らないので重複を避ける手がかりがなく、まだ直っていない前回の指摘も追えません。","画面上の重複は消えますが、議論の履歴が失われ、どれが新しい指摘なのかは依然として分かりません。症状だけを抑える手です。","重複は出なくなりますが、後のコミットで入った問題を見逃します。レビューという業務そのものをやめる、極端な手です。","正解。前回の指摘事項を文脈として渡せば、Claude は修正済みのものを除き、新しい問題と未対応の問題だけを報告できます。"],"explanation":"新しいコミットの後にレビューをやり直すときは、前回のレビューの指摘事項をコンテキストに含め、新しい問題か、まだ対応されていない問題だけを報告するよう指示します。Claude は前回何を指摘したかを自動では知らないので、渡さなければ同じ指摘を繰り返します。差分を削る、コメントを消す、レビューをやめるといった手は、重複という症状は抑えても、見逃しや履歴の喪失という別の問題を生みます。","ref":"試験ガイド タスク 3.6"},{"id":"D3-23","domain":"D3","scenario":"S5","topic":"テスト生成の質","type":"multi","question":"CI で、変更されたモジュールのテストケースを Claude Code に生成させています。生成されたテストには、(1) 既存のテストスイートですでにカバーされているシナリオの重複が多い、(2) チームが用意している共通のフィクスチャを使わず、テストごとにデータを手書きしている、という問題が目立ちます。取るべき対応はどれですか。（2つ選択）","options":["対象モジュールの既存のテストファイルをコンテキストに渡し、すでにカバーされているシナリオは提案しないよう指示する","生成するテストの件数に上限を設け、上限を超えた分は、確信度の自己申告が低い順に捨てるようにする","生成後に、テスト関数の名前が既存のテストと一致するものを機械的に取り除く後処理を、パイプラインに追加する","テスト生成を Message Batches API に移して夜間にまとめて生成し、翌朝に人が重複を取り除く","テスト標準、価値のあるテストの基準、利用できるフィクスチャとその使い方を、プロジェクトの CLAUDE.md に書く"],"answer":[0,4],"notes":["正解。何がすでにテストされているかを知らなければ、Claude は重複を避けられません。既存のテストファイルを渡すのが、(1) の原因に直接効く手です。","件数を減らしても、重複かどうかで選んでいるわけではありません。自己申告の確信度は、重複の判定にも価値の判定にも当てになりません。","名前が違っても同じシナリオを試すテストは残ります。表面的な一致で取り除くだけで、重複を生む原因には手を打っていません。","夜間のテスト生成はバッチに向く処理ですが、コストと時間の問題を解く手です。生成の質は変わらず、人に負担を回しているだけです。","正解。CLAUDE.md は、CI から呼ばれる Claude Code にプロジェクトの文脈を渡す仕組みです。テスト標準とフィクスチャを書いておけば、(2) の価値の低い出力を減らせます。"],"explanation":"テスト生成の質は、Claude に渡す文脈で決まります。既存のテストファイルを渡せば、すでにカバーされているシナリオの重複を避けられます。テスト標準・価値のあるテストの基準・利用できるフィクスチャを CLAUDE.md に書いておけば、CI から呼ばれるたびにそれが文脈になり、チームの流儀に合ったテストが出やすくなります。2026年11月時点のドキュメントは CI で `--bare` を推奨しており、その場合 CLAUDE.md は読み込まれないので、`--append-system-prompt-file` などで同じ内容を渡します。","ref":"試験ガイド タスク 3.6 ／ Claude Code Docs: Claude Code GitHub Actions、Run Claude Code programmatically"},{"id":"D3-24","domain":"D3","scenario":"S5","topic":"レビューのセッション","type":"single","question":"CI のジョブで、まず `claude -p` に失敗したテストの修正を実装させ、そのときの `session_id` を `--resume` に渡して、同じセッションに「今の変更をレビューして」と依頼しています。レビュー段階はほぼ毎回「問題なし」と答えますが、マージ後に修正の不備が見つかることが続いています。レビュー段階の構成として最も適切なものはどれですか。","options":["生成時のセッションを引き継がない別の `claude -p` の呼び出しでレビューさせ、差分とレビュー基準だけを渡す","`--resume` に `--fork-session` を加えて新しいセッション ID に分岐させ、生成の履歴を残したままレビューさせる","同じセッションのまま、「自分が書いたコードだと思わず、厳しい第三者として見直して」とプロンプトで強く指示する","`--max-turns` を増やし、同じセッションがレビューに使える反復の回数を多くして、時間をかけて見直させる"],"answer":[0],"notes":["正解。コードを生成したセッションは自分の推論を引き継いでいるため、自分の変更を疑いにくくなります。生成の文脈を持たない独立した呼び出しでレビューさせます。","`--fork-session` はセッション ID を新しくするだけで、会話の履歴はそのまま引き継ぎます。生成時の推論を持ったままなので、セルフレビューと変わりません。","指示で立場を変えさせても、同じ推論の文脈を見ていることは変わりません。プロンプトだけで偏りを取り除こうとする確率的な手です。","反復の回数を増やしても、同じ文脈で見直す限り、自分の判断を疑いにくいという原因は変わりません。コストが増えるだけです。"],"explanation":"コードを生成したのと同じ Claude のセッションは、生成時の推論を文脈に持っているため、独立したレビューインスタンスに比べて自分の変更をレビューする効果が下がります。CI では、レビューを生成と別の呼び出しにし、差分と基準だけを渡して、生成の推論から切り離します。`--resume` や `--fork-session` は前の会話を引き継ぐための機能で、レビューの独立性を得る目的には逆効果です。「レビューは書いた本人とは別の目で」という原則は、パイプラインの組み方で守らせます。","ref":"試験ガイド タスク 3.6 ／ Claude Code Docs: CLI reference、Best practices for Claude Code"},{"id":"D4-01","domain":"D4","scenario":"S1","topic":"明示的な判定基準","type":"single","question":"エージェントは、返金の依頼に「不正の疑い」フラグを付けて、不正対策チームの確認に回します。プロンプトには「疑わしい場合は慎重に判断し、確信度の高いものだけにフラグを付けること」とあります。フラグの約40%が誤検知で、チームはフラグを読み飛ばすようになり、本物の不正まで見落とし始めました。最も適切な対応はどれですか。","options":["「さらに保守的に判断し、明らかに不正なものだけにフラグを付けること」と指示を強める","フラグごとにモデルに0から1の確信度を出させ、0.9以上のものだけをチームに回す","読み飛ばしを防ぐため、すべてのフラグを上級担当者による二重確認の対象にしておく","直近30日の返金回数や注文直後の住所変更など、フラグを付ける条件と付けない条件を書く"],"answer":[3],"notes":["「保守的に」のような一般的な指示は、具体的なカテゴリ別の基準と比べて精度の向上につながりません。何が不正の兆候かが、まだ書かれていません。","キャリブレーションしていない自己申告の確信度でふるい分けても、何を不正の兆候とみなすかという基準はあいまいなままです。確信度に頼るのではなく、報告する条件を定めます。","誤検知の多いフラグを人の手間で受け止めているだけです。誤検知率は変わらず、チームの負担が増えます。","正解。どんな兆候ならフラグを付け、どんな場合は付けないかを明示すれば、誤検知が減ります。チームのフラグへの信頼も戻ります。"],"explanation":"精度を上げて誤検知を減らすには、曖昧な指示ではなく明示的な基準を書きます。試験ガイドは、「保守的に判断する」「確信度の高い指摘事項のみを報告する」といった一般的な指示が精度の向上につながらないこと、誤検知の多いカテゴリが正確な指摘への信頼まで損なうことを挙げています。報告すべきものとスキップすべきものを、具体的な条件と例で定義するのが判断の軸です。2026年11月時点のドキュメントも、1回のパスでモデルに絞り込ませるなら、「重要な」のような質的な言葉ではなく、報告する線を具体的に書くよう勧めています。","ref":"試験ガイド タスク 4.1 ／ Claude Docs: Prompting Claude Opus 4.8（Code review harnesses）"},{"id":"D4-02","domain":"D4","scenario":"S3","topic":"推論を持たないレビュー","type":"single","question":"レポート生成サブエージェントは、レポートを書き終えたあと、同じセッションのまま見直しをしています。それでも公開前の人手の確認では、出典の内容と食い違う主張が毎回のように見つかります。見直しの段階を作り直すとき、最も効果的な構成はどれですか。","options":["生成したセッションをフォークしてレビュー用の分岐を作り、元の履歴を引き継いだまま照合させる","生成時の推論を持たない別のインスタンスに、レポートと出典の記録だけを渡して照合させる","別のインスタンスに、レポートと生成時の推論の記録を渡し、書き手の意図を理解させてから照合させる","同じセッションのまま拡張思考を有効にし、より長く考えてから見直させる"],"answer":[1],"notes":["フォークは元の会話の履歴を写して始まるので、生成時の推論もそのまま残ります。同じセッションでの見直しと同じく、自分の判断を疑いにくいままです。","正解。生成時の推論コンテキストを持たない独立したインスタンスなら、書いた側の理屈に引きずられずに、主張と出典を突き合わせられます。","別のインスタンスでも、生成時の推論を渡せば、その理屈に引きずられやすくなります。独立したレビューの利点は、推論を持たないことにあります。","考える量を増やしても、生成したときの推論の文脈は同じセッションに残ります。試験ガイドも、独立したレビューインスタンスのほうが拡張思考より微妙な問題を見つけやすいとしています。"],"explanation":"モデルは生成時の推論コンテキストを持っているため、同じセッション内では自分の判断を疑いにくくなります。レビューは、以前の推論を持たない独立したインスタンスに、成果物と照合の材料（ここではレポートと出典の記録）だけを渡して行います。会話を写すフォークや、推論の記録を添えた依頼は、別のインスタンスに見えても生成時の文脈を持ち込むので、独立したレビューになりません。Claude Code のドキュメントも、会話を見ていない新しいサブエージェントによるレビューは、元の推論に引きずられないと説明しています。","ref":"試験ガイド タスク 4.6 ／ Claude Code Docs: Best practices ／ Agent SDK Docs: Sessions"},{"id":"D4-03","domain":"D4","scenario":"S5","topic":"指摘の条件を明示","type":"single","question":"レビューの観点に「コードコメントの正確性を確認する」を入れたところ、この観点の指摘の多くが「説明がやや曖昧」「もっと詳しく書くべき」といった、開発者が対応する必要のないものでした。本当に見つけたいのは、コメントに書かれた動作が実際のコードと食い違っているケースだけです。プロンプトをどう変えるのが最も適切ですか。","options":["「コメントの正確性は保守的に判断し、自信がある場合だけ指摘する」と書き加え、指摘の数を抑える","指摘のそれぞれに 0〜1 の確信度を付けさせ、0.8 未満の指摘はパイプラインの側でまとめて捨てるようにする","観点の名前を「ドキュメント品質」に変え、ほかの観点の指摘とは別のコメントにまとめて投稿する","「コメントが主張する動作が、実際のコードの動作と矛盾する場合にのみ指摘する」と、報告する条件を明示する"],"answer":[3],"notes":["「保守的に」は何を報告し何を報告しないかを決めていない一般的な指示で、具体的な基準に比べて精度の向上につながりません。","モデルが自己申告する確信度は、報告すべきかどうかの基準の代わりになりません。曖昧な指示が原因である点は変わりません。","見せ方を変えるだけで、対応不要の指摘が出続けるという問題は解決しません。開発者の確認の手間も減りません。","正解。曖昧な「正確性を確認する」を、「主張された動作が実際のコードと矛盾するときだけ」という明示的な基準に置き換えるのが、原因に直接効く手です。"],"explanation":"誤検知を減らすには、曖昧な指示ではなく、何を指摘するかの明示的な基準を書きます。「コメントの正確性を確認する」という指示は、表現の好みまで指摘の対象に含めてしまいます。「主張されている動作が実際のコードの動作と矛盾する場合にのみ指摘する」と条件を言い切れば、モデルは何を報告すべきかを判断できます。「保守的に」や確信度での足切りは、基準のあいまいさという原因を残したままです。","ref":"試験ガイド タスク 4.1 ／ Claude Docs: Prompting best practices"},{"id":"D4-04","domain":"D4","scenario":"S5","topic":"一般的な指示の限界","type":"single","question":"自動レビューの誤検知が多く、開発者がコメントを読まなくなってきました。チームはプロンプトに「確信度の高い指摘事項のみを報告すること」「保守的に判断すること」を加えましたが、2週間たっても却下される指摘の割合はほとんど変わりません。却下された指摘を分類すると、変数名の好みや、そのファイルの中では一貫している書き方への指摘が大半でした。次に行うべき最も適切な対応はどれですか。","options":["「確信度の高い」「保守的に」という指示を、「確信度95%以上の」「極めて保守的に」とさらに強い表現に書き換える","報告すべき問題（バグ、セキュリティ）と、報告しない問題（軽微なスタイル、局所的に一貫した書き方）を具体的に定義する","毎回3回レビューを実行し、3回すべてで出た指摘だけを投稿して、偶然に出た誤検知をまとめて取り除くようにする","開発者に読んでもらえるよう、すべての指摘に重大度「高」を付け、PR の目立つ位置にまとめて表示する"],"answer":[1],"notes":["効かなかった一般的な指示を強めているだけです。何を報告しないのかが決まっていないので、スタイルへの指摘は減りません。","正解。却下の大半がスタイルや局所的なパターンへの指摘だと分かっているので、それを「報告しない」と具体的に定義するのが原因に直接効きます。","スタイルへの指摘は毎回同じように出るので、多数決では残ります。逆に、ときどきしか見つからない本物のバグを消してしまうおそれがあります。","重大度の意味が失われ、本当に重要な指摘がますます埋もれます。誤検知を減らすのではなく、目立たせているだけです。"],"explanation":"「保守的に判断する」「確信度の高い指摘事項のみを報告する」といった一般的な指示は、具体的なカテゴリ別の基準に比べて精度の向上につながりません。何を報告し、何を報告しないかという基準そのものが示されていないからです。却下された指摘を分析して誤検知の型が分かったら、報告すべき問題と報告しない問題をカテゴリごとに具体的に書きます。なお、2026年11月時点の Claude Opus 4.8 向けのドキュメントは、新しいモデルがこうした指示に忠実に従い、見つけたバグまで報告しないことがあるとし、報告の線を具体的に書くよう勧めています。確信度での足切りや多数決に頼る前に、まず基準を明示します。","ref":"試験ガイド タスク 4.1 ／ Claude Docs: Prompting Claude Opus 4.8（Code review harnesses）"},{"id":"D4-05","domain":"D4","scenario":"S5","topic":"誤検知と開発者の信頼","type":"multi","question":"レビューの指摘を観点ごとに集計したところ、セキュリティとバグの指摘は8割以上が採用されている一方、「パフォーマンス」の観点は指摘の7割が却下されていました。開発者アンケートでは、「どうせ外れが多い」とセキュリティの指摘まで読み飛ばす人が増えています。開発者の信頼を回復するために取るべき対応はどれですか。（2つ選択）","options":["すべての観点の投稿をいったん止め、レビューの仕組み全体を見直し終えるまで、どの指摘も投稿しない","パフォーマンスの観点を一時的に無効にし、採用率の高い観点の指摘だけを投稿するようにする","パフォーマンスの指摘を、ほかの観点の指摘の後ろにまとめて表示し、目立たないようにする","パフォーマンスの観点のプロンプトに、報告する条件と報告しない条件を具体例とともに明示的に書き加える","セキュリティの指摘の先頭に「この指摘は信頼度が高い」と注記を付け、読み飛ばされないようにする"],"answer":[1,3],"notes":["正確に機能している観点まで止めてしまう、極端な手です。セキュリティやバグの有用な指摘が届かなくなります。","正解。誤検知の多い観点は、正確な観点への信頼まで損ないます。その観点を一時的に止めれば、残った指摘の信頼を取り戻せます。","誤検知の指摘は出続けるので、「外れが多い」という印象は変わりません。症状を目立たなくしているだけです。","正解。誤検知の原因である曖昧な基準を、明示的な条件に直します。採用率が上がったことを確かめてから、止めていた観点を戻します。","注記を付けても、外れの多いコメントが同じ場所に並び続けます。信頼を損なっている原因に手を打っていません。"],"explanation":"誤検知の多いカテゴリは、それ自体が役に立たないだけでなく、正確なカテゴリへの開発者の信頼まで損ないます。そこで、誤検知の多いカテゴリを一時的に無効にして信頼を回復し、その間にそのカテゴリのプロンプトを明示的な基準で改善します。全体を止めるのは行き過ぎで、表示順や注記の工夫は症状を隠すだけです。観点ごとの採用率を測り、問題のある観点だけを切り分けて直すのが判断の軸です。","ref":"試験ガイド タスク 4.1"},{"id":"D4-06","domain":"D4","scenario":"S5","topic":"重大度の基準","type":"single","question":"自動レビューの指摘には「重大」「中」「軽微」の重大度を付け、「重大」が1件でもあればマージ前に人が確認する運用にしています。ところが、ほぼ同じ SQL の組み立て方が、ある PR では「重大」、別の PR では「軽微」と判定されるなど、重大度の付け方が一貫しません。プロンプトには重大度の名前だけが書かれています。最も適切な対応はどれですか。","options":["重大度の判定をやめ、すべての指摘を「要確認」の1段階にして、人がすべての指摘を確認するようにする","重大度を付けるたびに確信度も自己申告させ、確信度の低い判定は1段階上の重大度に引き上げる","重大度ごとに判定の基準を明示し、それぞれの重大度にあたる具体的なコード例を添える","重大度を5段階に細かく分けて判定の選択肢を増やし、PR ごとの判定のぶれを吸収させる"],"answer":[2],"notes":["一貫しない判定を直すのではなく、仕組みそのものを捨てています。人の確認の負担が大きく増えます。","自己申告の確信度は判定の一貫性の目安として当てになりません。基準がないという原因も残ったままです。","正解。重大度ごとに明示的な基準と具体的なコード例があれば、同じ書き方が同じ重大度に分類されるようになります。","基準がないまま段階を増やすと、境界が増えて、かえって判定がぶれやすくなります。"],"explanation":"重大度の名前だけでは、モデルは毎回その場の解釈で分類するので、同じコードでも判定がぶれます。一貫した分類には、重大度ごとの明示的な基準と、それぞれにあたる具体的なコード例を定義します。例があると、「この形のSQLの組み立ては重大」という境界がはっきりします。判定をやめる、段階を増やす、確信度で補正するといった手は、基準がないという根本の原因に届きません。","ref":"試験ガイド タスク 4.1"},{"id":"D4-07","domain":"D4","scenario":"S5","topic":"形式と許容パターンの例","type":"multi","question":"レビューの指摘の書き方がばらつき、場所（ファイルと行）が抜けていたり、修正案がなかったりします。さらに、チームが意図して使っている「例外を握りつぶさずにログを出してから既定値を返す」書き方が、毎回「例外処理の問題」として指摘されます。どちらも、プロンプトの指示文を詳しくしても改善しませんでした。取るべき対応はどれですか。（2つ選択）","options":["出力を受け取った後に、別のモデルで指摘の形式を整え直す後処理の段階をパイプラインに追加する","例外処理に関する観点そのものを恒久的に外し、例外処理についての指摘が一切出ないように設定する","場所、問題、重大度、修正案をそろえて書いた指摘の例を few-shot で示し、求める出力形式を見せる","指示文の該当部分を大文字や記号で強調し、ほかの指示より優先度が高いことをはっきり伝える","許容される書き方と本当の問題を対比した例を、指摘する・しない理由とともに few-shot に加える"],"answer":[2,4],"notes":["後から整形しても、もとの出力に場所や修正案がなければ補えません。もう1段階増える分、作り込みすぎでもあります。","本物の例外処理の問題まで見逃すようになります。誤検知を一つの書き方に限って直すべきところを、観点ごと捨てる極端な手です。","正解。詳しい指示だけでは形式がそろわないとき、求める形式（場所、問題、重大度、修正案）を示す few-shot の例が最も効果的です。","すでに指示文を詳しくしても改善していないので、同じ指示を強調しても効果は見込めません。","正解。許容されるパターンと本当の問題を対比し、理由を付けて示すと、モデルが判断を一般化でき、誤検知が減ります。"],"explanation":"詳細な指示だけでは結果が一貫しないとき、few-shot の例が最も効果的な手段になります。出力形式のばらつきには、求める形式をそろえて書いた例を示します。意図して使っている書き方への誤検知には、許容される書き方と本当の問題を対比した例を、なぜそう判断するのかの理由とともに示します。理由付きの対比例があると、モデルは例そのものに一致させるだけでなく、似た新しいケースにも判断を広げられます。","ref":"試験ガイド タスク 4.2 ／ Claude Docs: Prompting best practices"},{"id":"D4-08","domain":"D4","scenario":"S5","topic":"曖昧なケースの例","type":"single","question":"テスト生成の前段で、「テストが不足している箇所」を Claude に指摘させています。プロンプトには不足とみなすケースを規則として12個列挙していますが、モデルは列挙されたケースに字面で一致するものしか指摘しません。たとえば、関数としてはテストされているのに、エラー時の分岐が一度も通らないといった不足を見逃します。最も効果的な対応はどれですか。","options":["分岐単位でテストが足りないなど曖昧なケースの例を数個、判断の理由付きで示して一般化させる","見逃したケースを13個目、14個目の規則として追加し、規則の一覧で不足のパターンを網羅していく","「列挙した規則に限らず、テストの不足を幅広く指摘すること」と一文を加え、判断をモデルに任せる","より大きなコンテキストウィンドウを持つモデルに切り替え、モジュール全体を一度に読ませて判断させる"],"answer":[0],"notes":["正解。few-shot の例は、事前に指定したケースへの一致ではなく、新しいパターンへの判断の一般化を可能にします。曖昧なケースと理由を示すのが効果的です。","見つかるたびに規則を足す方法は、列挙に一致させるという原因をそのまま強めます。まだ見ていないパターンは引き続き見逃します。","どこまでを不足とみなすかの手がかりがない曖昧な指示で、誤検知が増えるおそれもあります。判断の境界を示せていません。","規模で解決しようとする手です。読める量の問題ではなく、どう判断するかが伝わっていないことが原因です。"],"explanation":"規則を列挙するだけでは、モデルは列挙されたケースとの一致を探すようになり、似ているが書かれていないケースを見逃します。few-shot の例は、曖昧なケース（関数単位ではテストされているのに一部の分岐が通らない、など）の扱い方を、判断の理由とともに示せます。理由が分かる例があると、モデルはその判断を新しいパターンにも広げられます。なお、試験ガイドは的を絞った例を2〜4個としていますが、2026年11月時点のドキュメントは3〜5個を目安にしています。数より、曖昧な場面に的を絞り、理由を示すことが大事です。","ref":"試験ガイド タスク 4.2 ／ Claude Docs: Prompting best practices"},{"id":"D4-09","domain":"D4","scenario":"S5","topic":"バッチとツールの往復","type":"single","question":"夜間に、変更されたモジュールごとのテスト生成を同期の API で動かしています。各リクエストでは、Claude が `read_file` ツールで関連するソースを読み、`run_tests` ツールで生成したテストを実行し、結果を見て直す、というツールの往復を1件あたり平均6回繰り返しています。結果は翌日中にそろえばよいので、コストを下げるため Message Batches API への移行を検討しています。最も適切な進め方はどれですか。","options":["処理をそのままバッチに移す。バッチの中でも、Claude が求めたツールはアプリ側で実行され、結果が戻される","必要なソースを先にリクエストへ含めてテストの生成だけをバッチに移し、実行して直す往復は同期の API に残す","ツールを使う処理はバッチでは扱えないので移行を見送り、テスト生成はすべて同期の API のまま続ける","各リクエストの `custom_id` を指定し、ツールの実行結果をあとから同じリクエストに送って続きを処理させる"],"answer":[1],"notes":["バッチの各リクエストは独立に処理され、結果は1つの応答として返ります。リクエストの途中でアプリ側がツールを実行し、結果を返す往復はできません。","正解。1回の応答で完結する部分（情報を先に渡したテストの生成）をバッチに移して割引を受け、ツールの往復が要る実行と修正は同期の API に残します。","バッチのリクエストにもツールの定義や会話の履歴は入れられます。往復が要る部分だけを切り分ければ大部分で割引を受けられるので、移行をまるごとやめるのは極端です。","`custom_id` はリクエストと結果を対応付けるためのものです。送信したバッチは後から変更できず、同じリクエストに結果を足して続きを処理させることはできません。"],"explanation":"Message Batches API は、1つのリクエストの中でアプリ側のツールを実行して結果を返す、マルチターンのツール呼び出しに対応していません。ツールの往復を前提にした処理をバッチに移すときは、必要な情報を先にリクエストへ含めて1回の応答で完結する部分を切り出し、往復が必要な部分は同期の API に残します。こうすれば、待てる処理の大部分で50%のコスト削減を受けられます。なお、2026年11月時点のドキュメントでは、Anthropic 側で実行されるサーバーツールや過去の会話の履歴はバッチのリクエストに含められますが、アプリ側で実行するツールの結果を途中で返せない点は変わりません。","ref":"試験ガイド タスク 4.5 ／ Claude Docs: Batch processing"},{"id":"D4-10","domain":"D4","scenario":"S5","topic":"SLA と送信間隔","type":"single","question":"コストを下げるため、セキュリティ監査のジョブを Message Batches API に移す計画です。要件は「コミットから30時間以内に監査結果がそろっていること」です。溜まったコミットを一定の間隔でまとめてバッチに送り、バッチの処理には最大24時間かかる前提で設計します。要件を確実に満たす方法として最も適切なものはどれですか。","options":["24時間ごとに送信する。ほとんどのバッチは1時間ほどで終わるので、通常は要件に収まる","12時間ごとに送信する。処理に24時間かかっても、平均的には要件に収まる","要件を確実に守るため、バッチをやめ、コミットごとに同期の API で監査する","4時間ごとに送信する。最悪でも待ち4時間と処理24時間の合計で、要件に収まる"],"answer":[3],"notes":["バッチはたいてい早く終わりますが、レイテンシの保証はありません。最悪の場合は待ち24時間と処理24時間で48時間になり、要件を守れません。","最悪の場合は待ち12時間と処理24時間で36時間になります。平均で収まっても、「確実に」という要件は満たせません。","要件は守れますが、バッチで50%のコストを下げるという目的を捨てています。30時間待てる処理に同期の API は必要ありません。","正解。直前の送信の直後に入ったコミットは最大4時間待ち、さらに最大24時間の処理で、合計28時間です。最悪の場合でも30時間に収まります。"],"explanation":"Message Batches API は処理に最大24時間かかり、レイテンシの SLA は保証されません。待てる処理に使うときは、最悪の場合を前提に送信の間隔を決めます。結果がそろうまでの最悪の時間は「次の送信までの待ち＋最大24時間の処理」なので、試験ガイドの例にもあるとおり、30時間の要件なら4時間ごとの送信で守れます。「たいてい早く終わる」という平均の速さに頼るのは、確実さが求められる要件では誤りです。","ref":"試験ガイド タスク 4.5 ／ Claude Docs: Batch processing"},{"id":"D4-11","domain":"D4","scenario":"S5","topic":"統合パスの追加","type":"single","question":"大きな PR のレビューを、ファイルごとに別々のレビューパスで分析する方式に変えたところ、各ファイルへの指摘の深さはそろいました。しかし、ある PR で関数の戻り値の型を変えた変更が、別のファイルにある呼び出し元を壊していたのに、どのパスもそれを指摘しませんでした。最も適切な対応はどれですか。","options":["ファイル単位のパスをやめ、元どおり PR 全体を1回のパスでまとめてレビューする方式に戻す","ファイル単位のパスは残し、ファイル間のデータフローや呼び出し関係を調べる統合パスを別に追加する","各ファイルのパスに PR のほかのすべてのファイルの全文も渡し、それぞれのパスで横断的に確認させる","型の変更を含む PR は自動レビューの対象から外し、人間によるレビューだけで確認するようにする"],"answer":[1],"notes":["1回のパスに戻すと、注意の分散で指摘の深さがばらつく、もとの問題が戻ってきます。","正解。ファイル単位の局所的な分析パスと、ファイル横断のデータフローを調べる統合パスを分けるのが、マルチパスレビューの形です。","各パスがまた全ファイルを抱えることになり、注意の分散が戻ります。同じ横断の確認がファイルの数だけ重複し、指摘が矛盾するおそれもあります。","見つけにくい問題ほど自動レビューから外すことになり、仕組みを改善していません。人に負担を回すだけです。"],"explanation":"大規模なレビューは、ファイル単位で局所的な問題を見るパスと、ファイル横断のデータフローを見る統合パスに分けます。ファイル単位のパスは深さをそろえるのに有効ですが、ファイルの境界をまたぐ問題（型の変更が呼び出し元を壊す、など）は構造上見えません。そこで、横断の観点に絞った統合パスを別に用意します。片方だけでは、注意の分散か、横断の問題の見逃しのどちらかが残ります。","ref":"試験ガイド タスク 4.6"},{"id":"D4-12","domain":"D4","scenario":"S5","topic":"確信度で振り分け","type":"single","question":"自動レビューの指摘を、すべて人が確認してから PR に投稿しています。しかし確認する担当者の時間が足りず、投稿が1日以上遅れることがあります。チームは、人の確認を本当に必要な指摘に集中させたいと考えています。最も適切な構成はどれですか。","options":["検証パスで各指摘に確信度を付けさせ、ラベル付きの過去の指摘でしきい値を調整してから、確信度の低いものを人に回す","最初のレビューのプロンプトに「確信度の高い指摘事項のみを報告すること」と加え、人に届く指摘の数そのものを減らす","同じ PR を3回レビューさせ、3回すべてに出た指摘は自動で投稿し、それ以外の指摘はすべて捨てるようにする","生成時と同じセッションで「各指摘を見直し、誤りがあれば取り下げて」と頼み、残った指摘だけを人に回す"],"answer":[0],"notes":["正解。指摘ごとに確信度を出す検証パスを置き、ラベル付きのデータでしきい値をキャリブレーションすれば、人の確認を必要な指摘に振り分けられます。","一般的な指示は精度の向上につながらず、本物の問題まで報告されなくなるおそれがあります。振り分けではなく、指摘を減らしているだけです。","ときどきしか見つからない本物のバグを捨ててしまいます。人の確認を集中させるという目的にも合いません。","生成と同じ文脈では、自分の判断を疑いにくくなります。取り下げの判断も当てになりません。"],"explanation":"限られた確認の手間を必要な指摘に集中させるには、指摘ごとにモデルが確信度を出す検証パスを設け、その値で振り分けます。ただし、自己申告の確信度はそのままでは当てにならないので、ラベル付きの検証データでしきい値をキャリブレーションしてから使います。プロンプトで「確信度の高いものだけ」と指示する方法は、振り分けではなく報告の取りこぼしを生みます。確信度は「何を報告するか」の基準ではなく、「誰が見るか」の振り分けに使うのが判断の軸です。","ref":"試験ガイド タスク 4.6、5.5"},{"id":"D4-13","domain":"D4","scenario":"S5","topic":"レビュー役に渡すもの","type":"single","question":"API で作ったテスト生成エージェントでは、生成とレビューを別の呼び出しに分けました。ただし、レビュー役には文脈として、生成役の会話の履歴（どう考えてテストを書いたかの説明と、「すべての分岐を検証済み」という自己評価を含む）をすべて渡しています。それでも、常に成り立つアサーションや、対象の関数を実際には呼んでいないテストの見逃しが減りません。最も効果的な対応はどれですか。","options":["レビュー役で拡張思考を有効にし、渡された生成役の会話を、より時間をかけて読み込んでから判断させる","レビュー役を生成役より大きなモデルに替え、同じ会話の履歴を渡したまま、より深く見直させる","生成役の会話と自己評価は渡さず、テストと対象のコード、テストの標準だけをレビュー役に渡す","生成役に自分の推論を短く要約させてレビュー役に渡し、受け取る履歴を減らしたうえで見直させる"],"answer":[2],"notes":["考える量を増やしても、生成役の推論と自己評価を前提に読むことは変わりません。拡張思考は、独立したレビューの代わりになりません。","規模で解決しようとする手です。生成役の説明を読んだうえで見直す限り、その判断に引きずられるという原因は残ります。","正解。独立したレビューの価値は、生成側の推論を持たないことにあります。成果物と判断の基準だけを渡せば、生成役の説明に引きずられずに微妙な問題を見つけられます。","量が減っても、生成役がどう考えたかを渡していることは同じです。要約は生成役の見方で書かれるので、かえってその前提を強めかねません。"],"explanation":"セルフレビューが微妙な問題を見逃すのは、生成時の推論を持ったまま見直すので、自分の判断を疑いにくいからです。呼び出しを分けても、生成役の会話や自己評価を渡せば、レビュー役は同じ推論を引き継ぐことになり、独立したレビューになりません。独立したインスタンスには、成果物（テストと対象のコード）と判断の基準だけを渡します。拡張思考や大きなモデルは、文脈の分離の代わりにはなりません。","ref":"試験ガイド タスク 4.6 ／ Claude Code Docs: Best practices for Claude Code"},{"id":"D4-14","domain":"D4","scenario":"S6","topic":"文書構造の例示","type":"single","question":"論文から `sample_size`（標本数）と `method`（研究方法）を抽出しています。指示はすでに詳しく書いてあります。独立した「方法」の節がある論文では正しく取れますが、方法の説明が本文の段落に埋め込まれた論文では、`sample_size` が null になる割合が18%あります。最も効果的な対応はどれですか。","options":["「方法の節がない論文では、本文全体から標本数を探すこと」という指示を、強調して追加する","方法の節がある論文と詳細が本文に埋め込まれた論文の両方で、どこから値を取ったかを示す抽出の例を加える","`sample_size` を null を許さない必須の項目にして、モデルが必ず値を入れるようにする","論文を節ごとに分け、「方法」という見出しの節だけを抽出の入力として渡すようにする"],"answer":[1],"notes":["指示はすでに詳しく、それでも結果がそろわない状況です。同じ種類の指示を足すだけでは、構造の違う文書の扱い方は伝わりにくいままです。","正解。few-shot の例で多様な文書構造の正しい扱いを示すと、必須の項目が空や null で抽出される問題に効きます。","本当に標本数が書かれていない論文でも値を入れさせることになり、捏造を招きます。埋め込まれた値を見つける力は上がりません。","方法の節がない論文では渡す部分がなくなり、かえって抽出できなくなります。問題の論文の構造に合っていません。"],"explanation":"詳細な指示だけでは結果が一貫しないとき、few-shot の例が最も効く手です。試験ガイドは、方法論の独立した節と本文に埋め込まれた詳細のような、多様な文書構造の正しい扱いを例で示すこと、形式の違う文書から正しく抽出する例を足して、必須の項目が空や null になる問題を直すことを挙げています。例は実際の入力に近く、構造のばらつきを覆うものを選びます。「探せ」と指示するより、「この構造ならここから取る」を見せるほうが伝わります。","ref":"試験ガイド タスク 4.2 ／ Claude Docs: Prompting best practices（Use examples effectively）"},{"id":"D4-15","domain":"D4","scenario":"S6","topic":"くだけた表現の例","type":"single","question":"料理のレシピカードから、材料ごとの分量と単位を抽出しています。「ひとつまみ」「大さじ山盛り1」「2リットル弱」のようなくだけた表現で、モデルが勝手にグラムへ換算した、根拠のない数値を出すことがあります。チームは「数値と単位がはっきり書かれたものだけを数値にし、くだけた表現は原文のまま残す」と方針を決めました。最も適切な対応はどれですか。","options":["単位の換算表をプロンプトに貼り、くだけた表現もすべてグラムかミリリットルに換算させる","抽出の後に正規表現で分量の値を検査し、規則に合わない値は捨てて空のまま下流に渡す","「推測しないこと」「正確に抽出すること」という指示を、システムプロンプトの冒頭に加える","くだけた表現の例を数個、数値にしたものと原文のまま残したものに分け、その理由と並べて示す"],"answer":[3],"notes":["決めた方針（くだけた表現は原文のまま）に反します。根拠のない換算値を、かえって増やしてしまいます。","誤った値を後から捨てるだけで、原因に届きません。原文のまま残すべき情報まで失います。","抽象的な指示では、どの表現を数値にし、どれを残すかの線引きが伝わりません。","正解。あいまいな場面に絞った例と、その扱いを選んだ理由を見せると、例にない表現にも同じ判断を広げられます。"],"explanation":"試験ガイドは、few-shot の例が抽出タスクでのハルシネーションを減らすのに効くこと（例：非公式な計量表現の処理）を挙げ、あいまいな場面に絞った少数の例で、もっともらしい別の扱いではなくその扱いを選んだ理由を示すよう求めています。理由の付いた例があると、モデルは例に一致させるだけでなく、新しい表現にも判断を一般化できます。なお、試験ガイドは2〜4個を目安とし、2026年11月時点のドキュメントは一般的な目安として3〜5個を挙げています。","ref":"試験ガイド タスク 4.2 ／ Claude Docs: Prompting best practices（Use examples effectively）"},{"id":"D4-16","domain":"D4","scenario":"S6","topic":"tool_choice の any","type":"single","question":"受信する文書は請求書・発注書・納品書のどれかですが、種類は事前に分かりません。種類ごとに `extract_invoice`、`extract_purchase_order`、`extract_delivery_note` を定義し、`tool_choice` は `auto` にしています。約5%の応答で、モデルがツールを呼ばずに「この文書は発注書のようです」と文章で答え、下流の取り込み処理が失敗します。試験ガイドの立場で、最も適切な設定はどれですか。","options":["`tool_choice` を `{\"type\": \"any\"}` にし、3つのうちどれかの抽出ツールを必ず呼ばせる","`tool_choice` で `extract_invoice` を名前で指定し、すべての文書を請求書として抽出させる","`tool_choice` は `auto` のまま、文章の応答から JSON らしい部分を取り出す後処理を加える","ツールの定義をやめ、システムプロンプトで「JSON だけを返すこと」と指示して応答を解析する"],"answer":[0],"notes":["正解。`any` では、モデルは必ずどれかのツールを呼び、どのツールかは文書に合わせて選べます。種類が分からない文書に向く設定です。","ツールを呼ぶことは保証されますが、発注書や納品書まで請求書のスキーマで抽出され、別の誤りを生みます。","文章の応答から JSON を拾うのは壊れやすい後処理です。ツールを呼ばない応答そのものは減りません。","ツール使用より信頼性の低いやり方に戻ることになり、構文の誤りや項目の抜けが起きやすくなります。"],"explanation":"`auto` ではモデルがツールを呼ばずにテキストを返すことがあり、`any` では必ずどれかのツールを呼び、強制的なツール選択では指名したツールを必ず呼びます。試験ガイドは、抽出スキーマが複数あって文書の種類が分からないときに、`tool_choice: \"any\"` で構造化出力を保証することを挙げています。なお、2026年11月時点のドキュメントでは、Claude Opus 5.5 など一部の新しいモデルで `any` と名前の指定が 400 エラーになり、代わりに `auto` と strict tool use（`strict: true`）、または structured outputs を使うよう案内されています。","ref":"試験ガイド タスク 4.3 ／ Claude Docs: Define tools（Forcing tool use）"},{"id":"D4-17","domain":"D4","scenario":"S6","topic":"書式の正規化ルール","type":"single","question":"日本と欧州の仕入先の請求書から、`total_amount` を数値の型で抽出しています。スキーマの検証はすべて通っていますが、ドイツの請求書の「1.234,50」が 1.2345 になったり 123450 になったりと、元の書式によって値の読み方がぶれています。抽出結果は、そのまま支払いの処理に使われます。最も適切な対応はどれですか。","options":["`total_amount` に最小値と最大値の制約を加え、桁違いの値をスキーマの検証で弾けるようにする","スキーマの検証で失敗した抽出に、どの項目がなぜ失敗したかを付けてリトライする仕組みを加える","スキーマはそのままに、通貨ごとの桁区切りと小数点の読み方を、正規化のルールとしてプロンプトに書く","同じ文書をもう一度抽出させて金額を読み直させ、2回の値が一致したものだけを支払いの処理に渡す"],"answer":[2],"notes":["範囲の中に収まる読み違いは弾けず、どう読むべきかという決まりもモデルに伝わりません。","値はどれもスキーマの検証を通っているので、リトライのきっかけになるエラーが出ません。読み方のぶれという原因にも届きません。","正解。厳密なスキーマは型と構造をそろえますが、元の書式をどう読むかは決めません。正規化のルールをプロンプトに書けば、書式の違う文書からも同じ基準で値をそろえられます。","同じ読み違いは2回とも起きうるので、一致しても正しいとは限りません。読み方の決まりがないという原因も残ります。"],"explanation":"ツール使用と厳密なスキーマは、出力の型と構造をそろえますが、元の文書の書式がばらばらなときに、それをどう読んで正規化するかまでは決めません。試験ガイドは、一貫しないソースの書式に対処するために、厳密な出力スキーマとあわせて形式の正規化ルールをプロンプトに含めることを挙げています。日付、金額、単位のように国や書き手によって表記が変わる項目は、スキーマで形を、プロンプトで読み方を決める、という分担で考えます。","ref":"試験ガイド タスク 4.3"},{"id":"D4-18","domain":"D4","scenario":"S6","topic":"null 許容の項目","type":"single","question":"契約書から `termination_notice_days`（解約の予告期間の日数）を抽出しています。スキーマでは、この項目を必須の整数にしています。法務のレビューで、予告期間の条項がない契約書でも、モデルが「30」と返している例が多数見つかりました。最も適切なスキーマの変更はどれですか。","options":["必須の整数のまま、項目の説明に「契約書に書かれていない値を推測しないこと」と加える","必須の整数のまま、条項がない契約書では 0 を入れるよう、プロンプトで決めておく","項目の型を自由記述の文字列に変え、予告期間についての契約書の記載を文章で返させる","項目を null を許す型にし、条項がない契約書では null を返すよう定める"],"answer":[3],"notes":["必須のままでは、何かの値を入れないとスキーマを満たせません。指示で抑えても、値を作り上げる圧力は残ります。","0日は「予告なしで解約できる」という意味にも読め、条項がないことと区別できません。下流で誤った解釈を招きます。","構造化が崩れ、下流で日数として扱えなくなります。値を作り上げる問題も解決していません。","正解。文書にない可能性がある項目を null 許容にすれば、必須を満たすための捏造を防げ、「書かれていない」ことも表せます。"],"explanation":"スキーマで必須にした項目は、元の文書に情報がなくても、モデルが何かの値で埋めようとします。試験ガイドは、ソース文書に情報が含まれていない可能性がある項目を任意（null 許容）にして、必須を満たすための捏造を防ぐことを挙げています。null と 0 のように「書かれていない」と「ゼロ」を区別できることも、下流のシステムにとって大切です。必須にするか任意にするかは、その情報が文書に必ずあるかどうかで決めます。","ref":"試験ガイド タスク 4.3"},{"id":"D4-19","domain":"D4","scenario":"S6","topic":"other と unclear","type":"multi","question":"顧客からの苦情メールを分類し、`category` を enum（`billing`、`delivery`、`quality`）で抽出しています。最近、アプリの不具合のような新しい種類の苦情が無理にどれかの値に入れられ、複数の読み方ができるメールでも1つの値に決め打ちされて、集計が歪んでいます。スキーマの設計としてとるべき対応はどれですか。（2つ選択）","options":["`category` を自由記述の文字列に変え、enum の制約をなくしてモデルに自由に名付けさせる","enum に `other` を加え、その内容を書く `category_detail` の文字列の項目を設ける","enum に `unclear` を加え、複数の読み方ができて1つに決められないメールではそれを選ばせる","`category` を任意の項目にし、どの値にも当てはまらないメールでは項目ごと省かせる","新しい種類の苦情が見つかるたびに enum の値を足し、そのつどスキーマを改訂して配布する"],"answer":[1,2],"notes":["値の表記がばらばらになり、集計できなくなります。一貫性を保ったまま広げるには、enum を残して受け皿を足します。","正解。`other` と詳細の文字列の組み合わせで、決めた分類を保ったまま新しい種類を拾い、後から分析できます。","正解。あいまいなケース用の値があれば無理な決め打ちを避けられ、人の確認に回す対象としても拾えます。","項目がないことが「新しい種類」なのか「判断できない」のか「抽出の失敗」なのか区別できず、分析に使えません。","次の改訂までは無理な分類が続き、まだ見つかっていない種類には備えられません。受け皿がない問題は残ります。"],"explanation":"enum は値をそろえて集計しやすくしますが、受け皿がないと、当てはまらない入力も既存の値に押し込まれます。試験ガイドは、拡張可能な分類のための `other`＋詳細の文字列のパターンと、あいまいなケース用の `unclear` などの値を enum に加えることを挙げています。分類の一貫性を保ちながら、「新しい種類」と「判断できない」をそれぞれはっきり表せるのが、この設計の利点です。","ref":"試験ガイド タスク 4.3"},{"id":"D4-20","domain":"D4","scenario":"S6","topic":"エラーを伝えるリトライ","type":"single","question":"抽出結果は、下流に渡す前に Pydantic のモデルで検証しています。`issue_date` が「2026年3月5日」のような形で返り、ISO 8601 の日付を求める検証で失敗することがあります。今は失敗すると同じリクエストをそのまま送り直していますが、3回送り直しても同じ形で返ることがあります。リトライの仕組みとして最も適切なものはどれですか。","options":["送り直しの上限を10回に増やし、正しい形が返るまで同じリクエストを繰り返す","送り直すリクエストに、元の文書、失敗した抽出結果、どの項目がなぜ検証に失敗したかを含める","検証に失敗した文書は送り直さず、すべて人間によるレビューの待ち行列に回して担当者に直させる","送り直すたびにより大きいモデルに切り替え、2回目以降は最も大きいモデルで抽出させる"],"answer":[1],"notes":["何が違ったかを伝えないまま繰り返しても、同じ出力が返りやすいままです。コストと時間だけが増えます。","正解。具体的な検証エラーを付けてリトライすると、モデルは何をどう直せばよいかが分かり、自分で修正できます。","書式の食い違いはリトライで直せる種類の誤りです。限られたレビューの人手を、自動で直せる誤りに使うことになります。","規模で解決しようとする手です。モデルが誤りの中身を知らないという原因は、そのまま残ります。"],"explanation":"試験ガイドは、エラーフィードバック付きリトライ、つまりリトライ時に具体的な検証エラーをプロンプトに加えてモデルを修正へ導くことを挙げ、元の文書、失敗した抽出結果、具体的な検証エラーを含むフォローアップのリクエストを求めています。書式の不一致や構造の誤りは、この方法で直る典型です。同じリクエストを繰り返すだけのリトライは、失敗の理由をモデルに伝えていない点で効き目が薄くなります。","ref":"試験ガイド タスク 4.4"},{"id":"D4-21","domain":"D4","scenario":"S6","topic":"リトライの限界","type":"single","question":"検証で失敗した抽出のログを分類すると、主に2種類ありました。1つは、`currency` に ISO 4217 のコード（`JPY`）ではなく「円」が入っているものです。もう1つは、発注書に「支払条件は基本契約書第5条による」とだけあり、基本契約書は入力に含まれていないため、`payment_terms` が埋まらないものです。リトライの方針として最も適切なものはどれですか。","options":["どちらも具体的な検証エラーを付けて最大3回までリトライし、それでも直らなければ人間によるレビューに回す","通貨はコード表をプロンプトに加えてリトライし、支払条件は「必ず値を入れること」と加えてリトライする","通貨はエラーを付けてリトライし、支払条件はリトライせず外部文書の参照として記録して人の確認に回す","どちらもリトライせず、検証に失敗した抽出はすべて人間によるレビューに回し、担当者が元の文書を見て直す"],"answer":[2],"notes":["支払条件は入力にない文書にしか情報がないため、何回リトライしても埋まりません。無駄な呼び出しが増えるだけです。","通貨の扱いは妥当ですが、支払条件に値を強いると、文書にない条件を作り上げる捏造を招きます。","正解。書式の不一致はリトライで直り、情報が入力にない場合はリトライが効きません。種類を見分けて扱いを変えます。","通貨のような書式の誤りは自動で直せるのに、限られたレビューの人手を使ってしまいます。"],"explanation":"試験ガイドは、リトライが効かない場合（例：提供されていない外部文書にしか情報が存在しない）と、効く場合（形式の不一致、構造的な出力エラー）を見極めることを求めています。情報がそもそも入力にないなら、何度頼んでも正しい値は出せず、捏造の危険だけが増えます。そうした項目は null にして外部文書を参照していると記録し、その文書を入力に加えるか、人の確認に回します。リトライの前に「その情報は入力の中にあるか」を問うのが判断の軸です。","ref":"試験ガイド タスク 4.4"},{"id":"D4-22","domain":"D4","scenario":"S6","topic":"合計の突き合わせ","type":"multi","question":"請求書の抽出結果は、スキーマの検証をすべて通っています。それでも経理部門から、明細の合計と請求総額が合わないデータがあると指摘されました。調べると、明細の一部を取りこぼした抽出の誤りと、請求書そのものの記載の誤りの両方が混ざっていました。この2つを見分けて処理できるようにするために、とるべき対応はどれですか。（2つ選択）","options":["書かれた総額を `stated_total`、明細を足した合計を `calculated_total` として並べて出させる","型の指定や必須の項目を増やしてスキーマの検証を厳しくし、合計の不一致を構文エラーとして弾く","総額と明細の合計が合わないときは、明細から計算した合計で総額を上書きし、そろった値を下流に渡す","請求書の記載そのものが食い違っているときに立てる `conflict_detected` の真偽値をスキーマに加える","総額だけを抽出するようにスキーマを変え、明細の抽出をやめて、合計の不一致そのものが起きないようにする"],"answer":[0,3],"notes":["正解。2つの合計を並べて出させれば、食い違いをプログラムで見つけられます。抽出の誤りなら、エラーを付けてリトライできます。","スキーマは構文や型の誤りを防げても、合計が合わないという意味の誤りは扱えません。","請求書の記載の誤りを、抽出の段階で黙って直してしまいます。元の書類の問題が経理に伝わりません。","正解。元の書類が矛盾しているという事実を明示できるため、リトライで直すべき抽出の誤りと区別して扱えます。","問題を見えなくするだけで、明細を必要とする下流の処理も成り立たなくなります。"],"explanation":"ツール使用による厳密なスキーマは構文の誤りをなくしますが、合計と一致しない明細や、誤った項目に入った値のような意味の誤りは防げません。試験ガイドは、自己修正のための検証の流れとして、`stated_total` とあわせて `calculated_total` を抽出して不一致を見つけること、整合しないソースデータに `conflict_detected` の真偽値を付けることを挙げています。食い違いを見つける材料と、原因が元の書類にあることを示す印をそろえると、「リトライで直す誤り」と「報告すべき矛盾」を分けて処理できます。","ref":"試験ガイド タスク 4.4"},{"id":"D4-23","domain":"D4","scenario":"S6","topic":"detected_pattern","type":"single","question":"抽出システムは、元の文書に疑わしい点（手書きの訂正、金額の書き換えの跡など）を見つけると「要確認」のフラグを付けて担当者に送ります。担当者はフラグの6割を「問題なし」として却下しており、どのような文書の特徴が無駄なフラグを生んでいるのかを分析したいと考えています。最も適切な対応はどれですか。","options":["各フラグに、きっかけの特徴を示す `detected_pattern` を持たせ、却下の結果と突き合わせて集計する","システムプロンプトに「確信度の高い疑いだけを報告すること」と加え、担当者に届くフラグの数を減らす","却下するときに担当者が自由記述で理由を書く欄を設け、月に一度まとめて読み返して傾向をつかむ","フラグの確信度のしきい値を一律に引き上げ、却下の割合が十分に下がるまで少しずつ調整を続ける"],"answer":[0],"notes":["正解。何がフラグを生んだかを構造化して残せば、却下されやすいパターンを体系的に分析し、そのパターンの基準を直せます。","「確信度の高いものだけ」という大まかな指示は精度を上げにくく、どの特徴が誤検知を生んでいるかも分かりません。","理由の記録にはなりますが、表記がそろわず集計しにくい方法です。フラグの側に原因のパターンが残らないので、結び付けにくいままです。","全体の数を減らすだけで、本物の疑いも一緒に落ちます。どのパターンが問題なのかは分からないままです。"],"explanation":"試験ガイドは、どの構造が指摘事項を引き起こしたかを `detected_pattern` の項目で追跡し、却下されたパターンを体系的に分析できるようにするフィードバックループを挙げています（ガイドの例はコードレビューの指摘）。指摘の側に原因のパターンを構造化して残すと、却下の結果と突き合わせて、誤検知の多いパターンだけを狙って基準を直せます。全体のしきい値や大まかな指示で数を減らすのは、原因を特定しないまま症状を抑える手です。","ref":"試験ガイド タスク 4.4"},{"id":"D4-24","domain":"D4","scenario":"S6","topic":"サンプルで事前に改良","type":"single","question":"過去5年分、約8万件の請求書を、新しいプロンプトとスキーマで、Message Batches API を使って抽出し直す計画です。新しいプロンプトは、まだ十数件でしか試していません。前回の同じような作業では、全件を流した後に約3割が検証で失敗し、原因を直して失敗分を出し直す作業を4回繰り返しました。急ぎの処理ではありません。最も適切な進め方はどれですか。","options":["全件をバッチで送り、失敗した分を `custom_id` で特定しては、直して出し直すことを繰り返す","失敗にすぐ気づいて直せるよう、8万件すべてをバッチではなく同期の API で1件ずつ処理する","文書の種類や仕入先が偏らないサンプルでプロンプトを磨き、検証の合格率を確かめてから全件を送る","1回目で成功する割合を上げるため、プロンプトは今のまま、全件をより大きいモデルでバッチに送る"],"answer":[2],"notes":["失敗の扱いとしては正しい手順ですが、失敗が多いまま全件を流すので、出し直しの回数と時間がかさみます。前回と同じことが起きやすい進め方です。","急がない処理で、バッチの50%の割引を捨てることになります。プロンプトの問題そのものも直りません。","正解。大量に流す前に、ばらつきを覆うサンプルでプロンプトを改良すれば、1回目の成功率が上がり、出し直しのコストを減らせます。","規模で解決しようとする手です。プロンプトやスキーマに原因がある失敗はモデルを大きくしても残り、費用だけが増えます。"],"explanation":"試験ガイドは、大量のバッチ処理を行う前にサンプルセットでプロンプトを改良し、初回の成功率を最大化して、反復的な再送信のコストを削減することを挙げています。バッチは1回の処理に最大24時間かかりうるため、全件を流してから直す進め方では、出し直しのたびに時間もかかります。サンプルは、文書の種類や書式のばらつきを覆うように選びます。それでも残った失敗は、`custom_id` で特定し、直したものだけを送り直します。","ref":"試験ガイド タスク 4.5 ／ Claude Docs: Batch processing"},{"id":"D5-01","domain":"D5","scenario":"S1","topic":"ケースの事実情報","type":"single","question":"長い会話では、古いやり取りを段階的に要約して文脈を保つ仕組みにしています。ところが40往復を超えた会話で、エージェントが「返金額は約1万円です」「お届けは先月の中ごろでした」と答える例がありました。実際の返金額12,480円や配送日、顧客が求めた「今週中の返金」という期待が、要約の中でぼやけていました。最も適切な対応はどれですか。","options":["要約の頻度を上げ、10往復ごとに会話全体をあらためて最初から要約し直すようにする","コンテキストウィンドウの大きいモデルに替え、要約をやめて会話の履歴をすべて持たせる","金額・日付・注文番号・状態・顧客の期待を「ケースの事実情報」ブロックにし、毎回入れる","要約を作るプロンプトに「数字と日付は省略せずにそのまま残すこと」という一文を加える"],"answer":[2],"notes":["要約を重ねるほど、細かな数値や日付はさらに丸められます。段階的な要約のリスクを強めてしまいます。","長い入力では中間部分の情報を見落とす「lost in the middle」効果があり、履歴を全部持たせても重要な事実が確実に使われるとは限りません。規模で解決しようとする手です。","正解。取引に関する事実を要約された履歴の外に置き、毎回のプロンプトに含めます。要約がどれだけ進んでも、正確な値が失われません。","要約に任せる限り、何をどこまで残すかはモデル次第です。顧客の期待のような事実は、指示があっても圧縮されがちです。"],"explanation":"段階的な要約には、数値、パーセンテージ、日付、顧客が述べた期待があいまいな要約に圧縮されるリスクがあります。試験ガイドは、金額、日付、注文番号、ステータスといった取引の事実を、要約された履歴の外に置く永続的な「ケースの事実情報」ブロックに抜き出し、各プロンプトに含めるスキルを挙げています。要約は会話の流れを保つために使い、正確さが要る事実は別の層で保持します。","ref":"試験ガイド タスク 5.1"},{"id":"D5-02","domain":"D5","scenario":"S1","topic":"ポリシーの空白","type":"single","question":"返品ポリシーには「配送完了から30日以内なら返品できる」とありますが、定期購入を途中で解約したときに残りの期間分を返金するかどうかは何も定めていません。この依頼に対し、エージェントは返品ポリシーを当てはめて日割りの返金を約束することもあれば、断ることもあります。最も適切な対応はどれですか。","options":["ポリシーが何も定めていない依頼であることをきっかけに、人間の担当者へエスカレーションさせる","いちばん近い返品ポリシーを類推で当てはめ、30日以内の分だけ日割りで返金するよう対応を統一する","ポリシーに書かれていない依頼は対応範囲外とみなし、すべてお断りするよう指示する","エージェントに確信度を自己申告させ、高いときは自分で判断し、低いときだけ人に引き継がせる"],"answer":[0],"notes":["正解。ポリシーの例外や空白は、複雑さとは別の、エスカレーションの適切なトリガーです。会社として決めていない約束を、エージェントが代わりに決めずに済みます。","決まっていない方針をエージェントが類推で作ることになります。対応はそろっても、会社が認めていない返金を約束するおそれがあります。","空白を一律の拒否で埋めるのは、もう一方の極端です。本来は認められるかもしれない依頼まで断り、顧客の不満を生みます。","自己申告の確信度は、実際のケースの複雑さを示す指標として当てになりません。誤った判断に自信を持つこともあります。"],"explanation":"試験ガイドは、エスカレーションの適切なトリガーとして、顧客による人間の担当者の要求、ポリシーの例外や空白、有意義な進展が得られない状況を挙げ、「複雑なケースだけではない」としています。顧客の具体的な要求についてポリシーが曖昧か、何も定めていないときは、エージェントが推測で方針を作らず、人に判断を委ねます。こうした基準は、例とともにシステムプロンプトに明示しておきます。","ref":"試験ガイド タスク 5.2"},{"id":"D5-03","domain":"D5","scenario":"S1","topic":"人間の担当者の要求","type":"multi","question":"次の2つのケースへの対応を見直しています。ケース1では、顧客が最初のメッセージで「人間の担当者につないでください」と書いています。用件は配送状況の確認で、エージェントでも解決できる内容です。ケース2では、顧客が「3回目の問い合わせです。いい加減にしてください」と怒っていますが、人間の担当者は求めておらず、用件は配送の遅れでエージェントの対応範囲内です。取るべき対応はどれですか。（2つ選択）","options":["ケース1は単純な用件なので、先に `lookup_order` で調べて解決策を示し、それでも望まれたら引き継ぐ","ケース2は否定的な感情が強いので、感情分析のスコアがしきい値を超えた時点で自動的に引き継ぐ","ケース2は怒りの強さが複雑なケースであることを示すので、調査せずにすぐ人間の担当者へ引き継ぐ","ケース1は、調査を始めずに、ただちに人間の担当者へ引き継ぐ","ケース2は不満を受け止めたうえで解決を申し出て、顧客が重ねて人を求めたときに引き継ぐ"],"answer":[3,4],"notes":["顧客の明示的な要求を後回しにしています。人間の担当者を求められたら、先に調査を試みずに応じます。","感情に基づくエスカレーションは、実際のケースの複雑さを示す指標として当てになりません。対応範囲内の用件まで人に回り、解決率が下がります。","怒りの強さと用件の複雑さは別のものです。エージェントで解決できる用件を、本人が求めていないのに引き継いでいます。","正解。顧客が人間の担当者を明示的に求めたら、用件が単純でも、調査を試みずにすぐ応じます。","正解。対応範囲内の用件では、不満を受け止めつつ解決を申し出ます。顧客が希望を重ねて伝えたときにだけ、エスカレーションします。"],"explanation":"試験ガイドは、顧客が明示的に人間の担当者を求めた場合にただちにエスカレーションすることと、問題が単純な場合に解決を申し出ることを区別しています。判断の軸は、顧客が何を求めたかと、用件が対応範囲内かどうかです。感情の強さは複雑さの指標にならないので、エスカレーションの条件にはしません。","ref":"試験ガイド タスク 5.2"},{"id":"D5-04","domain":"D5","scenario":"S1","topic":"複数の一致","type":"single","question":"顧客が名前と郵便番号を伝え、エージェントが `get_customer` で検索すると、3件の顧客が一致しました。いまのエージェントは、直近に注文がある顧客を本人とみなして、返金の話を進めています。最も適切な対応はどれですか。","options":["3件の顧客の名前と注文の一覧を示し、どれが自分のアカウントかを顧客に選んでもらう","推測で選ばず、メールアドレスや注文番号など、本人を特定できる情報を追加で尋ねる","直近の注文に加えて住所の一致度も点数にし、最も点数の高い顧客を本人として選ぶ","複数の顧客が一致したケースは本人確認の問題とみなし、すべて人間の担当者に引き継ぐ"],"answer":[1],"notes":["別の顧客の個人情報や注文の内容を、本人か分からない相手に見せることになります。本人確認にもなっていません。","正解。複数の一致が返ったときは、ヒューリスティックで選ばず、追加の識別情報を求めて確認します。エージェントのまま本人を特定できます。","手がかりを増やしても、推測で1人を選ぶことに変わりはありません。外れたときは、別人のアカウントで返金が進みます。","追加の情報を尋ねれば解決できるケースまで人に回り、初回対応での解決率が下がります。"],"explanation":"試験ガイドは、複数の顧客が一致した場合には、ヒューリスティックによる選択ではなく、追加の識別情報を求める確認が必要だとしています。金銭が動く手続きで本人を取り違えると、誤った返金や情報の漏えいにつながります。ツールの結果が複数の候補を返したら、推測で絞らず、1人に決まる情報を尋ねるようエージェントに指示します。","ref":"試験ガイド タスク 5.2"},{"id":"D5-05","domain":"D5","scenario":"S2","topic":"要約で消える事実","type":"single","question":"Claude Code で、API のレート制限の機能を数時間かけて実装しています。最初に会話で「1分あたり120リクエスト、バーストは20、超えたら `429` と `Retry-After` を返す、管理者のキーは対象外」と伝えました。自動のコンパクトが何度か起きたあと、Claude は「適切な上限」「一部のキーは除外」のようなあいまいな言い方をするようになり、管理者のキーも制限するコードを書きました。最も適切な対応はどれですか。","options":["数値と決定事項を事実の一覧としてプロジェクトの CLAUDE.md に書き、会話の外に置く","以前の会話のログを丸ごと貼り直し、最初に伝えた要件をもう一度読ませてから作業を続けさせる","「最初に伝えた数値と条件は忘れないこと」と Claude に伝え、以後の作業で十分に気をつけてもらう","自動のコンパクトが起きないよう、より大きいコンテキストウィンドウのモデルに替えて続ける"],"answer":[0],"notes":["正解。会話の要約では、数値や条件があいまいになります。プロジェクトのルートの CLAUDE.md は、コンパクトのあとにディスクから読み直されるので、事実が要約で崩れません。","長い履歴をそのまま足すとコンテキストをさらに使い、次のコンパクトでまた要約されます。大事な事実を要約の外に置く手当てになっていません。","頼むだけでは、要約で数値が失われる仕組みは変わりません。会話の中の指示は、次のコンパクトでまた要約されます。","規模で解決しようとしています。長いセッションでは、いずれ要約が起き、同じ問題が繰り返されます。"],"explanation":"長いやり取りを段階的に要約すると、数値、条件、例外のような具体的な事実が、あいまいな言い方に圧縮されがちです。こうした事実は、要約される履歴の外に構造化して置き、毎回のコンテキストに入るようにします。Claude Code では、プロジェクトのルートの CLAUDE.md がコンパクトのあとにディスクから読み直されるので、その置き場所に使えます。会話だけで伝えた指示は、コンパクトで失われうると考えておきます。","ref":"試験ガイド タスク 5.1 ／ Claude Code Docs: Memory（Instructions seem lost after /compact）／ Claude Code Docs: Context window"},{"id":"D5-06","domain":"D5","scenario":"S2","topic":"ツール出力を削る","type":"single","question":"Claude Code で、E2E テストの失敗を直しています。テストを実行するたびに、成功したテストの詳細やブラウザのデバッグ出力を含む長いログが返りますが、必要なのは失敗したテストの名前とエラーの数行だけです。何回か実行すると、コンテキストの大半がログで占められ、Claude は少し前に決めた修正の方針に触れなくなってきました。最も適切な対応はどれですか。","options":["ログを毎回ファイルに保存させ、次の修正に入る前に、そのファイルを Claude に全部読み直させる","「成功したテストのログは読み飛ばすこと」と Claude に伝え、同じコマンドのまま実行を続けさせる","テストを走らせる回数を減らし、修正をいくつもまとめてから、ときどきだけ実行して確かめるようにする","テストの出力を、失敗したテストとエラーの要点だけに絞ってから会話に入るよう、実行のしかたを変える"],"answer":[3],"notes":["ファイルを全部読ませれば、同じ量のログがやはり会話に入ります。置き場所を変えても、たまる量は減りません。","読み飛ばすよう頼んでも、ログはすでにコンテキストに入っていて、トークンを使い続けます。たまる前に削る手当てになっていません。","確かめる回数が減るだけで、1回ごとのログの量は変わりません。修正をまとめると、どの変更で何が壊れたかも分かりにくくなります。","正解。ツールの出力は、関係のある部分だけに削ってから会話に入れます。テストのレポーターの設定や、出力を絞り込むフックを使えば、ログがたまる前にコンテキストを守れます。"],"explanation":"ツールの結果は、関係の深さに見合わない量のトークンを使いながら、コンテキストにたまっていきます。必要なのが一部の行や項目だけなら、たまる前に、その部分だけに削ります。Claude Code では、テストのレポーターを失敗だけを出す設定にする、フックでコマンドの出力を絞り込む、といった方法があり、そのコマンドを CLAUDE.md に書いておけば、毎回同じ形で実行されます。2026年11月時点のドキュメントでは、テストの実行のような冗長な操作をサブエージェントに任せ、要約だけを受け取る方法も案内されています。","ref":"試験ガイド タスク 5.1 ／ Claude Code Docs: Manage costs（Reduce token usage）"},{"id":"D5-07","domain":"D5","scenario":"S2","topic":"/compact で減らす","type":"single","question":"Claude Code で、モノレポの認証の流れを2時間ほど調べています。序盤に広い検索や長いログを何度も読ませたため、`/context` で見ると、コンテキストの大半を、もう参照しない検索結果とログが占めています。ここまでの結論（トークンの検証は `AuthGateway` が行う、など）は数行にまとまっており、このまま同じ調査を続けたいと考えています。最も適切な対応はどれですか。","options":["`/clear` で会話を空にし、ここまでの結論を思い出しながら、認証の流れの調査を最初から進め直す","残したい結論と次に調べることを指示として添えて `/compact` を実行し、使用量を減らしてから続ける","「前に読んだ検索結果とログは、もう気にしなくてよい」と伝え、そのまま同じ会話で調査を続けさせる","より大きいコンテキストウィンドウのモデルに切り替え、検索結果とログも残したまま調査を続ける"],"answer":[1],"notes":["`/clear` は、関係のない別の作業に移るときの手です。同じ調査を続けるのに会話を空にすると、ここまでの結論や経緯まで失います。","正解。`/compact` は会話を要約して、コンテキストの使用量を減らします。残したいことを指示として添えれば、要約で何を残すかを自分で決められます。","伝えても、検索結果とログはコンテキストに残ったままで、毎回のリクエストで送られ続けます。使用量は減りません。","規模で解決しようとしています。もう参照しない出力を抱えたまま続けることになり、関係のない情報がたまる問題は残ります。"],"explanation":"長い探索のセッションで、冗長な調査の出力がコンテキストを埋めてきたら、`/compact` で会話を要約して使用量を減らします。`/compact` に指示を添えると、自動の要約に任せるのではなく、残す内容を自分で選べます。要約では細かい数値や条件があいまいになりうるので、崩したくない事実は、コンパクトのあとにディスクから読み直される CLAUDE.md などに書いておきます。関係のない作業に移るなら `/clear`、同じ作業を続けるなら `/compact`、と使い分けます。","ref":"試験ガイド タスク 5.4 ／ Claude Code Docs: Context window（What survives compaction、When your context fills up）／ Claude Code Docs: Commands"},{"id":"D5-08","domain":"D5","scenario":"S2","topic":"フェーズ間の引き継ぎ","type":"single","question":"大規模なコードベースにテストを追加する作業を、2つのフェーズに分けています。第1フェーズでは、サブエージェントたちが各モジュールの依存関係を調べ、メインのエージェントがその報告を受け取りました。第2フェーズで、テストの不足を調べるサブエージェントを起動したところ、どれも依存関係を最初から調べ直し、時間とトークンを使っています。最も適切な対応はどれですか。","options":["第2フェーズのサブエージェントに、第1フェーズのサブエージェントの作業記録をそのまま全部渡す","サブエージェントを使うのをやめ、第2フェーズの調査はメインのエージェントが自分の会話の中で行う","第1フェーズの主な発見を要約し、第2フェーズのサブエージェントの最初のプロンプトに入れる","第2フェーズのサブエージェントに「第1フェーズの結果は共有されているので参照すること」と指示する"],"answer":[2],"notes":["作業記録には冗長な探索の出力が多く含まれ、サブエージェントのコンテキストを圧迫します。必要なのは要点です。","冗長な調査の出力がメインの会話にたまり、全体を調整するためのコンテキストが失われます。","正解。前のフェーズの要点を要約して、次のフェーズの初期コンテキストに入れます。調べ直しを防ぎつつ、サブエージェントの文脈を小さく保てます。","通常のサブエージェントは、ほかのサブエージェントの作業やメインの会話の内容を、自動では受け取りません。渡していない情報は参照できません。"],"explanation":"サブエージェントは分離されたコンテキストで動き、前のフェーズの発見を自動では引き継ぎません。次のフェーズのサブエージェントを起動する前に、前のフェーズの主な発見を要約し、その要約を初期コンテキストとして渡します。作業記録を全部渡すと冗長になり、何も渡さなければ調べ直しが起きます。なお、2026年11月時点の Claude Code には会話を丸ごと引き継ぐフォークのサブエージェントもありますが、通常のサブエージェントは引き継ぎません。","ref":"試験ガイド タスク 5.4 ／ Claude Code Docs: Subagents"},{"id":"D5-09","domain":"D5","scenario":"S3","topic":"エラーの文脈を返す","type":"single","question":"文書分析サブエージェントは、処理に失敗すると、原因にかかわらず「分析できませんでした」とだけ返します。12本の文書のうち3本のファイルが破損していて開けなかったときも同じ返事だったため、コーディネーターは9本の分析が済んでいたことも分からないまま、12本すべての分析を同じ指示でやり直させ、同じ失敗を繰り返しました。最も適切な対応はどれですか。","options":["失敗の種類、試した処理、済んだ9本の結果、別の版を探すなどの代替案を構造化して返す","失敗した3本を除いた9本の分析を、全件の分析が完了した結果として返すようにする","コーディネーターのプロンプトに、失敗の報告を受けたら別の方法を考えてから再委任するよう書く","失敗の詳細をログファイルに書き出し、運用担当者があとで原因を確かめられるようにする"],"answer":[0],"notes":["正解。失敗の種類、試した内容、部分的な結果、考えられる代替案を返せば、コーディネーターは済んだ9本を生かし、破損した3本だけを別の手段で取りに行く、と判断できます。","エラーを黙って握りつぶす手です。3本が抜けていることが、コーディネーターにもレポートの読者にも伝わりません。","汎用の「分析できませんでした」には判断の材料がないので、別の方法を考えるよう指示しても、何が失敗し何が済んだのかは分かりません。","あとで人が原因を調べるのには役立ちますが、実行中のコーディネーターには何も伝わらず、同じやり直しが続きます。"],"explanation":"「分析できませんでした」のような汎用的なエラーステータスは、何が失敗し、何が済んでいるかをコーディネーターから隠します。サブエージェントは、失敗の種類、試した内容、部分的な結果、考えられる代替案を構造化して返し、コーディネーターがリトライ、別の手段、部分的な結果での続行のどれを選ぶかを判断できるようにします。成功したように見せかける握りつぶしも、ログに残すだけで実行中の判断に使わないのも、復旧の材料を渡していない点で同じです。","ref":"試験ガイド タスク 5.3"},{"id":"D5-10","domain":"D5","scenario":"S3","topic":"部分的な失敗の扱い","type":"multi","question":"6つのサブトピックのうち2つは、契約していない有料データベースにしか資料がなく、検索サブエージェントは権限エラーで取得できません。ほかのサブトピックでも、ときどき一時的なタイムアウトが起きます。チームは、1つの失敗で調査全体を止めず、読者がどこまで裏付けがあるかを分かるレポートにしたいと考えています。取るべき対応はどれですか。（2つ選択）","options":["権限エラーが起きた時点で調査全体を中止し、データベースの契約が済むまで待つようユーザーに伝える","タイムアウトが起きるたびに、サブエージェントから直ちにコーディネーターへそのまま伝え、リトライの判断を任せる","一時的なタイムアウトはサブエージェント内でリトライし、解決できない失敗だけを、試した内容と部分的な結果とともに伝える","統合の出力に、十分に裏付けられた指摘事項と、情報源が得られず不足している領域を示すカバレッジの注記を付ける","取得できなかった2つのサブトピックは最初から対象外だったものとして扱い、残りの4つで一貫した構成にまとめる"],"answer":[2,3],"notes":["1つの失敗でワークフロー全体を終了させるアンチパターンです。残りの4つは調べられるのに、成果がゼロになります。","一時的な失敗まですべて上げると、コーディネーターの負担と往復が増えます。ローカルで直せるものはサブエージェント内で直します。","正解。一時的な障害はローカルで復旧し、解決できないエラーだけを、試した内容と部分的な結果を含めて伝播させます。","正解。どの指摘事項が十分に裏付けられ、どのテーマに情報源がなく不足があるかを注記すれば、全体を止めずに欠落を正直に伝えられます。","欠落を握りつぶすアンチパターンです。読者は2つのテーマが調べられていないことを知らないまま結論を読みます。"],"explanation":"マルチエージェントのエラー伝播では、黙って握りつぶすことも、1つの失敗で全体を止めることも避けます。サブエージェントは一時的な障害を自分でリトライして直し、直らないもの（ここでは権限エラー）だけを、試した内容と部分的な結果を付けてコーディネーターに伝えます。最終の出力では、カバレッジの注記で裏付けの強さと欠落を示します。Anthropic のリサーチシステムの記事も、ツールが失敗していることをエージェントに知らせて適応させるやり方がよく効くと述べています。","ref":"試験ガイド タスク 5.3 ／ Anthropic Engineering: How we built our multi-agent research system"},{"id":"D5-11","domain":"D5","scenario":"S3","topic":"確立と異論の区別","type":"single","question":"「リモートワークが生産性に与える影響」のレポートで、統合サブエージェントは、大規模な追跡調査2件が支持する知見と、小規模な研究1件だけが示す知見を、どちらも「〜であることが分かっている」という同じ書き方で並べていました。後者は、元の論文の著者自身が「予備的な結果」と書いており、別の研究では逆の結果も報告されています。最も適切な対応はどれですか。","options":["裏付けとなる研究が複数ある知見だけをレポートに残し、1件の研究しかない知見は載せないようにする","確立した知見と異論のある知見を節で分け、元の情報源での位置付けと研究の方法を添えて書かせる","各知見にモデル自身が0〜100の確信度を付け、数値の高い順に並べて読者が判断できるようにする","レポートの末尾に「研究によって結論が異なる場合があります」という一般的な注意書きを加える"],"answer":[1],"notes":["両極端の手です。予備的でも読者に役立つ知見を捨ててしまいます。研究の数だけで確からしさを決めることにもなります。","正解。十分に確立した知見と異論のある知見を節で分け、元の情報源での位置付け（「予備的な結果」など）と方法論上の文脈を保てば、読者は裏付けの強さを正しく読み取れます。","モデルの自己申告の確信度は、裏付けの強さの目安として当てになりません。元の論文が「予備的」と書いたという事実も伝わりません。","どの知見が確立していて、どれに異論があるのかが分からないままです。一般的な注意書きでは、本文の断定的な書き方は直りません。"],"explanation":"複数の情報源をまとめるときは、十分に確立した発見事項と異論のある発見事項を明示的な節で分け、元の情報源での特徴付け（「予備的な結果」など）と方法論上の文脈（研究の規模や設計）を保ちます。統合の段階で同じ断定の書き方にそろえると、裏付けの強さの違いが読者から見えなくなります。知見を捨てる、自己申告の確信度で並べる、一般的な注意書きで済ませる、といった手は、どれもその違いを正確に伝えません。","ref":"試験ガイド タスク 5.6"},{"id":"D5-12","domain":"D5","scenario":"S4","topic":"長い探索での劣化","type":"multi","question":"エンジニアが、支援エージェントと3時間にわたって、レガシーな在庫システムを調べています。序盤に `StockLedger` クラスが二重計上の原因だと特定していましたが、最近の回答では「この種のシステムでは一般に〜」と典型的なパターンを述べるだけで、特定済みのクラス名が出てこなくなりました。調査はまだ続きます。取るべき対応はどれですか。（2つ選択）","options":["より大きなコンテキストウィンドウを持つモデルに切り替え、会話の履歴をすべて保てるようにする","回答のたびに「これまでの発見と矛盾しないように」と指示し、一貫性を意識させるようにする","主要な発見を記録するスクラッチパッドファイルをエージェントに保たせ、以降はそれを参照させる","会話の最初から調査をやり直し、序盤に特定したことをもう一度たどって確かめさせるようにする","個別の問い（引き当ての依存関係をたどる、など）はサブエージェントに調べさせ、要約だけを返させる"],"answer":[2,4],"notes":["規模で解決しようとする手です。コンテキストを広げても、冗長な探索の出力で埋まった会話の中で発見が埋もれる問題は残ります。","モデルに頼んで済ませる手です。序盤の発見がコンテキストの中で薄れていることが原因なので、指示だけでは戻りません。","正解。スクラッチパッドファイルに主要な発見を書き出しておけば、コンテキストの境界を越えて保たれ、以降の質問で参照できます。","3時間分の調査を捨てて同じことを繰り返します。時間がかかるうえ、長く続ければ同じ劣化がまた起きます。","正解。冗長な探索をサブエージェントに分離すると、メインのエージェントは高いレベルの理解を保ったまま調整役に専念できます。"],"explanation":"長い探索のセッションでは、コンテキストの劣化が起きます。回答が一貫しなくなり、以前に見つけた具体的なクラスではなく「典型的なパターン」を語りはじめるのがその兆しです。対策は、主要な発見をスクラッチパッドファイルに書き出して参照させること、個別の問いの冗長な探索をサブエージェントに任せることです。冗長な出力でコンテキストが埋まったときは、`/compact` で使用量を減らす手もあります。","ref":"試験ガイド タスク 5.4 ／ Claude Code Docs: Best practices、Create custom subagents"},{"id":"D5-13","domain":"D5","scenario":"S6","topic":"上流は構造化して返す","type":"single","question":"数百ページの契約書を章ごとに抽出サブエージェントに渡し、まとめ役のエージェントが各章の結果を統合してリスクの評価を作っています。各サブエージェントは、条項の原文の長い引用と、どう判断したかの過程を文章で返しており、まとめ役のコンテキストの大半がそれで埋まっています。最近は、後半の章の結果が入りきらずに切り捨てられる例が出ています。最も適切な対応はどれですか。","options":["まとめ役を、より長いコンテキストを扱えるモデルに替え、各章の結果を省かずにすべて入力に入れる","サブエージェントに、条項の種類・要点・該当箇所・短い引用・重要度を構造化データとして返させる","各章の結果を、まとめ役に渡す前に別の呼び出しで数行の文章に要約させ、その要約だけを入れる","各章の結果を同じ文字数で一律に切り詰め、すべての章の結果がまとめ役の入力に収まるようにする"],"answer":[1],"notes":["規模で解決しようとする手です。冗長な文章でコンテキストを埋めるという原因は残り、長い入力の中で重要な条項が埋もれやすいままです。","正解。下流のコンテキストが限られるときは、冗長な文章や推論の過程ではなく、要点・引用・重要度などの構造化データを返させます。統合に要る情報を少ない量で渡せます。","文章に要約すると、金額や日付、該当箇所のような細部があいまいになりがちで、統合に要る情報が失われるおそれがあります。","一律に切り詰めると、重要な条項が各章の後ろのほうにあれば落ちます。何を残すかを、中身ではなく長さで決めています。"],"explanation":"試験ガイドは、下流のエージェントのコンテキスト予算が限られている場合に、冗長なコンテンツや推論チェーンではなく、構造化データ（主要な事実、引用、関連性スコア）を返すように上流のエージェントを変えることを挙げています。上流が何をどの形で返すかを決めれば、下流は少ない量で必要な情報だけを受け取れます。段階的な要約や機械的な切り詰めは、量は減らせても、数値や出典のような統合に要る細部を落とします。モデルやコンテキストを大きくする前に、渡すものの中身と形を見直します。","ref":"試験ガイド タスク 5.1"},{"id":"D5-14","domain":"D5","scenario":"S6","topic":"区分ごとの精度","type":"single","question":"抽出システムの精度は、直近3か月の検証で全体97%でした。チームは「目標の95%を超えたので、人間によるレビューをやめて全件を自動で下流に流そう」と提案しています。検証の結果は全件をまとめて集計しただけで、内訳は見ていません。最初に行うべきことはどれですか。","options":["全体の精度が目標を上回っているので、提案どおり人間によるレビューをやめて全件を自動化する","モデルが自己申告する確信度が高い抽出だけを自動化し、それ以外はこれまでどおりレビューする","文書の種類と項目ごとに精度を集計し、どの区分でも安定して目標を満たしているかを確かめる","全体の精度をさらに上げるため、より大きいモデルに替えてから、あらためて全体の精度を測る"],"answer":[2],"notes":["全体の97%は、特定の文書の種類や項目での低い精度を覆い隠すことがあります。内訳を見ないまま自動化するのは危険です。","キャリブレーションされていない自己申告の確信度は、当てにならない目安です。区分ごとの精度も確かめていません。","正解。人間によるレビューを減らす前に、文書の種類と項目の区分ごとに精度を分析し、一貫した性能を確認します。","全体の数字を追うだけで、弱い区分があるかどうかという問いに答えていません。"],"explanation":"試験ガイドは、集計された精度（例：全体で97%）が、特定の文書の種類やフィールドでの低い性能を覆い隠すリスクを挙げ、人間によるレビューを減らす前に、文書の種類およびフィールドごとに精度を分析して、すべての区分で一貫した性能を確認するよう求めています。件数の多い区分が全体の数字を押し上げ、件数の少ない区分の誤りが埋もれるからです。自動化の判断は、全体の平均ではなく、最も弱い区分を見て下します。","ref":"試験ガイド タスク 5.5"},{"id":"D5-15","domain":"D5","scenario":"S6","topic":"レビューの振り分け","type":"multi","question":"抽出は1日に約5,000件ありますが、レビュー担当者が確認できるのは1日300件までです。どの抽出を人間によるレビューに回すかを設計しています。限られた人手を最も効果的に使うために、とるべき対応はどれですか。（2つ選択）","options":["その日に処理した順に先頭から300件をレビューし、残りの抽出は確認せずに自動で下流に流す","モデルが出す確信度をそのまま使い、0.9 を下回った抽出だけをレビューに回すと決めて運用を始める","モデルに項目ごとの確信度を出させ、ラベル付きの検証セットで決めたしきい値を下回る抽出をレビューに回す","抽出結果の記述が長く詳しいものほど正確とみなし、記述の短い抽出を優先してレビューに回す","元の文書の記載があいまいだったり矛盾していたりする抽出を、優先してレビューに回す"],"answer":[2,4],"notes":["処理の順番は誤りの起きやすさと関係がありません。誤りの多い抽出にレビューの人手が向かいません。","キャリブレーションしていない確信度の値は当てになりません。0.9 という線が誤りの多さと対応している根拠がありません。","正解。ラベル付きの検証セットでしきい値をキャリブレーションすると、確信度を振り分けの目安として使えるようになります。","記述の長さや流ちょうさは、抽出の正しさの目安になりません。","正解。元の文書があいまい・矛盾している抽出は誤りが起きやすく、人の判断が要るので、優先して回す価値があります。"],"explanation":"試験ガイドは、モデルにフィールドレベルの確信度スコアを出力させ、ラベル付き検証セットでレビューのしきい値をキャリブレーションすること、確信度の低い抽出やソース文書が曖昧または矛盾している抽出を人間によるレビューに回して、限られたレビュー担当者のキャパシティに優先順位を付けることを挙げています。確信度は、正解の分かっているデータで「この値ならどれだけ当たるか」を確かめて初めて、振り分けの目安になります。処理の順番や文章の長さは、誤りの起きやすさと関係のない目安です。","ref":"試験ガイド タスク 5.5"},{"id":"D5-16","domain":"D5","scenario":"S6","topic":"層化無作為抽出","type":"single","question":"確信度が高いと判定された抽出は、人が確認せずに下流の会計システムへ流しています。半年後、ある取引先が請求書の書式を変えたことで誤りが増えていたことが、顧客からの問い合わせで初めて分かりました。確信度の高い抽出の誤りを継続して測り、新しい誤りのパターンを早く見つけるための対応として、最も適切なものはどれですか。","options":["確信度のしきい値を引き上げて、人が確認せずに下流へ流す抽出の件数そのものを減らす","問い合わせのあった取引先の請求書だけを、今後はすべて人がレビューしてから流すようにする","下流に流す前に、同じモデルに自分の抽出結果をもう一度見直させて、誤りがあれば直させる","確信度の高い抽出から、文書の種類や取引先の区分ごとに無作為に抜き、定期的に人が確かめる"],"answer":[3],"notes":["自動化を減らすだけで、確信度の高い抽出の誤り率は測れません。新しいパターンを見つける仕組みにもなりません。","すでに分かった1社への後追いです。ほかの取引先で起きる新しいパターンは見つけられません。","同じモデルによるセルフレビューは自分の判断を疑いにくく、確信度の高い誤りほど見逃しがちです。誤り率の測定にもなりません。","正解。層化無作為抽出で、確信度の高い抽出の誤り率を区分ごとに測り続け、新しい誤りのパターンを早く見つけられます。"],"explanation":"確信度の高い抽出をまったく見ないと、書式の変更などで生まれた新しい誤りに気づけません。試験ガイドは、確信度の高い抽出に層化無作為抽出をかけて、継続的にエラー率を測定し、新しいパターンを検出することを挙げています。区分ごとに抜き出すのは、件数の少ない文書の種類や取引先の誤りも、標本に確実に入るようにするためです。自動化した後も、測り続ける仕組みを残しておくことが信頼性を支えます。","ref":"試験ガイド タスク 5.5"},{"id":"D5-17","domain":"D5","scenario":"S6","topic":"数値の出所の保持","type":"single","question":"年次報告書、決算短信、プレスリリースなど複数の文書から企業の財務数値を抽出し、まとめ役のエージェントが1つの要約にして分析システムへ渡しています。監査の担当者から、要約の各数値がどの文書のどこから取られたのかを追えない、と指摘されました。最も適切な対応はどれですか。","options":["抽出の段階で数値ごとに文書名・ページ・抜粋を出させ、まとめ役にもその対応を保って統合させる","要約の末尾に、参照したすべての文書の名前と公表日を一覧にした「参考資料」の節を付け加える","要約を作った後で、別の呼び出しでモデルに各数値の出典を思い出させ、要約に書き加えさせる","監査の担当者には、要約とあわせて元の文書一式を渡し、必要に応じて数値を照合してもらう"],"answer":[0],"notes":["正解。主張と情報源の対応付けを抽出の段階から構造化して持たせ、統合の段階でも落とさないことで、各数値の出所を追えます。","文書の一覧だけでは、どの数値がどの文書から来たかが分かりません。値ごとの帰属は失われたままです。","元の文書との対応を失った後で出典を推測させることになり、誤った出典を付けるおそれがあります。","追跡の作業を人に押し付けるだけで、要約の段階で出所が失われる原因は直りません。"],"explanation":"主張と情報源の対応付けを保持せずに発見事項を圧縮すると、要約のステップで情報源の帰属が失われます。試験ガイドは、上流の担当に構造化された主張と情報源の対応付け（情報源の URL、文書名、関連する抜粋）を出力させ、下流のエージェントが統合を通じてそれを保持することを挙げています。出所の情報は後から付け足すものではなく、値と一緒に最初から運ぶものとして設計します。","ref":"試験ガイド タスク 5.6"},{"id":"D5-18","domain":"D5","scenario":"S6","topic":"食い違う値の注記","type":"single","question":"同じ企業の2025年度の売上高として、統合報告書からは1,240億円、決算説明会の資料からは1,180億円が抽出されました。対象の期間は同じで、どちらの文書にも訂正の記載はなく、どちらが正しいかは文書からは判断できません。抽出エージェントは今、こうした食い違いを見つけるとその文書の処理を止めてエラーを返すため、ほかの数値も下流に届きません。整合の方針は、統合の前にコーディネーターが決める運用です。最も適切な対応はどれですか。","options":["処理は止めずに、2つの値の平均をとって1つの値にまとめ、ほかの項目と一緒にコーディネーターに渡す","処理は止めずに、統合報告書のように信頼度が高いと決めた種類の文書の値を採用し、もう一方は捨てる","処理は止めずに、食い違った売上高の項目だけを空にして、ほかの項目と一緒にコーディネーターに渡す","処理は止めずに、2つの値を出典付きで両方残して食い違いを注記し、文書の残りの抽出も終えて渡す"],"answer":[3],"notes":["どの文書にも書かれていない値を作ることになります。食い違いがあったという事実も、コーディネーターに伝わりません。","信頼できる情報源どうしでも値は食い違いえます。一方を機械的に選ぶと、コーディネーターが決めるはずの整合の判断を先取りしてしまいます。","食い違いを黙って消す、握りつぶしの手です。コーディネーターは、整合を判断すべき項目があったことを知れません。","正解。矛盾する値を出典付きで残して注記したまま分析を終えれば、ほかの数値も届き、整合の方針はコーディネーターが判断できます。"],"explanation":"試験ガイドは、信頼できる情報源の間で統計が矛盾するときに、一方の値を恣意的に選ぶのではなく、情報源の帰属を付けて矛盾に注記すること、矛盾する値を含めて明示的に注記したうえで文書の分析を完了し、どう整合させるかは統合に渡す前にコーディネーターに判断させることを挙げています。1つの食い違いで文書全体の処理を止めるのも、値を選ぶ・平均する・消すのも、判断の材料を失わせる点で劣ります。抽出の段階では、「決める」より「残して印を付ける」が基本です。","ref":"試験ガイド タスク 5.6"}];
