ema`（JSON Schema）で定義します。他社の API 向けの `parameters` や、`function` で包んだ形をそのまま渡すと、Claude のツール定義の形式と合いません。スキーマどおりの入力を保証したい場合は、ツール定義に `strict: true` を加えます。","ref":"Anthropic Docs: Tool use"},{"id":"D8-02","domain":"D8","skill":"8.1","topic":"ツール説明と結果","type":"multi","question":"社内向けエージェントに `search_tickets` ツールを提供したところ、Claude が適切な場面で使わなかったり、結果を読み違えたりします。現在のツール説明は「チケットを検索」の一言だけで、結果は社内 API の生 JSON（内部 UUID を含む数百項目）をそのまま返しています。改善策として適切なものはどれですか。（2つ選択）","options":["トークン節約のため、ツール説明はさらに短くし、ツール名だけで意味が伝わるようにする","どんな情報でも使えるよう、社内 API の生 JSON に加えてデバッグ情報も結果に含める","用途、使う場面と使わない場面、各パラメータの意味と形式を説明文に具体的に書く","ツール名を `tool_a` のような汎用的な名前に変え、名前からの先入観をなくす","結果は判断に必要な項目に絞って人が読める名前を含め、多い場合はページングや切り詰めをする"],"answer":[2,4],"notes":["説明文はツール選択の最重要情報です。短すぎる説明は誤用の主な原因になります。","関係のない情報を増やすとトークンを浪費し、重要な情報が埋もれます。","正解。新しく入ったチームメンバーに説明するように、用途・使い分け・パラメータ・制約を具体的に書くのが効果的です。","意味のない名前はツール選択を難しくします。用途が分かる名前や、接頭辞による名前空間化が推奨されます。","正解。シグナルの高い情報に絞った、トークン効率の良い結果を返すとエージェントの精度が上がります。"],"explanation":"ツール説明はプロンプトの一部としてモデルの行動を左右します。何をするか、いつ使うか、パラメータの意味、注意点を具体的に書きます。ツール結果は、意味の分からない内部 ID の羅列よりも、名前など自然な識別子を含む高シグナルな情報に絞り、ページングや切り詰めでトークンを節約します。","ref":"Anthropic: Writing effective tools for agents"},{"id":"D8-03","domain":"D8","skill":"8.1","topic":"並列ツール使用","type":"single","question":"天気アプリで、Claude が1つの応答の中で東京・大阪・札幌の3都市について `get_weather` を同時に呼び出しました（`tool_use` ブロックが3つ）。3つの結果を返す方法として最も適切なものはどれですか。","options":["1つの user メッセージに3つの `tool_result` ブロックを入れ、補足テキストを付けるならその後ろに置く","都市ごとに user メッセージを分け、3つの連続したメッセージで1件ずつ `tool_result` を返す","1つの user メッセージの先頭に説明テキストを置き、その後に3つの `tool_result` ブロックを並べる","3都市の結果を1つの文字列に連結し、最初の `tool_use_id` に対応する `tool_result` 1件だけで返す"],"answer":[0],"notes":["正解。並列呼び出しの結果はすべて1つの user メッセージで返し、`tool_result` ブロックを先頭に置きます。","メッセージを分けると、Claude がその後の並列呼び出しを控えるようになる原因になります。","`tool_result` ブロックは content 配列の先頭に置く必要があり、テキストを前に置くとエラーになります。","すべての `tool_use` に対応する `tool_result` が必要です。結果のない呼び出しを残すとエラーになります。"],"explanation":"Claude は1つの応答で複数の `tool_use` ブロックを返すことがあります（並列ツール使用）。結果は、それぞれの `tool_use_id` に対応する `tool_result` ブロックを1つの user メッセージにまとめて返します。`tool_result` ブロックは content 配列の先頭に置き、テキストはその後ろに置きます。","ref":"Anthropic Docs: Parallel tool use"},{"id":"D8-04","domain":"D8","skill":"8.1","topic":"ツールエラー","type":"single","question":"在庫照会エージェントのツールが、外部の在庫 API のタイムアウトで失敗することがあります。現在は例外がそのまま送出され、エージェントループ全体が異常終了しています。最も適切な対処はどれですか。","options":["失敗したツール呼び出しには `tool_result` を返さず、そのまま次のリクエストを送ってモデルに再判断させる","`is_error: true` を付けた `tool_result` で、失敗の内容と次に取れる行動を具体的に返す","ループを止めないよう `is_error` は付けず、成功時と同じ形式で空の在庫リストを `tool_result` に入れて返す","タイムアウトの例外をハーネスで捕まえ、ユーザーに「システムエラー」と表示して会話を終了する"],"answer":[1],"notes":["`tool_use` に対応する `tool_result` がないとリクエストはエラーになります。失敗した呼び出しにも結果を返す必要があります。","正解。失敗の内容と次の行動（時間をおいて再試行する、条件を絞り込むなど）を伝えれば、回復の方法を Claude が判断できます。","空の成功結果を返すと、モデルは在庫ゼロなどと誤解し、誤った回答につながります。","回復できる一時的なエラーで会話を終えると、ユーザー体験が不必要に悪化します。"],"explanation":"ツールの実行に失敗した場合も、対応する `tool_result` を `is_error: true` 付きで返します。エラーメッセージを「何が起きたか」と「どうすればよいか」が分かる具体的な内容にすると、Claude が自分で回復しやすくなります。不透明なエラーコードやスタックトレースだけを返すのは避けます。","ref":"Anthropic Docs: Tool use"},{"id":"D8-05","domain":"D8","skill":"8.2","topic":"MCP のエラー報告","type":"single","question":"社内の在庫システムを操作する MCP サーバーを作っています。`reserve_item` ツールの実行中に、在庫システムの API が「在庫不足（残り 2 個）」を返すことがあります。Claude がこの状況を理解し、数量を減らして再試行したりユーザーに確認したりできるようにしたいと考えています。この失敗の返し方として最も適切なのはどれですか。","options":["JSON-RPC の `error` オブジェクト（内部エラーのコード）を返し、ツール呼び出しそのものをプロトコルエラーにする","ツールの結果に `isError: true` を付け、「在庫不足：残り 2 個」と次に取れる行動を書いて返す","`isError` は付けずに成功として空の `content` を返し、エラーの詳細はサーバー側のログにだけ記録する","在庫不足を検知したら MCP サーバーのプロセスを終了させ、クライアントに再接続とやり直しを促す"],"answer":[1],"notes":["JSON-RPC のエラーは未知のツールや不正なリクエストなどプロトコル上の問題のためのもので、業務上の失敗を伝える手段には向きません。","正解。MCP ではツール実行時のエラーを結果の中で `isError: true` として返します。「数量を 2 以下にすれば予約できます」のように具体的に書けば、Claude が対処を判断できます。","成功扱いの空の結果では、Claude は失敗に気づけず、誤った前提で作業を続けるおそれがあります。","1回の業務エラーでサーバーを落とすと、ほかのツールも使えなくなります。"],"explanation":"MCP のツールのエラー報告には2種類あります。未知のツール名や不正なリクエストなどのプロトコルエラーは JSON-RPC のエラーで返し、外部 API の失敗や業務ルール違反などのツール実行エラーは、結果に `isError: true` を付けて返します。後者はモデルから見えるので、原因と次に取れる行動を具体的に書くと、Claude が自分で修正したりユーザーに確認したりできます。","ref":"Model Context Protocol 仕様: Tools（Error Handling）"},{"id":"D8-06","domain":"D8","skill":"8.1","topic":"クライアントツール","type":"single","question":"開発者が、Claude にファイル編集とシェルコマンド実行をさせるため、Anthropic 定義の bash ツールとテキストエディタツールを使おうとしています。これらのツールに関する説明として最も適切なものはどれですか。","options":["Anthropic のサーバー上のサンドボックスで実行され、開発者は結果を受け取るだけでよく実行環境は不要である","独自ツールと同じく、`input_schema` を含む JSON Schema を開発者が詳細に定義する必要がある","これらを `tools` に宣言すると、Claude は Web 検索や Web フェッチも追加の設定なしで実行できる","`type` と `name` だけで宣言でき、コマンドの実行やファイル操作は開発者のアプリケーションが行う"],"answer":[3],"notes":["bash とテキストエディタはクライアントツールです。Claude はツール呼び出しを出すだけで、実行して結果を返すのはアプリ側です。","Anthropic がスキーマを定義したツールは、スキーマが組み込まれているため `input_schema` を指定しません。","Web 検索と Web フェッチは Anthropic 側で動く別のサーバーツールで、それぞれ個別に `tools` へ宣言する必要があります。","正解。スキーマは Anthropic 側で定義済みで（`input_schema` は不要）、実行と安全対策は開発者の責任です。"],"explanation":"ツールは、コードが実行される場所で2種類に分かれます。クライアントツールはアプリ側で実行するもので、自分で定義するツールと、bash・テキストエディタ・メモリのように Anthropic がスキーマを定義したツールが含まれます。サーバーツール（Web 検索、Web フェッチ、コード実行、ツール検索など）は Anthropic の側で実行されます。bash のようなクライアントツールでは、コマンドの検証やサンドボックス化といった安全対策も開発者が担います。","ref":"Anthropic Docs: Tool use overview"},{"id":"D8-07","domain":"D8","skill":"8.1","topic":"ツール検索","type":"single","question":"大企業の社内エージェントに、各部署の業務システムを操作する約300個のツールを提供しています。すべての定義を毎回 `tools` に含めると、ツール定義だけでコンテキストを大きく消費し、似たツールの選択ミスも増えてきました。最も適した対策はどれですか。","options":["ツール検索ツールを追加し、多くのツールに `defer_loading: true` を付けて必要な分だけ読み込ませる","すべてのツールに `defer_loading: true` を設定し、ツール検索ツール自身も遅延読み込みにする","300個のツールを1つの巨大なツールに統合し、`action` パラメータで300種類の処理を切り替える","各ツールの `description` を空にし、`name` と `input_schema` だけにしてツール定義のトークン数を減らす"],"answer":[0],"notes":["正解。遅延読み込みにより必要なツールだけがコンテキストに入るため、トークン消費と選択ミスの両方を抑えられます。","検索ツール自身は遅延にできず、少なくとも1つは遅延なしのツールが必要です。すべてを遅延にするとエラーになります。","巨大な単一ツールはスキーマが複雑になり、かえって誤用が増えます。","説明を消すとツール選択の手がかりがなくなり、精度が大きく下がります。ツール検索も説明文を検索の対象にしています。"],"explanation":"ツール検索ツール（正規表現版や BM25 版）を使うと、`defer_loading: true` を付けたツールは最初はコンテキストに読み込まれず、Claude が検索して必要なものだけを利用できます。大量のツールを持つエージェントで、コンテキストの消費とツール選択精度の問題を同時に緩和できます。よく使うツールは遅延させずに常に読み込んでおくのが一般的です。","ref":"Anthropic Docs: Tool search tool"},{"id":"D8-08","domain":"D8","skill":"8.2","topic":"MCP プリミティブ","type":"multi","question":"社内 Wiki を Claude から使えるように MCP サーバーを開発しています。ページの検索・更新という操作、ページ本文というデータ、「議事録の要約」という定型の指示テンプレートを公開する予定です。MCP のサーバー側プリミティブに関する説明として正しいものはどれですか。（2つ選択）","options":["ツール（Tools）はモデルが制御するもので、検索や更新のように LLM が判断して呼び出す操作を公開する","リソース（Resources）は副作用のある処理を実行するためのもので、ページ更新はリソースとして公開する","プロンプト（Prompts）はユーザーが制御するもので、スラッシュコマンドのように選んで使う定型の指示を公開する","リソース（Resources）は stdio トランスポートでしか公開できず、Streamable HTTP のサーバーでは使えない","プロンプト（Prompts）を公開すると、サーバーがその内容をすべてのリクエストに自動で挿入する"],"answer":[0,2],"notes":["正解。ツールは、モデルが自律的に発見して呼び出す実行可能な機能です。","リソースはコンテキストとして提供するデータです。副作用のある操作はツールとして公開します。","正解。プロンプトは、ユーザーが明示的に選択して使う再利用可能なテンプレートです。","プリミティブはトランスポートに依存しません。リソースは Streamable HTTP でも公開できます。","プロンプトは必要なときにユーザーが選んで使うもので、自動的に挿入されるわけではありません。"],"explanation":"MCP サーバーは主に3つのプリミティブを公開します。ツールはモデルが制御する実行可能な関数、リソースはアプリケーションが制御するコンテキスト用のデータ（ファイル、DB レコードなど）、プロンプトはユーザーが制御する再利用可能なテンプレートです。どれを使うかは「誰が使用を決めるか」で判断すると整理しやすくなります。","ref":"Model Context Protocol: Server concepts"},{"id":"D8-09","domain":"D8","skill":"8.2","topic":"MCP コネクタ","type":"single","question":"SaaS 企業が、自社 Web アプリのバックエンドから Messages API を呼び、Claude に社内の MCP サーバーのツールを使わせたいと考えています。MCP クライアントは自前で実装せず、API の MCP コネクタを使う方針です。この構成に関する説明として最も適切なものはどれですか。","options":["`mcp_servers` に `command` と `args` を書けば、ローカルの stdio の MCP サーバーも API から起動できる","MCP サーバーを URL で到達できるよう公開し、`mcp_servers` と、それを参照する `mcp_toolset` を指定する","`mcp_servers` に `url` と `name` を指定すれば十分で、`tools` 側には何も追加しなくてもツールが使える","MCP コネクタには認証情報を渡す項目がないため、社内の MCP サーバーは認証なしで公開する必要がある"],"answer":[1],"notes":["`mcp_servers` の `type` は現在 `url` だけで、起動コマンドを書く項目は存在しません。MCP コネクタは Anthropic 側から接続するため、ローカルの stdio サーバーには直接つなげず、HTTP での公開が必要です。","正解。`https://` で始まる URL で公開したリモート MCP サーバーを `mcp_servers` で指定し、`tools` 側に `mcp_toolset` を加えて有効にします。","`mcp_servers` だけでは検証エラーになります。定義したサーバーは、`tools` の中の `mcp_toolset` でちょうど1回参照する必要があります。","`mcp_servers` の `authorization_token` に、OAuth などで取得したアクセストークンを渡して、リモートサーバーに認証できます。"],"explanation":"MCP の標準のトランスポートは、ローカルのサブプロセスと標準入出力で通信する stdio と、ネットワーク越しに通信する Streamable HTTP です（以前の HTTP+SSE は非推奨）。Messages API の MCP コネクタ（ベータ）は、Anthropic の側からリモートの MCP サーバーに接続するため、URL で到達できるサーバーが前提です。リクエストには `mcp_servers`（接続先）と、`tools` の中の `mcp_toolset`（有効化）の両方を指定します。","ref":"Anthropic Docs: MCP connector"},{"id":"D8-10","domain":"D8","skill":"8.3","topic":"Skills の使い分け","type":"single","question":"営業企画チームは、四半期レポートを社内の書式で作るための手順書、テンプレート、集計用スクリプトを持っています。この作業は月に数回しか発生しないため、内容を常にコンテキストに載せておくのは避けたいと考えています。Claude にこの手順を再利用させる方法として最も適したものはどれですか。","options":["手順書とテンプレートの全文を、プロンプトキャッシュを効かせたうえで全会話のシステムプロンプトに常に含める","手順書の各ステップを1つずつカスタムツールとして実装し、すべて `tools` に登録する","手順書・テンプレート・スクリプトを Skill にまとめ、関連する作業のときだけ中身を読み込ませる","手順書とテンプレートの例をファインチューニング用のデータにして、社内の書式をモデルに覚えさせる"],"answer":[2],"notes":["キャッシュで料金と待ち時間は下がっても、月に数回の作業のためにすべての会話でコンテキストを消費する点は変わりません。","手順そのものは知識と指示であり、外部システムを操作する関数ではありません。細かいツール化は過剰です。","正解。Skill は名前と説明だけを先に読み込み、必要なときに本文やファイルを読み込む段階的開示の仕組みです。","手順やテンプレートを更新するたびに再学習が必要になり、現実的ではありません。"],"explanation":"Skill は手順・テンプレート・スクリプトなどをフォルダ（`SKILL.md` など）にまとめたもので、最初はメタデータだけが読み込まれ、関連するタスクのときに中身が読み込まれます（段階的開示）。判断の軸は、その知識をどのくらいの頻度で使うかです。いつも必要な短い指示はシステムプロンプトに置き、まれにしか使わない手順や資料は Skill にすると、ふだんのコンテキストを圧迫せずに済みます。同梱したスクリプトは実行され、その出力だけがコンテキストに入るため、集計のような定型の処理にも向きます。外部システムやデータへの接続を複数のクライアントで再利用したい場合は MCP、自分のアプリ固有の関数ならカスタムツール、Web 検索のように Anthropic が提供する機能は組み込みツールを選びます。","ref":"Anthropic Docs: Agent Skills"},{"id":"D8-11","domain":"D8","skill":"8.3","topic":"組み込みツールの選択","type":"single","question":"調査会社が、Messages API を使って、顧客企業の業界の最新動向をまとめる社内アプリを作っています。モデルの学習データより新しい公開情報を使い、回答には出典の URL を付ける必要があります。開発者は2人だけで、検索の仕組みやクローラーを自前で作って運用する余裕はありません。最も適切な方法はどれですか。","options":["外部の検索 API を呼ぶカスタムツールを `tools` に定義し、検索の実行と出典の整形をアプリ側で実装する","業界ニュースを毎朝バッチで集めて要約し、その日の `system` に出典の URL の一覧と一緒に貼り付けておく","学習データの新しい上位モデルに切り替え、最新の業界動向を知識として答えさせ、出典も書かせる","サーバーツールの Web 検索ツールを `tools` に加え、必要なら検索先のドメインを絞る"],"answer":[3],"notes":["動きますが、検索サービスとの連携、結果の整形、出典の付け方をすべて自前で作って保守することになり、運用の余裕がないという制約に合いません。","その日のうちの新しい情報には追いつけず、質問に関係のないニュースまで毎回コンテキストに載ります。質問に応じて情報を取りに行く仕組みになっていません。","どのモデルにも学習データの時点（知識のカットオフ）があり、それより新しい情報は持っていません。規模を上げても、最新の情報を取りに行く仕組みの代わりにはならず、モデルが書いた出典も検証されません。","正解。Web 検索ツールはサーバーツールで、検索は Anthropic の基盤で実行されるため、アプリに実行のコードは要りません。Web 検索では引用（citations）が常に有効で、回答に出典が付きます。`allowed_domains` などで検索先も絞れます。"],"explanation":"ツールを選ぶときは、まず Anthropic が提供する組み込みのツールで足りるかを確かめます。Web 検索・Web フェッチ・コード実行のようなサーバーツールは Anthropic の基盤で動き、アプリは実行のコードを持たずに済みます。自社のシステムやデータにしかない機能が必要なときはカスタムツール、それを複数のアプリから再利用したいときは MCP サーバー、手順や知識を必要なときだけ読ませたいときは Skill、と使い分けます。Web 検索には、トークンとは別に検索の回数に応じた料金がかかる点も、設計のときに考えておきます。","ref":"試験ガイド スキル「エージェントのカスタマイズ」 ／ Claude Docs: Tool use overview、Web search tool"},{"id":"D8-12","domain":"D8","skill":"8.3","topic":"カスタムツールと MCP","type":"single","question":"EC 企業が、自社の Web アプリに、Claude を使った買い物相談のチャットを組み込んでいます。バックエンドから Messages API を呼び、Claude が「ログイン中のユーザーのカートに商品を入れる」操作をできるようにしたいと考えています。この操作には、アプリのサーバーが持つユーザーのセッションと認証情報が必要です。この操作を使うのはこのアプリだけで、外部に公開するエンドポイントは増やしたくありません。最も適切な方法はどれですか。","options":["カートの操作を MCP サーバーとして作り、Messages API の MCP コネクタからそのサーバーに接続させる","カートの操作をカスタムツールとして定義し、Claude が呼び出したらバックエンドで実行する","組み込みの Web フェッチツールに、カートを操作する社内 API の URL を読み込ませる","カート API の呼び出し方とスクリプトを Skill にまとめ、コード実行ツールと一緒に読み込ませる"],"answer":[1],"notes":["MCP は同じ操作を複数のアプリやクライアントから再利用したいときに向く方法で、この場面では利点が生きません。MCP コネクタで使うサーバーは HTTP で外部に公開するのが前提で（社内に置いたまま接続する MCP トンネルは研究プレビュー）、エンドポイントを増やしたくないという制約にも合いません。","正解。自分で定義したツールはクライアントツールで、実行するのはアプリです。Claude が `tool_use` を返したら、バックエンドがリクエストに紐づくユーザーのセッションで操作し、`tool_result` で結果を返します。","Web フェッチは Anthropic の基盤で動くサーバーツールで、会話に出てきた URL のページや PDF の内容を取得して読むためのものです。カートを変更する操作には使えず、プライベートなアドレスへのアクセスもAnthropic 側で拒否されます。","Messages API で使う Skill は、ネットワークにアクセスできないコンテナの中で動くため、外部の API を呼べません。Skill は手順や知識を渡す仕組みで、アプリの中の状態を使う操作には向きません。"],"explanation":"カスタムツール、MCP、組み込みツール、Skill は、「その機能がどこにあり、誰が実行し、どこまで再利用するか」で選びます。アプリの中の状態（ユーザーのセッションやトランザクション）を使い、そのアプリでしか使わない操作は、カスタムツールとしてアプリが実行するのが最も単純で安全です。同じ操作を複数のアプリやクライアントから使い、アプリとは別に保守したくなったら、MCP サーバーに切り出すことを考えます。再利用と独立した保守が要件なら MCP、アプリの中で完結するならカスタムツール、という対比が判断の軸になります。","ref":"試験ガイド スキル「エージェントのカスタマイズ」 ／ Claude Docs: Tool use overview、MCP connector、MCP tunnels、Web fetch tool、Agent Skills"},{"id":"D8-13","domain":"D8","skill":"8.3","topic":"Skill と MCP","type":"multi","question":"データ分析チームは、Claude Code と Claude Desktop の両方で、社内のデータウェアハウスの分析に Claude を使っています。いまはメンバーが BI ツールで出した集計結果を会話に貼り付けており、手間がかかるうえに数字が古くなりがちです。また、Claude が書くクエリが、社内のテーブルの命名規則や「売上」の定義（返品を除く、など）に沿っていないことがよくあります。指標の定義は分析のときにだけ必要です。取るべき対応はどれですか。（2つ選択）","options":["各メンバーの CLAUDE.md に、テーブルの一覧と指標の定義をすべて書き込んでおく","データウェアハウスへの問い合わせを MCP サーバーのツールにし、両方のクライアントから使う","データウェアハウスの主要なテーブルを毎朝 CSV に書き出し、分析のたびに会話へ添付する","社内の命名規則や定義も推測できるよう、より推論能力の高い上位のモデルに切り替える","スキーマ、指標の定義、クエリの書き方を Skill にまとめ、分析の作業のときに読み込ませる"],"answer":[1,4],"notes":["CLAUDE.md は Claude Code のセッションで毎回読み込まれるため、分析をしないときもコンテキストを使います。Claude Desktop には効かず、各メンバーが別々に持つと内容もずれていきます。","正解。MCP は外部のシステムに接続し、ツールとデータへのアクセスを提供する仕組みです。サーバーを1つ作れば、MCP に対応した複数のクライアントから同じ接続を使え、最新のデータを直接引けます。","貼り付けと同じ問題が残ります。データは書き出した時点で古くなり、必要のない行までコンテキストに載ります。","モデルを大きくしても、社内だけで決めた命名規則や指標の定義は知りようがありません。規模で解決できる問題ではありません。","正解。Skill は知識や手順をまとめたもので、ふだんは名前と説明だけがコンテキストにあり、関係する作業のときに中身が読み込まれます。なお、カスタムの Skill は Claude Code と claude.ai などの面のあいだで同期されないので、使う面ごとに配置します。"],"explanation":"MCP と Skill は、解く問題が違います。MCP は「接続」（外部のシステムのツールとデータ）を、Skill は「知識」（そのツールをどう使うか、社内の定義や手順）を提供します。公式ドキュメントでも、MCP でデータベースにつなぎ、Skill にスキーマとクエリの型をまとめる、という組み合わせが例に挙がっています。データが古い・手で貼っているなら接続の問題（MCP）、手順や定義を守らないなら知識の問題（Skill）と、症状から切り分けると選びやすくなります。","ref":"試験ガイド スキル「エージェントのカスタマイズ」 ／ Claude Code Docs: Extend Claude Code ／ Claude Docs: Agent Skills"}];

function sanitizeSession(s) {
  if (!s || !Array.isArray(s.ids)) return null;
  s.ids = s.ids.filter(id => BY_ID[id]);
  if (!s.ids.length) return null;
  s.order = s.order || {}; s.answers = s.answers || {}; s.submitted = s.submitted || {}; s.flags = s.flags || {};

// total 問を、重み（weight）の比で各単位に割り振る。cap は、その単位に収録されている問題数。
// 端数は、余りの大きさに比例した確率で切り上げる。毎回同じ単位が切り捨てられると、配点の小さい単位が
// 一度も出題されなくなるため（平均すると、どの単位も配点どおりの問題数になる）
function apportion(total, units) {
  const sum = units.reduce((a, u) => a + u.weight, 0) || 1;
  const rows = units.map(u => {
    const exact = total * u.weight / sum;
    return { code: u.code, exact, cap: u.cap, n: Math.min(Math.floor(exact), u.cap) };
  });
  let left = Math.min(total, units.reduce((a, u) => a + u.cap, 0)) - rows.reduce((a, r) => a + r.n, 0);
  const cands = rows.filter(r => r.n < r.cap && r.exact % 1 > 1e-9).map(r => ({ r, w: r.exact % 1 }));
  while (left > 0 && cands.length) {
    let x = Math.random() * cands.reduce((a, c) => a + c.w, 0);
    let i = 0;
    while (i < cands.length - 1 && (x -= cands[i].w) > 0) i++;
    cands[i].r.n++; left--;
    cands.splice(i, 1);
  }
  // 収録数が足りない単位があって余ったぶんは、余りの大きい順にほかの単位へ回す
  const byRemainder = [...rows].sort((a, b) => (b.exact % 1) - (a.exact % 1));
  while (left > 0) {
    let moved = false;
    for (const r of byRemainder) {
      if (left > 0 && r.n < r.cap) { r.n++; left--; moved = true; }
    }
    if (!moved) break;
  }
  return Object.fromEntries(rows.map(r => [r.code, r.n]));
}

function examPick() {
  // シナリオ形式の試験（scenarioPick あり）は、本番と同じ数のシナリオを先に選び、その問題だけから出す
  let bank = QUESTIONS;
  let chosen = [];
  if (EXAM.scenarioPick && SCENARIOS.length) {
    // 分野によっては、問題が特定のシナリオに集まっている。そのシナリオが1つも選ばれないと、その分野を配点どおりに
    // 出せない（例: 配点20%の分野が2問だけになる）。どれかの分野が配点より大きく不足する組み合わせは引き直す。
    // 何度引いても不足するときは、不足がいちばん小さい組み合わせを使う
    const want = Math.min(EXAM_COUNT, QUESTIONS.length);
    const sumW = DOMAINS.reduce((a, d) => a + d.weight, 0) || 1;
    const tolerance = Math.max(1, Math.round(want * 0.05));
    let best = null;
    for (let t = 0; t < 40 && !(best && best.short <= tolerance); t++) {
      const ids = shuffle(SCENARIOS.map(s => s.id)).slice(0, EXAM.scenarioPick);
      const pool = QUESTIONS.filter(q => ids.includes(q.scenario));
      if (pool.length < want) continue;
      const short = Math.max(...DOMAINS.map(d => Math.round(want * d.weight / sumW) - pool.filter(q => q.domain === d.code).length));
      if (!best || short < best.short) best = { ids, pool, short };
    }
    if (best) { chosen = best.ids; bank = best.pool; }
  }
  const total = Math.min(EXAM_COUNT, bank.length);
  // 配点に沿って問題数を割り振る。まず分野ごとに割り振り、試験ガイドがスキルごとの配点も示している試験
  // （exam.json の skills）では、分野の中でさらにスキルごとに割り振る。分野の比率を崩さないため、2段にしている
  const domainOf = k => 'D' + String(k.code).split('.')[0];
  const bySkill = SKILLS.length > 0 && bank.every(q => q.skill);
  const perDomain = apportion(total, DOMAINS.map(d => ({ code: d.code, weight: d.weight, cap: bank.filter(q => q.domain === d.code).length })));
  const picked = shuffle(DOMAINS.flatMap(d => {
    const inDomain = shuffle(bank.filter(q => q.domain === d.code));
    if (!bySkill) return inDomain.slice(0, perDomain[d.code]);
    const skills = SKILLS.filter(k => domainOf(k) === d.code);
    const perSkill = apportion(perDomain[d.code], skills.map(k => ({ code: k.code, weight: k.weight, cap: inDomain.filter(q => q.skill === k.code).length })));
    return skills.flatMap(k => inDomain.filter(q => q.skill === k.code).slice(0, perSkill[k.code]));
  }));
  // 本番と同じく、同じシナリオの問題をまとめて出す
  if (chosen.length) picked.sort((a, b) => chosen.indexOf(a.scenario) - chosen.indexOf(b.scenario));
  return picked.map(q => q.id);
}

            <select id="pref-count" data-pref="count">

          <label class="field" for="pref-order"><span class="field-label">順番</span>
            <select id="pref-order" data-pref="order">

      <div class="panel">
        <div class="panel-head"><h2>模擬試験</h2><p>本番と同じ形式で、時間を計って通しで解きます。</p></div>
        <ul class="ticks">
          <li>${EXAM.scenarioPick && SCENARIOS.length ? `${SCENARIOS.length}つのシナリオから${EXAM.scenarioPick}つを無作為に選び、` : ''}${SKILLS.length ? `${esc(DOMAIN_LABEL)}とスキル` : esc(DOMAIN_LABEL)}の配点に沿って${Math.min(EXAM_COUNT, total)}問を抽出します</li>
          <li>制限時間は${EXAM_MINUTES}分です。ページを閉じてもタイマーは進みます</li>
          <li>採点するまで正誤は表示されません</li>
          <li>見直し用のマークと問題一覧で、好きな問題に戻れます</li>

        <div class="panel-foot">
          <span class="count">合格の目安は正答率 <b>${PASS_PCT}%</b></span>
          <button type="button" class="btn btn-primary" id="btn-exam" data-action="start-exam" ${total ? '' : 'disabled'}>模擬試験を始める</button>

      <div class="section-head">

      </div>
      <div class="bp">${rows}</div>
    </section>
    ${SCENARIOS.length ? `<section>
      <div class="section-head">
        <h2>シナリオ別に練習する</h2>
        <p>${esc(EXAM.scenarioNote || '問題は、場面設定（シナリオ）ごとにまとまっています。')}</p>
      </div>
      <div class="bp">${scnRows}</div>
    </section>` : ''}

    <footer class="foot">
      <div class="foot-stats">
        <span>解いた問題 <b>${tried}</b> / ${total}</span>
        <span>最新の回答で正解 <b>${okLast}</b></span>
        <span>要復習 <b>${wrong}</b></span>
        <span class="spacer"></span>
        ${ui.confirmReset
          ? `<span class="confirm">学習記録とブックマークを消しますか？
              <button type="button" class="btn btn-small btn-danger" id="btn-reset-yes" data-action="reset-yes">消去する</button>
              <button type="button" class="btn btn-small" id="btn-reset-no" data-action="reset-no">やめる</button></span>`
          : `<button type="button" class="btn btn-small btn-ghost" id="btn-reset" data-action="reset" ${tried || QUESTIONS.some(q => st(q.id).bm) ? '' : 'disabled'}>学習記録をリセット</button>`}
      </div>
      <p>非公式の学習用問題集です。Anthropic の公式問題ではありません。出題範囲と配点は公開情報をもとにしているので、受験前に公式の試験ガイドで最新の内容を確認してください。学習記録はこのブラウザの中にだけ保存されます。</p>
    </footer>
  </div>`;
}

function resumeBanner() {
  if (!session) return '';
  if (session.finished) {
    return `<div class="banner"><span>前回の${modeName(session.mode)}の結果が残っています。</span>
      <div class="banner-actions"><button type="button" class="btn btn-small" id="btn-last" data-action="last-result">結果を見る</button></div></div>`;
  }
  const done = session.mode === 'exam'
    ? session.ids.filter(id => (session.answers[id] || []).length).length
    : Object.keys(session.submitted).length;
  const left = session.mode === 'exam' ? `・残り ${fmtTime(session.deadline - Date.now())}` : '';
  const actions = ui.confirmDiscard
    ? `<span>途中の${modeName(session.mode)}を破棄しますか？</span>
       <button type="button" class="btn btn-small btn-danger" id="btn-discard-yes" data-action="discard-yes">破棄する</button>
       <button type="button" class="btn btn-small" id="btn-discard-no" data-action="discard-no">やめる</button>`
    : `<button type="button" class="btn btn-small btn-primary" id="btn-resume" data-action="resume">続きから再開</button>
       <button type="button" class="btn btn-small" id="btn-discard" data-action="discard">破棄</button>`;
  return `<div class="banner"><span>${modeName(session.mode)}の途中です（${done} / ${session.ids.length}問 回答済み${left}）</span>
    <div class="banner-actions">${actions}</div></div>`;
}

/* ---------- 画面：問題 ---------- */
function topBar(left, mid, right, progress) {
  return `<div class="bar"><div class="bar-inner">${left}<div class="bar-mid">${mid}</div>${right}</div>
    ${progress == null ? '' : `<div class="bar-progress"><span style="width:${progress.toFixed(1)}%"></span></div>`}</div>`;
}
function bookmarkBtn(id) {
  const on = !!st(id).bm;
  return `<button type="button" class="icon-btn" id="btn-bm" data-action="bookmark" aria-pressed="${on}" aria-label="ブックマーク" title="ブックマーク">${on ? '★' : '☆'}</button>`;
}

function questionCard(q, o) {
  const d = DOM[q.domain];
  const need = q.answer.length;
  const sel = o.sel || [];
  const items = o.order.map((orig, i) => {
    const chosen = sel.includes(orig);
    const right = q.answer.includes(orig);
    let cls = 'opt';
    if (chosen) cls += ' is-chosen';
    if (o.reveal) cls += right ? ' is-right' : (chosen ? ' is-wrong' : '');
    const marks = o.reveal ? (right ? PEN_CIRCLE : (chosen ? PEN_CHECK : '')) : '';
    const note = o.reveal
      ? `<span class="opt-note">${right ? '<b class="tag tag-right">正解</b>' : ''}${chosen && !right ? '<b class="tag tag-wrong">あなたの回答</b>' : ''}${fmt(q.notes[orig])}</span>`
      : '';
    return `<li role="presentation"><button type="button" class="${cls}" id="opt-${i}" data-action="pick" data-opt="${orig}"
      role="${need > 1 ? 'checkbox' : 'radio'}" aria-checked="${chosen}"${o.reveal ? ' aria-disabled="true"' : ''}>
      <span class="bubble" aria-hidden="true">${LETTERS[i]}${marks}</span>
      <span class="opt-body"><span class="opt-text">${fmt(q.options[orig])}</span>${note}</span></button></li>`;
  }).join('');

  const instr = need > 1
    ? `<span>${need}つ選んでください</span><span class="num">${sel.length} / ${need} 選択中</span>`
    : '<span>最も適切なものを1つ選んでください</span>';

  let after = '';
  if (o.reveal) {
    const ok = isCorrect(q, sel);
    const letters = o.order.map((orig, i) => (q.answer.includes(orig) ? LETTERS[i] : null)).filter(Boolean).join('・');
    after = `<div class="verdict ${ok ? 'ok' : 'ng'}" role="status">${ok ? MARK_OK : MARK_NG}
        <div><p class="verdict-title">${ok ? '正解' : (sel.length ? '不正解' : '未回答')}</p><p class="verdict-sub">正解は ${letters}</p></div></div>
      <div class="explain"><h3>解説</h3><p>${fmt(q.explanation)}</p>${q.ref ? `<p class="ref">参考：${fmt(q.ref)}</p>` : ''}</div>`;
  }

  // 回答の前に見せる情報は、本番で見えるものに近づける。論点名（topic）は正解の言い回しと重なることが多く、
  // 手がかりになるので、正解を表示するまで出さない。模擬試験では、分野と問題番号（分野が分かる）も採点まで出さない
  const meta = o.reveal
    ? `<span class="q-dom"><b>${d.code}</b>${esc(d.name)}</span><span class="q-topic">${esc(q.topic)}</span><span class="q-id">${q.id}</span>`
    : (o.exam ? '' : `<span class="q-dom"><b>${d.code}</b>${esc(d.name)}</span><span class="q-id">${q.id}</span>`);

  return `<article class="sheet" aria-labelledby="q-title">
    <div class="q-meta">
      <span class="q-num" id="q-title"><small>問</small>${o.number}</span>
      ${meta}
    </div>
    ${SCN[q.scenario] ? `<div class="scn"><b>シナリオ：${esc(SCN[q.scenario].name)}</b>${fmt(SCN[q.scenario].summary)}</div>` : ''}
    <div class="q-text">${fmt(q.question)}</div>
    ${q.code ? `<pre class="code"><code>${esc(q.code)}</code></pre>` : ''}
    ${o.reveal ? '' : `<div class="q-instr">${instr}</div>${ui.hint ? `<p class="hint" role="alert">${esc(ui.hint)}</p>` : ''}`}
    <ul class="opts" role="${need > 1 ? 'group' : 'radiogroup'}" aria-label="選択肢">${items}</ul>
    ${after}
  </article>`;
}

function viewQuiz() {
  const s = session;
  const id = s.ids[s.idx];
  const q = BY_ID[id];
  const exam = s.mode === 'exam';
  const sel = s.answers[id] || [];
  const revealed = !exam && !!s.submitted[id];
  const last = s.idx === s.ids.length - 1;
  const answeredCount = s.ids.filter(x => (s.answers[x] || []).length).length;
  const progress = exam ? answeredCount / s.ids.length * 100 : (Object.keys(s.submitted).length / s.ids.length) * 100;

  const bar = topBar(
    `<button type="button" class="btn btn-ghost btn-small" id="btn-home" data-action="home">← ${exam ? '中断' : 'ホーム'}</button>`,
    `<span class="bar-mode">${modeName(s.mode)}</span><span class="bar-count"><b>${s.idx + 1}</b> / ${s.ids.length}</span>`,
    `<div class="bar-right">${exam ? '<span class="timer" id="timer"></span>' : ''}${bookmarkBtn(id)}</div>`,
    progress
  );

  const card = questionCard(q, { sel, order: s.order[id], reveal: revealed, exam, number: s.idx + 1 });

  let actions;
  if (!exam) {
    const doneCount = Object.keys(s.submitted).length;
    actions = revealed
      ? `<div class="actions">
          <button type="button" class="btn btn-ghost btn-small" id="btn-quit" data-action="finish" ${doneCount ? '' : 'disabled'}>ここで終了して結果を見る</button>
          <button type="button" class="btn btn-primary" id="btn-next" data-action="next">${last ? '結果を見る' : '次の問題へ →'}</button>
        </div>`
      : `<div class="actions">
          <button type="button" class="btn btn-ghost btn-small" id="btn-quit" data-action="finish" ${doneCount ? '' : 'disabled'}>ここで終了して結果を見る</button>
          <button type="button" class="btn btn-primary" id="btn-submit" data-action="submit" ${sel.length === q.answer.length ? '' : 'disabled'}>回答する</button>
        </div>`;
    actions += '<p class="keys"><kbd>1</kbd>〜<kbd>5</kbd> で選択・<kbd>Enter</kbd> で回答／次へ</p>';
  } else {
    const flagged = !!s.flags[id];
    const flags = s.ids.filter(x => s.flags[x]).length;
    const nav = s.ids.map((x, i) => {
      const cls = [(s.answers[x] || []).length ? 'answered' : '', s.flags[x] ? 'flagged' : '', i === s.idx ? 'current' : ''].filter(Boolean).join(' ');
      return `<button type="button" class="${cls}" id="nav-${i}" data-action="goto" data-idx="${i}" aria-label="問${i + 1}${(s.answers[x] || []).length ? ' 回答済み' : ''}${s.flags[x] ? ' マークあり' : ''}">${i + 1}</button>`;
    }).join('');
    const unanswered = s.ids.length - answeredCount;
    actions = `<div class="actions">
        <button type="button" class="btn" id="btn-prev" data-action="prev" ${s.idx ? '' : 'disabled'}>← 前へ</button>
        <button type="button" class="btn btn-ghost" id="btn-flag" data-action="flag" aria-pressed="${flagged}">${flagged ? '● 見直しマーク中' : '○ 見直しマーク'}</button>
        <button type="button" class="btn ${last ? '' : 'btn-primary'}" id="btn-next" data-action="next" ${last ? 'disabled' : ''}>次へ →</button>
      </div>
      <details class="navbox" open>
        <summary>問題一覧 <span>回答済み ${answeredCount} / ${s.ids.length}・マーク ${flags}</span></summary>
        <div class="nav">${nav}</div>
        <div class="legend"><span><i class="l-ans"></i>回答済み</span><span><i class="l-flag"></i>見直しマーク</span><span><i></i>未回答</span></div>
      </details>
      ${ui.confirmFinish
        ? `<div class="finish-box" role="alert"><span>${unanswered ? `未回答が <b>${unanswered}</b> 問あります。` : 'すべての問題に回答しました。'}採点すると回答は変更できません。</span>
            <span class="banner-actions"><button type="button" class="btn btn-danger" id="btn-finish-yes" data-action="finish-yes">採点する</button>
            <button type="button" class="btn" id="btn-finish-no" data-action="finish-no">戻る</button></span></div>`
        : `<div class="actions"><span class="grow"></span><button type="button" class="btn ${last ? 'btn-primary' : ''}" id="btn-finish" data-action="finish">試験を終了して採点</button></div>`}
      <p class="keys"><kbd>1</kbd>〜<kbd>5</kbd> で選択・<kbd>←</kbd><kbd>→</kbd> で移動</p>`;
  }

  return `${bar}<div class="wrap">${card}${actions}</div>`;
}

/* ---------- 画面：結果と解説 ---------- */
function resultOf(s) {
  const rows = reviewList(s).map(id => {
    const q = BY_ID[id];
    const sel = s.answers[id] || [];
    return { id, q, answered: sel.length > 0, correct: isCorrect(q, sel) };
  });
  return { rows, ok: rows.filter(r => r.correct).length, total: rows.length };
}

function viewResult() {
  const s = session;
  const r = resultOf(s);
  const rate = r.total ? r.ok / r.total : 0;
  const pct = Math.round(rate * 100);
  const need = Math.max(0, Math.ceil(PASS_RATE * r.total - 1e-9) - r.ok);
  const wrongIds = r.rows.filter(x => !x.correct).map(x => x.id);
  const unanswered = r.rows.filter(x => !x.answered).length;

  const doms = DOMAINS.map(d => {
    const rows = r.rows.filter(x => x.q.domain === d.code);
    if (!rows.length) return '';
    const ok = rows.filter(x => x.correct).length;
    return `<div class="dom-row"><span class="bp-code">${d.code}</span><span>${esc(d.name)}</span><span class="num">${ok} / ${rows.length}</span>
      <span class="meter-track acc"><span style="width:${(ok / rows.length * 100).toFixed(1)}%"></span></span></div>`;
  }).join('');

  const list = r.rows.map((x, i) => `<li><button type="button" id="res-${i}" data-action="review" data-idx="${i}">
      <span class="res-mark ${x.correct ? 'ok' : 'ng'}" aria-label="${x.correct ? '正解' : '不正解'}">${x.correct ? '○' : '×'}</span>
      <span class="num">問${s.ids.indexOf(x.id) + 1}</span><span class="bp-code">${x.q.domain}</span>
      <span class="res-topic">${esc(x.q.topic)}${x.answered ? '' : '（未回答）'}</span><span class="res-go">解説 →</span></button></li>`).join('');

  const timeLine = s.mode === 'exam'
    ? `<span>所要時間 <b>${fmtTime((s.endedAt || Date.now()) - s.startedAt)}</b> / ${fmtTime(EXAM_MINUTES * 60000)}</span>` : '';

  return `<div class="wrap">
    <header class="score-head">
      <p class="eyebrow">${modeName(s.mode)}の結果</p>
      <div class="score-row">
        <span class="score num">${pct}<small>%</small></span>
        <span class="score-sub"><span>正解 <b>${r.ok}</b> / ${r.total}問</span>${timeLine}${unanswered ? `<span>未回答 <b>${unanswered}</b>問</span>` : ''}</span>
      </div>
      <div class="gauge" role="img" aria-label="正答率 ${pct}%、合格目安 ${PASS_PCT}%"><span style="width:${pct}%"></span><i class="mark" style="left:${PASS_RATE * 100}%" data-label="合格目安 ${PASS_PCT}%"></i></div>
      <p class="score-msg">${rate >= PASS_RATE ? `合格目安の正答率${PASS_PCT}%を上回りました。` : `合格目安の正答率${PASS_PCT}%まで、あと${need}問です。`}</p>
      <p class="score-note">本番は${EXAM.scaleMin}〜${EXAM.scaleMax}のスケールスコアで、${EXAM.passScore}以上が合格です。換算式は公開されていないので、ここでは正答率${PASS_PCT}%を目安にしています。</p>
    </header>

    <section class="sheet">
      <h2 style="font-size:18px">${esc(DOMAIN_LABEL)}別の正答</h2>
      <div class="dom-list">${doms}</div>
    </section>

    <section>
      <div class="section-head"><h2>問題ごとの結果</h2><p>行を選ぶと、正解と解説を確認できます。</p></div>
      <ul class="res-list">${list}</ul>
    </section>

    <div class="actions">
      <button type="button" class="btn" id="btn-res-home" data-action="home">ホームへ</button>
      <button type="button" class="btn btn-primary" id="btn-retry" data-action="retry-wrong" ${wrongIds.length ? '' : 'disabled'}>間違えた${wrongIds.length}問を解き直す</button>
    </div>
  </div>`;
}

function viewReview() {
  const s = session;
  const list = reviewList(s);
  const i = Math.min(Math.max(0, ui.reviewIdx), list.length - 1);
  const id = list[i];
  const q = BY_ID[id];
  const bar = topBar(
    '<button type="button" class="btn btn-ghost btn-small" id="btn-back" data-action="back-result">← 結果へ</button>',
    `<span class="bar-mode">解説</span><span class="bar-count"><b>${i + 1}</b> / ${list.length}</span>`,
    `<div class="bar-right">${bookmarkBtn(id)}</div>`,
    null
  );
  const card = questionCard(q, { sel: s.answers[id] || [], order: s.order[id], reveal: true, number: s.ids.indexOf(id) + 1 });
  return `${bar}<div class="wrap">${card}
    <div class="actions">
      <button type="button" class="btn" id="btn-rprev" data-action="review-prev" ${i ? '' : 'disabled'}>← 前の問題</button>
      <button type="button" class="btn btn-primary" id="btn-rnext" data-action="review-next" ${i < list.length - 1 ? '' : 'disabled'}>次の問題 →</button>
    </div></div>`;
}

/* ---------- 描画 ---------- */
const app = document.getElementById('app');
function render() {
  if (view !== 'home' && !session) view = 'home';
  const activeId = document.activeElement && document.activeElement.id;
  if (view === 'quiz') app.innerHTML = viewQuiz();
  else if (view === 'result') app.innerHTML = viewResult();
  else if (view === 'review') app.innerHTML = viewReview();
  else app.innerHTML = viewHome();

  const scrollKey = view + ':' + (view === 'quiz' ? session.idx : view === 'review' ? ui.reviewIdx : '');
  if (scrollKey !== lastScrollKey) { window.scrollTo(0, 0); lastScrollKey = scrollKey; }
  if (activeId) {
    const el = document.getElementById(activeId);
    if (el && !el.disabled) el.focus({ preventScroll: true });
  }
  tick();
}

/* ---------- 操作 ---------- */
function currentQ() { return BY_ID[session.ids[session.idx]]; }

function pick(orig) {
  const s = session;
  const q = currentQ();
  if (s.mode !== 'exam' && s.submitted[q.id]) return;
  const need = q.answer.length;
  let sel = [...(s.answers[q.id] || [])];
  ui.hint = '';
  if (need === 1) sel = [orig];
  else if (sel.includes(orig)) sel = sel.filter(x => x !== orig);
  else if (sel.length >= need) ui.hint = `選べるのは${need}つまでです。ほかの選択肢を選ぶ前に、どれかを外してください。`;
  else sel.push(orig);
  s.answers[q.id] = sel;
  saveSession(); render();
}
function submit() {
  const s = session;
  const q = currentQ();
  const sel = s.answers[q.id] || [];
  if (s.mode === 'exam' || s.submitted[q.id] || sel.length !== q.answer.length) return;
  s.submitted[q.id] = true;
  record(q.id, isCorrect(q, sel));
  saveStats(); saveSession(); render();
}
function go(delta) {
  const s = session;
  const n = s.idx + delta;
  if (n < 0 || n >= s.ids.length) return;
  s.idx = n; ui.hint = ''; ui.confirmFinish = false;
  saveSession(); render();
}
function next() {
  const s = session;
  if (s.mode !== 'exam' && s.idx === s.ids.length - 1) { finishSession(); render(); return; }
  go(1);
}

// 模擬試験の途中で別の出題を始めようとしたら、先に破棄するかを確かめる（黙って消さない）
function examInProgress() {
  if (!session || session.finished || session.mode !== 'exam') return false;
  ui.confirmDiscard = true;
  render();
  window.scrollTo(0, 0);
  return true;
}

const actions = {
  'start-practice': () => { if (!examInProgress()) startPractice(); },
  'start-exam': () => { if (!examInProgress()) startExam(); },
  'domain-practice': el => { if (examInProgress()) return; prefs.domains = [el.dataset.domain]; prefs.filter = 'all'; savePrefs(); startPractice(); },
  'scenario-practice': el => {
    if (examInProgress()) return;
    const qs = QUESTIONS.filter(q => q.scenario === el.dataset.scenario);
    startPractice((prefs.order === 'seq' ? qs : shuffle([...qs])).map(q => q.id));
  },
  'toggle-domain': el => {
    const c = el.dataset.domain;
    prefs.domains = prefs.domains.includes(c) ? prefs.domains.filter(x => x !== c) : [...prefs.domains, c];
    savePrefs(); render();
  },
  'all-domains': () => {
    prefs.domains = prefs.domains.length === DOMAINS.length ? [] : DOMAINS.map(d => d.code);
    savePrefs(); render();
  },
  'resume': () => { view = session.finished ? 'result' : 'quiz'; ui.confirmDiscard = false; render(); },
  'last-result': () => { view = 'result'; render(); },
  'discard': () => { ui.confirmDiscard = true; render(); },
  'discard-no': () => { ui.confirmDiscard = false; render(); },
  'discard-yes': () => { session = null; ui.confirmDiscard = false; saveSession(); render(); },
  'reset': () => { ui.confirmReset = true; render(); },
  'reset-no': () => { ui.confirmReset = false; render(); },
  'reset-yes': () => { stats = {}; ui.confirmReset = false; saveStats(); render(); },
  'home': () => { view = 'home'; ui.confirmFinish = false; ui.hint = ''; render(); },
  'pick': el => pick(Number(el.dataset.opt)),
  'submit': () => submit(),
  'next': () => next(),
  'prev': () => go(-1),
  'goto': el => go(Number(el.dataset.idx) - session.idx),
  'flag': () => { const id = currentQ().id; session.flags[id] = !session.flags[id]; saveSession(); render(); },
  'bookmark': () => {
    const id = view === 'review' ? reviewList(session)[ui.reviewIdx] : currentQ().id;
    stats[id] = { ...st(id), bm: !st(id).bm }; saveStats(); render();
  },
  'finish': () => {
    if (session.mode === 'exam') { ui.confirmFinish = true; render(); }
    else { finishSession(); render(); }
  },
  'finish-no': () => { ui.confirmFinish = false; render(); },
  'finish-yes': () => { finishSession(); render(); },
  'review': el => { ui.reviewIdx = Number(el.dataset.idx); view = 'review'; render(); },
  'review-prev': () => { ui.reviewIdx = Math.max(0, ui.reviewIdx - 1); render(); },
  'review-next': () => { ui.reviewIdx = Math.min(reviewList(session).length - 1, ui.reviewIdx + 1); render(); },
  'back-result': () => { view = 'result'; render(); },
  'retry-wrong': () => {
    const ids = resultOf(session).rows.filter(x => !x.correct).map(x => x.id);
    startPractice(shuffle(ids));
  },
};

app.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled || el.getAttribute('aria-disabled') === 'true') return;
  const fn = actions[el.dataset.action];
  if (fn) fn(el, e);
});
app.addEventListener('change', e => {
  const el = e.target.closest('[data-pref]');
  if (!el) return;
  prefs[el.dataset.pref] = el.value;
  savePrefs(); render();
});
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.closest && e.target.closest('input, select, textarea, summary')) return;
  if (view === 'quiz' && session) {
    const k = e.key.toLowerCase();
    const map = { '1': 0, '2': 1, '3': 2, '4': 3, '5': 4, a: 0, b: 1, c: 2, d: 3, e: 4 };
    const q = currentQ();
    if (k in map) {
      const order = session.order[q.id];
      if (map[k] < order.length) { e.preventDefault(); pick(order[map[k]]); }
      return;
    }
    if (e.key === 'Enter') {
      const onOther = e.target.closest('button') && !e.target.closest('.opt');
      if (onOther) return;
      e.preventDefault();
      if (session.mode === 'exam') { if (session.idx < session.ids.length - 1) go(1); }
      else if (session.submitted[q.id]) next();
      else submit();
      return;
    }
    if (session.mode === 'exam') {
      if (e.key === 'ArrowRight') { e.preventDefault(); go(1); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
    }
  } else if (view === 'review' && session) {
    if (e.key === 'ArrowRight') { e.preventDefault(); actions['review-next'](); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); actions['review-prev'](); }
  }
});

/* ---------- タイマー ---------- */
function tick() {
  if (!session || session.mode !== 'exam' || session.finished) return;
  const ms = session.deadline - Date.now();
  if (ms <= 0) {
    const wasInQuiz = view === 'quiz';
    finishSession();
    if (!wasInQuiz) view = 'home';
    render();
    return;
  }
  const el = document.getElementById('timer');
  if (el) {
    el.textContent = '残り ' + fmtTime(ms);
    el.classList.toggle('is-low', ms < 10 * 60000);
  }
}
setInterval(tick, 1000);

render();
})();
</script>

</html>
