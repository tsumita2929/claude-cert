を比べることを挙げています。効果が確かめられた手順から広げていけば、失敗したときの影響も小さく済みます。","ref":"試験ガイド 分野4 タスク 4.4（既存のワークフローにClaudeを統合し、ワークフローを強化または再設計する）／ claude.com: Claude adoption roadmap（Claude for the financial industry）"},{"id":"D4-12","domain":"D4","topic":"自動化の前に見直す","type":"single","question":"総務部では、備品の購入申請に5人の承認が必要で、担当者は承認者ごとに決められた書式に合わせて、同じ内容の申請書を毎回5通り作っています。担当者は、この5通りの作成を Claude に任せて時間を減らそうと考えました。ところが調べてみると、5人のうち3人は内容を見ずに承認しており、差し戻しもほとんど起きていないことが分かりました。最も適切な対応はどれですか。","options":["5通りの申請書づくりを Claude に任せ、承認の流れは今のまま残して、作成にかかる時間だけを減らす","より正確な申請書になるよう、いちばん高性能なモデルに切り替えて5通りの申請書を作らせる","承認する人が読みやすいよう、Claude に申請書を今より長く丁寧な文章で書かせる","承認の段階と書式が本当に必要かを関係者と見直し、流れを整理したうえで、残る手順に Claude を使う"],"answer":[3],"notes":["中身の確認に役立っていない承認と、そのための書類づくりを、そのまま速く回すだけです。むだな手順を自動化すると、そのむだが固定されます。","モデルの性能を上げても、承認の段階と書式が多すぎるという問題は変わりません。規模で解決しようとしています。","文章を長くしても、内容を見ずに承認している状況は変わりません。かえって作る手間と読む手間が増えます。","正解。役に立っていない手順は、自動化する前に見直します。流れを整理してから Claude を組み込むと、本当に必要な作業の効率が上がります。"],"explanation":"Claude をワークフローに組み込むやり方には、今の手順を助ける強化と、手順そのものを組み立て直す再設計があります。役に立っていない手順をそのまま自動化すると、むだが速く回るだけで、かえって逆効果です。対策講座も、間違った手順を自動化すると裏目に出ると説明しています。組み込む前に、その手順が業務の目的に役立っているかを確かめ、必要なら再設計を選びます。","ref":"試験ガイド 分野4 タスク 4.4（既存のワークフローにClaudeを統合し、ワークフローを強化または再設計する）／ Partner Academy 対策講座 Workflow Integration & Solution Design の概要"},{"id":"D4-13","domain":"D4","topic":"試行からチームへ","type":"multi","question":"イベント運営チームのリーダーが、参加者への案内メールを Claude で下書きする流れを、2人で1か月試しました。作成の時間は半分ほどになり、日時や会場の誤りは、送る前の担当者の確認でその都度直しました。来月から、チームの8人全員でこの流れを使います。広げるときに取るべき対応を2つ選んでください。（2つ選択）","options":["試行では誤りをすべて直せたので、全員に広げる際は送る前の確認を省き、送ったあとで月に一度まとめて確かめる","どの手順を Claude に任せ、送る前に誰が日時や会場を見直すかを、試行で分かった注意点と一緒に書き出して共有する","使い方には人それぞれの合う合わないがあるので、手順は決めずに、各自が自由に工夫して使うよう任せる","広げた後も、誤りの件数と気づいた点を集める担当を決め、決めた時期にその結果をもとに流れを見直す","せっかく広げるので、案内メールに加えて、名簿づくりや会場との連絡の手順も同時に Claude に任せる"],"answer":[1,3],"notes":["誤りを直せたのは、送る前に担当者が確かめていたからです。送ったあとで確かめても、日時や会場の誤りはすでに参加者に届いています。","正解。手順ごとの分担と確認の担当を書き出すと、8人が同じ基準で使えます。誤りの出やすい点を添えると、確認の抜けも防げます。","各自に任せると、誰がどこを確かめるかがあいまいになり、確認の抜けや品質のばらつきが生じます。試行で得た学びもチームに残りません。","正解。人数が増えると、試行では出なかった問題が出ることがあります。結果を集めて見直す仕組みがあれば、効果が続いているかと、直すべき手順を判断できます。","試していない手順まで一度に任せると、問題が起きたときに原因を切り分けられません。広げるのは、効果を確かめた手順からにします。"],"explanation":"試した流れをチームに広げるときは、個人の使い方を、チームの手順に変えます。どの手順を Claude に任せ、誰が何を確かめるかを書き出して共有すれば、人が増えても同じ基準で回せます。対策講座も、手順ごとに AI に任せるか、人が担うか、協働するかを意図して決めることで、個人の成果がワークフローの価値になると説明しています。広げた後も結果を集めて見直し、試していない手順への一度の拡大や、確認の省略は避けます。","ref":"試験ガイド 分野4 タスク 4.4（既存のワークフローにClaudeを統合し、ワークフローを強化または再設計する）／ Partner Academy 対策講座 Workflow Integration & Solution Design の概要（Delegation）"},{"id":"D4-14","domain":"D4","topic":"役員への説明","type":"single","question":"ある部の課長が2か月の試行で、Claude を使うと市場調査の報告書の下書きにかかる時間が半分ほどになることを確かめました。一方で、数字の誤りが毎回いくつか見つかり、担当者が出典と照らして直しています。役員から「それなら調査担当の3人は要らなくなるのか」と聞かれました。最も適切な伝え方はどれですか。","options":["予算を確保しやすくするため、3人の仕事は Claude で置き換えられると答え、確認の手間には触れない","下書きの時間が半分になった結果と、数字の確認に人が欠かせないことを示し、3人の役割を確認と分析に移す案を伝える","数字の誤りが毎回出るので Claude は業務に使えないと答え、下書きの時間が減ったことは報告しない","公開されている一般的な性能の評価を示し、Claude は精度が高いので、確認の手間は小さいと答える"],"answer":[1],"notes":["確認の手間を伏せると、役員は実態より大きな効果を前提に判断します。人を減らした後で、誤りが社外へ出るおそれもあります。","正解。測った効果と、残る限界、人が担う役割をそろえて伝えています。役員は事実に基づいて判断できます。","下書きの時間が半分になったという確かな効果まで伏せるのは、限界を大きく見せすぎています。価値を正確に伝えていません。","一般的な評価は、この業務で実際に出ている誤りの説明になりません。自分たちの試行の結果を伝えるべき場面です。"],"explanation":"ステークホルダーに伝えるときは、価値と限界を、自分たちが確かめた事実で示します。効果を大きく言えば、誤った前提で人員や予算が決まります。限界だけを強調すれば、確かな効果を捨てることになります。ヘルプセンターも、Claude を唯一の情報源として頼らないよう勧めています。測った効果、残る限界、人が担う役割をそろえて伝えることが、正確な説明です。","ref":"試験ガイド 分野4 タスク 4.5（Claudeの価値と限界をステークホルダーに伝える）／ Claude ヘルプセンター: Claude is providing incorrect or misleading responses"},{"id":"D4-15","domain":"D4","topic":"利用者への案内","type":"single","question":"営業企画の担当者が、顧客から届く提案依頼書を Claude に読ませて、求められている要件を一覧にする使い方を試しました。読む時間は大きく減りましたが、50ページを超える依頼書では、付録にある細かい条件がいくつか抜けることがありました。営業部の20人に使い方を案内するときの伝え方として、最も適切なものはどれですか。","options":["要件の洗い出しが速くなることと、長い依頼書では細かい条件が抜けうることを伝え、付録まで原文と照らすよう案内する","要件の多くは本文にあるので、一覧は本文の部分だけを原文と照らせば足りると伝え、提案の準備に使ってよいと案内する","AI は間違えることがあるので、大事な案件では使わないようにと、注意を一言だけ添えて案内する","案内では限界に触れず、すべての一覧の最後に「内容は確認してください」と付けるよう Claude に指示しておく"],"answer":[0],"notes":["正解。試した結果をもとに、何に使えて、どこで誤りが出やすいかを具体的に伝え、確かめ方まで示しています。利用者が自分で正しく判断できます。","試した段階で、抜けが出たのは付録の細かい条件だと分かっています。本文だけを原文と照らす確かめ方では、いちばん抜けやすいところを見逃します。","抽象的な注意だけでは、どの場面で何を確かめればよいかが分かりません。読む時間が減るという役に立つ使い方まで避けられてしまいます。","決まり文句の注意書きは、何を確かめるべきかを伝えません。見慣れると読み飛ばされ、案内の代わりになりません。"],"explanation":"Claude の限界を伝えるときは、「間違えることがある」という一般論ではなく、この使い方でどこが弱く、どう確かめればよいかを、試した結果に基づいて具体的に示します。ここでは、長い依頼書で付録の細かい条件が抜けうることが、伝えるべき弱点で、確かめる範囲も付録まで示します。ヘルプセンターも、Claude を唯一の情報源にしないよう勧めています。得意なこと、弱いところ、確かめる方法をそろえて伝えると、利用者は効率を落とさずに安全に使えます。価値と限界は、どちらか一方ではなく、両方をそろえて伝えます。","ref":"試験ガイド 分野4 タスク 4.5（Claudeの価値と限界をステークホルダーに伝える）／ Claude ヘルプセンター: Claude is providing incorrect or misleading responses"},{"id":"D4-16","domain":"D4","topic":"顧客の期待をそろえる","type":"multi","question":"社外のコンサルタントが、顧客企業の営業部に、提案書づくりへの Claude の導入を提案しています。顧客の部長は「Claude を入れれば、提案書は自動で完成し、顧客管理の仕組みにも自動で記録されるのだろう」と期待しています。最初の打ち合わせで行うべきことを2つ選んでください。（2つ選択）","options":["顧客が実演用に選んだ、使ってよい資料で短く実演し、うまくいく点と、誤りが出た点を一緒に見せる","契約につなげやすいよう、Claude はどんな業務も正確にこなせると説明し、確認の話は導入後にする","誤りの可能性を強調し、成果は約束できないので、効果の見込みは何も示さない","Claude に「この会社の業務でどれだけ効果が出るか」を予測させ、その数字を効果の見込みとして示す","Claude に任せる作業、人が確認する作業、技術担当が別に作る必要がある部分を、分けて示す"],"answer":[0,4],"notes":["正解。顧客が使ってよいと選んだ資料で見せると、自社の業務に近い形で価値も限界も具体的に伝わります。誤りが出た点を隠さないことで、期待が実態に近づきます。","限界を伏せて期待をあおると、導入後に誤りが出たときに信頼を失います。確認の手間を後から知った顧客は、計画を立て直すことになります。","限界だけを強調して見込みを示さないと、顧客は導入する価値があるかを判断できません。価値を正確に伝えることも求められています。","Claude が予測した数字は、この会社の業務で測った結果ではありません。根拠のない見込みを示すことになります。","正解。役割の分け方を先に示すと、人の確認にかかる手間や、技術担当に頼む範囲を顧客が見込めます。Claude だけでは届かない部分も正確に伝わります。"],"explanation":"社外のコンサルタントが顧客に Claude を提案するときも、価値と限界を正確に伝えることが求められます。顧客が実演用に選んだ資料で試して見せれば、効果と誤りの出方が具体的に分かります。また、Claude は、つながれていない仕組みに記録したり、メールを送ったりすることはできません。任せる作業、人が確認する作業、技術担当に頼む部分を分けて示すと、顧客は必要な手間と体制を見込めます。","ref":"試験ガイド 分野4 タスク 4.5（Claudeの価値と限界をステークホルダーに伝える）、§3（エスカレーション）／ Claude ヘルプセンター: Claude is producing links that don't work and falsely claiming that it has sent emails"},{"id":"D5-01","domain":"D5","topic":"仕事ごとに分ける","type":"single","question":"広報担当者は、プレスリリースの作成、社内報の記事、イベントの予算管理の3つを、すべて1つのプロジェクトで進めています。指示の欄には「報道向けに硬い文体で」「社員向けに親しみやすい文体で」のような仕事ごとの決まりが混ざって書かれ、ナレッジにも3つの仕事の資料がまとめて入っています。社内報の記事が報道向けの硬い文体で出てくるなど、別の仕事の決まりが混ざります。最も適切な設定の直し方はどれですか。","options":["1つのプロジェクトのまま、チャットを始めるたびに、どの仕事の話かを最初に伝える","指示の欄は空にして、3つの仕事の決まりを、すべてナレッジのメモに移しておく","仕事ごとにプロジェクトを分け、それぞれに、その仕事の指示と資料だけを入れる","食い違う決まりを読み分けられるよう、最も高性能なモデルの種類に切り替える"],"answer":[2],"notes":["毎回伝えても、指示の欄には別の仕事の決まりが残り、すべてのチャットに効き続けます。伝え忘れたときにも混ざります。","決まりをナレッジに移すと、守らせたいルールが参照用の資料に埋もれます。仕事ごとの決まりが1か所に混ざっていることも変わりません。","正解。プロジェクトの指示とナレッジは、そのプロジェクトのすべてのチャットに使われます。仕事ごとに分ければ、それぞれの仕事に合う決まりと資料だけが効きます。","原因は、1つの指示に別々の仕事の決まりが混ざっていることです。モデルを替えても、食い違う決まりが毎回すべて渡されることは変わりません。"],"explanation":"プロジェクトは、テーマごとに、チャットの履歴とナレッジを持つ作業場所です。指示とナレッジはそのプロジェクトのすべてのチャットに効くので、決まりの違う仕事を1つにまとめると、別の仕事の決まりや資料が混ざります。ヘルプセンターも、関連する資料を同じプロジェクトにまとめるよう勧めています。プロジェクトは、同じ指示と資料で繰り返す仕事のまとまりごとに作ります。","ref":"試験ガイド 分野5 タスク 5.1（指示とナレッジソースを使ってClaudeのプロジェクトを設定する）／ Claude ヘルプセンター: What are projects?、How can I create and manage projects?、Retrieval augmented generation (RAG) for projects"},{"id":"D5-02","domain":"D5","topic":"説明欄は見えない","type":"single","question":"マーケティング担当者が、新しいプロジェクトを作るときに、プロジェクトの説明欄へ「回答はです・ます調で、見出しを付けること」と書きました。ところが、そのプロジェクトのチャットでは、この書き方がまったく守られません。最も可能性の高い原因と、その対応はどれですか。","options":["説明欄の文が短すぎて伝わっていないので、説明欄に条件をもっと詳しく書き足す","プロジェクトの説明は Claude からは見えないので、同じ内容をプロジェクトの指示に書く","選んでいるモデルの能力が足りないので、より高性能なモデルの種類に替える","説明欄はチャットごとに読み込み直す必要があるので、毎回「説明欄を読んで」と頼む"],"answer":[1],"notes":["ヘルプセンターによると、プロジェクトの名前と説明は Claude からは見えません。説明欄に何を書き足しても、回答には反映されません。","正解。プロジェクトの名前と説明は Claude からは見えません。すべてのチャットで守らせたい振る舞いは、プロジェクトの指示に書きます。","まったく守られないのは、能力の問題ではなく、条件が Claude に届いていないためです。モデルを替えても解決しません。","説明欄は Claude から見えないので、読むように頼んでも読めません。存在しない仕組みを前提にした対処です。"],"explanation":"設定がまったく効かないときは、まず、その設定が Claude に届く場所に書かれているかを確かめます。ヘルプセンターは、プロジェクトの名前と説明は Claude からは見えないとしています。すべてのチャットに効かせたい振る舞いはプロジェクトの指示に、参照させたい資料はナレッジに入れます。","ref":"試験ガイド 分野5 タスク 5.1（指示とナレッジソースを使ってClaudeのプロジェクトを設定する）／ Claude ヘルプセンター: How can I create and manage projects?"},{"id":"D5-03","domain":"D5","topic":"指示と資料の置き分け","type":"single","question":"営業チームのプロジェクトでは、プロジェクトの指示の欄に、30ページ分の製品カタログの文章がそのまま貼られています。一方、「価格はカタログの表から引用し、値引きの約束はしない」といった回答のルールは、ナレッジにアップロードしたメモの中に書かれています。回答が、このルールを守らないことがあります。最も適切な直し方はどれですか。","options":["指示の欄の最後に、「ルールを必ず守ること」と太字で書き足す","カタログもルールも、すべて指示の欄にまとめて貼り直す","製品ごとにプロジェクトを分け、それぞれに同じ構成をそのまま写す","カタログはナレッジに移し、回答のルールは短く整理して指示に書く"],"answer":[3],"notes":["ルールの本文はナレッジの中のままで、指示の欄はカタログで埋まったままです。強調の一文を足すだけでは、置き場所の問題が残ります。","指示を長くすると、守らせたいルールが大量の資料に埋もれます。ヘルプセンターも、指示は要点に絞って短く保つよう勧めています。","分けても、どのプロジェクトでも資料とルールの置き場所は逆のままです。手間が増えるだけで原因に答えていません。","正解。参照する資料はナレッジに、すべての回答で守らせたい振る舞いは指示に置きます。指示を要点に絞ると、ルールが埋もれません。"],"explanation":"プロジェクトの設定では、置き場所を使い分けます。指示は、役割、口調、守るべきルールのような、すべての回答に効かせたい振る舞いを書く場所です。ナレッジは、カタログや規程のような、必要なときに参照させる資料の置き場です。資料を指示に詰め込み、ルールを資料の中に置くと、守らせたいことが伝わりにくくなります。","ref":"試験ガイド 分野5 タスク 5.1（指示とナレッジソースを使ってClaudeのプロジェクトを設定する）／ Claude ヘルプセンター: How can I create and manage projects?、How do usage and length limits work?"},{"id":"D5-04","domain":"D5","topic":"ナレッジを整理する","type":"single","question":"品質管理の担当者のプロジェクトには、「資料1.pdf」や「最終版(2).pdf」のような名前のファイルが50以上入っていて、もう使わない古い検査記録も混ざっています。特定の検査手順を聞くと、関係のない資料をもとに答えることがあります。最も適切な対応はどれですか。","options":["中身の分かるファイル名に直し、使わない資料を外し、質問では資料の名前を挙げる","ファイルの数を減らすため、50以上の資料を1つの PDF にまとめて入れ直しておく","プロジェクトの指示に、「必ず正しい資料を見て答えること」という一文を書き足しておく","資料の読み取りの精度を上げるため、最も高性能なモデルの種類に切り替えて使う"],"answer":[0],"notes":["正解。ヘルプセンターは、中身の分かるファイル名を付けること、質問で資料の名前を挙げること、使わないファイルを整理することを勧めています。関係のない資料が引かれにくくなります。","1つにまとめると、ファイル名で資料を見分けられず、質問で資料の名前を挙げて絞り込むこともできません。使わない記録も混ざったままです。","どれが正しい資料かが Claude に分からない状態のまま、守るよう頼んでいるだけです。ナレッジの整理という原因に答えていません。","ファイル名からも中身が分からず、古い資料も混ざったままでは、モデルを替えても取り違えは残ります。規模で解決しようとする対処です。"],"explanation":"アップロードしたナレッジは、置いて終わりではなく、管理するものです。ヘルプセンターによると、プロジェクトのナレッジが大きくなると、Claude は必要な部分を検索して取り出す方式に切り替わります。そのため、中身の分かるファイル名、使わない資料の整理、質問での資料名の指定が効きます。答えの質は、ナレッジがどれだけ整っているかに左右されます。","ref":"試験ガイド 分野5 タスク 5.2（アップロードしたナレッジとコネクタを管理する）／ Claude ヘルプセンター: Retrieval augmented generation (RAG) for projects、How do usage and length limits work?"},{"id":"D5-05","domain":"D5","topic":"コネクタの使い分け","type":"multi","question":"広報担当者は、Google Drive と Gmail のコネクタを有効にしたまま、Drive にある1本のプレスリリースの要約を Claude に頼みました。すると、関係のないメールの内容まで回答に混ざり、返答にも時間がかかりました。この作業で取るべき対応はどれですか（2つ選択）。","options":["Gmail のコネクタは有効のまま、依頼文に「メールは読まないで」と書き添える","このチャットでは、作業に要らない Gmail のコネクタをオフにする","今後は混ざらないよう、すべてのコネクタを解除し、二度と使わないことにする","Claude が見られる範囲を広げるため、共有ドライブ全体へのアクセスを管理者に求める","要約してほしいプレスリリースのファイルを指定して、チャットに追加する"],"answer":[1,4],"notes":["頼むだけでは、メールを調べられる状態は変わりません。モデルへのお願いで済ませていて、要らない機能を外していません。","正解。コネクタはチャットごとにオンとオフを切り替えられます。ヘルプセンターも、ツールやコネクタは多くのコンテキストを使うので、要らないものはオフにするよう勧めています。","要らない機能を外すのはよいのですが、すべてを永久にやめるのは極端です。Drive の資料を使う作業にも使えなくなります。","見られる範囲を広げると、関係のない情報がさらに混ざりやすくなります。いまの問題とは逆の方向の対処です。","正解。Drive から特定のファイルを選んでチャットに追加すれば、何を要約するかがはっきりします。関係のない情報を探しに行く必要もなくなります。"],"explanation":"コネクタは、つなげば多いほどよいものではありません。その作業に要るものだけを有効にし、使う資料ははっきり指定します。ヘルプセンターは、コネクタをチャットごとに切り替えられること、要らないコネクタはオフにすること、使わないサービスは解除することを勧めています。お願いの一文ではなく、設定そのものを作業に合わせるのが管理です。","ref":"試験ガイド 分野5 タスク 5.2（アップロードしたナレッジとコネクタを管理する）／ Claude ヘルプセンター: Use connectors to extend Claude's capabilities、Use Google Workspace connectors"},{"id":"D5-06","domain":"D5","topic":"コネクタと権限","type":"single","question":"人事部の担当者が、Google Drive のコネクタを使って、役員会の資料フォルダの中身を要約するよう Claude に頼みました。ところが、該当するファイルが見つからないと返ってきました。担当者は、そのフォルダを開く権限を持っていません。最も適切な対応はどれですか。","options":["Claude なら会社の Drive をすべて見られるはずなので、つなぎ直して何度か頼み直す","フォルダを開ける同僚に資料をダウンロードしてもらい、チャットに貼り付けて要約させる","Claude はつないだ人の権限の範囲しか見られないので、持ち主に閲覧の許可を求める","リサーチならふだん見られない資料も調べられるので、リサーチに切り替えて要約させる"],"answer":[2],"notes":["コネクタは、つないだ人がもともと見られるものしか見られません。つなぎ直しても、見られる範囲は変わりません。","権限のない資料を回り道で手に入れることになり、会社のアクセスの管理をすり抜けます。ルールに沿った手ではありません。","正解。コネクタは、つないだサービスでのその人の権限を引き継ぎ、権限を広げることはありません。本当に必要な資料なら、持ち主に正規の手続きで閲覧の許可を求めます。","リサーチも、有効にしたコネクタを通じて調べるだけで、権限は広がりません。存在しない抜け道を前提にしています。"],"explanation":"コネクタの管理では、Claude が何を見られるかを正しく理解することが出発点です。ヘルプセンターによると、Claude はつないだサービスでのその人の権限を引き継ぎ、元のサービスで見られないものは見られません。見えないのは不具合ではなく、権限が正しく働いている結果です。必要な資料は、会社のルールに沿った手続きで手に入れます。","ref":"試験ガイド 分野5 タスク 5.2（アップロードしたナレッジとコネクタを管理する）／ Claude ヘルプセンター: Use connectors to extend Claude's capabilities、Use Google Workspace connectors"},{"id":"D5-07","domain":"D5","topic":"指示を具体的にする","type":"single","question":"カスタマーサポートのチームは、問い合わせへの返信案を作るプロジェクトの指示に、「いい感じに丁寧に答えて」とだけ書いています。返信案の長さ、言葉づかい、構成がチャットごとにばらつき、そのまま使える返信案が少なくなっています。指示の直し方として最も適切なものはどれですか。","options":["「丁寧に」を「必ず、絶対に丁寧に」に書き換え、目立つ記号で強調しておく","これまでの返信のやり取りを、参考のためにすべて、指示の欄にそのまま貼っておく","指示の欄は空にして、各メンバーが毎回の依頼で、自分の言葉で条件を伝えるようにする","役割、読み手、口調、返信の構成と長さ、分からないときの扱いを具体的に書く"],"answer":[3],"notes":["強調しても、何をもって丁寧とするかは書かれていません。長さや構成のばらつきの原因である、条件のあいまいさが残ります。","大量のやり取りを貼ると、守らせたい要点が埋もれます。ヘルプセンターも、指示は要点に絞って短く保つよう勧めています。","条件を各自に任せると、人ごとに伝える内容が違い、ばらつきがかえって大きくなります。設定でそろえる利点を捨てています。","正解。システムレベルの指示には、すべての返信に共通する条件を具体的に書きます。役割、読み手、口調、構成と長さ、分からないときの扱いが決まれば、出力がそろいます。"],"explanation":"効果的なシステムレベルの指示は、毎回のプロンプトで伝えていた共通の条件を、具体的な言葉で一度だけ書いたものです。あいまいな言葉を強めても、何をしてほしいかは伝わりません。公式のプロンプトのガイドも、明確で直接的な指示を勧めています。指示は短く要点に絞り、資料はナレッジに分けて置きます。","ref":"試験ガイド 分野5 タスク 5.3（効果的なシステムレベルの指示を作成する）／ Claude Docs: Prompting best practices ／ Claude ヘルプセンター: How do usage and length limits work?"},{"id":"D5-08","domain":"D5","topic":"一度きりはチャットへ","type":"single","question":"営業チームの5人が共有するプロジェクトで、提案書の下書きを作っています。ある担当者が、海外の1社に一度だけ出す提案書のために、プロジェクトの指示へ「回答は英語で書くこと」と書き足しました。その日から、ほかのメンバーが国内の顧客向けに作る下書きまで、英語で返ってくるようになりました。最も適切な直し方はどれですか。","options":["指示から英語の一文を外し、英語で書く依頼は、その提案書を作るチャットの中で伝える","指示の一文はそのままにして、ほかのメンバーが毎回の依頼に「日本語で書いて」と添える","英語の提案書のために、同じ指示とナレッジを写した英語用のプロジェクトをもう1つ作る","同じことが起きないよう、共有をやめて、5人がそれぞれ自分用のプロジェクトを作る"],"answer":[0],"notes":["正解。プロジェクトの指示は、そのプロジェクトのすべてのチャットに使われます。一度きりの依頼はチャットに書き、指示には全員の仕事に共通する決まりだけを置きます。","一度きりの依頼のために、ほかの4人に毎回の手間を負わせています。添え忘れたチャットでは、英語のまま出てきます。","一度だけの提案書のために設定を複製すると、同じ指示とナレッジを2か所で保守することになります。チャットで伝えれば足りる依頼には重すぎます。","共有をやめると、指示と資料をそろえて使う利点を捨てることになります。原因は、指示に一度きりの依頼を書いたことです。"],"explanation":"システムレベルの指示（プロジェクトの指示）は、そのプロジェクトのすべてのチャットに効きます。共有のプロジェクトでは、1人が書き足した一文が、全員の出力を変えます。ヘルプセンターも、プロジェクトの指示は要点に絞り、その作業だけの指示はチャットの中で伝えるよう勧めています。指示に書き足す前に、それがすべての会話に当てはまる決まりかを確かめます。","ref":"試験ガイド 分野5 タスク 5.3（効果的なシステムレベルの指示を作成する）／ Claude ヘルプセンター: How can I create and manage projects?、How do usage and length limits work?"},{"id":"D5-09","domain":"D5","topic":"答えがないときの扱い","type":"single","question":"製品サポートのチームは、製品マニュアルをナレッジに入れたプロジェクトで、顧客への回答案を作っています。マニュアルに書かれていない質問にも、Claude がもっともらしい操作手順を答えてしまうことがあります。プロジェクトの指示に加える内容として最も適切なものはどれですか。","options":["「回答のたびに、自分の答えの確信度を100点満点で採点し、回答の末尾に必ず書き添える」","「マニュアルの内容にもとづいて答え、載っていなければ分からないと伝えて窓口を案内する」","「顧客を待たせないよう、マニュアルにない内容は一般的な知識で補って、すぐに手順を答える」","「間違えると会社の信用にかかわるので、どんな質問でも、何があっても絶対に間違えないこと」"],"answer":[1],"notes":["自己申告の確信度は、正しさの当てになる目安ではありません。もっともらしい誤りを高く採点することもあります。","正解。公式のドキュメントは、渡した資料の情報だけを使わせることと、分からないと言ってよいと伝えることを、作り話を減らす方法に挙げています。分からないときの行き先も決めておきます。","一般的な知識で補わせると、マニュアルにない手順を作り出す原因をそのまま指示に書くことになります。","強い言葉で頼んでも、分からないときにどうするかは書かれていません。確率的な後押しにとどまります。"],"explanation":"システムレベルの指示には、答えがないときにどうするかも書きます。公式のドキュメントは、渡した資料の情報だけを使うよう指示することと、分からないと言ってよいと伝えることで、作り話を減らせるとしています。そのうえで、人への引き継ぎ先を決めておけば、顧客を待たせずに済みます。これらの方法でも誤りは完全にはなくならないので、重要な回答は人が確かめます。","ref":"試験ガイド 分野5 タスク 5.3（効果的なシステムレベルの指示を作成する）／ Claude Docs: Reduce hallucinations"},{"id":"D5-10","domain":"D5","topic":"古い版に気づいたら","type":"single","question":"カスタマーサポートの10人が共有するプロジェクトで、ある担当者が、ナレッジに入っている製品保証の受付条件が、先月改定される前の版だと気づきました。この担当者には、プロジェクトの指示やナレッジを変える権限がありません。プロジェクトの設定は、チームリーダーが管理しています。最も適切な対応はどれですか。","options":["自分のチャットでだけ、新しい受付条件のファイルを毎回添付してから回答案を作る","新しい受付条件を入れた自分用のプロジェクトを作り、自分はそちらで回答案を作る","チームリーダーに古い版であることと新しい版のありかを伝え、差し替えを頼む","自分のチャットで「新しい条件で答えて」と Claude に伝え、チーム全体に反映させる"],"answer":[2],"notes":["自分の回答案は直っても、ほかの9人のチャットでは古い版が使われ続けます。原因であるナレッジの古い版も残ります。","設定が2つに分かれ、チームのプロジェクトは古いままです。自分だけが新しい版を使う状態は、食い違いと保守の手間を増やします。","正解。原因はナレッジの古い版で、直せるのは編集の権限を持つ人です。気づいた人が管理する人に伝えて元の設定を直してもらえば、チーム全員の回答に反映されます。","チャットで伝えた内容は、ほかのチャットとは共有されません。ナレッジの古い版も残ったままで、ほかのメンバーには届きません。"],"explanation":"設定を最新に保つことには、気づいた変更を、設定を直せる人に届けることも含まれます。共有のプロジェクトでは、編集の権限を持つメンバーが指示とナレッジを変えられ、その変更はプロジェクトのすべてのチャットに効きます。自分のチャットだけで補うと、ほかのメンバーには古い設定が残ります。古い版に気づいたら、管理する人に伝えて、元の設定を直してもらいます。","ref":"試験ガイド 分野5 タスク 5.4（Claudeの設定、ナレッジソース、指示に情報を反映し、維持、更新する）／ Claude ヘルプセンター: How can I create and manage projects?"},{"id":"D5-11","domain":"D5","topic":"変わる資料は元から","type":"single","question":"総務担当者は、自分専用のプロジェクトで、社員からの問い合わせへの返信案を作っています。各部署の担当窓口の一覧は Google ドキュメントで管理され、人事異動のたびに更新されます。ところが、半年前にダウンロードした PDF をナレッジに入れたままなので、異動前の担当者の名前が返信案に出ます。窓口の一覧は社外には公開されていません。最も適切な対応はどれですか。","options":["PDF はそのままにして、プロジェクトの指示に「最新の窓口で答えること」と書き足す","リサーチを使ってウェブを調べさせ、最新の担当窓口を見つけてから返信案を作らせる","古い名前が出たら、そのたびに正しい担当者をチャットで伝えて、そのつど直させる","古い PDF を外し、Drive から窓口一覧の Google ドキュメントを追加して同期させる"],"answer":[3],"notes":["ナレッジにある一覧は古いままなので、Claude は最新の窓口を知りようがありません。頼むだけで、原因の古い資料が残ります。","窓口の一覧は社外に公開されていないので、ウェブを調べても見つかりません。社内の資料を最新に保つという問題に答えていません。","毎回直すのは症状への対処です。古い資料が残るので、同じ誤りが繰り返されます。","正解。ヘルプセンターによると、Google Drive から追加した Google ドキュメントは、Drive の最新版と同期します。変わり続ける資料は、写しではなく元の資料につなぎます。"],"explanation":"ナレッジに入れたファイルの写しは、入れた時点のままです。毎月変わる資料は、元の資料とつないで最新に保つか、更新のたびに差し替える手順を決めておきます。ヘルプセンターによると、Google ドキュメントはチャットやプロジェクトに追加すると Drive と同期します。2026年11月時点では、共有のプロジェクトでは Drive から追加できないとされているので、その場合は差し替えの担当と時期を決めます。","ref":"試験ガイド 分野5 タスク 5.4（Claudeの設定、ナレッジソース、指示に情報を反映し、維持、更新する）／ Claude ヘルプセンター: Use Google Workspace connectors"},{"id":"D5-12","domain":"D5","topic":"設定を保守する","type":"multi","question":"人材開発チームの共有プロジェクトは、半年前に作ってから一度も見直されていません。その間に研修の制度の名前が変わり、チームのメンバーも入れ替わりました。最近は、出てきた資料の同じ箇所を、毎回人が手で直してから使っています。この状況で取るべき対応はどれですか（2つ選択）。","options":["古い設定が残らないよう、毎週プロジェクトを一から作り直すことにする","古くなった情報は Claude が自分で見つけて直すよう、指示に書いておく","指示とナレッジの担当者を決め、制度の変更に合わせて見直す時期を決める","誰でも資料を追加できるようにして、確認なしでナレッジを増やしていく","毎回同じように手で直している点を、指示やナレッジの修正として反映する"],"answer":[2,4],"notes":["毎週作り直すのは極端で、手間がかかるうえ、うまくいっている設定まで捨てることになります。","Claude は、制度の名前が社内で変わったことを自分では知りません。原因である古い設定を、モデルへのお願いで済ませています。","正解。担当者と見直しの時期を決めておくと、設定が知らないうちに古くなるのを防げます。制度の変更のような出来事を、見直しのきっかけにします。","確認なしで資料を増やすと、古い版や食い違う資料が混ざりやすくなります。保守ではなく、混乱の原因を増やします。","正解。毎回同じ手直しをしているのは、設定が現状に合っていない合図です。その直しを指示やナレッジに反映すれば、次からは直す必要がなくなります。"],"explanation":"設定は、一度作れば終わりではありません。制度や用語、メンバーが変われば、指示とナレッジも古くなります。持ち主と見直しの時期を決め、使う人の手直しを設定に戻す流れを作ると、設定が現状に合ったまま保たれます。公式の対策講座も、設定が知らないうちに古くならないよう、保守の周期を持つことを扱っています。","ref":"試験ガイド 分野5 タスク 5.4（Claudeの設定、ナレッジソース、指示に情報を反映し、維持、更新する）／ Claude ヘルプセンター: How can I create and manage projects?"},{"id":"D6-01","domain":"D6","topic":"採用選考での使い方","type":"single","question":"人事部の採用担当者が、中途採用の募集に集まった約300件の応募書類を前に、Claude で書類選考の負担を減らしたいと考えています。書類選考の結果は応募者の将来に大きく影響し、会社は公開した選考基準に沿って判断することを約束しています。最も適切な使い方はどれですか。","options":["選考基準に照らして Claude に応募書類を点数順に並べさせ、上位の100件だけを担当者が読んで合否を決める","選考基準に沿って Claude に各応募書類の要点を整理させ、採用担当者が全員分を確かめて合否を決める","応募者に不利益が出るおそれがあるので、書類選考に Claude を使うのはやめ、担当者だけで全件を読む","Claude に「性別や年齢で差をつけず公平に評価して」と指示し、その評価結果をそのまま選考結果にする"],"answer":[1],"notes":["担当者が読むのは上位の書類だけで、残りの約200人は Claude の順位だけで不採用になります。影響の大きい判断の一部を、人の確認なしに Claude に委ねています。","正解。情報の整理という Claude が得意な部分を任せ、合否という影響の大きい判断は、権限を持つ担当者が中身を確かめて下します。負担を減らしつつ、責任の所在も保てます。","リスクを理由に業務での活用そのものをやめる、極端な対処です。最終判断を人が担う形にすれば、整理の手間を減らす価値は安全に得られます。","公平にするよう頼むだけでは、偏りが出ないことを確かめる手段になりません。結果をそのまま使えば、人の判断を通さずに合否が決まってしまいます。"],"explanation":"適切なユースケースかどうかは、「Claude にできるか」ではなく、「間違えたときに誰がどれだけ影響を受けるか」と「人が確かめて直せるか」で決まります。採用のように個人に大きな影響が出る判断では、Claude には情報の整理や下書きを任せ、判断そのものは権限を持つ人が中身を確かめて下します。上位だけを人が読む形は、残りの応募者については Claude が決めたのと同じです。2026年11月時点の Anthropic の利用ポリシーも、応募者の選別のような雇用に関わる高リスクの用途では、資格のある人が内容を意味のある形で確認し、変更できることを求めています。「全部任せる」と「全部やめる」の間にある、役割を分ける形が最善になります。","ref":"試験ガイド 分野6 タスク 6.1（適切なユースケースと不適切なユースケースを特定する） ／ Anthropic 利用ポリシー（高リスクの用途の要件）"},{"id":"D6-02","domain":"D6","topic":"任せてよい業務の見分け","type":"single","question":"社外コンサルタントが、ある保険会社の Claude の導入を支援しています。クライアントは、Claude を使う業務を「誤りがあっても影響が小さいこと」と「出力が顧客に届く前に社員が中身を確かめられること」の2つを満たすものに限りたいと考えています。この条件に最も合う業務はどれですか。","options":["保険金の請求ごとに Claude に支払いの可否を判定させ、金額の大きい請求だけを担当者が確かめてから通知する","顧客ごとに合いそうな保険商品を Claude に選ばせ、担当者が文面だけを整えてから提案のメールを送る","代理店との契約書の確認を Claude に任せ、問題なしとされた契約は法務部門の確認を省いて締結する","承認済みの社内マニュアルをもとに FAQ を Claude に下書きさせ、担当者が確かめてから公開する"],"answer":[3],"notes":["金額が小さくても、支払いの可否は契約者一人ひとりに直接響く判断です。大きい請求だけを確かめる形では、残りの判定が人の確認なしに顧客に届き、2つの条件のどちらも満たしません。","担当者が直すのは文面だけで、その商品が顧客に合うかという判断は Claude のまま顧客に届きます。確認が見た目の手直しにとどまっています。","契約の内容の判断は専門家の確認が必要な領域です。法務の確認を省くと、誤りが見つからないまま契約が結ばれます。","正解。承認済みの資料という確かめられる元があり、公開前に担当者が照らし合わせられます。誤りがあっても公開前に止められるので、2つの条件を満たします。"],"explanation":"Claude に任せてよい業務かどうかは、誤ったときに誰がどれだけ影響を受けるかと、出力を人が確かめられるかで見分けます。支払いの可否、商品の推薦、契約の判断のように、相手に直接影響する判断は、一部だけを確かめる、文面だけを整える、専門家の確認を省くといった形では、人が確かめたことになりません。承認済みの社内資料をもとにした下書きは、元の資料と照らして公開前に誤りを止められるので、2つの条件を満たします。人が関わっているかどうかではなく、人が中身を確かめて止められるかどうかが判断の軸です。","ref":"試験ガイド 分野6 タスク 6.1（適切なユースケースと不適切なユースケースを特定する） ／ Anthropic 利用ポリシー（高リスクの用途の要件）"},{"id":"D6-03","domain":"D6","topic":"作れても使えない用途","type":"single","question":"マーケティング担当者が、新商品の紹介ページに載せる「お客様の声」を用意しています。本物の感想は2件しか集まっておらず、同僚から「Claude なら自然な感想を10件くらいすぐ作れる」と提案されました。会社は、広告で誤解を招く表現をしないことを方針にしています。最も適切な対応はどれですか。","options":["Claude に感想を10件作らせ、架空の名前を付けて、お客様から寄せられた声として掲載する","Claude に感想を作らせ、それぞれに「個人の感想です」と注記を付けたうえで掲載する","作った感想を掲載してよいかを Claude に尋ね、問題ないという答えが返ってきたら掲載する","本物の2件を本人の了承を得て載せ、Claude には感想を集めるアンケートの文面づくりを手伝わせる"],"answer":[3],"notes":["実在しない顧客の感想を本物として載せるのは、読み手をだます使い方です。Claude が自然な文章を作れることは、その用途が適切だという理由になりません。","注記を付けても、作られた文章が顧客の声として示されることは変わりません。見た目を整えるだけで、誤解を招くという問題は残ります。","掲載してよいかは、会社の方針と、読み手をだますかどうかで人が判断することです。Claude の答えは、その判断の代わりになりません。","正解。本物の声だけを了承のうえで使い、足りない分は本物の声を集める手順に Claude を使います。誤解を招かずに、集める手間も減らせます。"],"explanation":"Claude が出力を作れることと、その使い方が適切であることは別の問題です。実在しない人の感想を本物として示すことは、読み手をだます使い方で、Anthropic の利用ポリシーも偽のレビューを作ることを禁じています。注記を足す、Claude に許可を尋ねるといった対処は、だます構造そのものを変えません。目的が「信頼できる声を載せること」なら、本物の声を集める作業を Claude で効率化するのが、目的とルールの両方に沿う使い方です。","ref":"試験ガイド 分野6 タスク 6.1（適切なユースケースと不適切なユースケースを特定する） ／ Anthropic 利用ポリシー（誤解を招く活動の禁止）"},{"id":"D6-04","domain":"D6","topic":"一般の案内と個別の判断","type":"single","question":"総務部の担当者が、社員からの問い合わせへの返信の下書きに Claude を使っています。問い合わせには、休暇の申請の手順のような社内の決まりについてのものと、「持病があるが夜勤に入ってよいか」「この薬を飲んで社用車を運転してよいか」のような、本人の体の状態に当てはめた判断を求めるものが混じっています。社内には産業医がいます。最も適切な使い方はどれですか。","options":["社内の決まりの質問は規程をもとに下書きさせ、体の状態についての質問は産業医や医療機関への相談を案内する","体の状態についての質問にも Claude に答えを下書きさせ、総務の担当者が内容を確かめてから返信する","体の状態についての質問にも Claude に答えさせ、返信の最後に「医師の判断ではありません」と書き添える","体の状態についての質問が混じるので、問い合わせへの返信には Claude を使わず、総務がすべて一から書く"],"answer":[0],"notes":["正解。規程に基づく案内は、総務が元の規程と照らして確かめられる、Claude に向いた仕事です。一人ひとりの体の状態に当てはめた判断は、資格のある専門家に任せます。","総務の担当者には、体の状態に当てはめた判断が正しいかを確かめる専門知識がありません。資格のない人の確認は、専門家の確認の代わりになりません。","注意書きを付けても、本人の状態に当てはめた判断を Claude が返していることは変わりません。読んだ社員は、その答えを頼りに行動してしまいます。","規程の案内のように、Claude に任せて確かめられる仕事まで手放す、極端な対処です。分けるべきなのは質問の種類で、道具そのものではありません。"],"explanation":"同じ問い合わせの業務の中にも、Claude に向く仕事と向かない仕事が混じっています。社内の決まりの案内のように、元の資料と照らして確かめられるものは任せやすく、本人の体の状態に当てはめた判断のように、誤りが健康や安全に直接響き、資格のある人にしか確かめられないものは任せません。2026年11月時点の Anthropic の利用ポリシーも、一般的な情報の説明と、個人に向けた医療の判断を分けて扱い、後者には資格のある人の確認を求めています。業務を丸ごと任せるか丸ごとやめるかではなく、問い合わせの種類で線を引くのが判断の軸です。","ref":"試験ガイド 分野6 タスク 6.1（適切なユースケースと不適切なユースケースを特定する） ／ Anthropic 利用ポリシー（高リスクの用途の要件）"},{"id":"D6-05","domain":"D6","topic":"共有範囲と機密資料","type":"single","question":"人事部のマネージャーが、就業規則をナレッジに入れたプロジェクトを作り、社員が規則について質問できるよう、組織の全員が使える設定にしています。今度は、社員一人ひとりへの評価のフィードバックの下書きにもこのプロジェクトを使おうと考え、全社員の評価結果をまとめたファイルをナレッジに加えようとしています。最も適切な対応はどれですか。","options":["評価結果のファイルは全員が使えるプロジェクトには入れず、人事の担当者だけを招いたプロジェクトで扱う","ファイルを加えたうえで、プロジェクトの指示に「人事部以外の人には評価結果を答えない」と書いておく","中身が推測されないように、ファイル名を「資料A」のような名前に変えてからナレッジに加える","情報が漏れるおそれがあるので、全員が使えるプロジェクトを削除し、人事の資料はプロジェクトで扱わない"],"answer":[0],"notes":["正解。プロジェクトを共有すると、使える人はナレッジの中身も見られます。評価結果は、見てよい人だけを招いたプロジェクトに分けて置くのが、共有の範囲そのものを正しくする手です。","指示は Claude の応答の仕方を導くもので、アクセスを制限する仕組みではありません。プロジェクトを使える人は、ナレッジのファイル自体を見られます。","名前を変えても、中身は全員が見られる場所に置かれたままです。見た目を変えるだけで、共有の範囲の問題は解決しません。","全社向けのプロジェクトには就業規則の質問に答えるという正当な役割があります。機密の資料を分ければ済むのに、仕組みごとやめるのは行き過ぎです。"],"explanation":"プロジェクトのナレッジは、そのプロジェクトを共有された人が見られます。ヘルプセンターも、閲覧の権限を持つメンバーはプロジェクトの内容、ナレッジ、指示を見られると説明しています。機密性の高い資料は、「誰が見てよいか」に合わせて置き場所と共有の範囲を決めます。「答えないで」という指示や名前の変更は、Claude に頼むか見た目を変えるだけで、アクセスの管理にはなりません。","ref":"試験ガイド 分野6 タスク 6.2（データの機密性、規制、プライバシーに関する考慮事項を適用する） ／ Claude ヘルプセンター: Project visibility and sharing"},{"id":"D6-06","domain":"D6","topic":"見えても使えない情報","type":"single","question":"プロジェクトマネージャーが Google Drive のコネクタを使い、Claude にチームの予算の資料を探させました。すると Claude の回答に、社員一人ひとりの給与が載ったフォルダの内容が含まれていました。このフォルダは人事部のもので、マネージャーに共有されているのは設定の誤りだと思われます。最も適切な対応はどれですか。","options":["Claude が読めたのは自分にアクセス権があるからなので、給与の情報もそのまま予算の資料づくりに使う","給与の情報は使わずに作業を進め、共有の設定が誤っていそうなことを人事部のフォルダの管理者に伝える","Claude に「給与のフォルダは今後参照しないで」と指示し、共有の設定には手を付けずに作業を続ける","同じことが起きないように、全社員の Google Drive のコネクタを使えなくするようシステム担当に求める"],"answer":[1],"notes":["コネクタは、利用者が元のサービスで持っている権限をそのまま引き継ぎます。設定の誤りで見えているだけなら、使ってよい理由にはなりません。","正解。本来の目的に必要のない機密情報は使わず、原因である共有の設定を直せる人に知らせます。自分の作業も止めずに済みます。","指示で Claude の参照を避けても、誤った共有はそのまま残ります。ほかの人や別の場面で同じ情報が見えてしまう問題に手を付けていません。","原因はコネクタではなく、フォルダの共有の設定です。全員のコネクタを止めるのは、原因に効かない極端な対処です。"],"explanation":"ヘルプセンターによれば、Claude はコネクタでつないだサービスについて、利用者本人の権限を引き継ぎます。つまり Claude に見えたものは、自分のアカウントから見えるものです。しかし、見えることと使ってよいことは別で、設定の誤りで見えている機密情報は、業務の目的に使いません。原因は上流の共有の設定にあるので、それを直せる管理者に伝えるのが、問題に直接効くつり合った手です。","ref":"試験ガイド 分野6 タスク 6.2（データの機密性、規制、プライバシーに関する考慮事項を適用する） ／ Claude ヘルプセンター: Use connectors to extend Claude's capabilities"},{"id":"D6-07","domain":"D6","topic":"預かった機密情報","type":"single","question":"コンサルタントが、クライアントから未公表の事業計画書を預かりました。両社が結んだ秘密保持の契約には、「事前の同意なく第三者に情報を提供しない」という定めがあります。コンサルタントは、この計画書を Claude に要約させて分析を急ぎたいと考えています。最も適切な対応はどれですか。","options":["業務向けのサービスでは入力を学習に使わないことを Anthropic の方針で確かめ、計画書をそのままアップロードする","計画書をアップロードしたあとで、Claude に「この資料の内容を保存しないで」と指示しておく","契約で外部のサービスに渡せるかを確かめ、必要ならクライアントの同意を得てから、会社が認めた環境で使う","クライアントの社名と担当者の名前だけを伏せれば守秘の対象から外れるので、残りはそのまま貼り付ける"],"answer":[2],"notes":["確かめる資料が違います。Anthropic のデータの扱いの方針は、クライアントとの契約上の義務とは別のもので、自社が負う約束を代わりに果たしてはくれません。","モデルに保存しないよう頼んでも、契約上の管理にはなりません。渡してよいかという問題は、アップロードの前に決めることです。","正解。守るべきは契約で約束した情報の扱い方です。外部のサービスに渡せるかを先に確かめ、必要な同意と社内のルールに沿ってから使います。","守秘の対象は未公表の事業の内容そのものです。名前を伏せても、内容が第三者に渡ることは変わらず、契約の問題は解決しません。"],"explanation":"データの機密性は、個人情報だけの問題ではありません。取引先から預かった情報には、契約で約束した扱い方があります。Anthropic のプライバシーセンターは業務向けのサービスの入力を初期設定では学習に使わないとしていますが、それは Anthropic 側の方針で、クライアントとの約束を満たしたことにはなりません。アップロードする前に、契約、同意、社内のルールを確かめるという順番が、分析を進めながら約束を守る手になります。","ref":"試験ガイド 分野6 タスク 6.2（データの機密性、規制、プライバシーに関する考慮事項を適用する） ／ Anthropic Privacy Center: Is my data used for model training?"},{"id":"D6-08","domain":"D6","topic":"必要な情報だけを渡す","type":"multi","question":"人事部の担当者が、休職から復帰する社員のための「復職支援の計画」の下書きを Claude に頼もうとしています。手元の面談記録には、社員の氏名と社員番号のほか、診断名や服薬の内容が書かれています。下書きに必要なのは、勤務時間や業務量の調整の方針だけです。会社のルールは、健康に関する情報を特に慎重に扱い、業務に必要な範囲を超える個人の情報を AI に入力しないよう定めています。取るべき対応はどれですか。（2つ選択）","options":["診断名と服薬の内容は入力から除き、勤務時間や業務量の調整に必要な事情だけを伝えて下書きを頼む","背景がよく分かるように、面談記録をすべて貼り付けてから、要点を押さえた下書きを頼む","履歴に残らないチャット（incognito chat）を使い、診断名も含めて面談記録をそのまま入力する","入力の最後に「この情報は機密なので、ほかの目的に使わないで」と書き添えてから下書きを頼む","氏名と社員番号は「Aさん」のような仮の呼び名に置き換え、本人の情報は下書きの後で担当者が書き込む"],"answer":[0,4],"notes":["正解。下書きの目的に必要なのは調整の方針で、診断名や服薬の内容は要りません。必要な範囲だけを渡せば、慎重に扱うべき情報を外に出さずに済みます。","情報を多く渡すほど良い下書きになるとは限らず、必要のない健康情報まで入力することは会社のルールに反します。","このチャットは履歴に残りませんが、ヘルプセンターによれば、安全のために一定の期間は保持されます。どの画面で入力しても、必要のない健康情報を入力すること自体がルールに反します。","モデルに頼むことは、入力する情報を絞るという管理の代わりになりません。入力した時点で、ルールの範囲を超えています。","正解。下書きに氏名や社員番号は必要ありません。仮の呼び名に置き換えて、本人の情報は手元で補えば、下書きの質を落とさずに個人の情報を守れます。"],"explanation":"データの機密性への配慮は、「何を入力してよいか」を入力の前に決めることから始まります。判断の軸は、そのタスクにどの情報が本当に必要かです。必要のない健康情報は除き、本人を特定する情報は仮の呼び名に置き換えれば、目的を果たしながら守るべき情報を出さずに済みます。履歴に残らない機能を使う、Claude に機密だと伝えるといった方法は、入力する情報そのものを減らさないので、組織のルールが求める管理にはなりません。","ref":"試験ガイド 分野6 タスク 6.2（データの機密性、規制、プライバシーに関する考慮事項を適用する） ／ Claude ヘルプセンター: Use incognito chats"},{"id":"D6-09","domain":"D6","topic":"会社が認めた環境","type":"single","question":"会社は業務用に、会社が管理する Claude の環境を用意しており、AI ポリシーでは「業務のデータは会社が管理する環境でだけ扱う」と定めています。ある営業担当者は、移動中にスマートフォンで使い慣れた個人の Claude アカウントのほうが手軽なので、顧客向けの提案書の下書きをそこで作りたいと考えています。最も適切な対応はどれですか。","options":["会社の環境も個人のアカウントも同じ Claude で安全の方針も同じなので、個人のアカウントで下書きする","顧客の会社名と担当者の名前を伏せれば問題はないので、個人のアカウントで提案書を下書きする","業務のデータは会社が管理する環境で扱い、移動中に使いにくいなら、使い方について担当部署に相談する","下書きは個人のアカウントで作り、仕上げの作業だけを会社の環境に貼り直してから行うようにする"],"answer":[2],"notes":["個人のアカウントと会社の環境では、データの扱いの条件も、会社が管理できるかどうかも違います。仮に方針が同じでも、ベンダーの方針は、会社が管理する環境で扱うという自社のルールの代わりになりません。","名前を伏せても、提案書の内容という業務のデータを個人のアカウントで扱うことに変わりはありません。ルールの一部だけを自分の判断で緩めています。","正解。ルールに沿って会社の環境を使い、不便さは正規の窓口に相談して解決します。業務を止めずに、ルールも守れます。","下書きの段階で業務のデータが個人のアカウントに入っており、ルールに反しています。最後に会社の環境へ移しても、その事実は消えません。"],"explanation":"組織の AI ポリシーは、どの環境で、どのデータを、誰が扱ってよいかを決めるものです。製品が同じでも、会社が管理する環境と個人のアカウントでは、会社が利用の状況を把握し、管理できるかどうかが違います。「ベンダーが安全だから」「名前を伏せたから」と自分で例外を作るのではなく、ルールに沿ったうえで、不便な点は正規の窓口に相談して改善を求めます。ルールの抜け道を探すより、ルールの中で業務を続ける手が最善です。","ref":"試験ガイド 分野6 タスク 6.3（組織のAIポリシーとガバナンス基準に従う）"},{"id":"D6-10","domain":"D6","topic":"ルールに書いていない用途","type":"single","question":"カスタマーサポートのチームリーダーが、録音した顧客との通話を文字に起こし、その内容を Claude で分析して、よくある不満の傾向をつかみたいと考えています。会社の AI ポリシーには、認められる用途と禁止の用途の一覧がありますが、通話の記録を分析する使い方はどちらにも書かれていません。来週から始めたいと考えています。最も適切な対応はどれですか。","options":["禁止の用途の一覧を読み返し、この使い方が載っていないことを確かめたうえで、来週から始める","ポリシーを担当する部署に、この使い方が認められるかと守るべき条件を問い合わせてから始める","会社のポリシーの文書を Claude に読ませ、この使い方が認められるかを確かめさせて、その答えに従う","ポリシーに書かれていない使い方なので、判断がつくまで部署全体で Claude の利用を止める"],"answer":[1],"notes":["確かめたのは「禁止の一覧に載っていない」ことだけです。書かれていないことは認められているという意味ではなく、顧客の声という個人に関わるデータを扱う用途を、自分の解釈だけで始めています。","正解。ポリシーが想定していない用途は、ルールを解釈して決める権限のある部署に確かめます。扱いの条件が分かれば、安全に始められます。","Claude は文書を読んで整理する手伝いはできますが、会社としてその用途を認めるかを決める立場にはありません。判断の責任を Claude に移しています。","確かめるべきなのはこの新しい用途だけです。すでに認められている業務まで止めるのは、つり合わない対処です。"],"explanation":"組織の AI ポリシーは、すべての使い方を書き尽くしてはいません。書かれていない用途に出会ったときは、自分の解釈や Claude の答えで決めず、ポリシーを担当する部署に確かめます。特に、顧客の個人に関わるデータを扱う用途は、条件付きで認められることもあるので、先に条件を聞いておくと手戻りがありません。「書いていないから大丈夫」と「分からないから全部止める」の両極端を避け、確かめてから進めるのが判断の軸です。","ref":"試験ガイド 分野6 タスク 6.3（組織のAIポリシーとガバナンス基準に従う）"},{"id":"D6-11","domain":"D6","topic":"急ぐときの確認の手順","type":"single","question":"広報の担当者が、Claude で下書きした新サービスのお知らせを、1時間後に自社のサイトに載せる予定です。会社のガバナンスの基準では、AI を使って作った社外向けの文書は、指定された確認者が内容を確かめ、その結果を記録してから公開することになっています。確認者が不在のときの代わりの確認者も、基準で決めてあります。ところが、確認者がちょうど外出していて連絡がつきません。最も適切な対応はどれですか。","options":["予定の時刻に公開し、確認者が戻ってから内容を確かめてもらい、記録もそのときに残す","Claude に下書きの誤りを点検させ、問題がないという結果を確認の記録として残してから公開する","AI を使ったことにならないよう、Claude の下書きを自分の言葉で書き直してから、確認を経ずに公開する","基準で定められた代わりの確認者に頼むか、確認が済むまで公開を遅らせることを関係者に伝える"],"answer":[3],"notes":["確認は公開の前に行うことが基準の目的です。後から確かめても、誤りがあれば社外の人がすでに目にしています。","Claude の自己点検は、指定された人による確認の代わりになりません。記録の形だけを整えて、基準の中身を満たしていません。","書き直しで基準の対象から外そうとするのは、ルールの抜け道を探す行為です。社外向けの文書に人の確認が要るという目的を無視しています。","正解。急いでいても、基準が定める確認を省きません。代わりの確認者を立てるか、公開の時刻を動かして、ルールの中で業務を進めます。"],"explanation":"ガバナンスの基準は、急いでいるときにこそ意味を持ちます。社外に出る前の人の確認と記録は、誤りを外に出さないことと、後から誰が何を確かめたかを示せることの2つの役割があります。後回しにする、Claude に代わりをさせる、書き直して対象から外す、という選択肢は、どれも形だけ整えるか、ルールを避けているだけです。基準の中で動ける手、つまり代わりの確認者を立てるか公開を遅らせて関係者に伝えるのが、最も適切な対応です。","ref":"試験ガイド 分野6 タスク 6.3（組織のAIポリシーとガバナンス基準に従う）"},{"id":"D6-12","domain":"D6","topic":"ルール違反に気づいたとき","type":"multi","question":"マーケティング担当者が、キャンペーンの応募の傾向をまとめようとして、応募者の氏名、電話番号、住所が入った一覧を、そのまま Claude のチャットに貼り付けてしまいました。会社のルールでは、顧客の連絡先などの個人情報は伏せてから AI に入力することになっており、違反に気づいたときは情報管理の窓口に報告する手順があります。いま取るべき対応はどれですか。（2つ選択）","options":["Claude に「さきほど貼り付けた一覧の内容を忘れて」と伝え、そのまま分析の作業を続ける","会社の手順に沿って、何をいつ入力してしまったかを情報管理の窓口にすぐ報告する","分析は、氏名と連絡先を伏せた一覧を作り直して、窓口の指示に沿って改めて行う","部署の全員が同じことをしないよう、部署として Claude の利用を当面すべてやめる","業務向けのサービスでは入力が学習に使われないので、問題はないと判断し、報告はしない"],"answer":[1,2],"notes":["モデルに忘れるよう頼んでも、入力したという事実と、それへの対応は変わりません。会社の手順に沿った報告の代わりになりません。","正解。違反に気づいたときの手順が決まっているなら、それに従ってすぐ知らせます。何をいつ入力したかが分かれば、窓口が必要な対応を判断できます。","正解。分析そのものは、ルールどおりに識別情報を伏せたデータで続けられます。窓口の指示を受けたうえで、正しい形でやり直します。","原因は1回の入力の誤りで、Claude の利用全体ではありません。正しい手順を周知すれば済むのに、業務全体を止めるのは行き過ぎです。","学習に使われるかどうかは、会社のルールに反したかどうかとは別の問題です。報告するかを自分で決めず、手順に従います。"],"explanation":"ガバナンスの基準には、ルールを守るための手順だけでなく、守れなかったときの手順も含まれます。誤って入力したと気づいたら、自分で影響の大小を判断したり、Claude に頼んで済ませたりせず、決められた窓口にすぐ報告します。そのうえで、業務の目的はルールに沿った形で達成し直します。隠す、Claude に頼む、全部やめる、のどれでもなく、手順に従って報告し、正しいやり方で続けることが判断の軸です。","ref":"試験ガイド 分野6 タスク 6.3（組織のAIポリシーとガバナンス基準に従う）、タスク 6.2（データの機密性、規制、プライバシーに関する考慮事項を適用する）"},{"id":"D6-13","domain":"D6","topic":"AI の関与を伝える","type":"single","question":"コンサルタントが、クライアントに納める市場調査の報告書を、多くの部分で Claude の下書きをもとに作りました。クライアントはこの報告書を新規事業に投資するかどうかの判断に使う予定で、納品の際に「どのように調べて作ったのかも教えてほしい」と頼まれています。コンサルタントの会社には、この点についての特別な決まりはありません。最も適切な対応はどれですか。","options":["数字と出典は自分で一次情報と照らして確かめたので、Claude を使ったことには触れずに、自分の調査として説明する","冒頭に「AI が作成したため誤りを含む可能性があります」と書き、内容の確認はクライアントに任せる","Claude がどの作業をどう手伝ったかを説明し、数字と出典は自分で一次情報と照らしたうえで納品する","AI を使ったことが問題にならないよう、Claude の下書きをすべて捨てて、一から自分で書き直して納品する"],"answer":[2],"notes":["作り方を尋ねられているのに AI の関与を伏せるのは、知る必要のある相手に対して正直ではありません。内容を確かめたことは、AI の役割の説明を省く理由になりません。","注記を付けても、確かめる責任を相手に移しているだけです。投資の判断に使われる報告書なら、出す側が内容を確かめて責任を持つ必要があります。","正解。知る必要のある相手に AI の役割を正直に伝え、自分の名前で出す内容は自分で確かめます。透明性と、出力への責任の両方を果たせます。","AI を使うこと自体が問題なのではありません。役割を正直に伝え、内容を確かめれば済むのに、作業をすべて捨てるのは行き過ぎです。"],"explanation":"Anthropic の AI Fluency の枠組みは、責任ある利用（Diligence）の要素として、知る必要のある人に AI の役割を正直に伝えること（透明性）と、使ったり共有したりする出力を確かめて責任を持つこと（展開の責任）を挙げています。どこまで伝えるかは場面によって違いますが、相手が作り方を尋ね、重要な判断に使うなら、伝えるべき場面です。注記で責任を相手に移すことも、AI の利用を隠すことも、この2つを満たしません。正直に伝えることと自分で確かめることは、セットで考えます。","ref":"試験ガイド 分野6 タスク 6.4（AI利用の倫理的な影響を理解する） ／ AI Fluency: The 4Ds（Diligence）"},{"id":"D6-14","domain":"D6","topic":"出した文書の責任","type":"single","question":"広報の担当者が Claude で下書きした新商品のプレスリリースを配信したところ、発売日が誤っていたことが分かり、複数の記者から問い合わせが来ています。担当者は、元の企画資料と照らさずに配信していました。最も適切な対応はどれですか。","options":["自社の誤りとして訂正と謝罪を出し、今後は日付や数字を公開前に元の資料と照らす手順を加える","「AI が作成した文章に誤りがありました」と記者に説明し、誤りの原因が AI にあることを伝える","訂正を出したうえで、今後は配信の前に Claude 自身に日付や数字を確かめさせる手順を加える","Claude に誤りが起きた理由を説明させ、その説明文をそのまま記者への釈明として送る"],"answer":[0],"notes":["正解。自社の名前で出した文書の誤りは、自社が責任を持って正します。原因は確認を省いたことなので、公開前に元の資料と照らす手順を加えるのが再発を防ぐ手です。","文書を確かめて出す責任は、出した側にあります。AI のせいにしても訂正にはならず、相手からの信頼も損ないます。","誤った下書きを作った Claude 自身に確かめさせても、元の企画資料と照らす確認の代わりになりません。自社の誤りとしての謝罪も抜けています。","誤りの責任を負うのは自社で、Claude の説明は社外への釈明の代わりになりません。まず自社として訂正し、謝罪することが必要です。"],"explanation":"Claude が下書きした文書でも、自分の名前や会社の名前で出せば、その内容の責任は出した側にあります。AI Fluency の枠組みも、使ったり共有したりする出力を確かめて責任を持つことを、責任ある利用の要素に挙げています。誤りが起きたときは、AI のせいにせず自社の誤りとして正し、原因である確認の抜けを手順として埋めます。再発の防止を Claude 自身の点検に任せても、人が元の資料と照らす確認の代わりにはなりません。","ref":"試験ガイド 分野6 タスク 6.4（AI利用の倫理的な影響を理解する） ／ AI Fluency: The 4Ds（Diligence）"},{"id":"D6-15","domain":"D6","topic":"人によって変わる対応","type":"single","question":"カスタマーサポートのチームが、問い合わせへの返信の下書きに Claude を使っています。担当者が見直していたところ、日本語が母語ではないと思われる顧客への下書きは、同じような内容の問い合わせでも、ほかの顧客への下書きより短く、案内も少ない傾向に気づきました。最も適切な対応はどれですか。","options":["Claude にこれまでの下書きに偏りがないかを確かめさせ、ないという答えなら、今のやり方を続ける","偏りはモデルの性能の問題だと考え、より高性能なモデルに切り替えて、指示や確認の手順は今のままにする","見つかった下書きだけを担当者が書き足して送り、ほかの下書きは今までどおりの手順で扱う","似た問い合わせの下書きを並べて差を見つけ、同じ水準で案内するよう指示に明記し、その後の下書きでも差を比べる"],"answer":[3],"notes":["下書きを作った Claude 自身に偏りを確かめさせても、独立した確認になりません。偏りは、実際の出力を比べて見つけるものです。","モデルを替えれば偏りがなくなるという根拠はありません。規模で解決しようとしており、実際に偏りが直ったかも確かめていません。","見つかった1件ずつを直すだけでは、同じ傾向の下書きが作られ続けます。症状だけを抑えて、原因に手を付けていません。","正解。条件のそろった下書きを比べて偏りを確かめ、求める水準を指示で明確にします。そのあとも下書きを見比べて、差が消えたかを人が確かめます。"],"explanation":"AI の出力に偏りがあると、特定の人たちだけが質の低い対応を受けるという、公平さの問題につながります。Anthropic の AI Fluency の用語集も、バイアスを、特定の集団を不当に有利または不利に扱う出力の系統的な傾向と説明しています。偏りは、条件をそろえた出力を並べて比べることで確かめ、求める水準を指示で明確にしたうえで、人の確認で直ったかを見届けます。Claude に自己申告させる、より高性能なモデルに替える、見つかった1件だけを直す、といった手は、どれも偏りの原因に届きません。","ref":"試験ガイド 分野6 タスク 6.4（AI利用の倫理的な影響を理解する） ／ AI Fluency: Key Terminology Cheat Sheet（Bias）"},{"id":"D7-01","domain":"D7","topic":"あいまいな依頼の点検","type":"single","question":"人事の担当者が、社内の表彰に出す推薦文を Claude に作らせています。依頼文は、気づいたことを書き足してきたため長くなり、出力は毎回違う方向にずれますが、依頼文のどこが分かりにくいのか、自分では見当がつきません。モデルを替えても、新しいチャットで始めても、同じことが起きます。最初に行うべきことはどれですか。","options":["依頼文に「重要」「必ず守ること」と書き添えて、大事な指示を目立たせてから送る","依頼文を、この仕事の事情を知らない同僚に読んでもらい、迷う箇所を挙げてもらう","同じ依頼を5回送り、5回の出力に共通して出てくる部分だけを使って推薦文を仕上げる","思いつく限りの条件を依頼文にさらに書き足し、ずれる余地をなくしてから送り直す"],"answer":[1],"notes":["どこがあいまいかを特定しないまま強調しても、伝わっていない点は伝わりません。原因を見つける手順になっていません。","正解。公式のドキュメントは、事情をほとんど知らない同僚に依頼文を見せ、そのとおりにできるかを試すよう勧めています。同僚が迷う箇所は、Claude も迷う箇所です。","作り直して共通の部分を拾っても、依頼文のどこがあいまいかは分かりません。次の推薦文でも同じことが起きます。","原因が分からないまま条件を足すと、指示どうしがぶつかったり、あいまいな箇所が増えたりして、さらに原因が見えにくくなります。"],"explanation":"モデルや会話を変えても出力がずれるなら、原因は依頼文の指示の不足やあいまいさにあると考えられます。どこがあいまいか分からないときは、まず依頼文を外から点検します。公式のドキュメントは、仕事の事情をほとんど知らない同僚に依頼文を見せる方法を、点検の目安として挙げています。強調する、条件を書き足す、作り直すといった手は、原因を特定しないまま変える手で、診断になっていません。","ref":"試験ガイド 分野7 タスク 7.1（期待どおりに機能しないプロンプトや質の低い出力の問題を特定、診断、解決する）／ Claude Docs: Prompting best practices（Be clear and direct: Key test）／ 公式対策講座 Troubleshooting & Optimization の学習目標（指示の不足）"},{"id":"D7-02","domain":"D7","topic":"資料の詰め込みすぎ","type":"single","question":"営業担当者が、ある取引先への提案の要点をまとめるため、過去3年分の社内資料約40件（ほかの取引先向けの提案書、会議の議事録、製品カタログなど）を、1つのチャットにまとめて添付しました。依頼文には、目的、読み手、形式を書いています。出てきた要点には、ほかの取引先向けの条件が混じり、この取引先の課題がぼやけています。最も適切な対応はどれですか。","options":["40件はそのまま添付しておき、「関係のない資料は無視して」と依頼の最後に書き添える","一度に扱える情報の量が多いモデルに切り替えて、同じ40件の資料で作り直させる","この取引先に関係する資料だけに絞って渡し、どの資料を何に使うかも依頼に書く","40件を10件ずつ4つのチャットに分けて同じ依頼をし、4つの出力を自分で1つにまとめる"],"answer":[2],"notes":["どれが関係のない資料かを Claude が見分けなければならず、混ざる原因の資料もそのまま残ります。モデルに頼んで済ませる手です。","扱える量を増やしても、関係のない資料が混ざっている状態は変わりません。規模で解決しようとする手です。","正解。依頼文は足りているので、原因は関係のない資料の詰め込みすぎです。必要な資料に絞り、それぞれの使い道を示すと、要点がこの取引先に集中します。","分けても、それぞれのチャットに関係のない資料が残るので、混ざる原因は消えません。まとめ直す手間も増えます。"],"explanation":"依頼文は足りているのに、関係のない内容が混じって肝心な点がぼやけるなら、コンテキストの詰め込みすぎを疑います。対策講座は、これを不調の根本原因の1つに挙げています。渡す資料はその仕事に必要なものに絞り、どの資料を何に使うかを依頼で示します。資料が多いほど正確になると考えて積み増したり、扱える量の多いモデルに頼ったりしても、関係のない情報が混ざる状態は変わりません。","ref":"試験ガイド 分野7 タスク 7.1（期待どおりに機能しないプロンプトや質の低い出力の問題を特定、診断、解決する）／ 公式対策講座 Troubleshooting & Optimization の学習目標（コンテキストの詰め込みすぎ）"},{"id":"D7-03","domain":"D7","topic":"機能の選び間違い","type":"single","question":"総務の担当者が、出張の旅費を見積もるため、新しいチャットの最初の依頼で、ある鉄道会社が先月改定した運賃を Claude に聞きました。ウェブ検索やリサーチは使っていません。返ってきた答えは自信のある書き方でしたが、金額は改定前のものでした。依頼文には、区間と聞きたいことがはっきり書かれています。最も可能性の高い原因はどれですか。","options":["依頼文に「最新の」という言葉が入っていなかったので、古い情報で答えた","会話が長くなりすぎて、前のほうで話した古い情報が答えに混ざった","選んだモデルの性能が足りず、改定後の正しい運賃を思い出せなかった","最新の情報を調べない使い方で、学習した時点までの知識で答えた"],"answer":[3],"notes":["言葉を足しても、Claude が知らない新しい情報は出てきません。依頼文の不足が原因ではありません。","新しいチャットの最初の依頼なので、会話の長さは原因になりません。","モデルを替えても、学習した時点より後の改定は知りません。原因は性能ではなく、調べ方です。","正解。モデルの知識には、学習した時点という区切りがあります。新しい情報が要る質問には、ウェブ検索やリサーチなど情報を調べる機能を使い、出典を確かめます。"],"explanation":"期待外れの出力の原因は、指示の不足、詰め込みすぎ、機能やモデルの選び間違い、古い設定のどれかにたどれることが多いです。この場面では、依頼文は明確で、新しいチャットの最初の依頼なので、最新の情報を調べない使い方をしたという機能の選び間違いが残ります。モデルには知識の区切りがあり、自信のある書き方は正しさの証拠になりません。新しい情報が要る仕事には、それに合った機能を選びます。","ref":"試験ガイド 分野7 タスク 7.1（期待どおりに機能しないプロンプトや質の低い出力の問題を特定、診断、解決する）／ AI Fluency: Key Terminology Cheat Sheet（Knowledge cutoff date）／ Claude ヘルプセンター: Use Research on Claude"},{"id":"D7-04","domain":"D7","topic":"指示に残った古い情報","type":"single","question":"広報チームが、共有のプロジェクトでプレスリリースの下書きを作っています。先月、主力商品のブランド名が変わったため、ナレッジの資料はすべて新しい名前のものに差し替えました。それでも Claude は、新しく始めたチャットでもときどき旧ブランド名を使い、依頼文で新しい名前を指定しても直りきりません。このプロジェクトでは、メモリ機能は使っていません。最も適切な対応はどれですか。","options":["プロジェクトの指示を開いて旧ブランド名が書かれた箇所を探し、新しい名前に書き直す","依頼のたびに「旧ブランド名は絶対に使わないこと」と、さらに強く書き添えて頼む","下書きができるたびに旧ブランド名が混じっていないかを確かめ、見つけたら直させる","新旧の名前の対応表をナレッジに足し、どちらの名前を使うかは Claude に判断させる"],"answer":[0],"notes":["正解。ナレッジは差し替え済みで、依頼文も明確で、会話も新しいので、残るのは指示が古いことです。プロジェクトの指示はそのプロジェクトのすべてのチャットに効くので、旧名が残っていると、依頼で打ち消しても混じります。","指示に残った旧名という原因がそのままなので、言葉を強めても混じり続けます。症状を抑えようとする手です。","出力を毎回確かめて直すのは、症状への対処です。原因である設定の古い情報が残るので、確かめる手間が続き、見落とせば旧名のまま出てしまいます。","どちらを使うかを Claude に任せると、旧名が使われる余地が残ります。古い情報はなくし、新しい名前だけを示すのが確実です。"],"explanation":"依頼の書き方を工夫しても直らない不調は、設定が古いことを疑います。プロジェクトでは、ナレッジだけでなく指示も、そのプロジェクトのすべてのチャットの前提として使われます。資料を差し替えたら、指示の中にも古い名前や決まりが残っていないかを合わせて確かめます。設定の一部だけを直すと、残った古い部分が同じ不調を起こし続けます。","ref":"試験ガイド 分野7 タスク 7.1（期待どおりに機能しないプロンプトや質の低い出力の問題を特定、診断、解決する）、分野5 タスク 5.4（Claudeの設定、ナレッジソース、指示に情報を反映し、維持、更新する）／ 公式対策講座 Troubleshooting & Optimization の学習目標（設定が古い）／ Claude ヘルプセンター: Understanding Claude's personalization features"},{"id":"D7-05","domain":"D7","topic":"一度に1つ変える","type":"single","question":"広報の担当者が、プレスリリースの下書きの依頼を改良しようとして、読み手の説明、見本、長さの指定、口調の指示、禁止する表現の一覧の5つを一度に変えました。出力は、良くなった点と悪くなった点が混ざり、どの変更が効いたのか分かりません。次に取るべき行動として最も適切なものはどれですか。","options":["5つの変更はそのままにして、悪くなった点を直すための指示を、さらに書き足す","どの変更が効いたのかを Claude に尋ね、その答えに従って依頼を決める","元の依頼に戻し、同じ素材で変更を1つずつ加え、そのたびに前の出力と比べる","変更後の出力のほうが文章が流ちょうに見えるので、5つの変更をすべて採用する"],"answer":[2],"notes":["どの変更が悪さをしたのか分からないまま指示を足すので、さらに原因が見えにくくなります。","Claude の答えは推測で、どの変更が効いたかの証拠になりません。比べるのは出力そのものです。","正解。同じ素材で1つずつ変えて前の出力と比べると、どの変更が効き、どれが悪くしたのかが分かり、結果にもとづいて依頼を決められます。","流ちょうさは、目的に合っているかの証拠になりません。悪くなった点も残り、どの変更が効いたのかも分からないままです。"],"explanation":"フィードバックと結果にもとづいて依頼を変えるには、変えたことと結果の関係が見える形で試します。同じ素材を使い、一度に1つだけ変えて、前の出力と比べるのが基本です。一度に多くを変えると、効いた変更と悪くした変更の区別がつきません。Claude の推測や文章の流ちょうさではなく、出力を目的の基準に照らして判断します。","ref":"試験ガイド 分野7 タスク 7.2（フィードバックと結果に基づいてアプローチを調整する）／ 公式対策講座 Troubleshooting & Optimization の学習目標（当てずっぽうに変えず、原因から直す）"},{"id":"D7-06","domain":"D7","topic":"読み手の反応で直す","type":"single","question":"マーケティングの担当者が、顧客向けのメールマガジンを、毎月 Claude で下書きしてから配信しています。この3か月、最後まで読まれる割合が下がり続け、読者アンケートでは「長い」「何を伝えたいのか分からない」という声が多く集まりました。内容の正確さへの苦情はありません。最も適切な対応はどれですか。","options":["Claude に過去のメールマガジンの出来を評価させ、評価が高ければ今の依頼を続ける","最後まで読まれる回数を増やすため、配信の頻度を月1回から月2回に増やす","Claude で下書きするのをやめ、これからは担当者がすべて一から手で書く","読者の声を「冒頭に要点1つ」「全体を短く」などの条件にして依頼に加え、次号で比べる"],"answer":[3],"notes":["読者という実際の結果がすでに出ています。Claude の自己評価は、読者の反応の代わりになりません。","長くて要点が分からないという問題には触れていません。配信を増やしても、同じ読まれにくい号が増えるだけです。","正確さに問題はなく、直すべき点もはっきりしています。業務そのものをやめる極端な対処です。","正解。読者の反応という結果を、依頼の具体的な条件に変えて反映し、次の結果で効いたかを確かめます。"],"explanation":"フィードバックと結果は、次の依頼を直すための材料です。読み手の声や数字の変化を、長さ、冒頭の書き方、要点の数といった具体的な条件に言い換えて依頼に入れます。直したら、次の結果で効いたかどうかを確かめます。モデルの自己評価に頼る、別の問題を解く、業務をやめるといった手は、結果にもとづく調整になっていません。","ref":"試験ガイド 分野7 タスク 7.2（フィードバックと結果に基づいてアプローチを調整する）／ claude.com: Best practices for prompt engineering（Test and refine）"},{"id":"D7-07","domain":"D7","topic":"繰り返す手直し","type":"multi","question":"総務の担当者が、プロジェクトの中で、毎週の定例会議の議事録を Claude に作らせています。出力のたびに、取引先の社名の正式な表記を直し、決定事項と担当者の欄を自分で書き足しており、毎週同じ手直しに30分かかっています。この状況で取るべき対応はどれですか。（2つ選択）","options":["より性能の高いモデルに切り替えて、これまでと同じ依頼のまま議事録を作り続ける","社名や部署名の正式な表記のルールを、プロジェクトの指示に書いておく","これまでどおり、出力が出るたびに表記と欄を自分で直して、議事録を仕上げる","決定事項と担当者の欄がある議事録の見本を、プロジェクトのナレッジに入れる","正しい形の議事録が出るまで同じ依頼で作り直し、いちばん良いものを選ぶ"],"answer":[1,3],"notes":["原因は、表記のルールと欄の構成が伝わっていないことです。モデルを替えても、それは伝わりません。","正解。プロジェクトの指示はそのプロジェクトのすべてのチャットに効くので、毎週の表記の手直しが要らなくなります。","毎週の30分がそのまま残ります。繰り返す手直しは、恒久的な修正に変える対象です。","正解。ナレッジに置いた見本は、そのプロジェクトのチャットで参照されるので、毎回同じ構成の議事録が出てきます。","作り直しは運任せで、翌週も同じことが起きます。足りない指示を補っていません。"],"explanation":"同じ手直しを毎回しているなら、それは一度きりの修正ではなく、恒久的な修正に変えるべきものです。対策講座も、繰り返し出てくる手直しを、持続する修正に変えることを学習目標にしています。決まりはプロジェクトの指示に、見本はナレッジに置くと、そのプロジェクトのすべてのチャットで最初から反映されます。原因に触れない対処では、毎週の手間は減りません。","ref":"試験ガイド 分野7 タスク 7.2（フィードバックと結果に基づいてアプローチを調整する）／ 公式対策講座 Troubleshooting & Optimization の学習目標／ Claude ヘルプセンター: How can I create and manage projects?"},{"id":"D7-08","domain":"D7","topic":"いつも使う書き方","type":"single","question":"広報の担当者は、社内向けのお知らせ、取引先へのメール、会議の議事録など、いろいろな仕事に Claude を使っています。どの仕事でも、チャットを始めるたびに「結論から書く」「です・ます体」「絵文字は使わない」と書き添えており、書き忘れたときは出力を自分で直しています。この3つは、この担当者のどの仕事にも共通する書き方の好みです。最も適切な対応はどれですか。","options":["3つの書き方を個人設定の指示に書いておき、すべての会話に効くようにする","仕事の種類ごとにプロジェクトを作り、それぞれの指示に同じ3つの書き方を書き写す","3つの書き方をスキルにまとめ、お知らせを作るときなど、決まった作業でだけ使う","書き忘れを防ぐため、3つの書き方を書いたメモを手元に置き、毎回貼り付ける"],"answer":[0],"notes":["正解。個人設定の指示は、その人のすべての会話に効く設定です。どの仕事にも共通する好みは、ここに一度書いておけば、毎回書き添える手間も書き忘れもなくなります。","同じ内容の写しがいくつもでき、好みが変わったときに全部を直す必要があります。プロジェクトの外のチャットにも効きません。","決まった作業でだけ使うようにすると、ほかの仕事では効きません。どの仕事にも共通する好みには、範囲が狭すぎます。","貼り付ける手間が残り、貼り忘れも防げません。毎回くり返す指示は、設定に移す対象です。"],"explanation":"ワークフローの効率を上げるには、毎回くり返し書いている指示を、効く範囲の合った設定に移します。ヘルプセンターによれば、個人設定の指示はすべての会話に、プロジェクトの指示はそのプロジェクトのチャットだけに効き、スキルは特定の作業のときに読み込まれます。どの仕事にも共通する好みは個人設定の指示に、仕事ごとの決まりはプロジェクトに、決まった作業の手順はスキルに置くと、重ならず、更新も1か所で済みます。","ref":"試験ガイド 分野7 タスク 7.3（効率と効果を高めるためにワークフローを最適化する）／ 公式対策講座 Troubleshooting & Optimization の学習目標（常設の指示へ移す）／ Claude ヘルプセンター: Understanding Claude's personalization features、What are Skills?"},{"id":"D7-09","domain":"D7","topic":"決まった作業の手順","type":"single","question":"コンサルタントが、顧客ごとに分けた10個のプロジェクトで仕事をしています。どの顧客にも、毎月、同じ手順と形式で月次報告を作りますが、手順の説明をそのつど貼り付けていて手間がかかります。月次報告以外の仕事では、この手順は必要ありません。手順は1か所で管理したいと考えています。最も適切な対応はどれですか。","options":["月次報告の手順と形式を、自分のアカウント全体に効く個人設定の指示に書いておく","手順を書いた文書を用意し、10個のプロジェクトのナレッジに1つずつ入れておく","月次報告の手順と形式をスキルにまとめ、月次報告を作るときに使えるようにする","これまでどおり、毎月、手順書を探してきてチャットに貼り付けてから月次報告を頼む"],"answer":[2],"notes":["個人設定の指示はすべての会話に効くので、月次報告と関係のない仕事にまで手順が入り込みます。","10個の写しができるので、手順を変えるときに10か所を直す必要があり、直し漏れが起きます。","正解。スキルは、決まった作業を毎回同じやり方でこなすための手順で、プロジェクトをまたいで使え、必要な場面でだけ読み込まれます。1か所で管理できます。","毎月の手間が残ります。くり返す作業の手順は、設定に移す対象です。"],"explanation":"効率化では、共通の手順を、くり返し貼り付けるのではなく、適切な置き場所に移します。ヘルプセンターによれば、プロジェクトはそのプロジェクトの中で背景として使われ、個人設定の指示はすべての会話に効き、スキルは特定の作業を繰り返しこなす手順で、必要なときにだけ読み込まれます。複数のプロジェクトで使う、特定の作業の手順はスキルに向いています。2026年11月時点では、スキルは画面上でプラグインのページにまとめられつつありますが、考え方は同じです。","ref":"試験ガイド 分野7 タスク 7.3（効率と効果を高めるためにワークフローを最適化する）／ Claude ヘルプセンター: What are Skills?、Understanding Claude's personalization features"},{"id":"D7-10","domain":"D7","topic":"共通の資料はプロジェクトへ","type":"single","question":"人事部の採用チームの3人は、求人票を作るたびに、それぞれ新しいチャットを開き、職種名や勤務条件の書き方をまとめた社内の表記のルールと、過去の求人票を数本、毎回貼り付けたり添付したりしています。この準備に毎回10分ほどかかるうえ、人によって手元のルールの版が違い、求人票の表記がそろいません。このルールと過去の求人票は、求人票を作るとき以外には使いません。会社は、プロジェクトをチームで共有できるプランを使っています。最も適切な対応はどれですか。","options":["3人がそれぞれ、表記のルールを個人設定の指示に書き、過去の求人票は今までどおり毎回添付する","最新の表記のルールと過去の求人票を共有フォルダにまとめ、各自がそこから毎回チャットに添付する","求人票用のプロジェクトを作り、ルールを指示に、過去の求人票をナレッジに入れてチームで共有する","担当を1人に決め、その人が1つのチャットを使い続けて、3人分の求人票をまとめて作る"],"answer":[2],"notes":["個人設定の指示はその人のすべての会話に効くので、求人票以外の仕事にも表記のルールが入り込みます。3人が別々に書き写すので版の違いも残り、毎回の添付の手間も減りません。","版はそろいますが、毎回の添付という手間はそのまま残ります。共通の文脈を、そのつど人が運ぶ形が変わっていません。","正解。プロジェクトの指示とナレッジは、そのプロジェクトのチャットだけで使われます。チームで共有すれば、3人が同じ最新のルールと資料から始められ、毎回の準備もなくなります。","1人に作業が集まり、ほかの2人に待ち時間が生まれます。1つの長い会話に前の求人票のやり取りが積み重なり、別の職種の条件が混ざるおそれもあります。"],"explanation":"何人もが同じ仕事のたびに同じ文脈を貼り直しているなら、その文脈はプロジェクトに移す候補です。公式の対策講座も、共通の文脈、形式、検証の手順を、プロジェクト、スキル、常設の指示へ移すことを、ワークフローの最適化として挙げています。決まりは指示に、参考にする資料はナレッジに置いてチームで共有すれば、準備の手間が減るだけでなく、全員が同じ版から始められます。置き場所は、効く範囲で選びます。すべての会話に効く個人設定は、特定の仕事だけの決まりには広すぎます。","ref":"試験ガイド 分野7 タスク 7.3（効率と効果を高めるためにワークフローを最適化する）／ 公式対策講座 Troubleshooting & Optimization の学習目標（共通の文脈をプロジェクトへ移す）／ Claude ヘルプセンター: What are projects?、Understanding Claude's personalization features"}];

function sanitizeSession(s) {
  if (!s || !Array.isArray(s.ids)) return null;
  s.ids = s.ids.filter(id => BY_ID[id]);
  if (!s.ids.length) return null;
  s.order = s.order || {}; s.answers = s.answers || {}; s.submitted = s.submitted || {}; s.flags = s.flags || {};
  for (const id of s.ids) {
    const n = BY_ID[id].options.length;
    const o = s.order[id];
    const valid = Array.isArray(o) && o.length === n && [...o].sort((a, b) => a - b).every((v, i) => v === i);
    if (!valid) { s.order[id] = shuffle([...Array(n).keys()]); delete s.answers[id]; delete s.submitted[id]; }
  }
  s.idx = Math.min(Math.max(0, s.idx | 0), s.ids.length - 1);
  return s;
}

/* ---------- ユーティリティ ---------- */
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function fmt(s) {
  return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\n/g, '<br>');
}
function fmtTime(ms) {
  const t = Math.max(0, Math.round(ms / 1000));
  const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
  return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}
function isCorrect(q, sel) {
  return !!sel && sel.length === q.answer.length && q.answer.every(a => sel.includes(a));
}
const modeName = m => (m === 'exam' ? '模擬試験' : '練習');
const st = id => stats[id] || {};

function record(id, ok) {
  const s = st(id);
  stats[id] = { ...s, a: (s.a || 0) + 1, c: (s.c || 0) + (ok ? 1 : 0), last: ok };
}

/* ---------- 出題の組み立て ---------- */
function matchesFilter(q, filter) {
  const s = st(q.id);
  if (filter === 'new') return !s.a;
  if (filter === 'wrong') return !!s.a && !s.last;
  if (filter === 'bookmark') return !!s.bm;
  return true;
}
function practicePool() {
  return QUESTIONS.filter(q => prefs.domains.includes(q.domain) && matchesFilter(q, prefs.filter));
}
function practiceCount(pool) {
  return prefs.count === 'all' ? pool.length : Math.min(Number(prefs.count) || 20, pool.length);
}
function makeSession(mode, ids) {
  const now = Date.now();
  return {
    mode, ids, idx: 0, answers: {}, submitted: {}, flags: {}, finished: false,
    order: Object.fromEntries(ids.map(id => [id, shuffle([...Array(BY_ID[id].options.length).keys()])])),
    startedAt: now, deadline: mode === 'exam' ? now + EXAM_MINUTES * 60000 : null,
  };
}
function startPractice(ids) {
  if (!ids) {
    const pool = practicePool();
    const list = prefs.order === 'seq' ? pool : shuffle([...pool]);
    ids = list.slice(0, practiceCount(pool)).map(q => q.id);
  }
  if (!ids.length) return;
  session = makeSession('practice', ids);
  ui = { ...ui, hint: '', confirmFinish: false, confirmDiscard: false };
  view = 'quiz'; saveSession(); render();
}
// total 問を、重み（weight）の比で各単位に割り振る。cap は、その単位に収録されている問題数。
// 端数は、余りの大きさに比例した確率で切り上げる。毎回同じ単位が切り捨てられると、配点の小さい単位が
// 一度も出題されなくなるため（平均すると、どの単位も配点どおりの問題数になる）
function apportion(total, units) {
  const sum = units.reduce((a, u) => a + u.weight, 0) || 1;
  const rows = units.map(u => {
    const exact = total * u.weight / sum;
    return { code: u.code, exact, cap: u.cap, n: Math.min(Math.floor(exact), u.cap) };
  });
  let left = Math.min(total, units.reduce((a, u) => a + u.cap, 0)) - rows.reduce((a, r) => a + r.n, 0);
  const cands = rows.filter(r => r.n < r.cap && r.exact % 1 > 1e-9).map(r => ({ r, w: r.exact % 1 }));
  while (left > 0 && cands.length) {
    let x = Math.random() * cands.reduce((a, c) => a + c.w, 0);
    let i = 0;
    while (i < cands.length - 1 && (x -= cands[i].w) > 0) i++;
    cands[i].r.n++; left--;
    cands.splice(i, 1);
  }
  // 収録数が足りない単位があって余ったぶんは、余りの大きい順にほかの単位へ回す
  const byRemainder = [...rows].sort((a, b) => (b.exact % 1) - (a.exact % 1));
  while (left > 0) {
    let moved = false;
    for (const r of byRemainder) {
      if (left > 0 && r.n < r.cap) { r.n++; left--; moved = true; }
    }
    if (!moved) break;
  }
  return Object.fromEntries(rows.map(r => [r.code, r.n]));
}

function examPick() {
  // シナリオ形式の試験（scenarioPick あり）は、本番と同じ数のシナリオを先に選び、その問題だけから出す
  let bank = QUESTIONS;
  let chosen = [];
  if (EXAM.scenarioPick && SCENARIOS.length) {
    // 分野によっては、問題が特定のシナリオに集まっている。そのシナリオが1つも選ばれないと、その分野を配点どおりに
    // 出せない（例: 配点20%の分野が2問だけになる）。どれかの分野が配点より大きく不足する組み合わせは引き直す。
    // 何度引いても不足するときは、不足がいちばん小さい組み合わせを使う
    const want = Math.min(EXAM_COUNT, QUESTIONS.length);
    const sumW = DOMAINS.reduce((a, d) => a + d.weight, 0) || 1;
    const tolerance = Math.max(1, Math.round(want * 0.05));
    let best = null;
    for (let t = 0; t < 40 && !(best && best.short <= tolerance); t++) {
      const ids = shuffle(SCENARIOS.map(s => s.id)).slice(0, EXAM.scenarioPick);
      const pool = QUESTIONS.filter(q => ids.includes(q.scenario));
      if (pool.length < want) continue;
      const short = Math.max(...DOMAINS.map(d => Math.round(want * d.weight / sumW) - pool.filter(q => q.domain === d.code).length));
      if (!best || short < best.short) best = { ids, pool, short };
    }
    if (best) { chosen = best.ids; bank = best.pool; }
  }
  const total = Math.min(EXAM_COUNT, bank.length);
  // 配点に沿って問題数を割り振る。まず分野ごとに割り振り、試験ガイドがスキルごとの配点も示している試験
  // （exam.json の skills）では、分野の中でさらにスキルごとに割り振る。分野の比率を崩さないため、2段にしている
  const domainOf = k => 'D' + String(k.code).split('.')[0];
  const bySkill = SKILLS.length > 0 && bank.every(q => q.skill);
  const perDomain = apportion(total, DOMAINS.map(d => ({ code: d.code, weight: d.weight, cap: bank.filter(q => q.domain === d.code).length })));
  const picked = shuffle(DOMAINS.flatMap(d => {
    const inDomain = shuffle(bank.filter(q => q.domain === d.code));
    if (!bySkill) return inDomain.slice(0, perDomain[d.code]);
    const skills = SKILLS.filter(k => domainOf(k) === d.code);
    const perSkill = apportion(perDomain[d.code], skills.map(k => ({ code: k.code, weight: k.weight, cap: inDomain.filter(q => q.skill === k.code).length })));
    return skills.flatMap(k => inDomain.filter(q => q.skill === k.code).slice(0, perSkill[k.code]));
  }));
  // 本番と同じく、同じシナリオの問題をまとめて出す
  if (chosen.length) picked.sort((a, b) => chosen.indexOf(a.scenario) - chosen.indexOf(b.scenario));
  return picked.map(q => q.id);
}
function startExam() {
  session = makeSession('exam', examPick());
  ui = { ...ui, hint: '', confirmFinish: false, confirmDiscard: false };
  view = 'quiz'; saveSession(); render();
}
function finishSession() {
  const s = session;
  if (!s || s.finished) return;
  s.finished = true;
  s.endedAt = s.deadline ? Math.min(Date.now(), s.deadline) : Date.now();
  if (s.mode === 'exam') s.ids.forEach(id => record(id, isCorrect(BY_ID[id], s.answers[id])));
  ui.confirmFinish = false;
  saveStats(); saveSession();
  view = 'result';
}
function reviewList(s) {
  return s.mode === 'exam' ? s.ids : s.ids.filter(id => s.submitted[id]);
}

function questionCard(q, o) {
  const d = DOM[q.domain];
  const need = q.answer.length;
  const sel = o.sel || [];
  const items = o.order.map((orig, i) => {
    const chosen = sel.includes(orig);
    const right = q.answer.includes(orig);
    let cls = 'opt';
    if (chosen) cls += ' is-chosen';
    if (o.reveal) cls += right ? ' is-right' : (chosen ? ' is-wrong' : '');
    const marks = o.reveal ? (right ? PEN_CIRCLE : (chosen ? PEN_CHECK : '')) : '';
    const note = o.reveal
      ? `<span class="opt-note">${right ? '<b class="tag tag-right">正解</b>' : ''}${chosen && !right ? '<b class="tag tag-wrong">あなたの回答</b>' : ''}${fmt(q.notes[orig])}</span>`
      : '';
    return `<li role="presentation"><button type="button" class="${cls}" id="opt-${i}" data-action="pick" data-opt="${orig}"
      role="${need > 1 ? 'checkbox' : 'radio'}" aria-checked="${chosen}"${o.reveal ? ' aria-disabled="true"' : ''}>
      <span class="bubble" aria-hidden="true">${LETTERS[i]}${marks}</span>
      <span class="opt-body"><span class="opt-text">${fmt(q.options[orig])}</span>${note}</span></button></li>`;
  }).join('');

  const instr = need > 1
    ? `<span>${need}つ選んでください</span><span class="num">${sel.length} / ${need} 選択中</span>`
    : '<span>最も適切なものを1つ選んでください</span>';

  let after = '';
  if (o.reveal) {

  // 回答の前に見せる情報は、本番で見えるものに近づける。論点名（topic）は正解の言い回しと重なることが多く、
  // 手がかりになるので、正解を表示するまで出さない。模擬試験では、分野と問題番号（分野が分かる）も採点まで出さない
  const meta = o.reveal
    ? `<span class="q-dom"><b>${d.code}</b>${esc(d.name)}</span><span class="q-topic">${esc(q.topic)}</span><span class="q-id">${q.id}</span>`
    : (o.exam ? '' : `<span class="q-dom"><b>${d.code}</b>${esc(d.name)}</span><span class="q-id">${q.id}</span>`);

  return `<article class="sheet" aria-labelledby="q-title">
    <div class="q-meta">

      ${meta}
    </div>
    ${SCN[q.scenario] ? `<div class="scn"><b>シナリオ：${esc(SCN[q.scenario].name)}</b>${fmt(SCN[q.scenario].summary)}</div>` : ''}
    <div class="q-text">${fmt(q.question)}</div>
    ${q.code ? `<pre class="code"><code>${esc(q.code)}</code></pre>` : ''}
    ${o.reveal ? '' : `<div class="q-instr">${instr}</div>${ui.hint ? `<p class="hint" role="alert">${esc(ui.hint)}</p>` : ''}`}
    <ul class="opts" role="${need > 1 ? 'group' : 'radiogroup'}" aria-label="選択肢">${items}</ul>
    ${after}
  </article>`;
}

function viewQuiz() {
  const s = session;
  const id = s.ids[s.idx];
  const q = BY_ID[id];
  const exam = s.mode === 'exam';
  const sel = s.answers[id] || [];
  const revealed = !exam && !!s.submitted[id];
  const last = s.idx === s.ids.length - 1;
  const answeredCount = s.ids.filter(x => (s.answers[x] || []).length).length;
  const progress = exam ? answeredCount / s.ids.length * 100 : (Object.keys(s.submitted).length / s.ids.length) * 100;

  const bar = topBar(
    `<button type="button" class="btn btn-ghost btn-small" id="btn-home" data-action="home">← ${exam ? '中断' : 'ホーム'}</button>`,
    `<span class="bar-mode">${modeName(s.mode)}</span><span class="bar-count"><b>${s.idx + 1}</b> / ${s.ids.length}</span>`,
    `<div class="bar-right">${exam ? '<span class="timer" id="timer"></span>' : ''}${bookmarkBtn(id)}</div>`,
    progress
  );

  const card = questionCard(q, { sel, order: s.order[id], reveal: revealed, exam, number: s.idx + 1 });

  let actions;
  if (!exam) {
    const doneCount = Object.keys(s.submitted).length;
    actions = revealed
      ? `<div class="actions">
          <button type="button" class="btn btn-ghost btn-small" id="btn-quit" data-action="finish" ${doneCount ? '' : 'disabled'}>ここで終了して結果を見る</button>
          <button type="button" class="btn btn-primary" id="btn-next" data-action="next">${last ? '結果を見る' : '次の問題へ →'}</button>
        </div>`
      : `<div class="actions">
          <button type="button" class="btn btn-ghost btn-small" id="btn-quit" data-action="finish" ${doneCount ? '' : 'disabled'}>ここで終了して結果を見る</button>
          <button type="button" class="btn btn-primary" id="btn-submit" data-action="submit" ${sel.length === q.answer.length ? '' : 'disabled'}>回答する</button>
        </div>`;
    actions += '<p class="keys"><kbd>1</kbd>〜<kbd>5</kbd> で選択・<kbd>Enter</kbd> で回答／次へ</p>';
  } else {
    const flagged = !!s.flags[id];
    const flags = s.ids.filter(x => s.flags[x]).length;
    const nav = s.ids.map((x, i) => {
      const cls = [(s.answers[x] || []).length ? 'answered' : '', s.flags[x] ? 'flagged' : '', i === s.idx ? 'current' : ''].filter(Boolean).join(' ');
      return `<button type="button" class="${cls}" id="nav-${i}" data-action="goto" data-idx="${i}" aria-label="問${i + 1}${(s.answers[x] || []).length ? ' 回答済み' : ''}${s.flags[x] ? ' マークあり' : ''}">${i + 1}</button>`;
    }).join('');
    const unanswered = s.ids.length - answeredCount;
    actions = `<div class="actions">
        <button type="button" class="btn" id="btn-prev" data-action="prev" ${s.idx ? '' : 'disabled'}>← 前へ</button>
        <button type="button" class="btn btn-ghost" id="btn-flag" data-action="flag" aria-pressed="${flagged}">${flagged ? '● 見直しマーク中' : '○ 見直しマーク'}</button>
        <button type="button" class="btn ${last ? '' : 'btn-primary'}" id="btn-next" data-action="next" ${last ? 'disabled' : ''}>次へ →</button>
      </div>
      <details class="navbox" open>
        <summary>問題一覧 <span>回答済み ${answeredCount} / ${s.ids.length}・マーク ${flags}</span></summary>
        <div class="nav">${nav}</div>
        <div class="legend"><span><i class="l-ans"></i>回答済み</span><span><i class="l-flag"></i>見直しマーク</span><span><i></i>未回答</span></div>
      </details>
      ${ui.confirmFinish
        ? `<div class="finish-box" role="alert"><span>${unanswered ? `未回答が <b>${unanswered}</b> 問あります。` : 'すべての問題に回答しました。'}採点すると回答は変更できません。</span>
            <span class="banner-actions"><button type="button" class="btn btn-danger" id="btn-finish-yes" data-action="finish-yes">採点する</button>
            <button type="button" class="btn" id="btn-finish-no" data-action="finish-no">戻る</button></span></div>`
        : `<div class="actions"><span class="grow"></span><button type="button" class="btn ${last ? 'btn-primary' : ''}" id="btn-finish" data-action="finish">試験を終了して採点</button></div>`}
      <p class="keys"><kbd>1</kbd>〜<kbd>5</kbd> で選択・<kbd>←</kbd><kbd>→</kbd> で移動</p>`;
  }

  return `${bar}<div class="wrap">${card}${actions}</div>`;
}

/* ---------- 画面：結果と解説 ---------- */
function resultOf(s) {
  const rows = reviewList(s).map(id => {
    const q = BY_ID[id];
    const sel = s.answers[id] || [];
    return { id, q, answered: sel.length > 0, correct: isCorrect(q, sel) };
  });
  return { rows, ok: rows.filter(r => r.correct).length, total: rows.length };
}

function viewResult() {
  const s = session;
  const r = resultOf(s);
  const rate = r.total ? r.ok / r.total : 0;
  const pct = Math.round(rate * 100);
  const need = Math.max(0, Math.ceil(PASS_RATE * r.total - 1e-9) - r.ok);
  const wrongIds = r.rows.filter(x => !x.correct).map(x => x.id);
  const unanswered = r.rows.filter(x => !x.answered).length;

  const doms = DOMAINS.map(d => {
    const rows = r.rows.filter(x => x.q.domain === d.code);
    if (!rows.length) return '';
    const ok = rows.filter(x => x.correct).length;
    return `<div class="dom-row"><span class="bp-code">${d.code}</span><span>${esc(d.name)}</span><span class="num">${ok} / ${rows.length}</span>
      <span class="meter-track acc"><span style="width:${(ok / rows.length * 100).toFixed(1)}%"></span></span></div>`;
  }).join('');

  const list = r.rows.map((x, i) => `<li><button type="button" id="res-${i}" data-action="review" data-idx="${i}">
      <span class="res-mark ${x.correct ? 'ok' : 'ng'}" aria-label="${x.correct ? '正解' : '不正解'}">${x.correct ? '○' : '×'}</span>
      <span class="num">問${s.ids.indexOf(x.id) + 1}</span><span class="bp-code">${x.q.domain}</span>
      <span class="res-topic">${esc(x.q.topic)}${x.answered ? '' : '（未回答）'}</span><span class="res-go">解説 →</span></button></li>`).join('');

  const timeLine = s.mode === 'exam'
    ? `<span>所要時間 <b>${fmtTime((s.endedAt || Date.now()) - s.startedAt)}</b> / ${fmtTime(EXAM_MINUTES * 60000)}</span>` : '';

  return `<div class="wrap">
    <header class="score-head">
      <p class="eyebrow">${modeName(s.mode)}の結果</p>
      <div class="score-row">
        <span class="score num">${pct}<small>%</small></span>
        <span class="score-sub"><span>正解 <b>${r.ok}</b> / ${r.total}問</span>${timeLine}${unanswered ? `<span>未回答 <b>${unanswered}</b>問</span>` : ''}</span>
      </div>
      <div class="gauge" role="img" aria-label="正答率 ${pct}%、合格目安 ${PASS_PCT}%"><span style="width:${pct}%"></span><i class="mark" style="left:${PASS_RATE * 100}%" data-label="合格目安 ${PASS_PCT}%"></i></div>
      <p class="score-msg">${rate >= PASS_RATE ? `合格目安の正答率${PASS_PCT}%を上回りました。` : `合格目安の正答率${PASS_PCT}%まで、あと${need}問です。`}</p>
      <p class="score-note">本番は${EXAM.scaleMin}〜${EXAM.scaleMax}のスケールスコアで、${EXAM.passScore}以上が合格です。換算式は公開されていないので、ここでは正答率${PASS_PCT}%を目安にしています。</p>
    </header>

    <section class="sheet">
      <h2 style="font-size:18px">${esc(DOMAIN_LABEL)}別の正答</h2>
      <div class="dom-list">${doms}</div>
    </section>

    <section>
      <div class="section-head"><h2>問題ごとの結果</h2><p>行を選ぶと、正解と解説を確認できます。</p></div>
      <ul class="res-list">${list}</ul>
    </section>

    <div class="actions">
      <button type="button" class="btn" id="btn-res-home" data-action="home">ホームへ</button>
      <button type="button" class="btn btn-primary" id="btn-retry" data-action="retry-wrong" ${wrongIds.length ? '' : 'disabled'}>間違えた${wrongIds.length}問を解き直す</button>
    </div>
  </div>`;
}

function viewReview() {
  const s = session;
  const list = reviewList(s);
  const i = Math.min(Math.max(0, ui.reviewIdx), list.length - 1);
  const id = list[i];
  const q = BY_ID[id];
  const bar = topBar(
    '<button type="button" class="btn btn-ghost btn-small" id="btn-back" data-action="back-result">← 結果へ</button>',
    `<span class="bar-mode">解説</span><span class="bar-count"><b>${i + 1}</b> / ${list.length}</span>`,
    `<div class="bar-right">${bookmarkBtn(id)}</div>`,
    null
  );
  const card = questionCard(q, { sel: s.answers[id] || [], order: s.order[id], reveal: true, number: s.ids.indexOf(id) + 1 });
  return `${bar}<div class="wrap">${card}
    <div class="actions">
      <button type="button" class="btn" id="btn-rprev" data-action="review-prev" ${i ? '' : 'disabled'}>← 前の問題</button>
      <button type="button" class="btn btn-primary" id="btn-rnext" data-action="review-next" ${i < list.length - 1 ? '' : 'disabled'}>次の問題 →</button>
    </div></div>`;
}

/* ---------- 描画 ---------- */
const app = document.getElementById('app');
function render() {
  if (view !== 'home' && !session) view = 'home';
  const activeId = document.activeElement && document.activeElement.id;
  if (view === 'quiz') app.innerHTML = viewQuiz();
  else if (view === 'result') app.innerHTML = viewResult();
  else if (view === 'review') app.innerHTML = viewReview();
  else app.innerHTML = viewHome();

  const scrollKey = view + ':' + (view === 'quiz' ? session.idx : view === 'review' ? ui.reviewIdx : '');
  if (scrollKey !== lastScrollKey) { window.scrollTo(0, 0); lastScrollKey = scrollKey; }
  if (activeId) {
    const el = document.getElementById(activeId);
    if (el && !el.disabled) el.focus({ preventScroll: true });
  }
  tick();
}

/* ---------- 操作 ---------- */
function currentQ() { return BY_ID[session.ids[session.idx]]; }

function pick(orig) {
  const s = session;
  const q = currentQ();
  if (s.mode !== 'exam' && s.submitted[q.id]) return;
  const need = q.answer.length;
  let sel = [...(s.answers[q.id] || [])];
  ui.hint = '';
  if (need === 1) sel = [orig];
  else if (sel.includes(orig)) sel = sel.filter(x => x !== orig);
  else if (sel.length >= need) ui.hint = `選べるのは${need}つまでです。ほかの選択肢を選ぶ前に、どれかを外してください。`;
  else sel.push(orig);
  s.answers[q.id] = sel;
  saveSession(); render();
}
function submit() {
  const s = session;
  const q = currentQ();
  const sel = s.answers[q.id] || [];
  if (s.mode === 'exam' || s.submitted[q.id] || sel.length !== q.answer.length) return;
  s.submitted[q.id] = true;
  record(q.id, isCorrect(q, sel));
  saveStats(); saveSession(); render();
}
function go(delta) {
  const s = session;
  const n = s.idx + delta;
  if (n < 0 || n >= s.ids.length) return;
  s.idx = n; ui.hint = ''; ui.confirmFinish = false;
  saveSession(); render();
}
function next() {
  const s = session;
  if (s.mode !== 'exam' && s.idx === s.ids.length - 1) { finishSession(); render(); return; }
  go(1);
}

// 模擬試験の途中で別の出題を始めようとしたら、先に破棄するかを確かめる（黙って消さない）
function examInProgress() {
  if (!session || session.finished || session.mode !== 'exam') return false;
  ui.confirmDiscard = true;
  render();
  window.scrollTo(0, 0);
  return true;
}

const actions = {
  'start-practice': () => { if (!examInProgress()) startPractice(); },
  'start-exam': () => { if (!examInProgress()) startExam(); },
  'domain-practice': el => { if (examInProgress()) return; prefs.domains = [el.dataset.domain]; prefs.filter = 'all'; savePrefs(); startPractice(); },
  'scenario-practice': el => {
    if (examInProgress()) return;
    const qs = QUESTIONS.filter(q => q.scenario === el.dataset.scenario);
    startPractice((prefs.order === 'seq' ? qs : shuffle([...qs])).map(q => q.id));
  },
  'toggle-domain': el => {
    const c = el.dataset.domain;
    prefs.domains = prefs.domains.includes(c) ? prefs.domains.filter(x => x !== c) : [...prefs.domains, c];
    savePrefs(); render();
  },
  'all-domains': () => {
    prefs.domains = prefs.domains.length === DOMAINS.length ? [] : DOMAINS.map(d => d.code);
    savePrefs(); render();
  },
  'resume': () => { view = session.finished ? 'result' : 'quiz'; ui.confirmDiscard = false; render(); },
  'last-result': () => { view = 'result'; render(); },
  'discard': () => { ui.confirmDiscard = true; render(); },
  'discard-no': () => { ui.confirmDiscard = false; render(); },
  'discard-yes': () => { session = null; ui.confirmDiscard = false; saveSession(); render(); },
  'reset': () => { ui.confirmReset = true; render(); },
  'reset-no': () => { ui.confirmReset = false; render(); },
  'reset-yes': () => { stats = {}; ui.confirmReset = false; saveStats(); render(); },
  'home': () => { view = 'home'; ui.confirmFinish = false; ui.hint = ''; render(); },
  'pick': el => pick(Number(el.dataset.opt)),
  'submit': () => submit(),
  'next': () => next(),
  'prev': () => go(-1),
  'goto': el => go(Number(el.dataset.idx) - session.idx),
  'flag': () => { const id = currentQ().id; session.flags[id] = !session.flags[id]; saveSession(); render(); },
  'bookmark': () => {
    const id = view === 'review' ? reviewList(session)[ui.reviewIdx] : currentQ().id;
    stats[id] = { ...st(id), bm: !st(id).bm }; saveStats(); render();
  },
  'finish': () => {
    if (session.mode === 'exam') { ui.confirmFinish = true; render(); }
    else { finishSession(); render(); }
  },
  'finish-no': () => { ui.confirmFinish = false; render(); },
  'finish-yes': () => { finishSession(); render(); },
  'review': el => { ui.reviewIdx = Number(el.dataset.idx); view = 'review'; render(); },
  'review-prev': () => { ui.reviewIdx = Math.max(0, ui.reviewIdx - 1); render(); },
  'review-next': () => { ui.reviewIdx = Math.min(reviewList(session).length - 1, ui.reviewIdx + 1); render(); },
  'back-result': () => { view = 'result'; render(); },
  'retry-wrong': () => {
    const ids = resultOf(session).rows.filter(x => !x.correct).map(x => x.id);
    startPractice(shuffle(ids));
  },
};

app.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled || el.getAttribute('aria-disabled') === 'true') return;
  const fn = actions[el.dataset.action];
  if (fn) fn(el, e);
});
app.addEventListener('change', e => {
  const el = e.target.closest('[data-pref]');
  if (!el) return;
  prefs[el.dataset.pref] = el.value;
  savePrefs(); render();
});
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.closest && e.target.closest('input, select, textarea, summary')) return;
  if (view === 'quiz' && session) {
    const k = e.key.toLowerCase();
    const map = { '1': 0, '2': 1, '3': 2, '4': 3, '5': 4, a: 0, b: 1, c: 2, d: 3, e: 4 };
    const q = currentQ();
    if (k in map) {
      const order = session.order[q.id];
      if (map[k] < order.length) { e.preventDefault(); pick(order[map[k]]); }
      return;
    }
    if (e.key === 'Enter') {
      const onOther = e.target.closest('button') && !e.target.closest('.opt');
      if (onOther) return;
      e.preventDefault();
      if (session.mode === 'exam') { if (session.idx < session.ids.length - 1) go(1); }
      else if (session.submitted[q.id]) next();
      else submit();
      return;
    }
    if (session.mode === 'exam') {
      if (e.key === 'ArrowRight') { e.preventDefault(); go(1); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
    }
  } else if (view === 'review' && session) {
    if (e.key === 'ArrowRight') { e.preventDefault(); actions['review-next'](); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); actions['review-prev'](); }
  }
});

/* ---------- タイマー ---------- */
function tick() {
  if (!session || session.mode !== 'exam' || session.finished) return;
  const ms = session.deadline - Date.now();
  if (ms <= 0) {
    const wasInQuiz = view === 'quiz';
    finishSession();
    if (!wasInQuiz) view = 'home';
    render();
    return;
  }
  const el = document.getElementById('timer');
  if (el) {
    el.textContent = '残り ' + fmtTime(ms);
    el.classList.toggle('is-low', ms < 10 * 60000);
  }
}
setInterval(tick, 1000);

render();
})();
</script>

</html>
