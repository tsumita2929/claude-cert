<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CCAR-P 問題集</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap">
<style>
/* Layout: 一枚の答案用紙。中央1カラムの問題冊子、選択肢はマークシートの楕円、採点は赤ペンの丸付け */
:root {
  --bg: #eef1f4;
  --sheet: #ffffff;
  --ink: #18202b;
  --muted: #586473;
  --line: #d5dbe3;
  --print: #1b6b83;        /* マークシートの印刷インク */
  --print-soft: #e2eff3;
  --graphite: #262b33;     /* 鉛筆で塗った楕円 */
  --graphite-ink: #ffffff;
  --pen: #d03a3a;          /* 採点用の赤ペン */
  --pen-soft: #fbeaea;
  --ok: #1d7650;
  --ok-soft: #e5f2ea;
  --code-bg: #f2f4f7;
  --font-display: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  --font-body: "IBM Plex Sans JP", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", "Meiryo", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1318; --sheet: #171c23; --ink: #e6e9ee; --muted: #9aa4b2; --line: #2a323d;
    --print: #6bbfd5; --print-soft: #15303a; --graphite: #e6e9ee; --graphite-ink: #0f1318;
    --pen: #ff716b; --pen-soft: #3a1e21; --ok: #5cc898; --ok-soft: #13302a; --code-bg: #11161c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1318; --sheet: #171c23; --ink: #e6e9ee; --muted: #9aa4b2; --line: #2a323d;
  --print: #6bbfd5; --print-soft: #15303a; --graphite: #e6e9ee; --graphite-ink: #0f1318;
  --pen: #ff716b; --pen-soft: #3a1e21; --ok: #5cc898; --ok-soft: #13302a; --code-bg: #11161c;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.75;
  font-feature-settings: "palt" 0;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
p { margin: 0; }
code {
  font-family: var(--font-mono); font-size: .88em;
  background: var(--code-bg); border: 1px solid var(--line); border-radius: 4px;
  padding: .05em .35em; overflow-wrap: anywhere;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--print); outline-offset: 2px; }

.wrap {
  max-width: 760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 72px;
  display: flex; flex-direction: column; gap: 28px;
}
.wrap-wide { max-width: 920px; }

/* ---------- 共通部品 ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 8px 18px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--sheet); color: var(--ink);
  font-weight: 700; font-size: 15px; cursor: pointer; white-space: nowrap;
}
.btn:hover:not(:disabled) { border-color: var(--ink); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn-primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn-primary:hover:not(:disabled) { background: var(--print); border-color: var(--print); color: var(--sheet); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn-ghost:hover:not(:disabled) { border-color: transparent; color: var(--ink); }
.btn-small { min-height: 36px; padding: 4px 12px; font-size: 14px; }
.btn-danger { background: var(--pen); border-color: var(--pen); color: var(--sheet); }
.eyebrow {
  font-family: var(--font-mono); font-size: 12px; font-weight: 500;
  letter-spacing: .12em; text-transform: uppercase; color: var(--print);
}
.muted { color: var(--muted); }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* ---------- ホーム ---------- */
.banner {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px;
  padding: 12px 16px; border-radius: var(--radius);
  background: var(--print-soft); border: 1px solid var(--print);
}
.banner > span { min-width: 0; }
.banner-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }

.hero { display: flex; flex-direction: column; gap: 12px; padding-top: 8px; }
.hero h1 { font-weight: 900; font-size: clamp(36px, 8vw, 56px); line-height: 1.1; letter-spacing: .01em; }
.hero .lead { max-width: 40em; color: var(--muted); }

.spec {
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
  margin: 0; border: 1.5px solid var(--print); border-radius: 8px; overflow: hidden;
  background: var(--sheet);
}
.spec > div { padding: 12px 16px; border-left: 1px solid var(--print); min-width: 0; }
.spec > div:first-child { border-left: none; }
.spec dt { font-size: 12px; letter-spacing: .08em; color: var(--print); font-weight: 700; }
.spec dd { margin: 2px 0 0; font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.3; }
.spec dd small { font-family: var(--font-body); font-size: 13px; font-weight: 500; color: var(--muted); }

.modes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.panel {
  background: var(--sheet); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 20px; display: flex; flex-direction: column; gap: 16px; min-width: 0;
}
.panel h2 { font-size: 22px; font-weight: 900; }
.panel-head { display: flex; flex-direction: column; gap: 4px; }
.panel-head p { color: var(--muted); font-size: 14px; }
.panel-foot { margin-top: auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.panel-foot .count { font-size: 14px; color: var(--muted); }
.panel-foot .count b { color: var(--ink); font-family: var(--font-mono); }

.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field-label { font-size: 12px; font-weight: 700; letter-spacing: .06em; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.field-label button { border: none; background: none; padding: 0; color: var(--print); font-size: 12px; font-weight: 700; cursor: pointer; }
.field-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 10px; }
select {
  font: inherit; font-size: 14px; width: 100%; min-height: 40px;
  padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--sheet); color: var(--ink);
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-btn {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px; padding: 4px 10px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: transparent; color: var(--muted);
}
.chip-btn b { font-family: var(--font-mono); font-weight: 500; font-size: 12px; }
.chip-btn[aria-pressed="true"] { background: var(--print-soft); border-color: var(--print); color: var(--ink); }
.ticks { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
.ticks li { display: flex; gap: 10px; }
.ticks li::before {
  content: ""; flex: none; width: 12px; height: 16px; margin-top: 5px;
  border: 1.5px solid var(--print); border-radius: 50%;
}

.section-head { display: flex; flex-direction: column; gap: 4px; margin-bottom: 4px; }
.section-head h2 { font-size: 22px; font-weight: 900; }
.section-head p { color: var(--muted); font-size: 14px; }
.bp { display: flex; flex-direction: column; }
.bp-row {
  display: grid; grid-template-columns: 40px minmax(0, 1fr) 150px 110px auto;
  align-items: center; gap: 8px 14px; padding: 12px 0; border-top: 1px solid var(--line);
}
.bp-row:last-child { border-bottom: 1px solid var(--line); }
.bp-code { font-family: var(--font-mono); font-weight: 500; color: var(--print); }
.bp-name { min-width: 0; line-height: 1.45; }
.bp-name b { display: block; font-weight: 700; }
.bp-name small { color: var(--muted); font-size: 12px; }
.meter { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
.meter-track { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.meter-track span { display: block; height: 100%; background: var(--print); }
.meter-track.acc span { background: var(--ink); }
.meter .num { color: var(--ink); }

.foot { display: flex; flex-direction: column; gap: 14px; font-size: 14px; color: var(--muted); }
.foot-stats { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; }
.foot-stats b { color: var(--ink); font-family: var(--font-mono); font-weight: 500; }
.foot-stats .spacer { flex: 1; }
.confirm { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--ink); }

/* ---------- 上部バー ---------- */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
.bar-inner {
  max-width: 760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px;
  display: flex; align-items: center; gap: 8px 12px;
}
.bar-mid { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 10px; }
.bar-mode { font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--print); }
.bar-count { font-family: var(--font-mono); font-size: 14px; color: var(--muted); white-space: nowrap; }
.bar-count b { color: var(--ink); font-size: 16px; }
.bar-right { display: flex; align-items: center; gap: 6px; }
.timer {
  font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 14px;
  padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap;
}
.timer.is-low { color: var(--pen); border-color: var(--pen); }
.icon-btn {
  width: 40px; height: 40px; border-radius: 8px; border: 1px solid transparent;
  background: transparent; cursor: pointer; font-size: 20px; line-height: 1; color: var(--muted);
}
.icon-btn:hover { border-color: var(--line); }
.icon-btn[aria-pressed="true"] { color: var(--pen); }
.bar-progress { height: 3px; background: var(--line); }
.bar-progress span { display: block; height: 100%; background: var(--print); transition: width .25s; }

/* ---------- 問題 ---------- */
.sheet {
  background: var(--sheet); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 24px clamp(16px, 4vw, 32px) 28px;
  display: flex; flex-direction: column; gap: 18px; min-width: 0;
}
.q-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font-size: 13px; color: var(--muted); }
.q-num { font-family: var(--font-display); font-weight: 900; font-size: 24px; color: var(--ink); line-height: 1; }
.q-num small { font-size: 14px; margin-right: 2px; }
.q-dom { border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px; }
.q-dom b { font-family: var(--font-mono); font-weight: 500; color: var(--print); margin-right: 4px; }
.q-id { font-family: var(--font-mono); font-size: 12px; margin-left: auto; }
.q-text { font-size: 17px; line-height: 1.9; }
.code {
  margin: 0; padding: 14px 16px; border-radius: 8px; background: var(--code-bg); border: 1px solid var(--line);
  font-family: var(--font-mono); font-size: 13.5px; line-height: 1.65; overflow-x: auto; white-space: pre; tab-size: 2;
}
.code code { background: none; border: none; padding: 0; font-size: inherit; overflow-wrap: normal; }
.q-instr { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; font-size: 14px; font-weight: 700; }
.q-instr .num { font-weight: 500; color: var(--muted); }
.hint { font-size: 14px; color: var(--pen); }
.scn {
  border-left: 3px solid var(--print); background: var(--print-soft); border-radius: 0 8px 8px 0;
  padding: 10px 14px; font-size: 14px; line-height: 1.75;
}
.scn b { display: block; font-size: 12px; font-weight: 700; letter-spacing: .06em; color: var(--print); }

.opts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: flex; align-items: flex-start; gap: 16px; width: 100%; text-align: left;
  padding: 12px 16px 12px 14px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--line); background: transparent; line-height: 1.7;
}
.opt:hover { border-color: var(--print); }
.opt.is-chosen { border-color: var(--graphite); }
.opt[aria-disabled="true"] { cursor: default; }
.opt[aria-disabled="true"]:hover { border-color: var(--line); }
.opt.is-right, .opt.is-right:hover { background: var(--ok-soft); border-color: var(--ok); }
.opt.is-wrong, .opt.is-wrong:hover { background: var(--pen-soft); border-color: var(--pen); }
.bubble {
  position: relative; flex: none; width: 24px; height: 34px; margin-top: -3px;
  display: grid; place-items: center; border-radius: 50%;
  border: 1.5px solid var(--print); color: var(--print);
  font-family: var(--font-mono); font-size: 13px; font-weight: 500;
}
.opt.is-chosen .bubble { background: var(--graphite); border-color: var(--graphite); color: var(--graphite-ink); }
.opt-body { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.opt-note { font-size: 14px; color: var(--muted); line-height: 1.7; }
.tag {
  display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .04em;
  padding: 0 8px; border-radius: 999px; margin-right: 6px; line-height: 1.8; vertical-align: 1px;
}
.tag-right { background: var(--ok); color: var(--sheet); }
.tag-wrong { background: var(--pen); color: var(--sheet); }

.pen {
  position: absolute; left: 50%; top: 50%; width: 46px; height: 56px;
  transform: translate(-50%, -50%) rotate(-10deg); overflow: visible; pointer-events: none;
}
.pen path, .vmark path {
  fill: none; stroke: var(--pen); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;
  stroke-dasharray: 260; stroke-dashoffset: 0; animation: draw .6s ease-out both;
}
.pen-check { width: 40px; height: 44px; transform: translate(-30%, -60%) rotate(-4deg); }
@keyframes draw { from { stroke-dashoffset: 260; } }

.verdict { display: flex; align-items: center; gap: 16px; padding: 14px 18px; border-radius: 8px; }
.verdict.ok { background: var(--ok-soft); }
.verdict.ng { background: var(--pen-soft); }
.vmark { width: 48px; height: 48px; flex: none; overflow: visible; }
.verdict-title { font-family: var(--font-display); font-weight: 900; font-size: 24px; line-height: 1.2; }
.verdict-sub { font-size: 14px; color: var(--muted); }
.explain { display: flex; flex-direction: column; gap: 8px; padding-top: 18px; border-top: 1px dashed var(--line); }
.explain h3 { font-size: 15px; font-weight: 900; color: var(--print); letter-spacing: .06em; }
.explain p { line-height: 1.9; }
.ref { font-size: 13px; color: var(--muted); }

.actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.actions .grow { flex: 1; }
.keys { font-size: 12px; color: var(--muted); text-align: center; }
.keys kbd {
  font-family: var(--font-mono); font-size: 11px; padding: 0 5px; border-radius: 4px;
  border: 1px solid var(--line); background: var(--sheet);
}

.navbox { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.navbox summary { cursor: pointer; font-weight: 700; font-size: 14px; display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; }
.navbox summary span { font-weight: 400; color: var(--muted); font-size: 13px; }
.nav { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 6px; margin-top: 12px; }
.nav button {
  position: relative; height: 36px; border-radius: 6px; border: 1px solid var(--line);
  background: transparent; cursor: pointer; font-family: var(--font-mono); font-size: 13px;
}
.nav button.answered { background: var(--graphite); border-color: var(--graphite); color: var(--graphite-ink); }
.nav button.current { outline: 2px solid var(--print); outline-offset: 1px; }
.nav button.flagged::after {
  content: ""; position: absolute; top: 3px; right: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--pen);
}
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 10px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; border: 1px solid var(--line); }
.legend .l-ans { background: var(--graphite); border-color: var(--graphite); }
.legend .l-flag { background: var(--pen); border-color: var(--pen); border-radius: 50%; }
.finish-box {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
  padding: 14px 16px; border-radius: var(--radius); border: 1px solid var(--pen); background: var(--pen-soft);
}

/* ---------- 結果 ---------- */
.score-head { display: flex; flex-direction: column; gap: 14px; }
.score-row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 24px; }
.score { font-family: var(--font-display); font-weight: 900; font-size: clamp(56px, 14vw, 88px); line-height: .95; }
.score small { font-size: .4em; margin-left: 4px; }
.score-sub { display: flex; flex-direction: column; gap: 2px; padding-bottom: 6px; font-size: 14px; color: var(--muted); }
.score-sub b { color: var(--ink); font-family: var(--font-mono); font-weight: 500; }
.gauge { position: relative; height: 10px; border-radius: 5px; background: var(--line); margin-top: 18px; }
.gauge > span { display: block; height: 100%; border-radius: 5px; background: var(--ink); }
.gauge .mark { position: absolute; top: -7px; bottom: -7px; width: 2px; background: var(--pen); }
.gauge .mark::before {
  content: attr(data-label); position: absolute; bottom: calc(100% + 2px); left: 50%; transform: translateX(-50%);
  font-size: 11px; color: var(--pen); white-space: nowrap; font-weight: 700;
}
.score-msg { font-weight: 700; }
.score-note { font-size: 13px; color: var(--muted); }

.dom-list { display: flex; flex-direction: column; gap: 10px; }
.dom-row { display: grid; grid-template-columns: 40px minmax(0, 1fr) 72px; gap: 4px 14px; align-items: center; font-size: 14px; }
.dom-row .meter-track { grid-column: 2 / 3; }
.dom-row .num { text-align: right; }
.res-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.res-list button {
  width: 100%; display: grid; grid-template-columns: 28px 52px 40px minmax(0, 1fr) auto;
  align-items: center; gap: 10px; padding: 10px 4px; border: none; border-bottom: 1px solid var(--line);
  background: transparent; text-align: left; cursor: pointer; font-size: 14px;
}
.res-list button:hover { background: var(--sheet); }
.res-mark { font-size: 20px; line-height: 1; font-weight: 700; text-align: center; }
.res-mark.ok { color: var(--pen); }
.res-mark.ng { color: var(--muted); }
.res-topic { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res-go { color: var(--print); font-size: 13px; font-weight: 700; }

@media (max-width: 680px) {
  .spec { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .spec > div:nth-child(3) { border-left: none; }
  .spec > div:nth-child(n+3) { border-top: 1px solid var(--print); }
  .modes { grid-template-columns: minmax(0, 1fr); }
  .bp-row { grid-template-columns: 36px minmax(0, 1fr) auto; }
  .bp-row .meter { grid-column: 2 / 3; }
  .bp-row .bp-go { grid-column: 3; grid-row: 1; }
  .res-list button { grid-template-columns: 24px 44px 34px minmax(0, 1fr); }
  .res-go { display: none; }
  .q-id { margin-left: 0; }
  .keys { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .pen path, .vmark path { animation: none; }
  .bar-progress span { transition: none; }
}
</style>

<script>
(() => {
'use strict';

const QUESTIONS = [{"id":"D1-01","domain":"D1","topic":"役割の3分割","type":"single","question":"ある大学の経理課が、教員から出される研究費の精算の審査に Claude を使う計画を立てています。申請には、教員が自由に書いた支出の目的と、領収書の画像が付きます。費目ごとに精算できる額は会計システムに登録された規則で一意に決まり、精算を確定させる判断は経理担当者が行うと学内規程で決まっています。役割の分け方として最も適切なものはどれですか。","options":["Claude に規程の全文と領収書を渡して精算額を計算させ、可否も判断させて、審査を最後まで自動で完結させる","Claude が目的の記述と領収書から費目の候補と両者の食い違いを挙げ、精算額は会計システムが出し、確定は担当者が行う","Claude は教員への差し戻しの連絡文を下書きするだけにし、記述と領収書の読み取りから精算額の算出までは担当者が行う","精算額も Claude に計算させ、会計システムの規則どおりになるよう手順と例をプロンプトに詳しく書き、確定は担当者が行う"],"answer":[1],"notes":["規則で一意に決まる計算を確率的な出力に任せると、同じ申請でも額がぶれるおそれがあります。規程で担当者が行うと決まっている確定まで自動化しており、統制も満たしません。","正解。意味の理解が要る自由記述と領収書の読み取り（費目の候補と、記述と領収書の食い違いの指摘）は Claude、規則で決まる計算は既存の会計システム、規程で責任が求められる確定は人、と仕事の性質に合わせて分けています。","Claude に向く自由記述の読み取りを人に残しており、審査の手間の大部分が減りません。統制を守ることと、Claude の得意な部分を使うことは両立できます。","人による確定は守っていますが、会計システムが一意に出せる計算を確率的な出力に置き換えています。手順を詳しく書いても、規則どおりの額になる保証はありません。"],"explanation":"ビジネス課題を落とし込むときは、仕事を「Claude がやること」「既存システムがやること」「人がやること」に分けます。Claude に向くのは、形の決まっていない文章や画像を意味で読み取って判断する仕事です。規則で一意に決まる計算や記録の正本は既存のシステムに残し、規程や責任のうえで人の判断が要る箇所には人を置きます。3つのどれを取り違えても、正確さ、統制、効果のどれかが欠けます。","ref":"試験ガイド 分野1 タスク 1.1（ビジネス課題を Claude ベースの AI ソリューションに落とし込む）／ Claude Docs: Ticket routing（Define whether to use Claude）"},{"id":"D1-02","domain":"D1","topic":"変わる値と検索","type":"single","question":"家電量販チェーンが、店舗の在庫と注文の配送状況に答えるチャットアシスタントを計画しています。開発チームは、在庫と注文の状況を毎晩ベクトルデータベースに書き出し、商品マニュアルや返品規定と同じく検索（RAG）で答えさせる案を出しました。在庫は日中に何度も変わり、「店に行ったのに在庫がなかった」という苦情を減らすことが目的です。最も適切な提案はどれですか。","options":["書き出しの間隔を毎晩から1時間ごとに縮め、検索用のインデックスを日中も休まずこまめに作り直す","全店舗の在庫の一覧をシステムプロンプトに入れ、会話のたびに最新の一覧を取り直して送る","回答の末尾に「在庫は変わることがあります」と添えるよう、システムプロンプトで指示する","在庫と注文は回答のたびに各システムの API をツールで呼んで取り、検索は文書だけに使う"],"answer":[3],"notes":["間隔を縮めても、日中の変化とのずれは残ります。症状を小さくするだけで、刻々と変わる値を検索に担わせているという設計の誤りは直りません。","一覧が大きいほどトークンと費用がかさみ、送った時点からまた古くなります。必要な1件を必要なときに取りに行くほうが的確です。","注意書きは、苦情の原因（古い在庫を答えていること）を取り除きません。モデルに言わせて済ませる対応です。","正解。刻々と変わる値は正本を持つシステムにその場で問い合わせ、変わりにくい文書は検索で補う、という役割分担です。"],"explanation":"拡張LLM の補強には、検索とツールがあります。検索は、規定やマニュアルのように変わりにくい文書を引くのに向き、在庫や残高のように刻々と変わる値は、正本を持つシステムにツールで問い合わせるのが基本です。本来はライブの状態が担うべき役割を検索に担わせていないかは、設計の最初に確かめる点です。インデックスの更新を速めるのは症状への対処で、原因は残ります。","ref":"試験ガイド 分野1 タスク 1.1（ビジネス課題を Claude ベースの AI ソリューションに落とし込む）／ Anthropic: Building effective agents（The augmented LLM）"},{"id":"D1-03","domain":"D1","topic":"原因に当てる","type":"single","question":"ある市役所では、市民からの問い合わせへの回答に平均5日かかっています。業務を調べると、遅れの大半は、問い合わせを読んで担当課を決め、回すまでの待ち時間でした。回答の内容には行政としての責任があり、担当課の職員が確認してから出すと決まっています。Claude を使う最初の解決策として最も適切なものはどれですか。","options":["Claude が問い合わせを読んで担当課を判定し、要約を添えて既存の案件管理システムに登録し、回答は担当課が作る","よくある質問だけは Claude が規則集から回答を作って自動で返信し、残りは今までどおりの手順で担当課に回す","Claude が市の規則集を検索して回答の下書きを作り、担当課の職員が確認して直してから市民へ返信する","担当課の判定から回答の下書きまでを行うエージェント型の構成を新しく作り、既存の案件管理システムと置き換える"],"answer":[0],"notes":["正解。遅れの原因である振り分けに Claude を当て、記録は既存のシステム、責任のある回答は職員、という分担です。","よくある質問に限っても、職員が確認してから出すという決まりを破ります。残りの問い合わせは、遅れの原因である振り分けの待ち時間がそのままです。","職員の確認という決まりは守っていますが、遅れの大半を占める振り分けの待ち時間は減りません。目立つ回答作成に手を当てた、別の問題を解く手です。","作り込みすぎです。原因は振り分けの待ち時間で、動いている既存のシステムを置き換える理由がありません。最初の一手としては大きすぎ、効果が出るまでの時間も延びます。"],"explanation":"課題を落とし込むときは、まず今の業務がどう回っていて、どこで時間や失敗が生じているかを調べ、その原因に Claude の得意な仕事を当てます。自由な文面の問い合わせを意味で分類して振り分ける仕事は Claude に向き、Anthropic のチケット振り分けのガイドもこの使い方を例にしています。目立つ「回答の自動作成」に飛びつかず、制約（職員の確認）を守ったまま、原因に効く部分から始めます。","ref":"試験ガイド 分野1 タスク 1.1（ビジネス課題を Claude ベースの AI ソリューションに落とし込む）／ Claude Docs: Ticket routing"},{"id":"D1-04","domain":"D1","topic":"改善のループ","type":"multi","question":"銀行の法人営業部が、顧客との面談の文字起こしから面談記録の下書きを Claude で作り、担当者が手直ししてから顧客管理システムに登録する仕組みを本番で運用しています。入力から出力までは動いていますが、担当者の手直しの量が減らず、プロンプトを変えても良くなったのか悪くなったのかが分かりません。フィードバックループを閉じるために取るべき対応はどれですか。（2つ選択）","options":["下書きごとに、入力、使ったプロンプトとモデルの版、担当者が直した後の文面をひも付けて記録する","Claude に下書きごとの確信度を自己申告させ、確信度の低いものだけを担当者の確認に回す","これまでの担当者の手直しをすべてシステムプロンプトの末尾に書き足し、モデルに学ばせる","手直しが大きかった事例を評価データセットに加え、プロンプトやモデルを変える前に必ずその評価を通す","担当者の手直しを毎週自動でファインチューニングに回し、できたモデルをそのまま本番に出す"],"answer":[0,3],"notes":["正解。どの版のプロンプトとモデルで、何がどう直されたかが残って初めて、本番の結果を改善に戻せます。","モデルの自己申告の確信度は、品質の目安として当てになりません。手直しが減らない原因の分析にもつながりません。","手直しが増えるほどプロンプトが長くなり、費用がかさみ、注意も分散します。変更の効果を測る仕組みもありません。","正解。実際の失敗を評価データセットに加えて変更の関門にすることで、良くなったか悪くなったかを測れるようになります。","作り込みすぎで、評価の関門もないまま本番のモデルを入れ替えています。悪くなっても気づけません。"],"explanation":"エンドツーエンドの設計は、入力、処理、出力に加え、本番の結果を改善に戻すフィードバックループまでを含みます。ループを閉じるには、(1) 何がどう直されたかを版とひも付けて残すこと、(2) その失敗を評価データセットに加えて、変更のたびに通す関門にすることが要ります。成功基準と評価を先に置き、そのうえでプロンプトを直すのが基本の循環です。","ref":"試験ガイド 分野1 タスク 1.2（エンドツーエンドのアーキテクチャを設計する）／ Claude Docs: Define success criteria and build evaluations"},{"id":"D1-05","domain":"D1","topic":"出力の検証段","type":"single","question":"病院のシステム部門が、紹介状の PDF から診断名、処方、紹介元などを Claude で抜き出し、電子カルテに登録する仕組みを作っています。出力は構造化出力で JSON スキーマに沿っていますが、ときどき、紹介元の医療機関コードが院内のマスタにない記録や、用量の単位を取り違えた記録（mg と g など）が登録され、後から医師が見つけています。出力の段の設計として最も適切なものはどれですか。","options":["システムプロンプトに「コードはマスタにあるものだけを使い、単位は必ず確かめること」と強い表現で書き加える","登録された記録を医師が毎日抜き取りで点検し、見つかった誤りの件数を月ごとに集計して改善に使う","登録前に出力をマスタと業務ルールでコード検証し、不合格は理由を返して直させ、直らなければ人に回す","抜き出しに使うモデルを最も性能の高いものに切り替え、読み取りの誤りが出る割合そのものを下げる"],"answer":[2],"notes":["確率的な手で、必ず守らせたい条件を解こうとしています。誤りは減っても、マスタにないコードが登録の前に止まる保証はありません。","誤った記録がカルテに入ってから見つける発見的な統制で、登録の前に止める段がありません。抜き取りなので見逃しも残ります。","正解。マスタとの照合や用量の範囲のような決まったルールは、コードで確かめるのが最も確実です。不合格の理由を返して直させ、直らないものだけを人に回せば、人の負担も抑えられます。","規模で解決しようとしています。割合は下がるかもしれませんが、誤った記録を登録の前に止める段がない点は変わりません。"],"explanation":"出力の段では、結果を渡す前に「渡してよいか」を確かめる仕組みを設計します。構造化出力は JSON の形と必須の項目を保証しますが、値がマスタにあるか、業務上ありうる範囲かまでは保証しません。こうした明確なルールで判定できるものは、コードによる検証が最も確かなフィードバックです。不合格を理由とともにモデルに返して直させ、それでも直らないものを人に回すと、確実さと人の負担を両立できます。","ref":"試験ガイド 分野1 タスク 1.2（エンドツーエンドのアーキテクチャを設計する）／ Anthropic: Building agents with the Claude Agent SDK（Verify your work）／ Claude Docs: Structured outputs"},{"id":"D1-06","domain":"D1","topic":"拡張LLMで足りる","type":"single","question":"会計ソフトの会社が、ヘルプセンターの記事をもとに利用者の質問に答える機能を作ります。質問の多くは「請求書の締め日を変えるには」のような1回で答えられるもので、答えは記事のどれかに書いてあります。応答は3秒以内に返したく、1件あたりの費用も抑える必要があります。チームの一人は「将来に備えて最初からエージェント型にしよう」と言っています。最も適切な設計はどれですか。","options":["関連する記事を検索して添えた1回のモデル呼び出しで答え、評価で不足が見えた部分にだけ手を足す","エージェント型にして、検索の回数や順序をモデルに決めさせ、答えが十分だと判断するまで調べさせる","計画、検索、回答の担当を分けたマルチエージェントの構成にし、それぞれを別々のモデルで動かす","すべての回答を評価役のモデルに採点させ、基準を満たすまで回答役のモデルに書き直させる"],"answer":[0],"notes":["正解。答えが記事にある1回きりの質問は、検索で補強した1回の呼び出し（拡張LLM）で足ります。速さと費用の制約にも合います。","必要な手順の数が読めない問題ではないので、エージェントの柔軟さは要りません。呼び出しが増え、3秒以内と費用の制約に反しがちです。","トークンの消費とレイテンシが大きく増え、この単純な質問応答には見合いません。","毎回の採点と書き直しで、レイテンシと費用が何倍にもなります。評価者・最適化者は、反復で測れるほど良くなる場面のための手です。"],"explanation":"Building effective agents は、できるだけ単純な解決策から始め、必要なときだけ複雑さを足すよう勧め、多くの用途では検索や例で補強した1回の呼び出しで足りるとしています。拡張LLM、ワークフロー、エージェント型の順に柔軟さは増しますが、引き換えにレイテンシとコストも増えます。「将来に備えて」ではなく、今の要件と評価の結果で構成を決めます。","ref":"試験ガイド 分野1 タスク 1.3（適切なアーキテクチャパターンを選択する）／ Anthropic: Building effective agents（When and when not to use agents）"},{"id":"D1-07","domain":"D1","topic":"エージェント型の出番","type":"single","question":"クラウドサービスの運用チームが、障害の一次調査を Claude で自動化しています。最初は「ログ検索→メトリクス確認→要約」の固定の手順で作りましたが、障害の約半分は既知のどの型にも当てはまらず、何を調べるべきかが途中の発見で変わるため、原因にたどり着けませんでした。調査の結果は担当者が見てから復旧の操作を行います。最も適切な設計の変更はどれですか。","options":["考えられる分岐をすべて洗い出し、固定の手順に条件分岐を足し続けることで、対応できる障害の範囲を少しずつ広げる","障害を既知の型に分類し、型ごとにあらかじめ用意した固定の手順へ振り分けるルーティングの構成にする","読み取り専用のツールを持つエージェント型にし、呼び出し回数の上限などの停止条件を設け、結果を担当者に渡す","関係しそうなログとメトリクスをすべて1回の呼び出しに入れ、障害の原因をまとめて推定させる"],"answer":[2],"notes":["次の一手が途中の発見で決まる問題では、分岐が際限なく増えます。半分が未知の型という事実に、固定の経路は合いません。","既知の型には効きますが、どの型にも当てはまらない半分の障害には振り分け先がありません。","正解。必要な手順の数を前もって読めない、オープンエンドな問題はエージェント型の出番です。読み取り専用のツール、停止条件、人による確認で、自律性のコストとリスクを抑えています。","すべてを1回に詰め込むとコンテキストが膨らみ、途中の発見に応じて調べ直すこともできません。"],"explanation":"エージェント型は、必要な手順の数を前もって予測できない問題に向きます。その代わりに、コストの増加と誤りの積み重なりという代償があるため、停止条件、権限の小さいツール、人が確認する地点を合わせて設計します。「エージェントは常に過剰」でも「常に高度で正しい」でもなく、問題の形で選びます。この場面では、未知の型が半分あるという事実が決め手です。","ref":"試験ガイド 分野1 タスク 1.3（適切なアーキテクチャパターンを選択する）／ Anthropic: Building effective agents（Agents）"},{"id":"D1-08","domain":"D1","topic":"決まった手順を固定","type":"single","question":"EC モールの運営会社が、出店者が登録した商品ページの審査に Claude を使っています。手順は「商品情報から必要な項目を抜き出す→禁止品目と表示の基準に照らして判定する→判定の理由を出店者向けに書く」で毎回同じです。いまは1つのエージェントが自分の判断で手順を進めており、似た商品でも照合の段を飛ばすことがあり、1件あたりの処理時間とトークン数も大きくばらつきます。出店者からの異議に備え、どの段で何を判断したかを示せる必要があります。最も適切な見直しはどれですか。","options":["3つの段を1つの長いプロンプトにまとめ、1回の呼び出しで抜き出しから判定、理由の作成までを済ませる","3つの段をコードで決めた順に呼ぶプロンプトチェーンにし、段の間のチェックと各段の入出力の記録を置く","エージェントの構成はそのままにし、すべてのツール呼び出しを記録して、段を飛ばした事例を月ごとに点検する","エージェントのシステムプロンプトに、3つの段を必ずこの順に踏むよう強い表現で書き、守らなかった例も添える"],"answer":[1],"notes":["構成は単純になりますが、段が分かれていないため段の間のチェックを置けず、どの段で何を判断したかも示せません。","正解。決まった順のサブタスクに分けられる業務にはワークフローが向きます。経路をコードで固定すれば段を飛ばさなくなり、段ごとのチェックと記録で判断の根拠も示せます。","段を飛ばしたことを後から見つける発見的な統制で、飛ばすこと自体は防げません。処理時間とトークン数のばらつきも残ります。","確率的な手で、毎回必ず守らせたい手順を解こうとしています。飛ばす割合は減っても、なくなる保証はありません。"],"explanation":"ワークフローは、モデルとツールをあらかじめコードで決めた経路で動かすため、手順の決まったタスクで予測しやすさと一貫性が得られます。エージェント型は、手順をモデルが自分で決める柔軟さと引き換えに、経路、レイテンシ、コストがばらつきます。手順が毎回同じで、どの段で何をしたかを示す必要がある業務では、その柔軟さは要らず、代償だけが残ります。パターンは「エージェントのほうが高度か」ではなく、柔軟さが本当に要る問題の形かで選びます。","ref":"試験ガイド 分野1 タスク 1.3（適切なアーキテクチャパターンを選択する）／ Anthropic: Building effective agents（Workflow: Prompt chaining、Agents）"},{"id":"D1-09","domain":"D1","topic":"マルチエージェント","type":"single","question":"投資銀行の M&A 部門が、買収候補の企業について、競合、規制、特許、経営陣の経歴、訴訟歴を調べる下調べを Claude で行いたいと考えています。調べる方向はそれぞれほぼ独立で、どの方向でも、何をどこまで調べるかは途中で見つかった事実によって変わります。集める情報の量は1つのコンテキストウィンドウに収まりません。1件の調査は案件の判断に直結する価値の高い仕事で、トークンの費用が増えることは許容されています。最も適切な構成はどれですか。","options":["1つのエージェントに全方向の調査を順に任せ、コンテキストが一杯になったら古い内容を捨てて調査を続けさせる","5つの方向を固定の順に1つずつ調べるプロンプトチェーンにし、前の段の結果をすべて次の段に渡す","同じ調査を複数のエージェントに並列で行わせ、多数決で最終的な結論を決めて報告にまとめる","リードのエージェントが方向ごとにサブエージェントへ任せ、各自が自分のコンテキストで並列に調べ要点を返す"],"answer":[3],"notes":["1つのコンテキストに収まらない点を、捨てながら進めることで乗り切ろうとしており、必要な情報を失います。独立な方向を並列にできる利点も使っていません。","独立な方向を直列にしているので時間がかかり、前の結果をすべて渡すため後の段ほどコンテキストが膨らみます。途中の発見に応じて調べ方を変えることもできません。","投票は同じ判定の信頼性を上げる手です。異なる方向を手分けして調べる問題は解けません。","正解。独立な方向が多く、1つのコンテキストに収まらず、費用に見合う価値がある、というマルチエージェントの向く条件がそろっています。"],"explanation":"Anthropic の調査システムは、リードのエージェントが計画を立て、サブエージェントがそれぞれのコンテキストウィンドウで並列に調べる、オーケストレーター・ワーカー型です。マルチエージェントは、並列にしやすく、1つのコンテキストに収まらない情報を扱う、価値の高い仕事で力を発揮します。この場面では、方向ごとの調べ方も途中の発見で変わるため、各方向を固定の手順ではなくエージェントに任せる意味があります。トークンの消費は大きいので、費用に見合う価値があるかが採用の条件になります。","ref":"試験ガイド 分野1 タスク 1.4（マルチエージェントシステムとオーケストレーション戦略を設計する）／ Anthropic: How we built our multi-agent research system"},{"id":"D1-10","domain":"D1","topic":"任せ方の指示","type":"single","question":"ある省庁の政策調査チームが、リードのエージェントがサブエージェントに調査を任せる仕組みを試しています。ログを見ると、リードは「再生可能エネルギーの補助制度を調べて」のような短い指示だけを渡しており、複数のサブエージェントが同じ資料を重ねて調べる一方で、地方自治体の制度は誰も調べていませんでした。最も適切な改善はどれですか。","options":["リードが任せるときに、目的、出力の形式、使う情報源とツール、担当の範囲と境界を指示に含める","サブエージェントの数を増やし、重複があっても全体としては抜けが出にくいようにしておく","サブエージェントを性能の高いモデルに替え、自分の担当の範囲を周りの状況から判断できるようにする","サブエージェントどうしが調査の途中で直接やり取りし、担当をその場で調整できるようにする"],"answer":[0],"notes":["正解。重複と抜けの原因は、任せ方のあいまいさです。目的、形式、情報源、境界を渡せば、サブエージェントは自分の範囲を正しく知れます。","規模で解決しようとしています。境界が決まっていないままでは重複が増えるだけで、抜けがなくなる保証もありません。","ほかの担当が何を調べるかは、各サブエージェントからは見えません。モデルを替えても、指示にない境界は判断できません。","エージェントどうしがリアルタイムに調整し合うことは、まだ得意ではなく、調整のためのトークンも増えます。原因は上流の指示にあります。"],"explanation":"オーケストレーションでは、任せ方が品質を決めます。Anthropic の調査システムは、各サブエージェントに目的、出力の形式、ツールと情報源の目安、はっきりした担当の境界を渡す必要があり、詳しい指示がないと重複や抜けが出ると報告しています。下流のサブエージェントを強くするより、上流の指示を直すのが原因に効く手です。","ref":"試験ガイド 分野1 タスク 1.4（マルチエージェントシステムとオーケストレーション戦略を設計する）／ Anthropic: How we built our multi-agent research system"},{"id":"D1-11","domain":"D1","topic":"結果の返し方","type":"multi","question":"製薬会社の医学部門が、臨床試験の論文を調べるマルチエージェントの仕組みを運用しています。サブエージェントは調べた内容の全文をそのままリードに返しており、リードのコンテキストがすぐに一杯になります。また、リードが最終報告をまとめ直す途中で、表の数値や引用元の細部が抜け落ちることがあります。この2つの問題に対して取るべき対応はどれですか。（2つ選択）","options":["リードのモデルを、より大きなコンテキストウィンドウを持つものに替え、全文を受け取れるようにする","サブエージェントには、決めた形式に沿った要点の要約だけをリードに返させる","全員が1つの会話履歴を共有するようにし、サブエージェントの作業をすべてリードから見えるようにする","サブエージェントの数を増やし、1つあたりがリードに返す量を小さくする","表の数値や引用の一覧などの成果物はサブエージェントが外部の保存先に書き出し、リードには参照だけを渡す"],"answer":[1,4],"notes":["規模で解決しようとしています。コンテキストが長くなるほど注意は分散しやすく、まとめ直しで細部が落ちる問題も残ります。","正解。サブエージェントは自分のコンテキストで調べ、要点に絞って返すことで、リードのコンテキストを守れます。","サブエージェントごとにコンテキストを分ける利点がなくなり、リードのコンテキストはかえって膨らみます。","返す総量は変わらず、受け取るリードの負担は減りません。まとめ直しで細部が落ちる問題にも効きません。","正解。細部を伝言で受け渡さず、保存先に残して参照で渡せば、まとめ直しで情報が劣化するのを防げ、トークンも減らせます。"],"explanation":"サブエージェントの利点は、それぞれが自分のコンテキストで作業し、要点だけを返せることです。全文を返すと、この利点が消えます。一方で、細かい数値や引用まで要約で受け渡すと、伝言ゲームのように情報が劣化します。Anthropic の調査システムは、サブエージェントが成果物を外部に保存し、軽い参照だけをリードに返す方法を紹介しています。「要約で返すもの」と「保存して参照で渡すもの」を分けて設計します。","ref":"試験ガイド 分野1 タスク 1.4（マルチエージェントシステムとオーケストレーション戦略を設計する）／ Anthropic: How we built our multi-agent research system ／ Anthropic: Effective context engineering for AI agents"},{"id":"D1-12","domain":"D1","topic":"文脈で分ける","type":"single","question":"ソフトウェア会社が、機能追加を自動で進めるマルチエージェントを試作しています。仕事の種類で分け、設計担当、実装担当、テスト作成担当、レビュー担当の4つのエージェントが順に成果物を受け渡しています。ログを見ると、テスト担当は実装の意図を知らずに的外れなテストを書き、やり取りのためのトークンが実作業より多くなっていました。最も適切な分解の見直しはどれですか。","options":["各担当に渡す引き継ぎの文書を長く詳しくし、前の担当の会話履歴もすべて添付して渡す","担当をさらに細かく分け、テストの設計担当とテストの実装担当を別々のエージェントにして受け渡す","1つの機能の実装とテストは同じエージェントが担い、別のエージェントは完成物を外から試す検証役に絞る","担当どうしの受け渡しの回数を増やし、疑問があればその都度ほかの担当のエージェントに確かめさせる"],"answer":[2],"notes":["引き継ぎを厚くするほどトークンが増え、それでも受け渡しのたびに文脈は失われます。分け方そのものの問題が残ります。","仕事の種類でさらに分けると受け渡しが増え、文脈の欠落と調整の負担が悪化します。","正解。同じ文脈を必要とする仕事は1つのエージェントにまとめ、検証のように作業の経緯を知らなくてもできる仕事だけを分けています。","調整の手間とトークンがさらに増えます。エージェントどうしがその場で細かく調整し合うことは、まだ得意ではありません。"],"explanation":"分解は、仕事の種類ではなく、必要な文脈の境界で行うのが基本です。仕事の種類で分けると、受け渡しのたびに文脈が失われ、調整の負担が実作業を上回ることがあります。実装とテストのように同じ文脈を要する仕事はまとめ、完成物を外から試すだけでよい検証は別のエージェントに任せられます。そもそも1つのエージェントで足りるなら、そこから始めます。","ref":"試験ガイド 分野1 タスク 1.5（複雑な問題解決のために分解の手法を適用する）／ Claude Blog: Building multi-agent systems: when and how to use them"},{"id":"D1-13","domain":"D1","topic":"検査と回答の分離","type":"single","question":"アパレルの EC サイトが、接客チャットの1つのプロンプトで、商品の質問への回答と、不適切な依頼（ほかの客の個人情報を求めるなど）の検出を同時に行っています。検出の指示を強めると回答の質が下がり、回答の指示を整えると検出の漏れが増える、ということを繰り返しています。最も適切な分解はどれですか。","options":["回答と検出の指示を、1つのプロンプトの中で章立てし直し、どちらを優先するかを明確に書き分ける","入力を検査する呼び出しと回答を作る呼び出しを分けて並列に動かし、検査で問題が出たら回答を出さない","より性能の高いモデルに替え、1つのプロンプトのまま回答と検出の両方を高い水準でこなせるようにする","不適切な依頼の例を数十件 few-shot として足し、1つのプロンプトのまま検出の精度を上げる"],"answer":[1],"notes":["同じ呼び出しが両方を担う限り、一方への調整がもう一方に響く構造は変わりません。","正解。性質の違う仕事を別の呼び出しに分けると、それぞれに絞った指示で個別に調整できます。並列なのでレイテンシもほとんど増えません。","規模で解決しようとしています。1つの呼び出しに性質の違う仕事を背負わせる構造が原因で、モデルを替えても調整のぶつかり合いは残ります。","確率的な手を足すだけで、1つの呼び出しが両方を担う構造は同じです。プロンプトが長くなり、回答の質にも響きえます。"],"explanation":"Building effective agents は、並列化（セクショニング）の例として、ある呼び出しが利用者の質問を処理し、別の呼び出しが不適切な内容や依頼を検査する形を挙げ、同じ呼び出しで両方を扱うより性能が出やすいとしています。互いに干渉する関心事は、別の呼び出しに分けて個別に最適化します。分解の目安は「1つの呼び出しが、性質の違う仕事をいくつ抱えているか」です。","ref":"試験ガイド 分野1 タスク 1.5（複雑な問題解決のために分解の手法を適用する）／ Anthropic: Building effective agents（Workflow: Parallelization）"},{"id":"D1-14","domain":"D1","topic":"章ごとに分ける","type":"single","question":"ある大学が、300ページを超える認証評価の基準書を、学内の各部署向けの確認項目の一覧に変える作業を Claude で行っています。基準書の全体を1回の呼び出しに渡して一覧を作らせると、後半の章の項目がしばしば抜け落ち、どの章が抜けたかを担当者が手で突き合わせています。最も適切な分解はどれですか。","options":["より長いコンテキストウィンドウを持つモデルに替え、基準書の全体をこれまでどおり1回の呼び出しで処理させる","プロンプトに「すべての章を漏れなく扱うこと」と書き加え、章の一覧も添えて重ねて念を押す","1回で作った一覧を別の呼び出しに渡し、抜けた章がないかを、基準書の全体と照らしてモデルに確かめさせる","章ごとに項目を抜き出す呼び出しを並列に行い、全章の結果がそろったかをコードで確かめてからまとめる"],"answer":[3],"notes":["規模で解決しようとしています。入力が長いほど注意は分散しやすく、全章を扱えたことを確かめる仕組みもありません。","確率的な手で網羅を守らせようとしています。抜けが減っても、なくなったと確かめられません。","確かめ役のモデルも300ページの全体と照らすため、同じ長い入力で同じ見落としが起こりえます。全章がそろったかは章の番号で決まるので、モデルの判断ではなくコードで確実に確かめられます。","正解。章という独立した単位に分けると各呼び出しの仕事が易しくなり、全章がそろったかは章の番号でコードが確実に確かめられます。"],"explanation":"大きな仕事は、独立した単位に分けて並列に処理し（セクショニング）、最後にまとめます。分けた単位に番号や識別子があれば、全部そろったかをコードで確かめる関門を置けます。長いコンテキストや念押しは、抜けの割合を下げるかもしれませんが、網羅を保証しません。分解の利点は、各呼び出しを易しくすることと、確かめられる区切りを作ることの2つです。","ref":"試験ガイド 分野1 タスク 1.5（複雑な問題解決のために分解の手法を適用する）／ Anthropic: Building effective agents（Parallelization）／ Anthropic: Effective context engineering for AI agents"},{"id":"D1-15","domain":"D1","topic":"費用の見積もり","type":"single","question":"通信教育の大手が、受講者から届く学習の質問に答えるアシスタントを計画しています。質問は月に約40万件で、事業の目的は、質問1件あたりの対応費用を、今の外部の講師への委託の費用より下げることです。試作したマルチエージェントの構成は回答の質が高く評価されましたが、1件の処理で十数回のモデル呼び出しを行っています。本番の構成を決める前に行うこととして最も適切なものはどれですか。","options":["回答の質が高く評価されたので、まず全件で稼働させ、費用は毎月の請求額を見ながら後で構成を調整する","Console で月の支出の上限を予算に合わせて設定し、上限に達するまでの範囲で質問を受け付ける","試作で測った1件あたりの呼び出し回数とトークン数から月の費用を見積もり、目標の単価と比べて構成を決める","繰り返し送る前置きにプロンプトキャッシングを設定すれば費用は十分に下がるとみて、そのまま本番に移す"],"answer":[2],"notes":["目的がコストの削減なのに、目標を満たせるかを確かめないまま全件に広げています。マルチエージェントはトークンの消費が大きく、気づいたときには費用が膨らんでいるおそれがあります。","支出の上限は使いすぎを止める安全装置で、上限に達すれば受講者への応答が止まります。1件あたりの費用が目標に収まるかという問いには答えません。","正解。試作の実測から呼び出し量、トークン消費、月の費用を見積もれば、コストの柱の目標を満たせるかを構成を決める前に判断できます。足りなければ、より単純な構成と比べる根拠にもなります。","キャッシュは繰り返す前置きの費用を下げますが、1件で十数回呼び出す構成の費用がどこまで下がるかは、見積もらなければ分かりません。"],"explanation":"コストの柱を狙う案件では、構成を決める前に、呼び出し量、トークン消費、費用を見積もり、目標に照らして実現できるかを評価します。Anthropic の調査システムの記事では、マルチエージェントの構成はふつうのチャットの約15倍のトークンを使うと報告され、費用に見合う価値の高い仕事に向くとされています。品質の高い試作でも、狙う柱の目標を満たせなければ解決策になりません。見積もりは、より単純な構成と比べるときの根拠にもなります。","ref":"試験ガイド 分野1 タスク 1.6（ソリューションをビジネス価値の柱に整合させる）／ Anthropic: How we built our multi-agent research system ／ Claude Docs: Rate limits（Spend limits）"},{"id":"D1-16","domain":"D1","topic":"SLA と経路の分離","type":"single","question":"ある病院が、外来の診察中に、医師の画面へ患者の過去の診療記録の要点を表示する機能を作っています。診療部門との合意では、医師が患者を選んでから表示までを2秒以内に収めることがサービスの条件です。試作は、エージェントが過去の記録を何度も検索して要点を練り上げる設計で、質は高く評価されたものの平均12秒かかっています。外来は予約制で、診察する患者と、要点に使う前日までの記録は前の晩に確定しています。最も適切な見直しはどれですか。","options":["エージェントの設計はそのままにし、プロンプトで「できるだけ短く、速くまとめること」と強く指示する","予約の患者の要点は前の晩にエージェントで作っておき、診察中は作っておいた要点を表示するだけにする","エージェントの検索の回数に上限を設け、2秒に収まる回数で打ち切って、その時点の要点を表示する","要点の質を優先し、表示までの条件を15秒に緩めるよう、試作の結果を根拠に診療部門へ申し入れる"],"answer":[1],"notes":["何度も検索する構造が遅さの原因で、短くまとめさせても呼び出しの回数は減りません。条件を満たす保証もありません。","正解。時間のかかるエージェントの処理を、診察中の経路から前の晩に移しています。対象の患者と記録が前もって確定しているので、質を保ったまま表示の条件を満たせます。","停止条件を置くこと自体は大事ですが、2秒で打ち切ると調べられる量がわずかになり、評価された要点の質が保てません。時間をかけてよい処理を、急ぐ経路に残したままです。","SLA はサービスの条件として合意済みで、緩めれば診察中に使うという価値が失われます。設計で満たす手があるうちに取る手ではありません。"],"explanation":"パフォーマンス SLA は、構成を選ぶときの制約そのものです。エージェント型はレイテンシとコストを払って性能を得るため、厳しいレイテンシが求められる経路にそのまま置くと条件を満たせません。速さが要る経路と時間をかけてよい経路を分け、前もって分かる仕事は先に済ませておくなど、それぞれに合った置き方をします。SLA を緩める交渉や、質を削る打ち切りは、設計で満たす手を検討してからです。","ref":"試験ガイド 分野1 タスク 1.6（ソリューションをビジネス価値の柱に整合させる）／ Anthropic: Building effective agents（Agents のレイテンシとコスト）"},{"id":"D1-17","domain":"D1","topic":"柱と成功基準","type":"multi","question":"証券会社のリサーチ部門が、アナリストが書く企業レポートの下書きを Claude で作る仕組みを導入します。経営層が掲げる目的は「アナリストが文書作成に使う時間を減らし、企業への取材や分析に使う時間を増やすこと」で、レポートの数値や事実の正確さを損なわないことが前提です。導入の成否を判断する基準として設定すべきものはどれですか。（2つ選択）","options":["1か月のあいだに Claude が作成した下書きの件数と、前の月からの伸び","下書き1件あたりにかかる API の費用と、月ごとの費用の合計","アナリストが1本のレポートを仕上げるまでにかかる時間の、導入の前後での差","公開前の審査で、数値や事実の重要な誤りの修正が必要だったレポートの割合","Claude が下書きごとに出す、内容の正確さについての自己評価の平均"],"answer":[2,3],"notes":["作った件数やその伸びは、アナリストの時間が減ったかどうかを示しません。使われずに書き直されていても件数は増えます。","費用は管理すべき数値ですが、経営層が掲げた目的（アナリストの時間）とは別の柱の指標です。","正解。目的である担当者の時間（生産性）を、前後で比べられる具体的な数値にしています。","正解。正確さを損なわないという前提を、測れる基準にしています。時間の短縮と合わせて見ることで、確認を省いたことによる見かけの改善を防げます。","モデルの自己申告は当てになる目安ではなく、実際の誤りの割合を測る代わりにはなりません。"],"explanation":"解決策は、狙うビジネス価値の柱に合わせて測れる成功基準を決めて、初めて評価できます。よい成功基準は、具体的で、測れて、達成でき、目的に合ったものです。ここでは経営層の目的であるアナリストの時間（生産性）が主な柱で、正確さという前提も基準にします。作った量や費用のように測りやすい数値でも、目的と結びつかないものは成否の判断に使えません。","ref":"試験ガイド 分野1 タスク 1.6（ソリューションをビジネス価値の柱に整合させる）／ Claude Docs: Define success criteria and build evaluations"},{"id":"D2-01","domain":"D2","topic":"小型モデルを評価","type":"single","question":"ある県庁が、住民から届く意見や要望（1日に約3万件）を「道路」「福祉」「教育」「税」「その他」の5つの担当分野に振り分ける処理を、最上位のモデルで動かしています。振り分けの精度は十分ですが、費用が予算を大きく超えています。業務上は精度95%以上あれば足り、職員が振り分け先を付けた過去の意見が2,000件あります。顧客に最初に勧めるべきことはどれですか。","options":["最上位のモデルのまま、システムプロンプトを短く削ってトークン数を減らし、費用を抑える","振り分け先の付いた2,000件で小型で高速なモデルを評価し、95%以上なら切り替える","振り分けに特化したモデルをファインチューニングで作り、Claude の呼び出しを置き換える","小型のモデルに本番で切り替え、担当課から苦情が出たら元のモデルに戻す"],"answer":[1],"notes":["費用の大半を生んでいるのは、単純な大量処理を最上位のモデルで動かしている構成です。プロンプトを削っても構成は変わらず、削りすぎれば必要な指示も失います。","正解。大量で単純な分類は、小型で高速なモデル（Haiku など）で足りることが多い用途です。手元の正解付きのデータで評価し、業務の基準を満たすと確かめてから切り替えます。","効くかもしれませんが、最初の一手としては重すぎます。既存のモデルの選び直しで解決できるかを確かめる前に、学習と運用の負担を負う理由がありません。","本番の業務を試験台にしており、誤った振り分けが出てから気づく進め方です。評価に使えるデータが手元にあるのに使わない理由がありません。"],"explanation":"モデルの選択は、能力、速度、費用のトレードオフです。公式ドキュメントは、大量で単純なタスクや費用を重視する用途では、速くて安いモデルから始めて評価し、能力が足りない部分があるときだけ上げる「効率優先」の進め方を示しています。どの場合でも、判断の根拠は自社のデータで作った評価データセットと、業務で必要な基準です。2026年11月時点のドキュメントは、同じモデルのまま思考の深さと費用を調整する `effort` パラメータも、モデルを替えるより先に試す手として挙げています。","ref":"試験ガイド 分野2 タスク 2.1（トレードオフに基づくモデル選択） ／ Claude Docs: Choosing the right model"},{"id":"D2-02","domain":"D2","topic":"能力優先で始める","type":"single","question":"製薬会社の薬事部門が、承認申請の資料一式（数百ページの試験報告書と社内の規程）を突き合わせ、記載の矛盾や不足を洗い出す作業を Claude で支援したいと考えています。対象は月に20件ほどで、1件の見落としが審査の数か月の遅れにつながります。費用は人が確認する手間に比べて小さく、予算の制約はほとんどありません。最初に試すモデルの選び方として最も適切なものはどれですか。","options":["費用を抑えるため最も小さいモデルから試し、評価で足りなければ1段ずつ上位のモデルに上げる","中位のモデルを選び、能力の足りない部分は過去の指摘事例を few-shot の例として大量に足して補う","汎用のモデルでは足りないとみて、過去の申請資料でファインチューニングしたモデルを最初から作る","最も能力の高いモデルから始め、実際の申請資料で作った評価で見落としを測ってから効率化を探る"],"answer":[3],"notes":["大量で単純な処理や、費用を重視する場面に向く進め方です。ここは件数が少なく費用の制約もほとんどない一方、複雑な突き合わせで見落としの代償が大きいので、小さいモデルから順に試すのは回り道です。","中位のモデルを選ぶ根拠が示されていません。例は出力の形や判断の基準を示すのに役立ちますが、長い資料を突き合わせる推論の力そのものを補う手ではなく、トークンも増えます。","作り込みすぎです。既存のモデルで要件を満たせるかを評価で確かめる前に、学習用のデータの準備と、モデルの更新のたびの作り直しを抱えることになります。","正解。複雑な推論が要り、精度が費用より重い用途では、最も能力の高いモデルを出発点にします。実際の資料での見落としを評価で測り、要件を満たすと分かったあとで、より効率のよい設定やモデルを試します。"],"explanation":"公式ドキュメントは、最初に試すモデルの選び方を2つ示しています。速くて安いモデルから始めて足りないときだけ上げる「効率優先」は、試作、厳しいレイテンシの要件、費用を重視する実装、大量で単純な処理に向きます。最も能力の高いモデルから始めて後で効率化する「能力優先」は、複雑な推論、微妙な読み取りが要る作業、精度が費用より重い用途に向きます。件数、誤りの代償、費用の制約から出発点を選び、どちらの場合も実際のデータで作った評価で確かめるのが判断の軸です。","ref":"試験ガイド 分野2 タスク 2.1（トレードオフに基づくモデル選択） ／ Claude Docs: Choosing the right model"},{"id":"D2-03","domain":"D2","topic":"機能ごとのモデル","type":"single","question":"教育サービス企業が、学習アプリに2つの機能を載せます。1つは、生徒が問題を解いている最中にチャットで短いヒントを返す機能で、応答が遅いと生徒が離れてしまいます。もう1つは、1週間分の学習記録を分析して保護者向けに詳しい所見をまとめる機能で、翌日までに届けばよいものです。モデルの選び方として最も適切なものはどれですか。","options":["ヒントには小型で高速なモデルを、週次の分析には能力の高いモデルを使い、それぞれ評価で確かめる","品質をそろえるため、両方の機能に最上位のモデルを使い、ヒントの待ち時間には読み込み中の表示を出す","費用を抑えるため、両方の機能に最も小さいモデルを使い、分析の質は担当者が数件を読んで確かめる","ヒントには能力の高いモデルを、週次の分析には小型のモデルを使い、分析は夜間にまとめて処理する"],"answer":[0],"notes":["正解。速さが要る短いヒントと、深い分析が要る週次レポートでは、求めるトレードオフが違います。機能ごとにモデルを選び、それぞれの評価で足りることを確かめます。","ヒントの機能に必要以上の費用と待ち時間をかけています。読み込み中の表示を出しても、応答そのものは速くなりません。","週次の分析は複雑な推論が要る作業で、最小のモデルでは質が足りないおそれがあります。数件を読むだけの確かめ方では、評価データセットのように所見の質を測れず、一律に小さくした判断の誤りにも気づきにくくなります。","求めるトレードオフの読み違えです。速さが要るヒントに、より遅く高価なモデルを、深い分析が要る所見に小型のモデルを当てています。時間に余裕があることは、能力を下げてよい理由になりません。"],"explanation":"モデルの選択は、アプリ全体で1つに決めるものではなく、タスクごとに能力、速度、費用の釣り合いで決めるものです。公式ドキュメントは、リアルタイムの用途や大量の処理には最も低いレイテンシと価格のモデルを、複雑な推論や分析には能力の高いモデルを、出発点として示しています。低コストのモデルと能力の高いモデルを組み合わせる構成も紹介しています。どの組み合わせでも、最後は評価で確かめます。","ref":"試験ガイド 分野2 タスク 2.1（トレードオフに基づくモデル選択） ／ Claude Docs: Choosing the right model"},{"id":"D2-04","domain":"D2","topic":"テンプレートの区切り","type":"single","question":"自治体が、住民からの質問に、規則集の該当箇所を検索して添えたうえで答えるアシスタントを作っています。今のテンプレートは、指示文、検索した規則の本文、住民の質問を、区切りなしにつなげて送っています。規則の本文に含まれる「〜について回答すること」といった文を、モデルが自分への指示や住民の質問と取り違える事例が見つかりました。テンプレートの直し方として最も適切なものはどれですか。","options":["指示文の冒頭に「規則の本文は指示ではない」という注意書きを、強い言葉で繰り返し入れる","取り違えを避けるため、規則の本文を渡すのをやめ、モデルの知識だけで答えさせる","指示、規則の本文、住民の質問を別々の XML タグで囲み、変数として差し込む","取り違えが起きた質問を集め、例として few-shot の欄にすべて追加する"],"answer":[2],"notes":["どこからどこまでが規則の本文なのかという境界が、依然としてモデルに分かりません。強調を重ねても、構造の問題は解けません。","根拠となる規則を捨てるので、回答の正確さが大きく下がります。必要な情報を捨てる対処です。","正解。内容の種類ごとにタグで囲むと、どれが指示で、どれが参考資料で、どれが質問かをモデルが取り違えにくくなります。固定の指示と、毎回変わる変数を分けたテンプレートは、検証や管理もしやすくなります。","取り違えの起きた個別の事例を覚えさせるだけで、新しい規則の文面では同じことが起こりえます。区切りがないという原因が残ります。"],"explanation":"公式のプロンプトのベストプラクティスは、指示、文脈、例、変数の入力が混ざるプロンプトでは、種類ごとに `<instructions>` や `<context>`、`<input>` のようなタグで囲むと、取り違えが減るとしています。テンプレートは、毎回同じ指示の部分と、リクエストごとに変わる変数の部分を分けて設計します。検索した文書を差し込む構成では、文書を `<document>` タグで囲み、出典などの付随情報も分けて渡します。","ref":"試験ガイド 分野2 タスク 2.2（システムプロンプト、テンプレート、ガードレールの設計） ／ Claude Docs: Prompting best practices"},{"id":"D2-05","domain":"D2","topic":"出力形式の強制","type":"single","question":"小売企業が、仕入先から届く請求書から項目を抜き出し、JSON で基幹システムに渡しています。システムプロンプトでは「必ずスキーマどおりの JSON だけを返すこと」と指示していますが、約2%の応答で必須の項目が抜けたり、JSON として読めなかったりして、取り込みが止まります。失敗した応答は、`max_tokens` に達して途中で切れたものではありません。この問題を最も確実に解消する対応はどれですか。","options":["指示の文を「絶対に」「必ず」で強め、スキーマから外れた悪い例も書き加える","構造化出力で JSON スキーマを指定し、応答そのものをスキーマに従う形に制約する","読めない応答が返ったら、同じリクエストを最大3回まで自動で送り直す処理を足す","より大きなモデルに切り替え、指示に従う確率を上げて失敗の割合を下げる"],"answer":[1],"notes":["指示を強めても、従うかどうかはモデルの確率的な振る舞いのままです。失敗は減っても、なくなる保証はありません。","正解。構造化出力は、制約付きのデコードで応答をスキーマに従わせます。公式ドキュメントは、JSON の構文エラーが起きず、必須の項目と型が保証されると説明しています。","再送は症状を抑えるだけで、失敗の原因は残ります。費用と待ち時間も増え、3回とも失敗すれば止まります。","規模で解決しようとする手です。大きいモデルでも、形式が保証されるわけではありません。"],"explanation":"後段のシステムが必ず読める形を求めるときは、プロンプトで頼むのではなく、出力の形式を仕組みで制約します。公式ドキュメントによると、構造化出力（`output_config.format` に JSON スキーマを指定する方法と、ツール定義の `strict: true`）は、制約付きのデコードでスキーマに従う応答を返し、形式違反のための再送が要らなくなります。ただし、安全上の理由で断った応答（`stop_reason` が `refusal`）や `max_tokens` で切れた応答はスキーマに合わないことがあり、数値の範囲のようにスキーマで表せない制約もあります。そのため、`stop_reason` の確認と値の妥当性の検査は、アプリケーション側に残します。","ref":"試験ガイド 分野2 タスク 2.2（システムプロンプト、テンプレート、ガードレールの設計） ／ Claude Docs: Structured outputs"},{"id":"D2-06","domain":"D2","topic":"強すぎる指示","type":"single","question":"病院向けの診療記録の作成支援アシスタントを、新しい世代のモデルに移行しました。以前のモデルは薬剤データベースの検索ツールを呼ばないことが多かったため、システムプロンプトに「重要: 薬剤名が出たら必ずこのツールを使え」と強い言葉で書いてあります。移行後、薬剤とほとんど関係のないやり取りでもツールが呼ばれ、応答が遅くなりました。最初に行うべき対応はどれですか。","options":["「必要なときだけ使うこと」という一文を、同じように強い言葉で書き足して打ち消す","移行前の世代のモデルに戻し、元のシステムプロンプトをそのまま使い続ける","応答の遅れをなくすため、薬剤データベースの検索ツールを構成から外す","強い言葉を外し、どんな場面でなぜ使うのかを普通の言葉で説明する"],"answer":[3],"notes":["強い言葉どうしがぶつかり、どちらが優先されるのかがかえって曖昧になります。原因である過剰な強調が残ります。","プロンプトの書き方を直せば済む問題で、新しいモデルの利点を捨てています。","薬剤の確認が要る場面でも検索できなくなり、記録の正確さを損ないます。業務に必要な機能を捨てる両極端の手です。","正解。新しいモデルはシステムプロンプトによく反応するため、以前の弱さを補う強い言葉が過剰な呼び出しを生みます。公式ドキュメントは、強い言葉を和らげることと、指示の理由を添えることを勧めています。"],"explanation":"公式のベストプラクティスは、新しいモデルはシステムプロンプトに以前より強く反応するため、ツールを呼ばなさすぎることを防ぐために書いた強い言葉（「CRITICAL: 必ず使え」など）が、呼びすぎを招くことがあると説明しています。直し方は「〜のときにこのツールを使う」という普通の書き方に戻すことです。指示に理由や目的を添えると、モデルは意図を汲んで適用範囲を判断できます。モデルを移行したら、古いモデル向けに足した強調や念押しを見直すのが定石です。","ref":"試験ガイド 分野2 タスク 2.2（システムプロンプト、テンプレート、ガードレールの設計） ／ Claude Docs: Prompting best practices"},{"id":"D2-07","domain":"D2","topic":"few-shot の例","type":"single","question":"保険会社が、事故の報告書から査定担当者向けの要約を作る機能を作っています。指示文には項目の順番や書き方を詳しく書きましたが、出力される要約の書式と語調が報告書ごとにばらつきます。特に、複数の車両が関わる報告書で崩れやすいことが分かっています。次に行う改善として最も適切なものはどれですか。","options":["複数車両の事故も含む多様な要約例を3〜5件、タグで囲んで加える","複数車両の事故の要約例を1件だけ加え、すべての報告書でその例と同じ書き方をさせる","指示文をさらに細かくし、項目ごとの文字数や句読点の使い方まで書き足す","書式のばらつきを抑えるため、より大きなモデルに切り替えて同じ指示文を使う"],"answer":[0],"notes":["正解。例は、出力の書式、語調、構造をそろえる最も確実な手の一つです。崩れやすい複数車両の事例を含めた、関連性があり多様な例を、指示と区別できるようタグで囲んで渡します。","1件だけの例では、その例に固有の細部（車両の台数や言い回し）までまねされやすく、単独の事故など別の型の報告書でかえって崩れるおそれがあります。","すでに詳しい指示があってばらつくので、文章の指示を増やす効果は小さいと考えられます。書式は、説明より例で示すほうが伝わります。","規模で解決しようとする手です。書式の手本がないという原因は残ります。"],"explanation":"few-shot（multishot）プロンプトは、望む出力の例を見せて、書式、語調、構造をそろえる手法です。公式のベストプラクティスは、例を実際の用途に近く（関連性）、境界的な事例を含めて十分に変化をつけ（多様性）、`<example>` タグで囲む（構造化）ことを勧め、3〜5件を目安にしています。例が似通っていると、意図しない特徴までまねされます。ゼロショットの指示で足りないときに、次に足す手として位置づけます。","ref":"試験ガイド 分野2 タスク 2.3（プロンプトエンジニアリングの手法） ／ Claude Docs: Prompting best practices"},{"id":"D2-08","domain":"D2","topic":"思考の連鎖","type":"single","question":"銀行が、融資の申込みについて、収入、既存の借入、担保などの複数の条件を組み合わせて、審査の一次判定を出す仕組みを作っています。条件が1つだけ関わる申込みはほぼ正しく判定できますが、複数の条件が絡む申込みでは最終判定の誤りが目立ちます。処理は夜間にまとめて行い、応答の速さは問いません。最も効果の見込める手はどれですか。","options":["最終判定だけを書いた過去の例を few-shot で20件加え、判定の傾向をつかませる","出力を短くするため、判定の結果だけを1語で返すよう指示を厳しくする","最終判定の前に、条件ごとに段階を追って考えさせ、その結果を踏まえて判定させる","審査規程の全文に加えて過去の申込みの記録も大量に渡し、文脈を増やす"],"answer":[2],"notes":["結論だけの例では、条件をどう組み合わせるかという過程が示されません。誤りの原因である多段の推論は改善しにくいままです。","出力の形を絞っても、複数の条件を組み合わせる推論の誤りは直りません。速さは要件にないので、出力を短くする理由もありません。","正解。複数の条件を順に組み合わせる判断は、答える前に段階を追って考えさせると精度が上がりやすい典型です。速さを問わないので、推論にかかる時間とトークンの増加も許容できます。","必要な情報が足りないという状況ではなく、組み合わせの推論で誤っています。無関係な記録を足すと、かえって注意が散ります。"],"explanation":"思考の連鎖（chain-of-thought）は、答えの前に推論の過程を踏ませる手法で、多段の推論が要るタスクで効果を発揮します。推論が増える分、レイテンシとトークンが増えるので、速さに余裕がある場面や、単純な手では誤る場面で使います。2026年11月時点のドキュメントでは、新しいモデルは思考の機能（adaptive thinking）で考える量を自分で決めるのが基本で、深さは `effort` で調整します。推論を本文の `<thinking>` タグなどに書き出させる手作業の指示は、思考を使えないときの代わりとされ、一部の最新モデルでは断られることがあります。","ref":"試験ガイド 分野2 タスク 2.3（プロンプトエンジニアリングの手法） ／ Claude Docs: Prompting best practices"},{"id":"D2-09","domain":"D2","topic":"足さない判断","type":"single","question":"EC 事業者が、問い合わせメールに「至急」「通常」の優先度を付ける処理を、短いゼロショットのプロンプトで動かしています。評価データセットでの精度は目標の98%を上回っており、受信から1秒以内に振り分けるという要件もあります。チームの一人が「品質を上げるため、段階的に考えさせる指示と例を20件加えよう」と提案しました。アーキテクトの判断として最も適切なものはどれですか。","options":["提案どおり両方を加え、品質に余裕を持たせてから本番に出す","例の20件だけを加え、段階的に考えさせる指示は見送る","応答をさらに速くするため、評価を省いてより小さいモデルに切り替える","目標を満たしているので今のプロンプトを保ち、評価で劣化を見張る"],"answer":[3],"notes":["推論と例の追加は、どちらもトークンと待ち時間を増やします。1秒以内という要件を危うくするうえ、効果が測られていません。","入力のトークンが増え、費用と待ち時間が上がります。目標を満たしている今、足す根拠が評価で示されていません。","精度もレイテンシも要件を満たしている今、替える理由がありません。評価を省いて小さくすると、精度が目標を割っても気づけません。","正解。単純な分類で、評価が目標を上回り、厳しいレイテンシの要件があります。効果の測られていない手を足すより、今のプロンプトを保ち、評価を回して劣化に備えるのが最善です。"],"explanation":"ゼロショット、few-shot、思考の連鎖は、強い順に重ねるものではなく、タスクと制約に合わせて選ぶものです。公式のベストプラクティスも、思考はレイテンシを増やすので、答えの質を意味のある程度に上げるとき（典型的には多段の推論が要る問題）に使うよう、モデルに促す指示の例を示しています。評価で目標を満たしているなら、変更は評価で効果が示されたときだけ入れます。評価は改善の道具であると同時に、不要な変更や劣化を止める関門でもあります。","ref":"試験ガイド 分野2 タスク 2.3（プロンプトエンジニアリングの手法） ／ Claude Docs: Prompting best practices"},{"id":"D2-10","domain":"D2","topic":"長い文書の配置","type":"single","question":"資産運用会社が、200ページの目論見書を1回のリクエストで渡し、投資家からの質問に答えるツールを作っています。今のプロンプトは、先頭に質問と指示を置き、その後に目論見書の全文を続けています。全文はコンテキストウィンドウに収まっていますが、関連する条項を見落とした回答が目立ちます。最初に試すべき改善はどれですか。","options":["目論見書をモデルで先に要約し、要約だけを質問と一緒に渡すようにする","目論見書をタグで囲んで先頭に、質問を末尾に置き、関連箇所を引用してから答えさせる","より大きなコンテキストウィンドウを持つモデルに切り替え、同じプロンプトのまま送る","目論見書を章ごとに分けて別々に質問し、各章で得た回答をつなげて返す"],"answer":[1],"notes":["要約の段階で細かな条項が落ちやすく、見落としがかえって増えるおそれがあります。必要な情報を捨てる最適化です。","正解。長い文書は先頭に、質問は末尾に置くと品質が上がると公式ドキュメントは示しています。まず関連箇所を引用させると、文書の中の必要な部分に注意を向けさせられます。","全文はすでに収まっており、ウィンドウの大きさは原因ではありません。規模で解決しようとする手です。","呼び出しの数と費用が増え、章をまたぐ条項の関係も失われます。全文が収まっている今、最初に試す手としては重すぎます。"],"explanation":"公式のベストプラクティスは、2万トークンを超えるような長い入力では、文書をプロンプトの上のほう（質問、指示、例より前）に置くよう勧めています。質問を末尾に置くと、特に複数の文書がある複雑な入力で、応答の品質が大きく上がったとしています。複数の文書は `<document>` タグで囲み、出典を付けて区別します。さらに、答える前に関連する箇所を引用させると、長い文書の中で必要な部分に集中させられます。","ref":"試験ガイド 分野2 タスク 2.4（コンテキストウィンドウの最適化とトークン管理） ／ Claude Docs: Prompting best practices"},{"id":"D2-11","domain":"D2","topic":"履歴の肥大化","type":"multi","question":"IT 企業の運用チームが、障害を調査するエージェントを使っています。エージェントはログ検索ツールを何度も呼び、そのたびに数千行のログがそのまま会話の履歴に積み上がります。調査が長くなると、後半で最初に立てた仮説や指示を見失う挙動が増えます。この状況で取るべき対応を2つ選んでください。（2つ選択）","options":["処理を終えた古いツールの結果を、コンテキスト編集の機能などで履歴から消す","最も大きなコンテキストウィンドウを持つモデルに切り替え、履歴を消さずに済ませる","調査の開始時に、関係しそうなログをすべて読み込ませてからエージェントを動かす","立てた仮説と判明した事実を外部のメモに書かせ、必要なときに読み戻させる","トークンを節約するため、システムプロンプトからツールの使い方の説明を削る"],"answer":[0,3],"notes":["正解。一度処理した生のツールの結果を再び見る必要はほとんどありません。古いツールの結果の削除は最も安全で軽い形の圧縮の一つとされ、API のコンテキスト編集の機能でも行えます。","コンテキストは、量が増えるほど情報を正しく思い出す力が落ちる有限の資源です。器を大きくしても、注意が散る原因は残ります。","最初に全部を載せると、無関係なログが注意を奪い、問題を悪化させます。必要なときに必要な分だけ読む設計の逆です。","正解。仮説や判明した事実をコンテキストの外のメモ（メモリのツールやファイル）に残させると、履歴が長くなっても失われず、必要なときに読み戻せます。長い作業で大事な文脈を見失うことへの対策です。","削るべきは重複した古いログで、エージェントの行動を導く指示ではありません。必要な情報を捨てる最適化です。"],"explanation":"Anthropic のコンテキストエンジニアリングの記事は、コンテキストを、増えるほど効き目が落ちる有限の資源として扱い、望む結果につながる最小限の、信号の濃い情報を目指すよう述べています。長く続くエージェントでは、古いツールの結果の削除や会話の要約（コンパクション）で履歴を軽くし、仮説や決定事項はコンテキストの外のメモに残して読み戻します。公式ドキュメントは、API のコンテキスト編集とメモリのツールを組み合わせ、消される前に大事な情報をメモに保存させる使い方も紹介しています。大きなウィンドウや、最初に全部を載せる設計は、注意が散る原因を残します。","ref":"試験ガイド 分野2 タスク 2.4（コンテキストウィンドウの最適化とトークン管理） ／ Anthropic Engineering: Effective context engineering for AI agents、Claude Docs: Context editing"},{"id":"D2-12","domain":"D2","topic":"キャッシュが効かない","type":"single","question":"SaaS 企業が、約1万トークンの製品マニュアルとシステムプロンプトを、プロンプトキャッシングの対象にしています。ところが、使用量を見るとキャッシュの読み取りがほぼゼロで、毎回キャッシュの書き込みの料金がかかっています。調べると、システムプロンプトの先頭に、リクエストごとの現在時刻を差し込んでいました。最も適切な修正はどれですか。","options":["現在時刻を、キャッシュの区切りより後ろのユーザーのメッセージ側に移す","キャッシュの有効期間を1時間に延ばし、期限が切れる前に次のリクエストが来るようにする","現在時刻を含むブロックにもキャッシュの区切り（`cache_control`）を付け、区切りの数を増やす","キャッシュは効かないものとして無効にし、製品マニュアルを要約して短くする"],"answer":[0],"notes":["正解。キャッシュは、区切りまでの接頭辞が完全に一致したときだけ当たります。毎回変わる時刻を先頭から外し、変わらない部分を前に、変わる部分を区切りの後ろに置きます。","期限の長さは原因ではありません。先頭の時刻が毎回違うので、期間を延ばしても接頭辞は一致せず、書き込みの料金が上がるだけです。","区切りを足しても、その手前に毎回変わる時刻がある限り、どの区切りでも接頭辞は一致しません。","原因を直さずに仕組みを捨てています。要約すると、回答に必要なマニュアルの内容も失われます。"],"explanation":"公式ドキュメントによると、プロンプトキャッシングは `tools`、`system`、`messages` の順に並んだ接頭辞を、`cache_control` を付けたブロックまで含めて再利用します。当たるには、そこまでの内容が完全に一致している必要があり、上の階層が変わるとそれより後ろはすべて無効になります。そのため、時刻やリクエストごとの文脈のような変わる内容は、毎回同じ部分の後ろに置き、区切りは変わらない最後のブロックに付けます。キャッシュの読み取りが増えないときは、まず接頭辞のどこが毎回変わっているかを調べます。","ref":"試験ガイド 分野2 タスク 2.5（プロンプトの再利用戦略） ／ Claude Docs: Prompt caching"},{"id":"D2-13","domain":"D2","topic":"モジュール型プロンプト","type":"single","question":"ある大学が、入試、学生生活、就職支援の3つの問い合わせアシスタントを運用しています。3つのシステムプロンプトは同じ原本を写して作ったもので、個人情報の扱いの方針、口調の決まり、出力の形式が、それぞれにほぼ同じ文で書かれています。先月、個人情報の扱いの方針を改めた際に1つのアシスタントだけ直し漏れ、古い方針のまま答えていたことが分かりました。プロンプトの再利用の仕組みとして最も適切なものはどれですか。","options":["3つのアシスタントを1つに統合し、すべての業務の指示を1つの長いシステムプロンプトに書く","方針を改めるたびに、3つのプロンプトを担当者が見比べて直すための点検表を作る","方針、口調、出力の形式を共通の部品として1か所で管理し、決まった順で組み立てて使う","個人情報の扱いの方針はプロンプトから外し、モデルが学習済みの一般的な知識に任せる"],"answer":[2],"notes":["方針の写しは1つになりますが、毎回3業務分の指示を載せることになり、関係のない指示が混ざって判断を鈍らせ、トークンも増えます。業務ごとの変更も1つのプロンプトの上でぶつかります。","人の注意に頼る運用で、写しが3つある構造は変わりません。アシスタントや部品が増えるほど、直し漏れは起きやすくなります。","正解。共通の部品を1か所で直せば、使っているすべてのアシスタントに反映され、直し漏れが起きません。業務ごとの指示は、各アシスタントに固有の部品として後ろに足します。","大学が定めた方針は、モデルの一般的な知識からは分かりません。必要な指示を捨てる対処です。"],"explanation":"モジュール型プロンプトは、役割、方針、出力の形式のような部品に分け、1か所で管理して使い回す設計です。試験ガイドが推奨経験に挙げるモジュール設計や関心の分離を、プロンプトに当てはめたものと考えられます。公式のベストプラクティスは、内容の種類ごとに XML タグで囲み、タグの名前をプロンプトの間でそろえるよう勧めており、部品の境目をはっきりさせるのに役立ちます。部品の並び順を固定し、変わらない部品を前に置けば、各アシスタントで毎回同じ接頭辞になり、プロンプトキャッシングも効きやすくなります。","ref":"試験ガイド 分野2 タスク 2.5（プロンプトの再利用戦略） ／ Claude Docs: Prompting best practices、Prompt caching"},{"id":"D3-01","domain":"D3","topic":"役割に要らないツール","type":"single","question":"小売チェーンが、店舗スタッフ向けに在庫を問い合わせるエージェントを作りました。開発中に試した名残で、在庫、POS の管理、人事、メール、ファイル共有の5つの MCP サーバーがつながったままで、ツールは合わせて120個あります。この業務に必要なのは、在庫の照会と店舗間の移動依頼の2つだけです。最近、エージェントが関係のないツールを呼ぶ誤りが増えています。最も適切な対応はどれですか。","options":["ツール検索ツールを導入し、120個の定義を必要なときにだけ読み込ませる","在庫の照会と移動依頼のツールだけを残し、ほかのサーバーは構成から外す","システムプロンプトに「在庫に関係するツールだけを使うこと」と書き加える","ツールの選び間違いが減るよう、指示によく従う大きなモデルに切り替える"],"answer":[1],"notes":["ツール検索は、多数のツールがどれも必要な場面で、コンテキストと選択の精度を守る仕組みです。業務に要らない人事や POS 管理の機能は、呼べる状態のまま残ります。","正解。役割に要らない機能を構成から取り除けば、誤ったツールを選ぶ余地と攻撃面の両方がなくなります。残るツールが少なければ、最初から全部渡す通常の構成で足ります。","指示は確率的にしか効かず、ツールは呼べるまま残ります。迷いの原因である余分な定義も減りません。","モデルの大きさは、渡しているツールの範囲とは無関係です。余分なツールがある限り、選び間違いと権限の過剰は残ります。"],"explanation":"機能の肥大化を見つけたら、まず「この役割に本当に要るか」で構成を削ります。ツールが多すぎたり役割が重なったりすると、エージェントは迷いやすくなり、要らない権限は事故や悪用の入口にもなります。ツール検索のような仕組みは、多数のツールがどれも必要な場合の解決策で、不要な機能を減らすことの代わりにはなりません。指示の追加やモデルの変更では、構成の問題は解決しません。","ref":"試験ガイド 分野3 タスク 3.1（機能の肥大化の評価）／ Anthropic Engineering: Writing effective tools for agents ／ Claude Docs: Tool search tool"},{"id":"D3-02","domain":"D3","topic":"サブエージェントの権限","type":"single","question":"証券会社が Claude Agent SDK で投資調査のエージェントを作っています。メインのエージェントには、売買の注文を出す MCP のツールが付いています。外部のニュース記事を読んで要約するサブエージェントを追加しましたが、その定義では `tools` を省略しています。ニュース記事には、モデルへの指示を装った文が紛れ込むおそれがあります。最も適切な見直しはどれですか。","code":"agents={\n    \"news-summarizer\": AgentDefinition(\n        description=\"外部のニュース記事を読んで要約する\",\n        prompt=\"あなたはニュースの要約担当です。…\",\n    ),\n}","options":["サブエージェントのプロンプトに「注文のツールは絶対に使わないこと」と書き加える","サブエージェントをやめ、記事の読み込みと要約もメインのエージェントに任せる","注文のツールの呼び出しをすべて記録し、不審な注文を後から監査できるようにする","サブエージェントの `tools` に、記事の取得と読み取りのツールだけを並べる"],"answer":[3],"notes":["指示は確率的で、記事に紛れ込んだ文に上書きされるおそれがあります。注文のツールは呼べる状態のまま残ります。","メインのエージェントは注文のツールを持っているので、信頼できない記事を同じ文脈で読ませると、かえって危険が増えます。","記録は後から見つけるための発見的な統制で、不要な権限そのものは残ります。","正解。`tools` を省略したサブエージェントは、メインのエージェントで使えるツールを、MCP のツールも含めて受け継ぎます。必要なツールだけを列挙すれば、注文のツールはそのサブエージェントのセッションに存在しなくなります。"],"explanation":"Agent SDK のサブエージェントは、`tools` を省略すると、メインのエージェントで使えるツールを MCP のツールも含めて受け継ぎます。信頼できない入力を扱う役割ほど、持たせるツールを絞ることが大切です。列挙から外したツールはそのサブエージェントのセッションにないので、指示が乗っ取られても呼べません。指示や記録は、権限を減らす統制の代わりになりません。","ref":"試験ガイド 分野3 タスク 3.1（機能の肥大化の評価）／ Claude Agent SDK Docs: Subagents in the SDK ／ Claude Code Docs: Subagents（Available tools）"},{"id":"D3-03","domain":"D3","topic":"ツールの粒度と返す量","type":"multi","question":"ある大学が、職員の問い合わせに答えるエージェントを運用しています。`list_all_students` ツールは約3万人分の学生の記録を一度に返し、そのたびにコンテキストが埋まります。また、1人の学生について答えるたびに、`get_profile`、`get_grades`、`get_attendance`、`get_advisor_notes` を毎回順に呼んでいます。ツールの構成の見直しとして最も効果的なものを2つ選んでください。（2つ選択）","options":["全件を返すツールを、条件で絞り込めてページ分けもできる検索のツールに置き換える","コンテキストウィンドウの大きなモデルに替え、全件の結果を収められるようにする","システムプロンプトに「ツールの呼び出しはできるだけ少なくすること」と書き加える","毎回続けて呼ばれる4つのツールを、学生ごとの要約を返す1つのツールにまとめる","記録の項目ごとにツールをさらに細かく分け、必要な項目だけを選べるようにする"],"answer":[0,3],"notes":["正解。全件を返すより、絞り込みやページ分けで必要な分だけ返すほうが、コンテキストを無駄にしません。","大きな窓に収まっても、関係のない記録で文脈が埋まる問題は残ります。コストと待ち時間も増えます。","指示は確率的にしか効かず、ツールの切り分け方という原因はそのままです。","正解。いつも一緒に使う処理を1つのツールにまとめると、呼び出しの回数と途中の結果が減ります。","ツールをさらに増やすと、どれを使うかの迷いと呼び出しの回数がかえって増えます。"],"explanation":"ツールは、API の端点を1つずつ包んだものではなく、エージェントの仕事の単位で設計します。Anthropic は、全件を返す一覧より検索のツールを、毎回続けて呼ばれる処理はまとめたツールを勧め、応答にはページ分けや絞り込みを付けるよう述べています。ツールの数や返す量が膨らむほど、コンテキストと判断の両方が圧迫されます。モデルや指示を変える前に、ツールの構成を見直します。","ref":"試験ガイド 分野3 タスク 3.1（機能の肥大化の評価）／ Anthropic Engineering: Writing effective tools for agents"},{"id":"D3-04","domain":"D3","topic":"利用者ごとの認可","type":"single","question":"ある病院が、職員向けのアシスタントから患者の記録を調べられるよう、リモートの MCP サーバーを作りました。サーバーは全員の要求を、すべての記録を読める1つのサービスアカウントで処理しています。どの職員がどの患者の記録を見てよいかは、システムプロンプトで「担当の患者の記録だけを返すこと」と指示しています。セキュリティ上のギャップを塞ぐ対応として最も適切なものはどれですか。","options":["システムプロンプトの指示を強め、担当外の患者を尋ねられたら断る例を追加する","サービスアカウントの操作をすべて記録し、担当外の閲覧を毎週の監査で見つける","職員ごとに OAuth で認可し、その職員の権限に沿ってサーバー側で絞り込む","接続元を院内のネットワークだけに限り、外部の端末からの利用を確実に防ぐ"],"answer":[2],"notes":["認可の判断をモデルに任せたままです。指示や例は確率的で、言い回し次第で破られるおそれがあります。","監査は後から見つける発見的な統制で、担当外の記録が読めてしまう状態は変わりません。","正解。誰が使っているかをサーバーが確かめ、その人に許された範囲だけを返す仕組みにすれば、認可がモデルの判断から切り離されます。","接続元を絞るのは入口の対策で、院内の職員が担当外の記録を読める問題は残ります。"],"explanation":"認証は「誰か」を確かめ、認可は「何を許すか」を決めます。全員を1つの強い資格情報で処理し、絞り込みをプロンプトに任せる構成では、実質的に認可がありません。MCP の認可は仕様上は任意ですが、HTTP のトランスポートを使うサーバーには OAuth 2.1 をもとにした認可の仕様があり、利用者に代わって発行されたトークンで要求を受けられます。権限の判断は、モデルではなくサーバー側のコードで強制します。","ref":"試験ガイド 分野3 タスク 3.2（認証と認可の要件の分析）／ MCP Specification: Authorization"},{"id":"D3-05","domain":"D3","topic":"トークンの素通し","type":"single","question":"ある自治体が、会計システムの API の前に MCP サーバーを置き、職員のアシスタントから予算を照会できるようにしました。レビューで、このサーバーがクライアントから届いたアクセストークンを、発行先を確かめずにそのまま会計システムの API へ転送していることが分かりました。最も適切な修正はどれですか。","options":["自分あてのトークンだけを受け付け、会計 API には別に発行されたトークンを使う","会計 API への転送をすべてログに記録し、不正な利用を後から追跡できるようにする","届いたトークンの署名と有効期限を確かめたうえで、そのまま会計 API へ転送する","会計 API の側で、MCP サーバーの IP アドレスから届いた要求だけを受け付ける"],"answer":[0],"notes":["正解。MCP サーバーは自分を宛先とするトークンだけを受け付け、先の API には、その API の認可サーバーが発行した別のトークンを使います。","記録は後から見つけるための発見的な統制です。別のサービス向けのトークンを受け付け、そのまま先へ渡す状態は変わりません。","署名や期限が正しくても、そのトークンがこのサーバーあてに発行されたとは限りません。受け取ったトークンを先へ渡す点も変わらず、仕様が禁止するトークンパススルーのままです。","接続元を絞っても、別のサービス向けのトークンが流用される問題と、先の API の記録で誰の要求かを区別できない問題は残ります。"],"explanation":"受け取ったトークンを先のサービスへそのまま渡す「トークンパススルー」は、MCP の認可仕様で明確に禁止されています。トークンが本物かどうかだけでなく、自分あてに発行されたものかを確かめないと、別のサービス向けのトークンが流用され、先の API のレート制限や監査も素通りされます。MCP サーバーは OAuth のリソースサーバーとして宛先を検証し、先の API に対しては自らがクライアントとして、その API の認可サーバーが発行した別のトークンを使います。","ref":"試験ガイド 分野3 タスク 3.2（認証と認可の要件の分析）／ MCP Specification: Authorization、Security Best Practices（Token Passthrough）"},{"id":"D3-06","domain":"D3","topic":"STDIO が継ぐ資格情報","type":"single","question":"あるソフトウェア企業の開発者は、Claude Code から、障害の調査のためにクラウドのログを読むローカルの MCP サーバー（STDIO で起動）を使っています。このサーバーは、起動した開発者の環境にあるクラウドの資格情報をそのまま使います。多くの開発者の環境には、本番環境を変更できる管理者権限の資格情報が入っています。最も適切な対応はどれですか。","options":["この STDIO のサーバーに OAuth 2.1 の認可フローを実装し、開発者にログインさせる","ログの読み取りだけを許す専用の資格情報を用意し、このサーバーにはそれだけを渡す","サーバーのツールの説明文に「読み取り以外の操作はしない」と明記しておく","サーバーが実行したクラウドの操作をすべて記録し、変更があれば通知する"],"answer":[1],"notes":["MCP の認可仕様は HTTP のサーバー向けで、STDIO のサーバーはこの仕様に従わず、資格情報を環境から受け取るものとされています。権限が広すぎるという問題も解決しません。","正解。STDIO のサーバーは環境の資格情報と、起動した人と同じ権限で動きます。渡す資格情報そのものを、役割に合った最小の権限にします。","説明文は Claude への案内で、サーバーが持つ権限は変わりません。","記録と通知は後から気づくための統制で、本番を変更できる権限は残ります。"],"explanation":"ローカルで起動する MCP サーバーは、クライアントと同じ権限で動き、資格情報を環境から受け継ぎます。そのため「どの資格情報を受け継いでいるか」が、認可の実体になります。役割に合った最小の権限の資格情報を用意して渡せば、サーバーの不具合や悪用があっても被害の範囲が限られます。認証の仕組みを足すことや、記録と説明文の追加では、権限の広さは変わりません。","ref":"試験ガイド 分野3 タスク 3.2（認証と認可の要件の分析）／ MCP Specification: Authorization（Protocol Requirements）、Security Best Practices（Local MCP Server Compromise）"},{"id":"D3-07","domain":"D3","topic":"難しさで振り分け","type":"single","question":"あるネット通販企業は、問い合わせのチャットをすべて最上位のモデルで処理しており、レイテンシの目標を満たせていません。問い合わせの約7割は配送状況や返品の手順などの定型の質問で、評価データセットでは、速い小型のモデルでも定型の質問は最上位のモデルと同じ精度でした。残りの3割の複雑な相談では、小型のモデルの精度は大きく下がりました。最も適切な構成はどれですか。","options":["すべての問い合わせを小型のモデルに切り替え、レイテンシの目標を優先する","`max_tokens` を小さくして回答を短くし、すべての問い合わせの生成時間を縮める","最上位のモデルのまま、すべての問い合わせで effort を最大にして精度を上げる","問い合わせを分類し、定型は小型のモデル、複雑な相談は最上位のモデルに振り分ける"],"answer":[3],"notes":["複雑な相談の精度が大きく下がることが、評価で分かっています。速さのために品質の要件を捨てることになります。","`max_tokens` は上限に達した応答を途中で切る手段です。必要な説明が欠けるおそれがあり、遅さの原因であるモデルの選び方も変わりません。","考える量を増やすと精度は上がりうるものの、レイテンシはさらに延びます。目標を満たせていない問題を悪化させます。","正解。評価で「定型は小型で十分」と確かめた範囲だけを速いモデルに回し、品質が必要な相談には上位のモデルを残します。"],"explanation":"精度とレイテンシのトレードオフは、一律にどちらかへ寄せるのではなく、評価の結果を根拠に問い合わせの種類ごとに決めます。Anthropic はルーティングの例として、簡単でよくある質問は小型で安いモデルへ、難しい質問は高性能なモデルへ振り分ける構成を挙げています。前提は、分類が正確にできることと、種類ごとの品質を評価で確かめていることです。","ref":"試験ガイド 分野3 タスク 3.3（精度とレイテンシのトレードオフ）／ Anthropic Engineering: Building effective agents（Routing）／ Claude Docs: Reducing latency"},{"id":"D3-08","domain":"D3","topic":"件数は測って決める","type":"single","question":"あるオンライン学習サービスが、講義資料を検索して受講者の質問に答える RAG を運用しています。いまは候補を150件取ってリランカーで採点し直し、上位20件をモデルに渡しています。回答の正確さは要件を満たしていますが、応答が終わるまでの時間は、事業部門と合意した目標を超えています。チームは件数を減らせば速くなると考えています。件数の決め方として最も適切なものはどれですか。","options":["代表的な質問の評価データセットで件数ごとに正確さと所要時間を測り、両方の要件を満たす値を選ぶ","公開されている検証で最も成績の良かった件数を、自社の講義資料でもそのまま採用する","応答を最も速くするため、リランカーを外し、検索の上位1件だけをモデルに渡すようにする","正確さを守るため件数は変えずに、合意した時間の目標を緩めるよう事業部門に申し入れる"],"answer":[0],"notes":["正解。件数を減らすと速くなる一方で、必要な記述を取りこぼすおそれもあります。自分のデータで両方を測れば、どこまで減らせるかを根拠をもって示せます。","ほかのデータと質問での結果が、自社の講義資料と質問に当てはまるとは限りません。正確さも所要時間も確かめないままでは、決定の根拠になりません。","必要な記述がモデルに渡らなくなり、正確さの要件を守れなくなるおそれが大きい手です。必要な情報を捨てる高速化です。","測る前に目標を緩めるのは早すぎます。件数を減らしても正確さが保てるなら、構成の見直しだけで目標を満たせる可能性があります。"],"explanation":"精度とレイテンシのトレードオフは、思い込みやよその数字ではなく、自分のデータで測って決めます。Claude のドキュメントは、まず性能の出る構成を作り、そのあとでレイテンシを削るよう勧めています。Anthropic の Contextual Retrieval の記事は、リランカーで採点する件数を増やせば性能は上がりうる一方でレイテンシとコストが増えるとして、自分のユースケースで設定を試すよう勧めています。記事がモデルに渡すチャンクの数を比べた結果も、その評価環境での値です。要件を満たす構成の中から軽いものを選び、測った結果を構成の根拠として示します。","ref":"試験ガイド 分野3 タスク 3.3（精度とレイテンシのトレードオフ）／ Anthropic Engineering: Contextual Retrieval ／ Claude Docs: Reducing latency"},{"id":"D3-09","domain":"D3","topic":"段ごとの追跡","type":"single","question":"ある銀行が、融資の申込書類を確認する多段のエージェントを本番で動かしています。検索、書類の読み取り、規程との照合、判定の下書きという段があり、全体の約4%で誤った下書きが出ます。処理はエラーなく終わり、レイテンシも普段どおりです。記録しているのは最終の出力だけで、同じ入力で実行し直しても誤りが再現しないことがあります。原因を突き止めるために最初に行うべきことはどれですか。","options":["誤りが出たら自動で実行し直し、2回の結果が一致したものだけを採用する","誤りが報告された入力で実行を繰り返し、誤りが再現したときに各段を調べる","リクエストごとに、各段の入出力とツールの呼び出しを1本につないで記録する","API のエラー率とレイテンシのモニタリングを細かくし、異常が出た時刻の処理を調べる"],"answer":[2],"notes":["誤りを目立たなくするだけで、どの段で崩れたかは分からないままです。呼び出しが増える分、コストもかさみます。","同じ入力でも毎回同じ動きをするとは限らないので、再現を待つと調べられない誤りが残ります。本番で起きた誤りそのものを記録するほうが確実です。","正解。本番の各段で何を受け取り、何を返したか（取得した書類や規程の箇所、ツールの結果）を残せば、再現に頼らずに崩れた段を切り分けられます。","誤った下書きはエラーとしては現れず、レイテンシも変わっていません。エラー率とレイテンシを細かく見ても、手がかりは得られません。"],"explanation":"LLM を使った多段の処理は、同じ入力でも毎回同じ動きをするとは限らず、失敗もエラーとしては現れません。最終の出力だけでは、検索、読み取り、照合のどこで崩れたかを切り分けられず、再現に頼る調べ方も成り立ちません。Anthropic はマルチエージェントの記事で、エージェントは同じプロンプトでも実行ごとに動きが変わると述べ、本番の全体を追跡できるようにしたことで、失敗の原因を体系的に直せるようになったとしています。まず本番の各段を観測できる状態を作り、そのうえで原因の段に手を打ちます。","ref":"試験ガイド 分野3 タスク 3.4（オブザーバビリティの課題とモニタリング戦略）／ Anthropic Engineering: How we built our multi-agent research system"},{"id":"D3-10","domain":"D3","topic":"中身を見ないモニタリング","type":"multi","question":"ある医療機関が、患者向けの予約と問い合わせのエージェントを運用しており、会話は1日に約20万件あります。院内の規程で、エンジニアが会話の本文を読むことは認められていません。プロンプトやツールを更新したあとに挙動が悪くなっても、気づくのが遅れています。会話の本文を読まずに、悪化を早く見つけて影響を抑える方法を2つ選んでください。（2つ選択）","options":["エンジニアが毎日、無作為に選んだ100件の会話の本文を読み、品質の変化を確かめる","ツールの呼び出しの順序や回数、エラー、所要時間を全件記録し、集計値の変化に警報を設定する","すべての応答の最後にモデル自身の確信度を出力させ、その平均の変化をモニタリングする","すべての会話の本文を期限なく保存し、問題が報告されたときに検索して調べる","新しい版へは一部の利用から段階的に切り替え、旧版と並べて動かしながら指標を比べる"],"answer":[1,4],"notes":["規程で認められていない本文の閲覧です。20万件に対して100件では、悪化を早く見つける力も足りません。","正解。会話の中身ではなく、判断のパターンとやり取りの構造をモニタリングすれば、プライバシーを守りながら、挙動の変化を全件で捉えられます。","自己申告の確信度は当てにならない目安で、挙動の悪化と結びつく保証がありません。","本文を無期限に保存するのは規程の趣旨とデータの最小化に反し、問題が報告されるまで気づけない点も変わりません。","正解。新旧を並べて少しずつ切り替えれば、悪化が出ても影響は一部にとどまり、版ごとの指標の差で早く気づけます。"],"explanation":"大規模なシステムでは、人が会話を読むモニタリングは、量の面でも規程の面でも成り立ちません。Anthropic は、会話の中身は見ずに、エージェントの判断のパターンとやり取りの構造をモニタリングし、本番の全体を追跡したと述べています。また、更新で動いているエージェントを壊さないよう、旧版と新版を同時に動かしながら利用を少しずつ移す方法（レインボーデプロイ）を使っています。検知の仕組みと、影響を限る切り替え方を組み合わせるのが要点です。","ref":"試験ガイド 分野3 タスク 3.4（オブザーバビリティの課題とモニタリング戦略）／ Anthropic Engineering: How we built our multi-agent research system"},{"id":"D3-11","domain":"D3","topic":"チャンクの文脈を補う","type":"single","question":"ある県が、補助金の要綱集を検索して職員の質問に答える RAG を作りました。要綱は制度ごとに数十ページあり、500トークンずつに区切って埋め込みのインデックスを作っています。「対象は前年度の所得が基準額以下の世帯とする」のように、どの制度の話かが書かれていないチャンクが多く、別の制度の条件を答える誤りが目立ちます。最も適切な改善はどれですか。","options":["回答を生成するモデルを上位のモデルに替え、制度の取り違えに気づけるようにする","各チャンクに、文書全体から見た短い説明を Claude で付けてからインデックスを作り直す","検索で取得するチャンクの数を大幅に増やし、正しい制度のチャンクも含まれるようにする","要綱を制度ごとに1つのチャンクにまとめ、文書全体を1つの単位として検索させる"],"answer":[1],"notes":["誤りの原因は、検索の段で制度の区別がつかないことです。渡されるチャンクが違えば、モデルを替えても直りません。","正解。Contextual Retrieval の考え方で、どの制度のどの部分かという文脈をチャンクに補ってから埋め込みとインデックスを作れば、検索の段での取り違えが減ります。","関係のないチャンクも増え、コンテキストが雑音で埋まります。どの制度の条件かが分からない点も変わりません。","1件が大きすぎると、どの箇所が質問に合うのかが埋もれやすくなり、毎回大量の文章を渡すことにもなります。"],"explanation":"文書をチャンクに切ると、文書全体では分かっていた文脈が落ちることがあります。Anthropic の Contextual Retrieval は、各チャンクが文書のどこの何の話かという短い説明を Claude に書かせて先頭に付け、そのうえで埋め込みと BM25 のインデックスを作る手法です。問題が検索の段にあるときは、生成の段のモデルを替えるのではなく、インデックスに入れる中身を直します。","ref":"試験ガイド 分野3 タスク 3.5（チャンキングとインデックス作成の戦略）／ Anthropic Engineering: Contextual Retrieval"},{"id":"D3-12","domain":"D3","topic":"構造に沿った区切り","type":"single","question":"ある保険会社が、約款を検索して契約者の質問に答える RAG を作っています。約款は章と条で構成され、多くの条が「〜の場合は保険金を支払います。ただし、次の各号のいずれかに該当する場合を除きます」のように、本文と例外の列挙が続きます。いまは400トークンごとの機械的な区切りで、本文と例外が別のチャンクに分かれ、例外を見落とした回答が出ています。最も適切な改善はどれですか。","options":["チャンクを100トークンに小さくし、1つのチャンクに入る内容を細かく絞り込む","回答の前に必ず例外の有無を確かめるよう、システムプロンプトで強く指示する","条ごとに区切って本文と例外を同じチャンクに収め、章と条の見出しを付ける","埋め込みモデルを大きなものに替え、本文と例外の意味のつながりを捉えさせる"],"answer":[2],"notes":["細かく切るほど、本文と例外はさらに別のチャンクに分かれやすくなります。","例外のチャンクが取得されていなければ、モデルは確かめようがありません。原因は区切り方です。","正解。文書の構造に沿って意味のまとまりで区切れば、条件と例外が一緒に取得され、見出しから出どころも分かります。","区切る位置が同じままでは、例外が別のチャンクにある状態は変わりません。"],"explanation":"チャンクの大きさ、区切る位置、前後の重なりは、検索の性能を左右します。固定の長さで機械的に切ると、条件と例外のように一緒に読むべき内容が分かれることがあります。約款や規程のように構造がはっきりした文書は、その構造に沿って区切り、見出しなどの情報を添えるのが基本です。区切り方の良し悪しは、実際の文書と質問で評価して決めます。","ref":"試験ガイド 分野3 タスク 3.5（チャンキングとインデックス作成の戦略）／ Anthropic Engineering: Contextual Retrieval（Implementation considerations）"},{"id":"D3-13","domain":"D3","topic":"ハイブリッド検索","type":"multi","question":"あるソフトウェア企業のサポート用 RAG は、埋め込みによる意味の検索だけで技術資料を探し、上位5件をモデルに渡しています。「E-4012 が出る」のようにエラーコードで尋ねると、似た番号の別のエラーの資料が返ります。また、文章で症状を尋ねる質問でも、関連する資料は上位50件には入っているのに、上位5件には入らないことがよくあります。最も効果的な改善を2つ選んでください。（2つ選択）","options":["回答を生成するモデルを上位のモデルに替え、渡された資料の誤りに気づかせる","多めに取った候補をリランカーで採点し直し、関連の高い数件だけを渡す","BM25 などのキーワードのインデックスを加え、意味の検索の結果と順位で統合する","エラーコードが一字一句一致する資料だけを使うよう、システムプロンプトで指示する","上位50件をすべてモデルに渡し、関連する資料が必ず含まれるようにする"],"answer":[1,2],"notes":["渡す資料が違えば、モデルを替えても答えは直りません。原因は検索の段です。","正解。候補を広く取ってから関連の強さで並べ直せば、上位50件に埋もれた資料を、渡す数件に引き上げられます。その分、レイテンシは少し増えます。","正解。BM25 は、エラーコードのような固有の文字列を含む質問に強く、意味の検索と組み合わせると取りこぼしが減ります。","一致する資料が取得されていなければ、指示しても使えません。検索の方法という原因が残ります。","関係のない資料が大量に入り、コストとレイテンシが増え、回答の質も落ちやすくなります。"],"explanation":"検索の方法は、質問の型に合わせて選びます。意味の検索は言い換えに強い一方で、固有の識別子の一致を取りこぼすことがあり、キーワードの検索はその逆です。両方の質問が来るなら、2つの結果を順位で統合し、さらにリランカーで絞り込みます。Anthropic の Contextual Retrieval の評価では、これらを重ねるほど検索の失敗が減りましたが、リランカーはレイテンシとコストを少し増やします。","ref":"試験ガイド 分野3 タスク 3.6（データの形状とクエリパターンに合った検索戦略）／ Anthropic Engineering: Contextual Retrieval"},{"id":"D3-14","domain":"D3","topic":"表のデータは問い合わせ","type":"single","question":"ある小売チェーンは、売上データの各行を文章に変換して埋め込みのインデックスに入れ、店長からの質問に RAG で答えています。「先月の地域別の売上合計は」「昨日いちばん売れた商品は」といった質問で、数字が誤った回答が目立ちます。売上データは毎日更新され、データウェアハウスの表として管理されています。最も適切な対応はどれですか。","options":["データウェアハウスに集計の問い合わせを読み取り専用で実行できるツールを渡す","検索で取得する行の数を大きく増やし、集計に必要な行がすべて含まれるようにする","月次や地域別の売上の要約文を前もって作ってインデックスに加え、集計の質問も検索で答える","渡された数字を一つずつ慎重に足し合わせるよう、システムプロンプトで指示する"],"answer":[0],"notes":["正解。表の形のデータへの集計の質問は、似た文章を探す検索ではなく、元のシステムに問い合わせて答えるのが合っています。読み取り専用にすれば、権限も最小にできます。","合計に必要な行は数千行に及ぶことがあり、検索ですべてを確実に集めることはできません。コンテキストも圧迫します。","決まった切り口の数字は答えられても、「昨日」「商品別」のような切り口の組み合わせを前もってすべて文章にはできません。数字の正確さを検索の当たり外れに任せる点も変わりません。","必要な行がそろっていない以上、計算を丁寧にしても正しい合計にはなりません。"],"explanation":"検索の戦略は、データの形と質問の型で選びます。規程や手順書のような文章は意味やキーワードの検索に向きますが、表の形のデータの集計や、刻々と変わる値の照会は、元のシステムにツールや API で問い合わせるほうが正確です。Anthropic も、Claude Code が大きなデータベースに対して的を絞ったクエリを書き、データ全体をコンテキストに載せずに分析する例を挙げています。何でも埋め込んで検索する設計になっていないかを確かめます。","ref":"試験ガイド 分野3 タスク 3.6（データの形状とクエリパターンに合った検索戦略）／ Anthropic Engineering: Effective context engineering for AI agents"},{"id":"D3-15","domain":"D3","topic":"複数の環境で使い回す","type":"single","question":"あるソフトウェア企業では、社内のチケット管理システムを Claude から使いたいというチームが3つあります。社員が使う Claude のアプリ、開発者の Claude Code、Agent SDK で作る社内の自動化エージェントです。いまは各チームが別々に、チケットを扱う独自のツール定義と API の呼び出しを書こうとしています。最も適切な設計はどれですか。","options":["各チームがそれぞれの環境に合わせて、独自のツール定義を書いて保守する","チケットの一覧を毎朝書き出し、各環境のシステムプロンプトに貼り付けておく","チケット管理の担当エージェントを作り、ほかのエージェントがそれに仕事を任せる","チケット管理システムの MCP サーバーを1つ作り、3つの環境からそれにつなぐ"],"answer":[3],"notes":["同じ連携を3回作ることになり、認可や仕様が変わるたびに3か所を直す必要があります。","情報が古くなるうえ、チケットの更新などの操作ができません。コンテキストも無駄に使います。","決まった操作を呼ぶだけの連携に、判断を担うエージェントを挟むと、コストと不確かさが増えます。必要なのはツールとデータへの接続です。","正解。MCP は AI のアプリと外部のシステムをつなぐオープンな標準で、一度サーバーを作れば、対応する複数のクライアントから使い回せます。"],"explanation":"統合の手段は、つなぐ相手と使い方で選びます。同じ社内システムを複数のアプリやチームで使うなら、MCP サーバーとして一度作り、各クライアントからつなぐのが効率的です。自分のアプリの中だけで使う決まった連携なら、API を呼ぶ自作のツールで足ります。エージェント間の連携は、別のエージェントに独立した仕事を任せる場面のための形で、決まった操作の呼び出しには重すぎます。","ref":"試験ガイド 分野3 タスク 3.7（接続プロトコルと統合メカニズムの選択）／ MCP Docs: What is the Model Context Protocol (MCP)?"},{"id":"D3-16","domain":"D3","topic":"STDIO かリモートか","type":"single","question":"ある官庁が、文書管理システムを検索する MCP サーバーを作り、約800人の職員のパソコンに配って、それぞれの端末で STDIO で起動させる計画を立てています。設定ファイルには、全員で共有する1つの API キーを書き込む予定です。サーバーは今後も頻繁に更新され、職員ごとの利用の記録と、異動した職員の権限の取り消しが必要です。最も適切な設計はどれですか。","options":["計画どおり各端末で起動させ、共有の API キーを定期的に新しいものに差し替える","各端末に配るサーバーの更新を自動化し、全員を常に同じ版にそろえておく","Streamable HTTP のリモートのサーバーを1か所に置き、職員ごとに認可する","職員が文書を検索するたびに、Claude に職員の所属を確かめさせてから検索させる"],"answer":[2],"notes":["鍵を替えても全員で1つの資格情報を共有する点は変わらず、職員ごとの記録や取り消しができません。","版はそろっても、800台への配布と共有の API キーという問題は残ります。","正解。リモートのサーバーなら1か所で更新でき、HTTP のサーバー向けの認可の仕様に沿って、職員ごとのトークンで利用を記録し、取り消せます。","所属の確認をモデルに任せても、確かな認証にはなりません。共有の API キーの問題も残ります。"],"explanation":"MCP の標準のトランスポートは、クライアントがサーバーを子プロセスとして起動する STDIO と、HTTP で1つのエンドポイントに要求を送る Streamable HTTP の2つです。手元だけで使う道具なら STDIO が簡単ですが、多くの利用者が使い、頻繁に更新し、利用者ごとの認可と記録が要るなら、リモートのサーバーにまとめるほうが合っています。接続の方式は、利用者の数、更新の頻度、認可の要件で選びます。","ref":"試験ガイド 分野3 タスク 3.7（接続プロトコルと統合メカニズムの選択）／ MCP Specification: Transports、Authorization"},{"id":"D3-17","domain":"D3","topic":"CLI があれば CLI","type":"single","question":"あるソフトウェア企業の開発チームが、Claude Code にプルリクエストの操作と、クラウドのリソースの状態の確認をさせたいと考えています。どちらのサービスにも公式の CLI があり、開発者の端末には導入済みで、各自の権限でサインインしてあります。チームの一人は、両方のサービスの API を包む MCP サーバーを自作して全員に配る案を出しました。最初に勧める方法として最も適切なものはどれですか。","options":["提案どおり MCP サーバーを自作して配り、両方のサービスの操作をそのサーバー経由にする","各自の権限でサインイン済みの公式の CLI を、Claude Code にそのまま使わせる","チームで共有する API キーを `CLAUDE.md` に書き、Claude Code に API を直接呼ばせる","サービスごとに操作を担当するエージェントを作り、Claude Code からそのエージェントに頼む"],"answer":[1],"notes":["CLI がないシステムなら MCP が向きますが、ここでは公式の CLI がすでに使えます。自作のサーバーは作って保守する手間が増え、つないだサーバーは使わないときもツールの名前などをコンテキストに加えます。","正解。Claude Code のドキュメントは、相手のシステムに CLI があれば、たいていそれがいちばん簡単な入り口だとしています。各自の権限で認証済みなので、新たな資格情報の管理も要りません。","共有の鍵をリポジトリのファイルに書くと漏えいの危険が増え、誰の操作かも区別できなくなります。各自の権限で認証された経路があるのに、わざわざ弱い方式に替えることになります。","エージェント間の連携は、独立した仕事を別のエージェントに任せる場面のための形です。決まったコマンドで済む操作に挟むと、コストと不確かさが増えます。"],"explanation":"統合の手段は、相手のシステムに何が用意されているかと、誰がどう使うかで選びます。Claude Code のドキュメントは、CLI があればそれがたいてい最も簡単な入り口で、CLI のないシステムには MCP がある、という順で整理しています。MCP サーバーは、CLI がないときや、複数のアプリで同じ連携を使い回したいときに作る価値があります。どの方式でも、利用者ごとの権限で認証された経路を使い、共有の資格情報を増やさないことが前提です。","ref":"試験ガイド 分野3 タスク 3.7（接続プロトコルと統合メカニズムの選択）／ Claude Code Docs: Best practices"},{"id":"D3-18","domain":"D3","topic":"小さな知識は一括で","type":"single","question":"ある大学が、学生からの質問に「学生便覧」をもとに答えるアシスタントを作ります。便覧は約80ページでコンテキストに余裕をもって収まり、内容は学期中ほとんど変わりません。質問のほとんどは、便覧のどこかの記述に関わります。チームの一人が、便覧をチャンクに分けてベクトルデータベースを作り、検索で必要な部分だけを渡す構成を提案しています。最も適切な判断はどれですか。","options":["便覧の全文を変わらない前置きとしてプロンプトの先頭に置き、キャッシュする","提案どおりチャンクとベクトルデータベースを用意し、検索で取った部分だけを渡す","便覧の章ごとにスキルを作り、質問に合う章だけをその都度読み込ませる","便覧の内容をモデルに覚えさせるため、便覧でファインチューニングを行う"],"answer":[0],"notes":["正解。小さく変わらない知識をほぼ毎回使うなら、一括で載せるのが最も単純です。キャッシュで、繰り返す前置きの処理の時間とコストも抑えられます。","収まる量の知識に検索の仕組みを足すと、作るものと壊れる箇所が増え、必要な記述を取りこぼすおそれも生まれます。","段階的に読み込む設計は、ときどき要る大きな情報に向きます。ほぼ毎回使う小さな情報では、探す手間と見落としの危険が増えるだけです。","改訂のたびに学習し直す必要があり、最初の一手としては重すぎます。"],"explanation":"一括型と段階的ディスカバリーは、情報の大きさ、変わる頻度、使う頻度で選びます。Anthropic は、知識ベースが十分に小さければ RAG を使わずに全体をプロンプトに含め、プロンプトキャッシングで速く安くできると述べています。実行中に探す設計は、その分遅く、説明があいまいだと見落とします。いつも要る小さな情報は先に載せ、ときどき要る大きな情報は後から読み込む、が判断の軸です。","ref":"試験ガイド 分野3 タスク 3.8（段階的ディスカバリーと一括型コンテキストの比較）／ Anthropic Engineering: Contextual Retrieval ／ Claude Docs: Prompt caching"},{"id":"D3-19","domain":"D3","topic":"多数のツールは検索で","type":"single","question":"ある大学の教職員向けエージェントには、学務、授業、図書、施設予約、研究費など12の MCP サーバーがつながり、ツールは合わせて約250個あります。棚卸しでは、どのツールもいずれかの部署の業務で使われていて、外せるものはありませんでした。一方で、ツールの定義だけで毎回5万トークン以上を使い、1回の依頼で使うのは数個なのに、似た名前のツールを取り違える誤りも増えています。最も適切な見直しはどれですか。","options":["各ツールの説明文を1行に削って定義のトークンを減らし、すべてのツールを毎回読み込ませる","コンテキストウィンドウの大きなモデルに替え、すべてのツールの定義を毎回余裕をもって収める","MCP サーバーごとに12の専用エージェントを作り、前段の振り分けで1つを選ばせて処理させる","ツール検索ツールを導入し、よく使う数個を除くツールの定義は検索されたときだけ読み込ませる"],"answer":[3],"notes":["説明文は、Claude がツールを選ぶ手がかりです。削るほど似たツールを取り違えやすくなり、毎回すべてを読み込む構成も変わりません。","収まっても、毎回の大量のトークンのコストは残ります。ツールが多すぎると選択の精度が落ちる問題も解決しません。","12のエージェントと振り分けを作って保守するのは、最初の一手としては重すぎます。複数のサーバーにまたがる依頼では、エージェント間の受け渡しも増えます。","正解。`defer_loading` を付けたツールの定義は最初はコンテキストに入らず、Claude が検索で見つけたものだけが読み込まれます。よく使う数個は最初から載せておけます。"],"explanation":"多くのツールがどれも必要で、1回に使うのはその一部、という場面が段階的ディスカバリーの出番です。ツール検索ツールを使うと、すべての定義をリクエストに含めたまま、`defer_loading` を付けたものはコンテキストに載せず、Claude が検索で見つけたツールだけを読み込みます。2026年11月時点のドキュメントは、ツールが10個以上ある場合や定義が1万トークンを超える場合に勧め、10個未満で毎回すべてを使うなら通常の構成のほうが合うとしています。要らないツールを外すことが先で、それでも残る多数のツールに対して使う仕組みです。","ref":"試験ガイド 分野3 タスク 3.8（段階的ディスカバリーと一括型コンテキストの比較）／ Claude Docs: Tool search tool"},{"id":"D4-01","domain":"D4","topic":"件数の偏りと指標","type":"single","question":"クレジットカード会社が、会員からのチャットの問い合わせを Claude で分類し、カードの紛失や盗難の連絡だけを、すぐに利用を止める専門の窓口に回す仕組みを設計しています。過去の問い合わせ2万件のうち、紛失や盗難の連絡は約2%です。開発チームは「精度95%以上」を合格の基準にしようとしていますが、すべてを「その他」に分類するだけでも精度は98%になります。評価指標の定義として最も適切なものはどれですか。","options":["精度の基準を95%から99%に引き上げ、正解の付いた2万件すべてで測って、基準を上回るかどうかで合否を決める","紛失や盗難の連絡を拾えた割合（再現率）と、窓口に回したうち本当に該当した割合（適合率）に目標値を定める","紛失や盗難の連絡は件数が少なく測りにくいので評価データセットから外し、残りの問い合わせの精度で合否を決める","分類のたびにモデルに確信度を出力させ、その平均が0.9以上になることを、合格の基準として計画書に書いておく"],"answer":[1],"notes":["全体の精度は、件数の多い「その他」の出来に引きずられます。紛失や盗難の連絡を半分見逃しても誤りは全体の約1%なので、99%の基準でも見逃しを隠せます。","正解。件数が少なく、見逃すと被害の大きい種類について、拾えた割合と、回した先で当たった割合を分けて目標を置けば、合否が業務への影響と結びつきます。","最も重要な種類を、測る対象から外しています。見逃しが不正利用の被害に直結する種類こそ、評価で確かめる必要があります。","モデルの自己申告の確信度は、正しさの当てになる目安ではありません。正解と照らした測定が要ります。"],"explanation":"評価指標は、業務で何を誤ると困るかに合わせて選びます。全体の精度は件数の多い種類の出来に引きずられるため、件数の少ない種類の失敗を隠してしまいます。Anthropic のドキュメントは、成功基準を具体的で測定可能なものにするよう勧め、指標の例として、精度のほかに適合率、再現率、F1 スコアを挙げています。ここでは、見逃しは不正利用の被害に、空振りは窓口の手間につながるので、再現率に高い目標を置き、適合率にも下限を決めます。多くの用途では複数の基準での評価が要るので、レイテンシやコストの目標も合わせて定めます。","ref":"試験ガイド 分野4 タスク 4.1（評価指標の定義） ／ Claude Docs: Define success criteria and build evaluations"},{"id":"D4-02","domain":"D4","topic":"セキュリティの指標","type":"single","question":"証券会社が、アナリストがアップロードした外部の調査レポートを読んで要点をまとめる社内アシスタントを作っています。セキュリティ部門は、レポートに埋め込まれた指示にアシスタントが従ってしまうリスクを心配しており、リリースの判定に使えるセキュリティの指標を求めています。最も適切な指標の定義はどれですか。","options":["本番のログで、ガードレールが遮断したリクエストの件数を週ごとに数え、件数が減っていれば安全性が上がったと判断する","採用しているモデルの、公開されている安全性ベンチマークの点数を指標とし、一定の点数以上のモデルを使うことを条件にする","埋め込まれた指示を検出できたかをアシスタント自身に毎回答えさせ、「検出した」と答えた割合をそのまま指標にする","指示を埋め込んだ文書と通常の文書を含むテストセットで、埋め込みに従った割合と、通常の文書を誤って拒んだ割合を測る"],"answer":[3],"notes":["遮断件数には、攻撃が何件来たかという分母も、遮断が正しかったかという正解もありません。増減から安全性は判断できません。","一般的なベンチマークは、この業務の文書と攻撃の形を反映していません。自分たちのユースケースに合わせたテストが必要です。","自己申告は当てにならない目安です。攻撃が成功しているときほど、正しく申告するとは限りません。","正解。攻撃が成功した割合を正解付きのケースで測り、同時に過剰な拒否も測る、両面のテストセットです。"],"explanation":"評価は実際の業務の分布に合わせ、エッジケースを含めて作るのが基本です。セキュリティの指標も同じで、この業務で起こりうる攻撃（文書に埋め込まれた指示）を正解付きのケースにして、攻撃が成功した割合を測ります。Anthropic のエンジニアリング記事は、ある振る舞いが起こるべき場合と起こるべきでない場合の両方をテストするよう勧め、片側だけの評価は片側だけの最適化を招くとしています。そのため、通常の文書を誤って拒む割合も合わせて測ります。","ref":"試験ガイド 分野4 タスク 4.1（評価指標の定義） ／ Anthropic Engineering: Demystifying evals for AI agents ／ Claude Docs: Define success criteria and build evaluations"},{"id":"D4-03","domain":"D4","topic":"採点方法の組み合わせ","type":"single","question":"アパレルの EC 事業者が、商品データから商品説明文を生成する仕組みの評価方法を設計しています。評価したい点は、決められた JSON の項目がそろい文字数の上限を守っていることと、ブランドの語調に合っていることの2つです。説明文は毎週数千件作られ、評価は変更のたびに回したいと考えています。最も適切な評価の組み合わせはどれですか。","options":["項目と文字数はコードで判定し、語調は採点基準を与えた LLM で採点して、担当者の採点との一致度で較正する","品質を確実にするため、項目、文字数、語調のすべてを、ブランドの担当者が変更のたびに全件を読んで手作業で採点する","評価の仕組みを1つにそろえるため、項目、文字数、語調のすべてを LLM に採点させ、合計点が基準以上なら合格とする","評価をすべて自動化するため、語調もブランドの禁止語と推奨語の一覧を使ってコードで判定し、LLM や人は使わない"],"answer":[0],"notes":["正解。規則で決まる点は速く確実なコードで判定し、判断が要る点は LLM で採点します。その LLM の採点は、同じ説明文を担当者も採点して、両者の食い違いが小さくなるように較正します。","人による採点は最も柔軟で質が高い一方、遅く高価です。毎週数千件を変更のたびに読む運用は続きません。","項目の有無や文字数は、コードで確実に判定できます。そこに確率的な LLM の採点を使うと、判定がぶれます。","語調は単語の一覧では捉えきれない判断です。一覧にない言い回しで語調に合っている正しい表現を、誤りと判定しがちです。"],"explanation":"Anthropic のドキュメントは、採点方法を「最も速く、確実で、拡張しやすい方法」から選ぶよう勧めています。コードによる採点は速く確実ですが、複雑な判断には向きません。LLM による採点は速く柔軟で、判断が要る基準に向きますが、まず信頼できるかを確かめてから規模を広げます。人による採点は質が高い反面、遅く高価なので、LLM の採点の較正や抜き取りの確認に絞って使います。1つの方法ですべてを測ろうとせず、基準ごとに合う方法を組み合わせるのが、試験ガイドのいう「複数の方法論の組み合わせ」です。","ref":"試験ガイド 分野4 タスク 4.2（評価データセットとテストフレームワークの設計） ／ Claude Docs: Define success criteria and build evaluations ／ Anthropic Engineering: Demystifying evals for AI agents"},{"id":"D4-04","domain":"D4","topic":"評価データセットの作り方","type":"single","question":"オンライン学習の事業者が、学習者の質問に答えるチューター機能を運用しています。評価データセットは開発者が書いた50問で、最近の変更ではどれも合格率100%です。ところが、学習者からは「見当違いの答えが返る」という報告が続いています。評価データセットについて、最初に勧める対応として最も適切なものはどれですか。","options":["同じ開発者たちに、いまの50問と同じ書き方で問題を450問書き足してもらい、評価データセットを500問に増やして測り直す","いまの50問はそのままにして採点の基準を厳しくし、合格率が100%から下がるようにしたうえで、もう一度測り直す","本番の質問を匿名化して抜き出し、報告された失敗例、あいまいな質問、範囲外の質問を加えて、専門家が合意した正解を付ける","学習者からの報告を1件ずつ調べてプロンプトを直し、そのたびに、いまの50問で合格率が保たれていることを確かめる"],"answer":[2],"notes":["数を増やすこと自体はよいことですが、同じ人が同じ書き方で作ると、本番の質問との分布のずれは残ります。","採点を厳しくしても、問題が本番の質問と違うという原因は残ります。見当違いの答えが出るような質問が50問の中になければ、厳しく採点しても見つかりません。","正解。実際の利用の分布とエッジケースを入れ、専門家の判断が一致する正解を付けると、本番の失敗を評価で捉えられます。","個別の修正は必要ですが、評価データセットが本番の失敗を捉えられないままでは、直ったかどうかも、ほかの質問で悪化していないかも測れません。"],"explanation":"評価は、実際の業務の質問の分布に合わせ、エッジケースを含めて作ります。Anthropic のエンジニアリング記事は、実際の失敗から集めた20〜50件の課題でも良い出発点になるとし、本番で利用者が報告した失敗をテストケースに変えるよう勧めています。また、良い課題とは、2人の専門家が独立に同じ合否を下せるものだとしています。合格率が100%に張り付いているのに本番で失敗が続くのは、評価データセットが実際の利用を表していない合図で、このままでは改善の余地も測れません。","ref":"試験ガイド 分野4 タスク 4.2（評価データセットとテストフレームワークの設計） ／ Anthropic Engineering: Demystifying evals for AI agents ／ Claude Docs: Define success criteria and build evaluations"},{"id":"
